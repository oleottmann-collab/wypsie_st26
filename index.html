<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WiPsy Lernplattform - Klausur SS 2026</title>
<style>
:root{
  --bg:#f7f2e9; --bg2:#fffdf9; --surface:#ffffff; --surface2:#f6efe3;
  --border:#e7dbc6; --text:#2c2115; --muted:#8a7962; --muted2:#b0a089;
  --accent:#e8792f; --accent2:#d2591b; --good:#25925c; --mid:#b57e10; --hard:#d95f28; --again:#c94840;
  --shadow:0 10px 30px rgba(122,86,40,.13);
  --r:16px;
  --glow1:#fdeedb; --glow2:#f8f0e2;
  --headbg1:rgba(255,252,247,.92); --headbg2:rgba(255,252,247,.72);
  --border2:#ddae76;
  --text-strong:#241a0f; --text-soft:#4a3a26;
  --zk-def:#1d6fc0; --zk-erk:#7452cf; --zk-bsp:#1c8a5c; --zk-merk:#a5750c; --zk-qz:#7b7466;
  --primary-shadow:rgba(210,89,27,.30);
}
html[data-theme="dark"]{
  --bg:#17120e; --bg2:#1f1813; --surface:#271e16; --surface2:#33271c;
  --border:#473524; --text:#f4ece1; --muted:#c4ab8c; --muted2:#8f7559;
  --accent:#f0883c; --accent2:#e06329; --good:#5cc08a; --mid:#f0b429; --hard:#ef7a45; --again:#e05c54;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --glow1:#3a2415; --glow2:#2a1810;
  --headbg1:rgba(23,18,14,.92); --headbg2:rgba(23,18,14,.72);
  --border2:#6b4e2c;
  --text-strong:#f7efe3; --text-soft:#ece3d6;
  --zk-def:#7cc4ff; --zk-erk:#9d8cff; --zk-bsp:#46cf9b; --zk-merk:#f0b429; --zk-qz:#9aa6c8;
  --primary-shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 80% -10%,var(--glow1),transparent),
             radial-gradient(1000px 600px at -10% 110%,var(--glow2),transparent),var(--bg);
  background-attachment:fixed;
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 80px}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}

/* HEADER */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,var(--headbg1),var(--headbg2));
  border-bottom:1px solid var(--border)}
.head-inner{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.2px;font-size:18px;display:flex;align-items:center;gap:9px}
.logo .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent)}
.head-stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text)}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 13px;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--surface2);border-color:var(--border2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;box-shadow:0 6px 18px var(--primary-shadow)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}

/* HOME */
h1.page{font-size:22px;margin:18px 2px 6px}
.sub{color:var(--muted);font-size:14px;margin:0 2px 16px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 2px 18px}
.switch{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.switch input{width:38px;height:21px;appearance:none;background:var(--border);border-radius:999px;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch input:checked{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked::after{left:19px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
.cat{position:relative;background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);
  border-radius:var(--r);padding:16px 16px 14px;overflow:hidden;transition:.18s;text-align:left}
.cat:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:var(--shadow)}
.cat .bar-top{position:absolute;top:0;left:0;right:0;height:4px;background:var(--cc,var(--accent))}
.cat h3{font-size:16.5px;margin:6px 0 2px;display:flex;align-items:center;gap:8px}
.cat .cnt{color:var(--muted);font-size:13px;margin-bottom:12px}
.cat .due{color:var(--cc,var(--accent));font-weight:700}
.prog{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:4px}
.prog>i{display:block;height:100%;background:var(--cc,var(--accent));border-radius:999px;transition:width .4s}
.cat .pct{font-size:12px;color:var(--muted2);margin-top:6px;display:flex;justify-content:space-between}
.cat .ico{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--cc) 22%,transparent);color:var(--cc);font-size:16px;font-weight:800;flex:none}

/* STUDY */
.study-top{display:flex;align-items:center;gap:12px;margin:6px 2px 14px;flex-wrap:wrap}
.study-top .name{font-weight:700;font-size:17px}
.sessbar{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.sessbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.count{color:var(--muted);font-size:13.5px;white-space:nowrap}

.card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);
  border-radius:20px;box-shadow:var(--shadow);padding:26px 24px;min-height:300px;display:flex;flex-direction:column}
.card .tagrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.tag{font-size:11.5px;letter-spacing:.3px;text-transform:uppercase;font-weight:700;color:var(--cc,var(--accent));
  background:color-mix(in srgb,var(--cc) 16%,transparent);padding:4px 9px;border-radius:7px}
.qlabel,.alabel{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:6px}
.frage{font-size:21px;font-weight:650;line-height:1.4}
.divider{height:1px;background:var(--border);margin:20px 0}
.antwort{font-size:16.5px;white-space:pre-wrap;color:var(--text-strong)}
.reveal-hint{color:var(--muted2);font-size:13.5px;margin-top:auto;padding-top:18px;text-align:center}

.infobtn{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);
  font-size:16px;font-weight:800;color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.infobtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.infobtn[disabled]{opacity:.32;cursor:not-allowed}

.zusatz{margin-top:18px;border-top:1px dashed var(--border);padding-top:16px;display:grid;gap:13px}
.zfield{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.zfield .zk{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:800;margin-bottom:5px}
.zfield .zv{font-size:15px;white-space:pre-wrap;color:var(--text-strong)}
.zk.def{color:var(--zk-def)}.zk.erk{color:var(--zk-erk)}.zk.bsp{color:var(--zk-bsp)}.zk.merk{color:var(--zk-merk)}.zk.qz{color:var(--zk-qz)}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.rate{padding:14px 8px;border-radius:13px;font-weight:750;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:1px solid var(--border);background:var(--surface);transition:.14s}
.rate small{font-weight:600;font-size:11px;opacity:.7}
.rate:hover{transform:translateY(-2px)}
.rate.again{color:var(--again);border-color:color-mix(in srgb,var(--again) 45%,var(--border))}
.rate.hard{color:var(--hard);border-color:color-mix(in srgb,var(--hard) 45%,var(--border))}
.rate.mid{color:var(--mid);border-color:color-mix(in srgb,var(--mid) 45%,var(--border))}
.rate.easy{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--border))}
.rate.again:hover{background:color-mix(in srgb,var(--again) 16%,var(--surface))}
.rate.hard:hover{background:color-mix(in srgb,var(--hard) 16%,var(--surface))}
.rate.mid:hover{background:color-mix(in srgb,var(--mid) 16%,var(--surface))}
.rate.easy:hover{background:color-mix(in srgb,var(--good) 16%,var(--surface))}

.bigbtn{display:block;width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:750;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 22px var(--primary-shadow)}

/* DONE / EMPTY */
.panel{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:20px;
  padding:34px 26px;text-align:center;box-shadow:var(--shadow)}
.panel .big{font-size:46px;margin-bottom:6px}
.panel h2{font-size:22px;margin-bottom:8px}
.panel p{color:var(--muted);margin-bottom:18px}
.statline{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:16px 0 22px}
.statline div{text-align:center}
.statline .n{font-size:26px;font-weight:800}
.statline .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px;margin-top:6px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px}
.scard h4{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.scard .line{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--muted)}
.scard .line b{color:var(--text)}
.kpi{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 20px}
.kpibox{flex:1;min-width:150px;background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:16px;padding:16px}
.kpibox .n{font-size:30px;font-weight:850}
.kpibox .l{color:var(--muted);font-size:13px;margin-top:2px}

footer{color:var(--muted2);font-size:12px;text-align:center;margin-top:30px;line-height:1.7}
@media(max-width:560px){
  .frage{font-size:19px}.actions{grid-template-columns:repeat(2,1fr)}
  .card{padding:20px 16px}.wrap{padding:14px 12px 70px}
  .head-stats{display:none}
}

/* ===== ACTIVE RECALL ===== */
.ar-block .ico{font-size:12px;letter-spacing:.5px}
.ar-teile{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ar-teil{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,var(--surface),var(--bg2));
  border:1px solid var(--border);border-left:4px solid var(--cc,var(--accent));border-radius:14px;padding:14px 16px;flex-wrap:wrap}
.ar-teil-main{flex:1;min-width:200px}
.ar-teil-title{font-weight:700;font-size:15.5px}
.ar-teil-meta{color:var(--muted);font-size:13px;margin-top:3px}
.ar-teil-actions{display:flex;gap:8px;flex-wrap:wrap}
.amp{font-weight:700;padding:1px 8px;border-radius:999px;font-size:12px}
.amp.green{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.amp.yellow{color:var(--mid);background:color-mix(in srgb,var(--mid) 16%,transparent)}
.amp.red{color:var(--again);background:color-mix(in srgb,var(--again) 16%,transparent)}

.lerntext{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:18px;
  padding:24px 26px;box-shadow:var(--shadow);max-width:760px;margin:0 auto;font-size:16.5px;line-height:1.72}
.lerntext h4{font-size:17px;margin:20px 0 7px;color:var(--accent)}
.lerntext p{margin:0 0 12px;color:var(--text-soft)}
.lerntext .lz{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.lerntext .lz b{color:var(--text)}

.ar-controls{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;margin-top:16px;padding:14px 0;
  background:linear-gradient(0deg,var(--bg) 62%,transparent)}
.timer{font-variant-numeric:tabular-nums;font-weight:750;background:var(--surface2);border:1px solid var(--border);
  border-radius:999px;padding:6px 13px;font-size:14px;color:var(--accent)}

.recall-area{margin-top:6px}
.recall-hint{color:var(--muted);font-size:14px;margin-bottom:10px}
#arInput{width:100%;min-height:46vh;resize:vertical;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:16px 17px;color:var(--text);font-family:inherit;font-size:16px;line-height:1.6}
#arInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}

.res-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,var(--surface),var(--bg2));
  border:1px solid var(--border);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
.ring{--p:0;width:118px;height:118px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%),var(--surface2) 0);transition:.4s}
.ring i{width:88px;height:88px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:26px;font-weight:850;line-height:1}
.ring small{font-size:11px;color:var(--muted);margin-top:2px}
.res-meta{flex:1;min-width:210px}
.res-meta .niv{font-size:19px;font-weight:800;margin-bottom:4px}
.res-meta .sub2{color:var(--muted);font-size:13.5px}
.res-counts{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.res-counts span{font-size:13px;color:var(--muted)}
.res-counts b{font-size:16px}
.dotg{color:var(--good)}.doty{color:var(--mid)}.dotr{color:var(--again)}

.miss-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:13px;margin-top:18px}
.miss-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;--cc:var(--accent)}
.miss-card h4{font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:7px;color:var(--text)}
.miss-card.klausur{border-color:color-mix(in srgb,var(--again) 45%,var(--border));--cc:var(--again)}
.miss-card ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.miss-card li{font-size:13.5px;color:var(--text-soft);padding-left:15px;position:relative}
.miss-card li:before{content:"\203a";position:absolute;left:0;color:var(--cc)}
.miss-card .none{color:var(--good);font-size:13px}
.kbadge{font-size:10.5px;font-weight:800;color:var(--again);border:1px solid color-mix(in srgb,var(--again) 50%,transparent);border-radius:5px;padding:0 4px;margin-left:6px}

.sec-h{font-size:16px;font-weight:750;margin:24px 2px 10px}
.concept-list{display:flex;flex-direction:column;gap:7px}
.concept-row{display:flex;gap:11px;align-items:flex-start;justify-content:space-between;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:11px 13px;border-left:4px solid var(--border)}
.concept-row.green{border-left-color:var(--good)}
.concept-row.yellow{border-left-color:var(--mid)}
.concept-row.red{border-left-color:var(--again)}
.cr-main{flex:1;min-width:0}
.cr-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.kat{font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:1px 6px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.cr-begriff{font-weight:650;font-size:14.5px}
.cr-warum{color:var(--muted);font-size:12.5px;margin-top:3px}
.gw{font-size:11.5px;color:var(--muted2);font-weight:600}
.seg{display:flex;flex:none;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{padding:6px 10px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.on.g{background:var(--good);color:#10261c}
.seg button.on.y{background:var(--mid);color:#2a1d05}
.seg button.on.r{background:var(--again);color:#fff}

.fehler-list{background:color-mix(in srgb,var(--again) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--again) 30%,var(--border));
  border-radius:14px;padding:14px 18px;margin-top:16px}
.fehler-list h4{font-size:14.5px;margin-bottom:8px;color:var(--hard)}
.fehler-list ul{margin-left:18px}
.fehler-list li{font-size:13.5px;color:var(--text-soft);margin-bottom:4px}

.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
@media(max-width:560px){
  .lerntext{padding:18px 16px}.res-top{padding:16px}
  .concept-row{flex-direction:column}.seg{align-self:flex-start}
}

/* KLAUSURTRAINING */
.exam-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.exam-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.exam-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 14px}
.exam-timer.warn{color:var(--again);border-color:var(--again)}
.exam-score{font-size:14px;color:var(--muted)}
.exam-score b{color:var(--text)}
.exam-teil{margin:22px 2px 10px;font-size:15px;font-weight:800;color:var(--accent);text-transform:none}
.exam-q{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.exam-q .qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.exam-q .qid{font-weight:800;color:var(--accent)}
.exam-q .qpts{font-size:12.5px;color:var(--muted);white-space:nowrap}
.exam-q p{margin:0 0 9px;color:var(--text-soft);white-space:pre-wrap}
.exam-sol{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px}
.exam-sol .src{font-size:12.5px;color:var(--muted2);margin-bottom:6px}
.exam-rate{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.exam-rate span{font-size:12.5px;color:var(--muted)}
.exam-rate button{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:12.5px}
.exam-rate button.on.g{background:var(--good);color:#fff;border-color:var(--good)}
.exam-rate button.on.y{background:var(--mid);color:#fff;border-color:var(--mid)}
.exam-rate button.on.r{background:var(--again);color:#fff;border-color:var(--again)}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="logo"><span class="dot"></span>WiPsy Lernplattform</div>
    <div class="head-stats" id="headStats"></div>
    <div class="spacer"></div>
    <button class="btn sm ghost" id="navAR">Active Recall</button>
    <button class="btn sm ghost" id="navExam">Klausurtraining</button>
    <button class="btn sm ghost" id="navStats">Statistik</button>
    <button class="btn sm ghost" id="navHome">Karteikarten</button>
    <button class="btn sm ghost" id="themeToggle" title="Hell/Dunkel umschalten">◐</button>
  </div>
</header>

<div class="wrap">
  <!-- HOME -->
  <section id="viewHome">
    <h1 class="page">Karteikarten nach Kategorie</h1>
    <p class="sub" id="homeSub"></p>
    <div class="toolbar">
      <button class="btn primary" id="studyAllDue">Alle fälligen Karten lernen</button>

  "a": "Korrelation: Zwei Variablen verändern sich gemeinsam — ohne Aussage über Ursache. \nBeispiel: Eiscremeverkauf und Ertrinkungsopfer korrelieren (beide durch Sommer bedingt). \nKausalität: Eine Variable verursacht die andere. Nur durch Experimente (mit Kontrollgruppe und Randomisierung) nachweisbar. \nMerksatz: Korrelation ≠ Kausalität. In der WiPsy-Praxis oft verwechselt!",
  "a_short": "Korrelation bedeutet nur, dass sich zwei Variablen gemeinsam verändern, ohne Aussage über die Ursache. Kausalität bedeutet, dass eine Variable die andere verursacht, und lässt sich nur im Experiment mit Randomisierung nachweisen.",
  "extra": {
   "erklaerung": "Ein gemeinsamer dritter Faktor kann beide Variablen treiben (Scheinkorrelation). Aus einem Zusammenhang allein darf deshalb keine Ursache abgeleitet werden. Nur das Experiment, das die unabhängige Variable gezielt verändert und die Versuchspersonen zufällig auf die Bedingungen verteilt, schließt Störvariablen aus und zeigt Kausalität. Häufiger Klausurfehler ist das Gleichsetzen von Korrelation und Kausalität.",

  "a": "»(Direkte) Partizipation ist die von der Organisation gewährte oder verlangte,\nsubjektiv wahrgenommene, direkte Beteiligung des Einzelnen an Ent-\nscheidungen, die im Zusammenwirken mit anderen Organisationsmitgliedern\ngetroffen werden und die seine oder ihre mittel-oder unmittelbaren Bereiche\nder Arbeit betreffen« ( Lohmann & Prümper, 2006, S. 120).\nBei einer zu ausgeprägten Partizipationskultur besteht die Möglichkeit, dass\nEntscheidungen verzögert werden und einen Kompromisscharakter be-\nkommen.\nVgl. Jedoch Partizipation im Hinblick auf „Demokratieförderlichkeit“ gemäß\nHonneth",
  "a_short": "Die von der Organisation gewährte oder verlangte, subjektiv wahrgenommene direkte Beteiligung des Einzelnen an Entscheidungen, die im Zusammenwirken mit anderen getroffen werden und seine Arbeitsbereiche betreffen (Lohmann und Prümper, 2006).",

  "a": "Symbolkraft: Geld steht für Erfolg, Macht, Status, Unabhängigkeit, Sicherheit.\nPsychologische Grenzen der Tauschmittelfunktion: \n• Geldgeschenke unter Erwachsenen sind sozial verpönt\n• Monetäre Anreize gegen unerwünschtes Verhalten können dieses verstärken (Bsp. Kindergarten-Bußen: mehr Verspätungen)\n• Intrinsische Motivation kann durch Bezahlung verdrängt werden\nKontextabhängigkeit: Erscheinungsform (Bargeld vs. Karte), Erwerbskontext (Arbeit vs. Erbschaft), Situation (Weihnachten vs. Alltag) beeinflussen alle das Gelderleben.\nStichwort: Mental Accounting (Thaler, 1985) – unterschiedliche mentale Konten je nach Herkunft des Geldes.",
  "a_short": "Symbolkraft: Geld steht für Erfolg, Macht, Status, Unabhängigkeit, Sicherheit. Psychologische Grenzen der Tauschmittelfunktion: Geldgeschenke unter Erwachsenen gelten als unpersönlich; monetäre Anreize gegen unerwünschtes Verhalten können es verstärken; Bezahlung kann intrinsische Motivation verdrängen. Der Umgang mit Geld ist stark kontextabhängig (Bargeld gegenüber Karte, Arbeit gegenüber Erbe, Weihnachten gegenüber Alltag).",

  "cat": "Finanzpsychologie",
  "q": "Was ist die Geldillusion (Geldwertillusion) – und wie zeigt sie sich konkret auf Arbeitsmärkten? (Shafir et al., 1997)",
  "a": "Definition: Menschen denken in nominalen Geldeinheiten, auch wenn die realen Einheiten relevant wären.\nKernbeispiel (Shafir et al. 1997): \n+2 % Nominallohn bei 4 % Inflation = −2 % Reallohn → trotzdem positiver bewertet als −2 % Nominallohn bei 0 % Inflation (= identische reale Senkung) \nKonsequenz: Unternehmen können in Hochinflationsphasen leichter Reallöhne senken – ohne Widerstand der Arbeitnehmer. Damit kann Beschäftigung kurzfristig erhöht werden (Akerlof et al., 2000).\n10.2 Entscheidungen über Finanzen – Theorien & Anomalien",
  "a_short": "Menschen denken in nominalen Geldeinheiten, auch wenn die realen relevant wären. Beispiel (Shafir et al., 1997): +2% Nominallohn bei 4% Inflation (also 2% Reallohnverlust) wird positiver bewertet als 2% Nominallohnsenkung bei 0% Inflation, obwohl beides derselben realen Lohnsenkung entspricht.",
  "extra": {
   "erklaerung": "Nominale Preise sind kognitiv leichter abrufbar als reale, daher denken Menschen in nominalen Größen. Folge auf Arbeitsmärkten: Unternehmen können in Hochinflationsphasen leichter Reallöhne senken, ohne Widerstand, und so kurzfristig die Beschäftigung erhöhen (Akerlof et al., 2000). Klausurfehler: Geldillusion mit Geldwahrnehmung gleichsetzen. Die Illusion ist speziell das Denken in nominalen statt realen Größen.",

  "cat": "Finanzpsychologie",
  "q": "Was besagt die Erwartungsnutzentheorie (Expected Utility Theory) – und welche Annahmen liegen ihr zugrunde?",
  "a": "Kern: Menschen handeln rational – sie berechnen den erwarteten Nutzen aller Alternativen und wählen die mit dem größten Gesamtnutzen.\nEU_j = Σ u_jk × p_jk \nu = subjektiver Nutzen der Konsequenz; p = subjektive Wahrscheinlichkeit\nZwei Rationalitätsannahmen: \n• Korrekte Vorstellungen über Umwelt und andere Akteure\n• Stabile, von Emotionen unabhängige Präferenzen\nStatus: Heute primär normative Theorie (wie man entscheiden sollte). Als deskriptive Theorie wird zunehmend die Prospect Theory bevorzugt.\nBegründer: Von Neumann & Morgenstern (1944); Savage (1954)",
  "a_short": "Menschen handeln rational: Sie berechnen den erwarteten Nutzen aller Alternativen und wählen die mit dem größten Gesamtnutzen (EU = Summe aus subjektivem Nutzen mal subjektiver Wahrscheinlichkeit). Zwei Rationalitätsannahmen: korrekte Vorstellungen über Umwelt und Akteure sowie stabile, emotionsunabhängige Präferenzen. Heute primär normative Theorie; deskriptiv wird zunehmend die Prospect Theory bevorzugt. Begründer: Von Neumann und Morgenstern (1944), Savage (1954).",
  "extra": {
   "erklaerung": "Die Erwartungsnutzentheorie ist die dominierende Entscheidungstheorie der Wirtschaftswissenschaften. Sie sagt, wie man entscheiden sollte, um den Nutzen zu maximieren (normativ), beschreibt aber nicht das reale Verhalten. Klausurfehler: die EUT für eine Beschreibung realen Verhaltens halten, sie ist normativ.",

  "id": 239,
  "cat": "Finanzpsychologie",
  "q": "Was ist die Prospect Theory (Kahneman & Tversky, 1979) – Ablauf, Wertfunktion, Kernaussagen?",
  "a": "Definition: Deskriptives Modell menschlicher Entscheidungen unter Unsicherheit – zeigt systematische Abweichungen von der Erwartungsnutzentheorie.\n2 Entscheidungsschritte: \n• 1. Editierung: Psychologische Vereinfachung (Runden, Kodieren als Gewinn/Verlust)\n• 2. Evaluation: Zuordnung von Nutzenwerten und Entscheidungsgewichten\nWertfunktion (s-förmig, asymmetrisch): \n• Bewertung relativ zum Referenzpunkt (Status quo) – Entscheidungen immer vom Status quo aus!\n• Im Gewinnbereich konkav (risikoscheu), im Verlustbereich konvex (risikosuchend)\n• Verlustaversion (WICHTIG!): 100 € Verlust wiegt psychologisch schwerer als 100 € Gewinn – die Kurve ist asymmetrisch!\nGewichtungsfunktion: Hohe Wahrscheinlichkeiten werden untergewichtet , kleine übergewichtet .\nKlausurhinweis (VL 13.05.): Die Wertfunktions-Abbildung (s-Kurve mit Referenzpunkt) erkennen und verstehen können – nicht nur auswendig lernen!",
  "a_short": "Deskriptives Modell von Entscheidungen unter Unsicherheit; zeigt systematische Abweichungen von der Erwartungsnutzentheorie. Zwei Schritte: Editierung (Vereinfachung, Kodieren als Gewinn/Verlust) und Evaluation (Zuordnung von Nutzenwerten und Entscheidungsgewichten). Wertfunktion s-förmig, asymmetrisch, relativ zum Referenzpunkt (Status quo); im Gewinnbereich konkav (risikoscheu), im Verlustbereich konvex (risikosuchend). Verlustaversion: Ein Verlust wiegt schwerer als ein gleich hoher Gewinn.",
  "extra": {
   "definition": "Deskriptives Modell menschlicher Entscheidungen unter Unsicherheit, das systematische Abweichungen von der Erwartungsnutzentheorie beschreibt (Kahneman und Tversky, 1979).",
   "erklaerung": "Entscheidungen werden immer relativ zum Referenzpunkt bewertet, nicht am Endvermögen. Die Gewichtungsfunktion untergewichtet hohe und übergewichtet kleine Wahrscheinlichkeiten. Klausurfehler: konkav und konvex vertauschen, und die Wertfunktion aufs Endvermögen statt auf die Veränderung zum Referenzpunkt beziehen. Die Wertfunktion samt Verlustaversion ist als [K!] markiert: Die Abbildung (s-Kurve) muss man erkennen und erklären können.",
   "merkhilfe": "Klausurhinweis VL 13.05.: s-Kurve mit Referenzpunkt erkennen und verstehen, nicht nur auswendig lernen.",

  "a": "Ergibt sich aus Zusammenspiel von s-förmiger Wertfunktion und übergewichteten kleinen Wahrscheinlichkeiten:\nGewinnbereich \nVerlustbereich \nNiedrige p \nrisikoliebend (Lotto) \nrisikoscheu (Versicherung) \nHohe p \nrisikoscheu \nrisikosuchend (\"Possibility Effect\") \nBei hoher Verlustwahrscheinlichkeit: Man setzt lieber alles aufs Spiel, als den Verlust sicher hinzunehmen – klassisches Spielerverhalten.",
  "a_short": "Aus dem Zusammenspiel von s-förmiger Wertfunktion und übergewichteten kleinen Wahrscheinlichkeiten. Bei niedriger Wahrscheinlichkeit: risikoliebend im Gewinn (Lotto), risikoscheu im Verlust (Versicherung). Bei hoher Wahrscheinlichkeit: risikoscheu im Gewinn, risikosuchend im Verlust (Possibility Effect: man setzt lieber alles aufs Spiel, als den Verlust sicher hinzunehmen).",

  "q": "Was ist der Endowment-Effekt – Merkmale, Bezug zur Prospect Theory und Praxisbeispiele?",
  "a": "Definition: Was mir gehört, überschätze ich – Menschen schätzen Objekte, die sie besitzen , höher ein als identische Objekte, die sie nicht besitzen.\n5 Kernmerkmale: \n• Wertüberschätzung durch bloßen Besitz (z.B. eigenes Haus ist weniger wert als man denkt)\n• Verlustaversion: Verkaufspreisforderung > Kaufbereitschaft für identisches Objekt\n• Status quo-Bias: Tendenz, den aktuellen Besitzstand zu behalten\n• Tritt schon nach kurzer Zeit ein\n• Emotionale Bindung verstärkt den Effekt\nMarketing-Praxis (VL-Beispiele): \n• Autoverkauf: Auto übers Wochenende verleihen → Kunde gewöhnt sich dran, will es nicht mehr abgeben\n• Zalando: Mehrere Stücke günstig bestellen → will man 1–3 behalten, weil man sie kurz „besessen\" hat\n• Allgemein: Probefahrt, „zur Ansicht\", kostenlose Testphase\nVerbindung zur PT: Besitzstand = Referenzpunkt. Hergeben = Verlust, der stärker schmerzt als der Gewinn durch den Kaufpreis. Deshalb Verkaufspreis > Kaufbereitschaft.",

  "a": "Ökonomisches Modell: Lohn = Wertgrenzprodukt, Arbeitnehmer wählen optimal zwischen Arbeit und Freizeit, kennen ihren Marktwert.\nRealität – mehrere Abweichungen: \n• Arbeitnehmer wissen nicht gut, wie viel Freizeit sie Geld wert ist\n• Sie wissen nicht, was ihre Arbeit dem Arbeitgeber wert ist – Lohngeschichte ist oft der einzige Anhaltspunkt\n• Reziprozität (psychologischer Vertrag) spielt eine zentrale Rolle\n• Fairnesspräferenzen beeinflussen Arbeitseinsatz\n• Arbeit hat für viele einen Eigenwert – keine reine Freizeit-Lohn-Abwägung",
  "a_short": "Ökonomisches Modell: Lohn gleich Wertgrenzprodukt, Arbeitnehmer wählen optimal zwischen Arbeit und Freizeit und kennen ihren Marktwert. Realität: Arbeitnehmer wissen nicht gut, wie viel ihnen Freizeit wert ist und was ihre Arbeit dem Arbeitgeber wert ist (oft ist der frühere Lohn der einzige Anhaltspunkt); Reziprozität (psychologischer Vertrag) und Fairnesspräferenzen prägen den Einsatz; Arbeit hat für viele einen Eigenwert.",

  "q": "Erkläre die drei Fairness-Modelle am Arbeitsmarkt: Equity-Theorie, Fair-Wage-Effort-Modell, Gift-Exchange-Ansatz .",
  "a": "• Equity-Theorie (Adams, 1965): Fairness = Verhältnis von Beiträgen zu Belohnungen. Wird dieses Verhältnis als ungleich wahrgenommen, entsteht das Bedürfnis nach Anpassung – auch beim Besserverdienenden.\n• Fair-Wage-Effort-Modell (Akerlof & Yellen, 1988): Leistung hängt davon ab, ob Arbeitnehmer ihren Lohn als gerecht empfinden. Als fair geltender Lohn variiert je nach Referenzgruppe und Arbeitslosenquote.\n• Gift-Exchange-Ansatz (Akerlof, 1984): Reziprozität – Arbeitgeber und Arbeitnehmer „beschenken\" sich gegenseitig mit höherem Lohn und höherem Arbeitseinsatz.\nHenry Ford 1914: Lohn auf $5/Tag verdoppelt → Fluktuation sank drastisch → „finest cost cutting move\" – klassisches Gift-Exchange-Beispiel.",
  "a_short": "Equity-Theorie (Adams, 1965): Fairness als Verhältnis von Beiträgen zu Belohnungen; Ungleichgewicht erzeugt Korrekturbedarf. Fair-Wage-Effort-Modell (Akerlof und Yellen, 1988): Die Leistung hängt davon ab, ob der Lohn als gerecht gilt; der faire Lohn variiert mit Referenzgruppe und Arbeitslosenquote. Gift-Exchange-Ansatz (Akerlof, 1984): Reziprozität, Arbeitgeber und Arbeitnehmer beschenken sich mit höherem Lohn und höherem Einsatz.",
  "extra": {
   "erklaerung": "Alle drei Modelle erklären, warum Fairness den Arbeitseinsatz bestimmt und der Lohn nicht rein über Angebot und Nachfrage zustande kommt. Der Gift-Exchange-Ansatz beruht auf gegenseitiger Reziprozität.",
   "beispiel": "Henry Ford verdoppelte 1914 den Lohn auf 5 Dollar pro Tag; die Fluktuation sank drastisch, Ford nannte es einen seiner besten Kostensenkungszüge (Gift-Exchange).",

  "q": "Klausurfrage: Erläutern Sie die Prospect Theory und zeigen Sie, wie sie sich von der Erwartungsnutzentheorie unterscheidet. Nehmen Sie dabei kritisch Stellung.",
  "a": "Musterlösung: \nErwartungsnutzentheorie (EUT): Normative Theorie – Menschen maximieren rational ihren erwarteten Nutzen, haben stabile Präferenzen, gewichten Wahrscheinlichkeiten objektiv.\nProspect Theory (Kahneman & Tversky, 1979): Deskriptiv – beschreibt, wie Menschen tatsächlich entscheiden:\n1. Editierung (Vereinfachung) → 2. Evaluation (Nutzenzuordnung über Referenzpunkt)\nKernunterschiede: Verlustaversion, Referenzpunkt, s-förmige Wertfunktion, Übergewichtung kleiner Wahrscheinlichkeiten → vierfaches Muster der Risikopräferenzen.\nKritik an der Prospect Theory: \n• Referenzpunkte sind nicht immer klar definiert – wie wird der Status quo bestimmt?\n• Wurde hauptsächlich in Laborexperimenten getestet (Glücksspiele) – externe Validität fraglich\n• Keine klare normativen Implikationen – nur deskriptiv\n• Trotzdem: weit besser als EUT bei Erklärung realen Verhaltens bestätigt (Kahneman, Nobelpreis 2002)\nFazit: PT ist die aktuell beste deskriptive Theorie – ersetzt EUT nicht als normativen Standard, ergänzt sie aber fundamental.",
  "a_short": "Erwartungsnutzentheorie: normativ, rationale Nutzenmaximierung, stabile Präferenzen, objektive Wahrscheinlichkeitsgewichtung. Prospect Theory (Kahneman und Tversky, 1979): deskriptiv, zwei Schritte (Editierung, Evaluation), Bewertung relativ zum Referenzpunkt. Kernunterschiede: Verlustaversion, Referenzpunkt, s-förmige Wertfunktion, Übergewichtung kleiner Wahrscheinlichkeiten (vierfaches Muster). Kritik: unklare Referenzpunkte, vor allem Laborbefunde, rein deskriptiv.",

  "a": "Ausmaß: 8 % globaler Finanzvermögen versteckt; EU-Verlust bis zu 1 Billion € p.a. (EU-Kommission 2016).\nTraditionell (Becker, 1968): Rationale Kosten-Nutzen-Abwägung – Hinterziehung wenn Nutzen > erwartete Strafe.\nPsychologische Ergänzungen: \n• Prospect Theory: Bei erwarteter Steuernachzahlung (= Verlust) höhere Hinterziehungsneigung als bei Rückzahlung (Gewinn)\n• Gesellschaftliche Normen und individuell wahrgenommene Fairness\n• Persönlichkeit (Unzufriedenheit, Egoismus) erklärt beobachtete Hinterziehung besser als Einstellungen\n3 Präventionsansätze: \nEnforcement (Prüfungen + Strafen) / Service (Kundenorientierung) / Trust – Alm & Torgler 2011 (Normen stärken, Amnestien vermeiden, Fairness ernst nehmen)\nFazit: Rein monetäre Abschreckung greift zu kurz – Steuermoral ist kulturelles Phänomen.",

  "q": "Klausurfrage: Geldillusion und ihre wirtschaftliche Bedeutung – Erklärung, Beispiel, Konsequenzen.",
  "a": "Definition: Menschen denken und handeln in nominalen statt in realen Geldeinheiten, auch wenn Letztere rational relevant wären.\nBeispiel (Shafir et al. 1997): \n+2 % Nominallohn bei 4 % Inflation → bewertet als Lohnerhöhung\n−2 % Nominallohn bei 0 % Inflation → bewertet als Lohnsenkung\nRealeffekt in beiden Fällen: −2 % Reallohn\nWirtschaftliche Konsequenzen: \n• Unternehmen können in Hochinflationsphasen Reallöhne ohne Widerstand senken\n• Kurzfristig: mehr Beschäftigung möglich (Akerlof et al., 2000)\n• Bei starker Inflation oder Währungsumstellung: Preisintransparenz, desorientierende Wirkung\n• Beeinflusst Konjunkturverlauf über Lohn- und Nachfrageeffekte\nWichtig für Prof. Süßmair: Geldillusion ist ein konkretes Beispiel, wie psychologische Wahrnehmungsverzerrungen gesamtwirtschaftlich wirksam werden.",
  "a_short": "Menschen denken und handeln in nominalen statt in realen Geldeinheiten, auch wenn Letztere rational relevant wären. Beispiel (Shafir et al., 1997): +2% Nominallohn bei 4% Inflation gilt als Erhöhung, 2% Nominalsenkung bei 0% Inflation als Senkung, obwohl beides 2% Reallohnverlust bedeutet. Folgen: In Hochinflationsphasen lassen sich Reallöhne ohne Widerstand senken, was kurzfristig die Beschäftigung erhöhen kann (Akerlof et al., 2000).",
  "extra": {
   "erklaerung": "Die Geldillusion ist ein zentrales Beispiel dafür, wie Wahrnehmungsverzerrungen gesamtwirtschaftlich wirken. Bei sehr hoher Inflation oder Währungsumstellung werden Preise als intransparent erlebt; diese Unsicherheit über den Geldwert gilt Ökonomen als das eigentliche Hauptproblem hoher Inflation.",
   "quelle": "Block 5, Thema Geldwert, Geldwahrnehmung und Geldillusion (10.1.3); Klausurfrage"
  },
  "hasInfo": true
 },

  "a": "• Geldillusion: Denken in Nominalwerten statt Realwerten\n• Prospect Theory: Entscheidungen relativ zu Referenzpunkt; Verlustaversion; vierfaches Risikopräferenzmuster\n• Verlustaversion: Verluste wiegen psychologisch stärker als gleich hohe Gewinne\n• Behavioral Finance: Wann/wie weichen Anleger von Rationalität ab? 2 Säulen: Grenzen der Arbitrage + Psychologie der Akteure\n• Arbitrage: (nahezu) risikolose Nutzung von Preisunterschieden – in Praxis stark begrenzt\n• Endowment-Effekt: Eigenbesitz wird höher bewertet als identisches Fremdobjekt\n• Gift-Exchange: Reziprozität zwischen Lohn und Arbeitseinsatz (Ford-Beispiel)\n• Trust-Ansatz: Steuermoral durch Normen, nicht nur Strafen stärken (Alm & Torgler)\n↑ \nconst TOTAL = 33;\nlet revealed = new Set();\nfunction reveal(id) {\nconst back = document.getElementById('back-' + id);\nconst card = document.getElementById(id);\nif (!back) return;\nback.classList.toggle('visible');\nif (back.classList.contains('visible')) {\ncard.classList.add('revealed');\nrevealed.add(id);\n} else {\ncard.classList.remove('revealed');\nrevealed.delete(id);\n}\nupdateProgress();\n}\nfunction revealAll() {\ndocument.querySelectorAll('.card-back').forEach(b => {\nb.classList.add('visible');\nrevealed.add(b.id.replace('back-', ''));\nb.closest('.card').classList.add('revealed');\n});\nupdateProgress();\n}\nfunction resetAll() {\ndocument.querySelectorAll('.card-back').forEach(b => {\nb.classList.remove('visible');\nb.closest('.card').classList.remove('revealed');\n});\nrevealed.clear();\nupdateProgress();\n}\nfunction updateProgress() {\nconst visible = document.querySelectorAll('.card-wrapper:not(.hidden)').length;\nconst revealedVisible = [...revealed].filter(id => {\nconst wrap = document.getElementById(id)?.closest('.card-wrapper');\nreturn wrap && !wrap.classList.contains('hidden');\n}).length;\nconst pct = visible > 0 ? (revealedVisible / visible * 100) : 0;\ndocument.getElementById('progressBar').style.width = pct + '%';\ndocument.getElementById('progressText').textContent = revealedVisible + ' von ' + visible + ' aufgedeckt';\n}\nfunction filterCards(type) {\ndocument.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));\nevent.target.classList.add('active');\ndocument.querySelectorAll('.card-wrapper').forEach(w => {\nif (type === 'all' || w.dataset.type === type) {\nw.classList.remove('hidden');\n} else {\nw.classList.add('hidden');\n}\n});\nupdateProgress();\n}\nfunction exportCSV() {\nlet csv = 'Frage;Antwort\\n';\ndocument.querySelectorAll('.card-wrapper').forEach(wrapper => {\nconst q = wrapper.querySelector('.question')?.innerText?.replace(/\\n/g, ' ').replace(/;/g, ',') || '';\nconst a = wrapper.querySelector('.card-back')?.innerText?.replace(/\\n/g, ' ').replace(/;/g, ',') || '';\nif (q && a) csv += `\"${q}\";\"${a}\"\\n`;\n});\nconst blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'});\nconst a = document.createElement('a');\na.href = URL.createObjectURL(blob);\na.download = 'WiPsy_Kap10_Finanzpsychologie.csv';\na.click();\n}\nwindow.addEventListener('scroll', () => {\nconst btn = document.getElementById('scrollTopBtn');\nbtn.classList.toggle('visible', window.scrollY > 300);\n});\nupdateProgress();",
  "a_short": "Geldillusion: Denken in Nominalwerten statt Realwerten. Prospect Theory: Entscheidungen relativ zum Referenzpunkt, Verlustaversion, vierfaches Risikopräferenzmuster. Verlustaversion: Verluste wiegen psychologisch stärker als gleich hohe Gewinne. Behavioral Finance: Wann und wie weichen Anleger von Rationalität ab; zwei Säulen (Grenzen der Arbitrage, Psychologie der Akteure). Arbitrage: risikolose Nutzung von Preisunterschieden, in der Praxis begrenzt. Endowment-Effekt: Eigenbesitz wird höher bewertet als identisches Fremdobjekt. Gift-Exchange: Reziprozität zwischen Lohn und Arbeitseinsatz (Ford). Trust-Ansatz: Steuermoral durch Normen statt nur Strafen (Alm und Torgler).",

  "q": "Definiere den Konstruktivismus als erkenntnistheoretische Perspektive (Janich).",
  "a": "Wir sehen die Welt von vornherein niemals so, wie sie wirklich ist, sondern nach Maßgabe unserer Wahrnehmungsfähigkeit, Bedeutung und jeweils konkreter Perspektive. Informationen werden nicht nur weggefiltert, sondern durch physiologische, unbewusste oder bewusste Aktivität werden Umweltgegebenheiten erst zu ganzheitlichen Objekten gestaltet, das heißt konstruiert. Diese erkenntnistheoretische Perspektive, die jede Erkenntnistätigkeit als konstruierende begreift, wird Konstruktivismus genannt (Janich 1999).",
  "a_short": "Wir sehen die Welt nie, wie sie wirklich ist, sondern nach Maßgabe von Wahrnehmungsfähigkeit, Bedeutung und Perspektive. Erkenntnistheoretische Perspektive, die jede Erkenntnistätigkeit als konstruierende begreift (Janich 1999): weggefiltert plus konstruiert.",

   "erklaerung": "Konsequenz: In Vorstellung, Wissen über die Welt, andere Menschen und sich selbst stecken konstruktive Anteile. In der Kommunikation treffen die Konstruktionen aller Beteiligten aufeinander; Narrative und Storytelling gewinnen Bedeutung in Management und Marketing.",

  "q": "Wie beschreibt Holzkamp die Wahrnehmung, und was bedeutet dabei Bedeutung?",
  "a": "Was Menschen von ihrer Umwelt aufnehmen, ist vielfältig gefiltert. Bereits bei optischen und akustischen Signalen werden Anteile herausgefiltert beziehungsweise Gestalten hineininterpretiert. Die Wahrnehmung hängt von der Bedeutung der Signale für die empfangende Person ab; Bedeutung ist das Verhältnis zwischen psychischen Charakteristika und den objektiven Beschaffenheiten der Umwelt (Holzkamp 2005: 207). Die Bedeutung von Umweltgegebenheiten wird zusätzlich zu objektiven Umständen (Hunger, Durst, Sättigung) vom Denken bestimmt.",
  "a_short": "Wahrnehmung ist vielfältig gefiltert (herausfiltern plus Gestalten hineininterpretieren) und hängt von der Bedeutung der Signale ab; Bedeutung = Verhältnis zwischen psychischen Charakteristika und objektiven Beschaffenheiten der Umwelt (Holzkamp).",

  "a": "(1) Sachaspekt: die beschriebene Sache (worüber ich informiere). (2) Selbstoffenbarung: was anhand der Nachricht über den Sprecher deutlich wird. (3) Beziehungsaspekt: was die Art der Nachricht über die Beziehung offenbart. (4) Appell: wozu der Empfänger veranlasst werden soll. Beispiel: Die Frau sagt Da ist was Grünes! und meint: Ich weiß nicht, was es ist / Du wirst es wissen / Sag mir, was es ist. Der Mann versteht: Mir schmeckt das nicht / Du bist ein mieser Koch / Lass nächstes Mal das Grüne weg, und reagiert gereizt.",

 {
  "id": 271,
  "cat": "Vertiefung I: Theorie & Kommunikation",
  "q": "Was besagt die These von Maturana und Varela zur Kommunikation?",
  "a": "Biologisch gesehen gibt es in der Kommunikation keine übertragene Information. Jede Person sagt, was sie sagt, und hört gemäß ihrer eigenen Strukturdeterminiertheit; dass etwas gesagt wird, garantiert nicht, dass es gehört wird. Aus der Perspektive eines Beobachters gibt es in einer kommunikativen Interaktion immer Mehrdeutigkeit. Das Phänomen der Kommunikation hängt nicht von dem ab, was übermittelt wird, sondern von dem, was im Empfänger geschieht (Maturana/Varela 1990: 212).",
  "a_short": "Keine übertragene Information: Jede Person sagt und hört gemäß eigener Strukturdeterminiertheit; entscheidend ist, was im Empfänger geschieht; kommunikative Interaktion ist immer mehrdeutig (Maturana/Varela).",
  "extra": {

  "id": 273,
  "cat": "Vertiefung I: Theorie & Kommunikation",
  "q": "Welche Bedeutung hat der Konstruktivismus für das Management?",
  "a": "Wissen ist nicht das Ergebnis eines Abbildes (Entdecken der objektiv vorliegenden Wirklichkeit), sondern eines Erfindens (Konstruierens) der Wirklichkeit. Das Gehirn erzeugt kein fotografisches Abbild, sondern schafft mithilfe von Sinneswahrnehmungen ein eigenes Bild der Welt: Wahr ist, was wahrgenommen wird. Der Konstruktivismus verleugnet die Wirklichkeit nicht, nimmt aber Abschied von der absoluten Wahrheit. Für das Management: Bereits in der Betrachtung der unternehmerischen Wirklichkeit wird diese konstruiert, gestaltet beziehungsweise erfunden; Führungskräfte haben viele Gestaltungsmöglichkeiten, da Management letztlich die Konstruktion, Gestaltung beziehungsweise Erfindung von Führung ist (Gabler Wirtschaftslexikon).",
  "a_short": "Wissen = Erfinden statt Abbilden; Wahr ist, was wahrgenommen wird; Abschied von der absoluten Wahrheit (nicht: Leugnung der Wirklichkeit). Management konstruiert die unternehmerische Wirklichkeit bereits in der Betrachtung; Management als Konstruktion von Führung.",

  "q": "Definiere Fragmenting und Playing it (both) multiple ways.",
  "a": "Fragmenting: Fragmentierung der Kommunikationsbotschaft, zum Beispiel Herausgreifen eines Teilaspekts und Überakzentuierung, so dass ein verzerrtes Gesamtbild entsteht; insbesondere die Kommunikation von Teilaspekten an verschiedene Gruppen, vor allem in Unternehmen (Notion-Kurzformel: einen Sachverhalt isolieren und positiv rahmen). Playing it (both) multiple ways: Ein Sachverhalt (zum Beispiel die Entlassung von Mitarbeitern) wird unterschiedlich dargestellt, etwa gegenüber dem Betriebsrat und gegenüber Aktionären.",
  "a_short": "Fragmenting: Teilaspekt herausgreifen und überakzentuieren (isolieren und positiv rahmen), verzerrtes Gesamtbild; Teilaspekte an verschiedene Gruppen. Playing it both ways: derselbe Sachverhalt (z. B. Entlassungen) wird Betriebsrat und Aktionären unterschiedlich dargestellt.",

  "q": "Was ist Group Think, und welchen Bezug stellt die Mitschrift her?",

  "a_short": "Kompetente Personen treffen schlechtere/realitätsfernere Entscheidungen, weil jede ihre Meinung an die erwartete Gruppenmeinung anpasst; die Gruppe stimmt Dingen zu, die einzeln jeder ablehnen würde. Notion: Widerspruch gegen Vorgesetzte unterbleibt; Bezug Asch.",

  "a": "Fichter: Unser Wissen über die Dinge ist unvollständig und verzerrt (erkenntnistheoretische Grundannahme der Wirtschaftspsychologie). Images haben eine Vereinfachungsfunktion und umfassen auch mentale Repräsentationen faktischer Informationen (Preisimage, Zuverlässigkeitsimage). Experiment: Inhaltlich identische Artikel wurden je nach Layout unterschiedlich beurteilt; der fiktive NZZ-Artikel galt als seriös, gut recherchiert und glaubwürdig (aber schwer lesbar), der fiktive Blick-Artikel als oberflächlich, tendenziös und schlecht recherchiert (aber leicht lesbar). Wir urteilen nach unscharfen Meinungsbildern statt nach Fakten; Expertise und Involvement schwächen den Effekt nicht ab. Vorlesungsfolie: derselbe Migros/Coop-Preiskampf parallel in Blick und NZZ (13.09.2005).",
  "a_short": "Image = mentale Repräsentation mit Vereinfachungsfunktion; Wissen ist unvollständig und verzerrt. NZZ/Blick-Experiment: identischer Inhalt, unterschiedliche Beurteilung je nach Layout; Urteil nach Meinungsbildern statt Fakten; Expertise schützt nicht.",

 {

  "q": "Welche Empfehlungen gibt der Managementratgeber zur Kommunikation, und wie ordnet die Vorlesung sie kritisch ein?",
  "a": "Persönliche Kommunikation beansprucht rund 70 Prozent der Arbeitszeit im Top-Management. Empfohlen wird dialogorientierte Führung nach der ABC-Regel (Akzeptanz, Beteiligung, Commitment); der Manager als Schleusenwärter (Informationsflut kanalisieren) und Transformator (Informationen zielgruppenspezifisch übersetzen). Grundregeln: Kernbotschaft bei vielen Gelegenheiten wiederholen (wiederholte Information prägt sich ein), Information bedarfsgerecht und adressatenbezogen verteilen (Mittelweg zwischen Push und Pull), Informationen bündeln, Emotionalität beachten, Strategie-Dialoge führen. Ziele: durchgängig, konsistent, glaubwürdig, zielgruppengerecht, nutzenorientiert, phasengerecht, stetig. Kritische Einordnung der Vorlesung: Kritik? Vgl. Theranos; dieselben Techniken können eine Wirklichkeit ohne Substanz konstruieren.",

 {
  "id": 285,
  "cat": "Vertiefung II: Keynes, Hayek & Ungleichheit",
  "q": "Wie lautet Pikettys These, und warum hielt sie der empirischen Prüfung für die Vergangenheit nicht stand?",
  "a": "These: Die Rendite von Kapital liegt dauerhaft über der Wachstumsrate der Wirtschaft; Erträge aus Kapital wachsen schneller als Erträge aus Arbeit, Vermögen konzentriert sich zwangsläufig, das Verhältnis von Arbeit und Kapital kann kippen. Kritik (Handelsblatt-Analyse): Solange Maschinen bedient werden müssen, sind Kapital und Arbeit Komplemente; die zusätzliche Kapitaleinheit pro Arbeiter bringt tendenziell geringeren Zuwachs der Produktionskapazität (ein dritter Hammer ist nicht so nützlich wie die ersten beiden, solange Menschen nur zwei Hände haben); Kapital ohne Arbeit ist nahezu wertlos, sein Grenzprodukt fällt bei Akkumulation rasch. Deshalb schwankt die Kapitalquote am Volkseinkommen seit 200 Jahren zwischen 20 und 40 Prozent.",
  "a_short": "Piketty: Kapitalrendite dauerhaft über Wachstumsrate, Vermögen konzentriert sich zwangsläufig. Empirisch schwach: Kapital und Arbeit sind Komplemente (dritter Hammer bei zwei Händen), Grenzprodukt des Kapitals fällt; Kapitalquote seit 200 Jahren stabil bei 20 bis 40 Prozent.",
  "extra": {
   "erklaerung": "Datenbasis der Debatte: World Inequality Database (wid.world); Krugman-Rezension auf der Folie verlinkt.",
   "quelle": "VL Vertiefung Teil 5, Folien 149 und 150; Notion Vertiefung 5"
  },
  "hasInfo": true
 },
 {

  "cat": "Vertiefung II: Keynes, Hayek & Ungleichheit",
  "q": "Warum könnte KI zum Piketty-Szenario führen (Folie 150)?",
  "a": "Mit KI und Robotik kippt das Komplementaritätsverhältnis: Wenn Maschinen die Arbeit ersetzen, werden Kapital und Arbeit zu Substituten; die Kapitalquote steigt nachhaltig, die Lohnquote fällt (Befürchtung u. a. von Daron Acemoglu, MIT, Nobelpreisträger 2024; mit jedem Dollar in Sprach-KI steigt der Kapitalanteil am Volkseinkommen). Trammell und Patel: Piketty was wrong about the past. He is probably right about the future. Sie schließen nicht aus, dass der Gini-Koeffizient der US-Einkommensverteilung (0 = jeder hat das Gleiche, 1 = einer hat alles) von heute 0,42 auf 0,95 steigt, eine nie gemessene Größenordnung. Notion: Erträge aus Kapital wachsen schneller als aus Arbeit; das Verhältnis Arbeit/Kapital kann kippen.",
  "a_short": "KI macht Kapital und Arbeit zu Substituten: Kapitalquote steigt nachhaltig, Lohnquote fällt; Gini der US-Einkommen könnte von 0,42 auf 0,95 steigen. Trammell/Patel: Piketty was wrong about the past, probably right about the future (vgl. Acemoglu).",
  "extra": {
   "merkhilfe": "Vergangenheit: Komplemente (These falsch). Zukunft mit KI: Substitute (These womöglich richtig).",
   "quelle": "VL Vertiefung Teil 5, Folie 150; Notion Vertiefung 5"
  },
  "hasInfo": true
 },
 {

  "cat": "Vertiefung II: Keynes, Hayek & Ungleichheit",
  "q": "Nenne die drei Mechanismen des KI-Piketty-Szenarios und die Folgen für Deutschland.",
  "a": "(1) Privatisierung der Renditen: 2000 waren 8 Prozent des US-Unternehmenskapitals in privaten Händen, heute 19 Prozent; dazu Ende des internationalen Aufholens (Schwellenländer können Wohlstand nicht mehr über billige Arbeit plus Kapitaleinsatz steigern). (2) Ende des Generationenausgleichs: vererbtes Kapital wächst über Generationen unbegrenzt. (3) Fokus USA und China (China mit dramatisch sinkender Erwerbsbevölkerung im Vorteil); Notion: Wertschöpfung verlagert sich in Länder mit wertvollen Ressourcen. Deutschland: Arbeit würde überwiegend durch importierte KI-Vorleistungen ersetzt; Kapitalbesitzer profitieren weniger als in den USA; Bevölkerung partizipiert wegen geringer Aktienquote kaum; der von Lohnsteuern und Sozialabgaben lebende Sozialstaat wäre am Ende; erhebliche Wohlstandsverschiebung Richtung Ausland. Einordnung: noch ein Szenario; KI könnte wie frühere Innovationen auch Arbeitsnachfrage schaffen.",

  "q": "Wie lautet die Marken-Definition nach Meffert, und warum ist die Marke das Paradebeispiel des Konstruktivismus? (Klausurhinweis!)",
  "a": "Eine Marke ist ein in der Psyche des Konsumenten verankertes Vorstellungsbild von einem Produkt oder einer Dienstleistung (Marketing Centrum Münster; Meffert 2000). Merksatz und ausdrücklicher Klausurhinweis des Professors: Starke Marken sind unverwechselbar im Kopf verankert, Verbindung zum Konstruktivismus. Vorbereitende Folien: Starke Marken haben ein Gesicht (Logos) und sind einzigartig (Coca-Cola-Flasche zwischen Weinflaschen). Konstruktivismus-Bezug: Der Markenwert liegt nicht in objektiven Produkteigenschaften, sondern im konstruierten Vorstellungsbild in der Psyche der Konsumenten.",

 {
  "id": 291,
  "cat": "Vertiefung III: Globalisierung & Fallstudien",
  "q": "Lohnt sich der Aufbau starker Marken, und reicht Werbung dafür aus?",
  "a": "Aufbau lohnt sich: McKinsey Brand Stretch Studie (2001; 130 Konsumgüterunternehmen in sechs Industrien, Befragung von 5.000 Konsumenten): Total Return to Shareholders im Vergleich zum Marktdurchschnitt: starke Marken plus 2,0 Prozentpunkte, schwache minus 3,1. Werbung allein reicht nicht: Der Zusammenhang zwischen jährlichen Werbeausgaben (TV und Print) und Brand Value hat nur ein R-Quadrat von 6 Prozent, kein monokausaler Zusammenhang. Erforderlich ist eine umfassende Markenstrategie: Marketing (Medienauswahl, Promotions, PR), Kundensegmente (Intermediäre, Endkunden), Distributionswege (Einzelhandel, Boutiquen, Internet, Discounter), Produkt (Design, Logo, Verpackung, Preis), Mitarbeiter (Moments of Truth, Kauferlebnisse), Markenportfolio (Konsistenz). Beleg für die Lücke zwischen Werbewirkung und Ökonomie: E.ON erreichte im Strommarkt (November 2000) 93 Prozent gestützte Bekanntheit und 66 Prozent ungestützte Werbeerinnerung; die Mix-it-Baby-Kampagne 2001 kostete aber 22,5 Millionen Euro bei rund 1.100 Neukunden (0,7 Millionen Euro Jahresumsatz), also rund 20.500 Euro Werbeausgaben pro Neukunde.",
  "a_short": "Ja: TRS starke Marken plus 2,0 vs. schwache minus 3,1 Prozentpunkte (Brand Stretch 2001). Aber Werbung allein reicht nicht: R-Quadrat 6 Prozent; E.ON: 93 Prozent Bekanntheit, aber rund 20.500 Euro Werbekosten pro Neukunde; nötig ist eine umfassende Markenstrategie (inkl. Moments of Truth).",
  "extra": {
   "merkhilfe": "Werbewirkung (Bekanntheit, Erinnerung) und ökonomischer Impact sind zwei verschiedene Dinge.",
   "quelle": "VL Vertiefung Teil 5, Folien 162 bis 166"
  },

  "q": "Wie illustriert die Vorlesung Markenbildung über Musikvideos, und was zeigt der Fall Apple gegen Apple Corps?",
  "a": "Referenzkette: Das Tokio-Hotel-Video Der letzte Tag covert das U2-Video Where the Streets Have No Name und hält sich dicht am Original; das U2-Video war seinerseits ein Remake des spontanen Beatles-Konzerts auf dem Dach ihrer Plattenfirma Apple (1969, London); Drehort bei Tokio Hotel war das Dach des Kosmos-Kinos in Berlin. Dazu Anleihen an Fritz Langs Metropolis und den Apple-Werbefilm 1984, der von Orwells Roman 1984 inspiriert wurde (aktuelleres Beispiel: Bad Bunny). Pointe: Bedeutung entsteht über kollektiv geteilte kulturelle Referenzen, also durch Konstruktion. Apple gegen Apple Corps: Von 1978 bis 2006 Rechtsstreitigkeiten zwischen Apple Corps (Beatles) und Apple Computer über Markenrechte; Urteil des High Court of Justice am 8. Mai 2006 zugunsten Apple Computer, endgültige Einigung am 5. Februar 2007. Vorstellungsbilder sind so wertvoll, dass jahrzehntelang um sie prozessiert wird.",
  "a_short": "Tokio Hotel covert U2, das das Beatles-Rooftop-Konzert (1969, Apple) zitiert; plus Metropolis- und Apple-1984-Anleihen (Orwell): Bedeutung durch kulturelle Referenzketten. Apple vs. Apple Corps (1978 bis 2006, Urteil 2006, Einigung 2007): Marken als umkämpfte Vorstellungsbilder.",

 {

  "cat": "Organisation",
  "q": "Wie berechnet sich der WACC anhand der Kapitalanteile (Grundformel)?",
  "a": "WACC = EK-Anteil x EK-Kosten + FK-Anteil x FK-Kosten. Die Anteile von Eigenkapital (EK) und Fremdkapital (FK) an der Gesamtfinanzierung werden jeweils mit ihren Kapitalkosten multipliziert und addiert.",
  "a_short": "WACC = EK-Anteil x EK-Kosten + FK-Anteil x FK-Kosten.",
  "extra": {
   "erklaerung": "Der WACC (Weighted Average Cost of Capital) ist der gewichtete Durchschnitt aus Eigenkapitalkosten und Fremdkapitalkosten. Die Gewichte sind die jeweiligen Finanzierungsanteile, EK-Anteil plus FK-Anteil ergeben zusammen 100 Prozent. Rechenbeispiel: 70 Prozent EK zu 10 Prozent EK-Kosten plus 30 Prozent FK zu 5 Prozent FK-Kosten ergibt 0,70 x 10% + 0,30 x 5% = 7% + 1,5% = 8,5% WACC.",
   "quelle": "Rechenlogik-Ergaenzung zur Klausurvorbereitung (Nutzervorgabe 09.07.2026); vgl. Karte 125 (WACC ueber D/(D+E) und E/(D+E), Vorlesungsformel mit gleichem Ergebnis)."
  },

 },

  "q": "Wie berechnet sich der Economic Profit ueber Gewinn und Kapitalkosten (Kurzformel)?",
  "a": "Economic Profit = Gewinn - (WACC x Investitionsbasis). Vom Gewinn werden die Kapitalkosten abgezogen, die sich aus WACC mal Investitionsbasis ergeben.",
  "a_short": "Economic Profit = Gewinn - (WACC x Investitionsbasis).",
  "extra": {
   "erklaerung": "Diese Kurzform ist rechnerisch identisch mit Economic Profit = (ROIC - WACC) x investiertes Kapital, da ROIC x Kapital dem Gewinn entspricht: WACC x Investitionsbasis ergibt die Kapitalkosten, Gewinn minus Kapitalkosten ergibt den Economic Profit. Positiver Economic Profit heisst Wertschaffung, negativer Economic Profit heisst Wertvernichtung.",

 {
  "id": 324,
  "cat": "Organisation",
  "q": "Rechne die Referenzaufgabe Schritt fuer Schritt durch: Preis 130,90 Euro inklusive 19% USt, 15 Stueck, Gesamtkosten 1500 Euro, Investitionsbasis 1000 Euro, 70% EK zu 10%, 30% FK zu 5%. Wie hoch sind Nettopreis, Umsatz, Gewinn, WACC, Kapitalkosten und Economic Profit?",
  "a": "1. Nettopreis: 130,90 / 1,19 = 110 Euro. 2. Umsatz: 110 Euro x 15 Stueck = 1650 Euro. 3. Gewinn: 1650 Euro Umsatz - 1500 Euro Gesamtkosten = 150 Euro. 4. WACC: 70% x 10% + 30% x 5% = 7% + 1,5% = 8,5%. 5. Kapitalkosten: 8,5% x 1000 Euro Investitionsbasis = 85 Euro. 6. Economic Profit: 150 Euro Gewinn - 85 Euro Kapitalkosten = 65 Euro.",
  "a_short": "Netto 110 Euro, Umsatz 1650 Euro, Gewinn 150 Euro, WACC 8,5%, Kapitalkosten 85 Euro, Economic Profit 65 Euro.",
  "extra": {
   "erklaerung": "Deutung fuer das Management: Das Unternehmen erwirtschaftet nicht nur einen buchhalterischen Gewinn von 150 Euro, sondern schafft nach Abzug der Kapitalkosten von 85 Euro zusaetzlich 65 Euro echten oekonomischen Mehrwert, der Economic Profit ist positiv. Die eingesetzten Mittel verzinsen sich also besser, als die Kapitalgeber es fuer ihr Risiko verlangen, die Investition lohnt sich ueber die reinen Finanzierungskosten hinaus. Deutung fuer Stakeholder (Eigen- und Fremdkapitalgeber): Ihre Renditeanspruche, 10 Prozent auf Eigenkapital und 5 Prozent auf Fremdkapital, sind bereits in den Kapitalkosten von 85 Euro beruecksichtigt, und trotzdem bleibt ein Ueberschuss von 65 Euro. Das Investment schafft zusaetzlichen Wert und rechtfertigt das eingegangene Risiko. Waere der Economic Profit negativ, haette das Unternehmen zwar einen Gewinn ausgewiesen, aber gleichzeitig Kapital vernichtet, weil die Rendite unter den Kapitalkosten liegt.",
   "beispiel": "Angaben: Preis 130,90 Euro inklusive 19% USt, 15 Stueck, Gesamtkosten 1500 Euro, Investitionsbasis 1000 Euro, 70% EK zu 10%, 30% FK zu 5%.",
   "quelle": "Rechenlogik-Referenzaufgabe zur Klausurvorbereitung (Nutzervorgabe 09.07.2026, Economic-Profit-Rechnung laut Klausurbesprechung sehr wahrscheinlich)."

<script type="application/json" id="ar-data">[{"key":"Block1","label":"Block 1 · Grundlagen & Forschungsmethoden","color":"#e8833a","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Was Wirtschaftspsychologie ist und woher sie kommt","lernziel":"Verstehen, was das Fach im Kern ausmacht, wie es sich in Psychologie und Ökonomie einordnet, wie es historisch entstand, und die vier Aussagetypen sicher unterscheiden können.","konzepte":"Definition und Selbstverständnis (empirische Wissenschaft), Postulat 'Wirtschaft wird von Menschen gemacht', Wie- und Wozu-Frage, Disziplinen der Psychologie (Sozialpsychologie als Fundament), BWL und VWL (Mikro/Makro), drei Themenkreise und wirtschaftlicher Kreislauf, Geschichte (Smith, Wundt, Münsterberg, Tarde, Veblen, Hawthorne, Taylor, Katona, Kahneman), Typologie der Aussagen.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"","body":["Beginnen wir mit einer Frage, die einfacher klingt, als sie ist: Womit beschäftigt sich die Wirtschaftspsychologie eigentlich? Die Antwort, die du wortnah können solltest, weil der Professor sie in Vorlesung und Lehrbuch fast identisch formuliert, lautet: Sie befasst sich mit dem Erleben und Verhalten des Menschen beim wirtschaftlichen Handeln, mit einem Schwerpunkt auf dem Entscheidungsverhalten. Genauso wichtig ist der zweite Teil dieser Definition: Sie ist eine empirische Wissenschaft. Das heißt, sie gewinnt ihre Erkenntnisse nicht im Lehnstuhl durch bloßes Nachdenken, sondern durch systematische Beobachtung, Experimente und Datenauswertung. Diese beiden Halbsätze, Gegenstand und empirische Methode, sind Grundlagenwissen, und sie tauchen mit hoher Wahrscheinlichkeit in der Klausur auf.","Dahinter steht ein Leitgedanke, das zentrale Postulat des Fachs: Wirtschaft wird von Menschen gemacht. Gemeint ist, dass es die Wirtschaft nur gibt, weil Menschen gemeinschaftlich organisierte Austauschprozesse gefunden haben, die ihnen das Überleben in einer Welt knapper Ressourcen erleichtern. Teilen, Tauschen und Handeln haben sich über Zehntausende von Jahren herausgebildet, sie gehören zur menschlichen Natur. Daraus folgt der Anspruch des Fachs: Ohne Psychologie kann man die Wirtschaft nicht verstehen."]},{"h":"Nicht nur das Irrationale, und immer auch das Wozu","body":["Ein verbreitetes Missverständnis ist, Wirtschaftspsychologie handle nur vom Irrationalen. Dieses Image entsteht, weil Medien und Politik sie meist dann zu Hilfe rufen, wenn etwas schiefläuft. Tatsächlich erklärt sie aber genauso, warum etwas gelingt. Und selbst scheinbar irrationales Verhalten hat oft gute Gründe. Menschen wollen zum Beispiel nicht möglichst viel verdienen, sondern mehr als ihre Nachbarn, und sie suchen das absolut beste Produkt, nehmen dann aber das erstbeste. Worauf sie eigentlich aus sind: im Kampf um knappe Ressourcen mit möglichst wenig Aufwand möglichst gut dazustehen. Deshalb fragt das Fach nicht nur nach dem Wie, also den naheliegenden Ursachen eines Verhaltens, sondern auch nach dem Wozu, den Letztursachen. Diese Doppelperspektive ist typisch und hilft dir, Verhalten tiefer zu deuten."]},{"h":"Wo das Fach zu Hause ist","body":["Um die Wirtschaftspsychologie einzuordnen, brauchst du zwei Landkarten, eine psychologische und eine ökonomische. In der Psychologie gibt es mehrere Disziplinen: die Allgemeine Psychologie behandelt die Grundlagen des Erlebens, die Persönlichkeitspsychologie die Unterschiede zwischen Menschen, dazu kommen Entwicklungs-, biologische und evolutionäre Psychologie. Den einen Satz, den du dir hier unbedingt merkst, ist aber dieser: Die Sozialpsychologie gilt als das Fundament der Wirtschaftspsychologie, weil wirtschaftliches Handeln immer in einem sozialen Umfeld stattfindet, mit Gruppen, Normen und Wettstreit um Ressourcen. Wegen ihrer starken Anwendungsorientierung lässt sich das Fach zugleich als Teil der Angewandten Psychologie verstehen.","Die zweite Landkarte ist die Ökonomie, wobei du Wirtschaft und Ökonomie unterscheiden solltest: Wirtschaft meint das System, Ökonomie die Lehre davon. Die Betriebswirtschaftslehre betrachtet die einzelnen Betriebe, mit Themen wie Produktion, Strategie, Finanzen, Organisation, Marketing und Personal, und genau hier liegen die Brücken zur Psychologie. Die Volkswirtschaftslehre abstrahiert von den einzelnen Betrieben und teilt sich in Mikroökonomik, die das Verhalten von Haushalten und Unternehmen auf Märkten untersucht, und Makroökonomik, die Staat, Konjunktur, Geldpolitik und Arbeitslosigkeit in den Blick nimmt.","Diese Ordnung spiegelt sich in der Gliederung des ganzen Fachs. Fichter teilt es in drei Themenkreise, die du als roten Faden durch das gesamte Studienjahr verstehen kannst: Erstens Konsum, Markt und Werbung, die Perspektive des Verbrauchs, mikroökonomisch. Zweitens Arbeit, Organisation und Personal, die Perspektive der Herstellung, ebenfalls mikroökonomisch. Und drittens Geld, Gesellschaft und Entwicklung, die gesamtwirtschaftlichen Rahmenbedingungen, makroökonomisch. Dahinter steht ein einfacher wirtschaftlicher Kreislauf: Menschliche Bedürfnisse sind die Basis, Güter werden durch Arbeit hergestellt, dafür organisieren sich Menschen und brauchen passend ausgewähltes, entlohntes Personal, und mit dem Lohn wird wieder konsumiert, während ein Teil an Staat und Vorsorge geht.",". . ."]},{"h":"Eine kurze Geschichte mit ein paar Namen, die sitzen müssen","body":["Ökonomische Überlegungen sind uralt, von den alten Ägyptern über Hesiod, der die Arbeit zugleich als wichtigste Beschäftigung und als Übel aus der Büchse der Pandora sah, bis zu Aristoteles. Den ersten großen Namen, den du brauchst, ist Adam Smith, der 1776 mit dem Wohlstand der Nationen als Begründer der modernen Wirtschaftswissenschaft gilt. Von ihm stammt das Bild der unsichtbaren Hand: Das Streben jedes Einzelnen nach eigenem Nutzen wirkt in der Summe wie eine ordnende Kraft. Aus dieser Tradition stammt auch das Menschenbild des Homo oeconomicus, des durchweg rationalen Nutzenmaximierers, das uns später noch oft als Kontrastfolie begegnet.","Die wissenschaftliche Psychologie als empirisches Fach entstand 1879, als Wilhelm Wundt in Leipzig das erste psychologische Labor gründete. Und jetzt der wichtigste Name des Kapitels: Hugo Münsterberg, ein Schüler Wundts, gilt als Begründer der Wirtschaftspsychologie. Er baute an der Harvard University ein Labor auf, setzte experimentelle Methoden für betriebliche Fragen ein, etwa Auswahlverfahren für Telefonistinnen und Straßenbahnfahrer, und veröffentlichte 1912 das Buch Psychologie und Wirtschaftsleben. Hier lauert eine klassische Falle: Den Begriff Wirtschaftspsychologie hat nicht Münsterberg zuerst verwendet, sondern Gabriel Tarde, bereits 1902, allerdings folgenlos. Begründer und Begriffsprägerin sind also zwei verschiedene Personen, verwechsle sie nicht.","Ein paar weitere Namen runden das Bild: Walter Dill Scott begründete die Werbepsychologie, Kurt Lewin die Feldtheorie und die Forschung zu Führungsstilen, und der Soziologe Thorstein Veblen lieferte den Veblen-Effekt, also die Beobachtung, dass die Nachfrage nach Luxusgütern trotz Preiserhöhung steigen kann, weil sie Status demonstrieren. Ab etwa 1930 stagnierte die Entwicklung, doch zwei Dinge aus dieser Zeit musst du kennen. Erstens die Hawthorne-Studien: Bei einem Beleuchtungsexperiment stieg die Arbeitsleistung sogar dann, als man die Beleuchtung wieder senkte, einfach weil die Arbeiterinnen wussten, Teil einer Studie zu sein. Die Lehre daraus war, dass härteres Anpeitschen nicht mehr Leistung bringt, sondern Sinn, Anerkennung und gute Beziehungen, das war der Beginn der Human-Relations-Bewegung und das Ende des Taylorismus, jener Lehre Frederick Taylors, die Arbeit in kleinste, monotone Schritte zerlegte. Zweitens George Katona, der ein bis heute genutztes Instrument zur Messung der Konsumentenstimmung entwickelte und damit den dritten Themenkreis vorbereitete. Den vorläufigen Schlusspunkt setzt das Jahr 2002, als der Psychologe Daniel Kahneman den Wirtschaftsnobelpreis erhielt, für seine Arbeiten mit Amos Tversky zu Urteilsheuristiken und zur Prospect Theory. Damit war die Verhaltensökonomie endgültig etabliert, und Krisen wie die Dotcom-Blase und die Subprime-Krise bestätigten, dass das reine Homo-oeconomicus-Bild zu kurz greift."]},{"h":"Vier Arten, etwas zu sagen","body":["Zum Schluss dieses ersten Texts ein kleines, aber ausdrücklich klausurrelevantes Werkzeug: die Typologie der Aussagen. Es gibt vier Typen, und am leichtesten merkst du sie über je ein Verb. Eine deskriptive Aussage beschreibt einen Sachverhalt, sie stellt wertfrei den Ist-Zustand dar. Eine explikative Aussage erklärt ihn, sie stützt sich auf Gesetzmäßigkeiten, deren logische Form im Hempel-Oppenheim-Schema steckt und die man durch den Versuch der Falsifikation prüft. Eine normative Aussage bewertet einen Sachverhalt, sie beruft sich auf Normen, also gesellschaftlich festgelegte Regeln. Und eine präskriptive Aussage fordert etwas, sie beschreibt einen Soll-Zustand im Sinne von so soll es sein. Der Merksatz, den du sicher beherrschen solltest, lautet also: beschreiben, erklären, bewerten, fordern. Pass besonders auf das letzte Paar auf, denn normativ und präskriptiv werden leicht verwechselt: Das eine bewertet, das andere fordert."]}],"raster":[{"kat":"PB","begriff":"Definition + 'empirische Wissenschaft'","warum":"vom Prof wortgleich formuliert","muss":true,"gew":10,"ktag":"","terms":["Definition","Wissenschaft","empirische"]},{"kat":"PB","begriff":"Postulat 'Wirtschaft wird von Menschen gemacht'","warum":"Leitgedanke des Fachs","muss":false,"gew":5,"ktag":"","terms":["Postulat","Wirtschaft","Menschen","gemacht"]},{"kat":"PB","begriff":"Sozialpsychologie als Fundament","warum":"Selbstverständnis","muss":true,"gew":8,"ktag":"","terms":["Sozialpsychologie","Fundament"]},{"kat":"PB","begriff":"BWL vs. VWL (Mikro/Makro)","warum":"Einordnung in die Ökonomie","muss":false,"gew":6,"ktag":"","terms":["BWL","VWL","Mikro","Makro"]},{"kat":"PB","begriff":"Drei Themenkreise (Konsum/Arbeit/Geld)","warum":"Strukturwissen des Fachs","muss":true,"gew":7,"ktag":"","terms":["Themenkreise","Konsum","Arbeit","Geld"]},{"kat":"PB","begriff":"Adam Smith (unsichtbare Hand, Homo oeconomicus)","warum":"Eckpfeiler der Geschichte","muss":true,"gew":7,"ktag":"","terms":["Adam","Smith","Hand","Homo"]},{"kat":"PB","begriff":"Wundt 1879 Leipzig","warum":"erstes psychologisches Labor","muss":false,"gew":5,"ktag":"","terms":["Wundt","Leipzig","1879"]},{"kat":"PB","begriff":"Münsterberg (Begründer, 1912)","warum":"klassische Namensfrage","muss":true,"gew":8,"ktag":"","terms":["Münsterberg","Begründer"]},{"kat":"PB","begriff":"Vier Aussagetypen + Merksatz","warum":"explizit klausurrelevant","muss":true,"gew":10,"ktag":"","terms":["Aussagetypen","Merksatz"]},{"kat":"PB","begriff":"Veblen-Effekt","warum":"Status/Luxus, verbindet zu Konsum","muss":false,"gew":5,"ktag":"","terms":["Veblen-Effekt","Veblen","Effekt"]},{"kat":"PB","begriff":"Hawthorne-Effekt / Taylorismus","warum":"Wendepunkt zu Human Relations","muss":false,"gew":5,"ktag":"","terms":["Hawthorne-Effekt","Hawthorne","Effekt","Taylorismus"]},{"kat":"PB","begriff":"Kahneman 2002 / Behavioral Economics","warum":"Etablierung der Verhaltensökonomie","muss":false,"gew":5,"ktag":"","terms":["Kahneman","Behavioral","Economics","2002"]},{"kat":"PK","begriff":"Wie-/Wozu-Doppelperspektive","warum":"naheliegende vs. Letztursachen","muss":false,"gew":5,"ktag":"","terms":["Wie-","Wozu-Doppelperspektive","Wozu","Doppelperspektive"]},{"kat":"PK","begriff":"Vier Aussagetypen unterscheiden","warum":"beschreiben/erklären/bewerten/fordern","muss":true,"gew":9,"ktag":"","terms":["Aussagetypen","unterscheiden"]},{"kat":"PZ","begriff":"Sozialpsychologie als Fundament, belegt durch Asch","warum":"verbindet Selbstverständnis und Methodenteil","muss":true,"gew":6,"ktag":"","terms":["Sozialpsychologie","Fundament","Asch","belegt"]},{"kat":"PZ","begriff":"Homo oeconomicus als Kontrastfolie (Smith -> Kahneman)","warum":"Bogen zur Verhaltensökonomie / Block 5","muss":false,"gew":6,"ktag":"","terms":["Homo","Kontrastfolie","Smith","Kahneman","oeconomicus"]},{"kat":"KD","begriff":"Definition wortnah wiedergeben","warum":"Prof formuliert wortgleich","muss":true,"gew":9,"ktag":"","terms":["Definition","wortnah","wiedergeben"]},{"kat":"KD","begriff":"Typologie als ausdrücklicher Klausurpunkt","warum":"sehr wahrscheinliche Frage","muss":true,"gew":9,"ktag":"","terms":["Typologie","Klausurpunkt","ausdrücklicher"]},{"kat":"KD","begriff":"Münsterberg (Begründer) vs. Tarde (Begriffsprägerin)","warum":"präzise Zuordnung","muss":true,"gew":6,"ktag":"","terms":["Münsterberg","Begründer","Tarde","Begriffsprägerin"]}],"fehler":["Münsterberg und Tarde verwechseln: Münsterberg ist der Begründer (1912), Tarde prägte nur den Begriff (1902).","Normativ und präskriptiv vertauschen: das eine bewertet, das andere fordert.","Die Sozialpsychologie nicht als Fundament des Fachs erkennen.","Die Wirtschaftspsychologie auf das Irrationale reduzieren, statt auch das Gelingen zu erklären.","Den Homo oeconomicus als realistisches Menschenbild darstellen statt als Kontrastfolie."]},{"title":"Wie das Fach zu Wissen kommt - Forschungsmethoden","lernziel":"Verstehen, wie wirtschaftspsychologisches Wissen empirisch entsteht, wie ein Forschungsprozess abläuft, und wie man die Qualität von Studien beurteilt, mit besonderem Blick auf die klausurrelevanten Gütekriterien.","konzepte":"Wissenschaftstheorie, empirische Forschung, neun Schritte des Forschungsprozesses, Hypothesen, Operationalisierung und Variablen, quantitative/qualitative/Mixed-Methods-Forschung, Gütekriterien (Validität, Reliabilität, Objektivität), deskriptive und Inferenzstatistik, Signifikanz und Effektstärke, Experiment (UV, AV, Randomisierung), Befragung (Repräsentativität, soziale Erwünschtheit), Metaanalyse und Publication Bias, qualitative Verfahren, Asch-Experiment.","lesezeit":"etwa 11 bis 13 Minuten","sections":[{"h":"","body":["Im ersten Teil hast du gesehen, dass die Wirtschaftspsychologie eine empirische Wissenschaft ist. Jetzt geht es darum, was das konkret bedeutet, denn der Bonuskapitel-Stoff zu den Methoden ist ausdrücklich klausurrelevant, der Professor hat angekündigt, dass immer mindestens eine Frage aus dem Bonuskapitel kommt. Behandle diesen Text also nicht als Pflichtübung, sondern als sichere Punktequelle."]},{"h":"Bevor man misst: die Frage nach dem Wissen selbst","body":["Ganz am Anfang steht eine philosophische Disziplin, die Wissenschaftstheorie. Sie fragt, ob und wie Wissenschaft überhaupt Wissen schaffen kann, zum Beispiel, ob wir alle eine vergleichbare Wirklichkeit wahrnehmen. In der wirtschaftspsychologischen Forschung hat man sich darauf geeinigt, dass das in hinreichendem Maß möglich ist, und auf dieser Grundlage betreibt man empirische Forschung, also die systematische Sammlung und Auswertung von Daten aus der Realität durch Beobachtung, Befragung und Experiment. Der Kerngedanke ist, dass man Wissen nicht erdenkt, sondern erhebt."]},{"h":"Der typische Forschungsprozess","body":["Eine Studie verläuft idealtypisch in neun Schritten, und es lohnt sich, die Reihenfolge zu kennen, weil sie eine innere Logik hat. Am Anfang stehen Themenfindung, Literaturrecherche und die Zuspitzung auf eine konkrete Fragestellung. Daraus leitet man Hypothesen ab, also prüfbare Vermutungen. Dann kommt der Schritt, der gern unterschätzt wird, die Operationalisierung, gefolgt von Datenerhebung, Datenauswertung, Diskussion und schließlich Verwertung. Nicht jede Studie durchläuft alle neun Schritte, aber die Abfolge zeigt, wie aus einer vagen Idee am Ende verwertbares Wissen wird.","Zwei Begriffe daraus brauchst du genauer. Eine Hypothese ist eine konkrete, statistisch prüfbare Aussage, meist in der Form je-desto oder wenn-dann, etwa: Je öfter Mitarbeiter eine E-Mail-Benachrichtigung bekommen, desto unzufriedener sind sie am Abend. Und die Operationalisierung ist die Festlegung, wie man ein psychologisches Konstrukt überhaupt messbar macht, zum Beispiel Intelligenz über die Zahl richtig gelöster Testaufgaben. Variablen sind dabei einfach die Messgrößen. Ohne Operationalisierung bleibt jede schöne Theorie unprüfbar, deshalb ist dieser Schritt das Scharnier zwischen Idee und Daten."]},{"h":"Zwei Wege, dieselbe Wirklichkeit zu untersuchen","body":["Man unterscheidet zwei große Zugänge, die du nicht als Konkurrenten, sondern als unterschiedliches Handwerkszeug verstehen solltest. Die quantitative Forschung arbeitet mit numerischen Daten aus Fragebogen, Experimenten oder Beobachtung, wertet sie statistisch aus und geht meist deduktiv und variablenorientiert vor, oft um Hypothesen zu prüfen. Die qualitative Forschung arbeitet mit verbalen Äußerungen aus Interviews oder Freitexten, wertet sie interpretativ oder per Inhaltsanalyse aus und geht induktiv und einzelfallorientiert vor, oft um Hypothesen erst zu erzeugen. Beide lassen sich im Mixed-Methods-Ansatz kombinieren, und die Grundregel, die du dir merken solltest, lautet: Die Fragestellung leitet die Wahl der Methode, nicht umgekehrt. Eine einzige oder beste Methode gibt es nicht, und qualitativ ist keineswegs einfacher als quantitativ."]},{"h":"Woran man gute Forschung erkennt","body":["Jetzt kommt der wohl wichtigste Teil dieses Texts, die Gütekriterien, denn an ihnen misst man die Qualität quantitativer Forschung, und genau sie nennt der Professor als Bonuskapitel-Prüfstoff. Es sind drei. Die Validität, also die Gültigkeit, fragt: Wird wirklich das gemessen, was gemessen werden soll? Die Reliabilität, die Zuverlässigkeit, fragt: Ergibt eine Wiederholung der Messung dieselben Ergebnisse? Und die Objektivität, die intersubjektive Vergleichbarkeit, fragt: Ist die Studie so standardisiert, dass verschiedene Studienleiter dieselben Ergebnisse erhalten? Erst wen
