<script type="application/json" id="exam-data">[{"key":"probe","title":"Probeklausur des Profs (mit Musterlösungen)","fragen":[{"id":"1","punkte":2,"teil":"Fragenteil (31 Punkte, 31 Minuten)","frage":["Welche Probleme bringt Arbeit im Home-Office mit sich?"],"loesung":["Gesundheitliche Beeinträchtigungen: überwiegendes Stillsitzen, Fehlhaltungen und dauerhafte Fokussierung auf den Bildschirm können langfristig die Gesundheit schädigen.","Soziale Isolation: Home-Office-Arbeitende können sozial isoliert und in der betrieblichen Kommunikation benachteiligt werden (weniger informeller Austausch, Nachteil für Innovation; Beispiel Yahoo rief 2013 die Mitarbeiter zurück ins Firmengebäude).","Entgrenzung der Arbeit: Bei ständiger Erreichbarkeit weitet sich Arbeit auf Freizeit und Familienzeit aus; Work-Life-Balance und Qualität der Arbeit leiden (Beispiel Volkswagen führte 2011 eine E-Mail-Funkstille außerhalb der Gleitzeiten ein).","Lösungsansatz: Betroffene müssen über gute Arbeitsplatzgestaltung informiert und zur Vermeidung schädigender oder unproduktiver Verhaltensweisen befähigt und motiviert werden.","Klausurtaktik: Bei 2 Punkten genügen zwei sauber benannte Probleme mit je einem Halbsatz Erläuterung. Die weiteren Konzepte sind Reserve, falls mehr Zeit bleibt."],"quelle":"Block 2 Arbeit"},{"id":"2","punkte":3,"teil":"Fragenteil (31 Punkte, 31 Minuten)","frage":["Auf welchen Märkten muss ein Unternehmen langfristig erfolgreich sein? Nennen und erläutern Sie kurz."],"loesung":["Beschaffungsmarkt: Bezug von Ressourcen; langfristiger Erfolg braucht verlässliche Lieferantenbeziehungen (Beispiel Aldi als zuverlässig zahlender Vertragspartner der Lieferanten).","Absatzmarkt: Verkauf von Produkten und Leistungen; langfristiger Erfolg braucht Kundennutzen und Kundenbindung.","Finanzmarkt: Beschaffung von Eigen- und Fremdkapital; langfristiger Erfolg braucht Vertrauen der Kapitalgeber (Unternehmenswert, Investor Relations).","Vertiefung für die volle Punktzahl: Aus der Frage, welcher Markt priorisiert wird, folgt der Gegensatz Shareholder-Ansatz gegen Stakeholder-Ansatz. Langfristig muss ein Unternehmen auf allen drei Märkten zugleich bestehen; die Commanding-Heights-Konsequenz fordert ausdrücklich Verantwortung entlang von Absatz-, Beschaffungs- und Finanzmarkt."],"quelle":"Block 3 Organisation und Wertorientierung"},{"id":"3","punkte":2,"teil":"Fragenteil (31 Punkte, 31 Minuten)","frage":["Was versteht man unter der Geldillusion?"],"loesung":["Definition: Menschen denken in nominalen statt in realen (teuerungsbereinigten) Größen, weil nominale Preise kognitiv leichter abrufbar sind; die Geldwahrnehmung entspricht dann nicht dem tatsächlichen Geldwert (Kaufkraft).","Beleg (Shafir et al., 1997): Eine nominale Lohnerhöhung um 2 Prozent bei 4 Prozent Inflation wird positiver beurteilt als eine Lohnsenkung um 2 Prozent bei 0 Prozent Inflation, obwohl beides real einer Lohnsenkung um 2 Prozent entspricht.","Folge (Akerlof et al., 2000): In Jahren mit hoher Inflation können Unternehmen die Reallöhne leichter ohne Widerstand senken und so kurzfristig die Beschäftigung erhöhen."],"quelle":"Block 5 Finanzpsychologie"},{"id":"4","punkte":6,"teil":"Fragenteil (31 Punkte, 31 Minuten)","frage":["Beschreiben Sie das Geschäftsmodell eines selbst gewählten Unternehmens anhand der drei strukturierenden Leitfragen."],"loesung":["Begriff (Stähler, 2001): Ein Geschäftsmodell besteht aus drei Hauptkomponenten: Value Proposition (Nutzenversprechen), Architektur der Wertschöpfung und Ertragsmodell. Es wird bewusst nicht über Produkt oder Markt definiert, sondern über den gestifteten Nutzen. Die drei Leitfragen lauten: Welchen Nutzen stiftet das Unternehmen? Wie erbringt es diesen Nutzen? Wie verdient es Geld?","Leitfrage 1, Nutzen (Value Proposition): Aldi bietet verlässlich günstige Preise bei akzeptabler Qualität und schnelle Orientierung durch ein begrenztes Sortiment; dazu kommt der Imagewandel von billig zu jung und modern mit jüngerer Zielgruppe.","Leitfrage 2, Wertschöpfungsarchitektur: schlanke Prozesse, begrenztes Sortiment mit hoher Umschlagshäufigkeit (Abverkauf der Ware innerhalb rund einer Woche), effiziente Logistik und die Rolle als verlässlicher, zuverlässig zahlender Vertragspartner der Lieferanten.","Leitfrage 3, Ertragsmodell: Masse über günstige Preise statt hoher Einzelmargen, langfristige Kundenbindung (Lifetime Value of a Customer, der Kunde ist König) und vor allem das Working-Capital-Management: Lieferanten werden erst nach rund 90 Tagen bezahlt, die Ware ist dann längst verkauft, das eingesammelte Kapital wird weiter investiert (Aldi als große Geldeinsammelstelle mit Lebensmitteln).","Schlusssatz für die volle Punktzahl: Langfristig trägt das Modell, weil Aldi seine Ressourcen und Kompetenzen laufend an Marktveränderungen anpasst (Dynamic Capabilities nach Teece).","Klausurtaktik: Das Raster funktioniert für jedes Unternehmen (Lidl, Amazon, Tesla, Zalando, Taylor Swift). Vorab ein Unternehmen wählen, dessen drei Antworten man in je zwei Sätzen sicher formulieren kann. Punktelogik: 1 Punkt Definition, je 1 bis 2 Punkte pro Leitfrage."],"quelle":"Block 8 Vertiefungen; hier am Beispiel Aldi"},{"id":"5","punkte":7,"teil":"Fragenteil (31 Punkte, 31 Minuten)","frage":["Auf dem Portal finanzen.net können Anleger ein Depot führen, Kurse in Echtzeit verfolgen und Börsennachrichten lesen. Welche wirtschaftspsychologischen Aspekte greifen beim Anlegerverhalten auf einer solchen Plattform? Begründen Sie außerdem, warum wirtschaftspsychologische Erklärungen hier überhaupt einen Beitrag leisten."],"loesung":["Antwortmuster laut Klausur-Besprechung: 4 bis 6 Konzepte nennen und jeweils in einem Satz auf den Fall beziehen.","Massenpsychologie und Herdenverhalten: Anleger imitieren die Entscheidungen anderer; auf einer Plattform mit sichtbaren Kursbewegungen und Nachrichten läuft die Herde gemeinsam in steigende Titel, wodurch sich Kurse vom Fundamentalwert lösen können (Spekulationsblasen durch gegenseitige psychologische Ansteckung).","Prospect Theory mit Endowment-Effekt und Wertüberschätzung: Anleger bewerten Ergebnisse relativ zum Referenzpunkt (Kaufkurs) und überschätzen den Wert der Aktien, die sie bereits besitzen (Besitztumseffekt), weshalb sie am eigenen Depot festhalten.","Verlustaversion: Verluste wiegen schwerer als gleich hohe Gewinne; daraus folgt der Dispositionseffekt, Anleger verkaufen ungern Aktien unter dem Kaufpreis und halten Verlierertitel zu lange.","Overconfidence: Anleger überschätzen die eigene Prognosefähigkeit und handeln übermäßig häufig; die Renditen liegen nach Gebühren unter dem Markt.","Stimmungen: Emotionen beeinflussen Anlageentscheidungen und sogar Börsenkurse (Wetterlage, Hirshleifer und Shumway 2003); Anleger in neutraler Stimmung erzielen die höchsten Gewinne.","Verfügbarkeitsheuristik: Leicht verfügbare Information wird überbewertet (Aufmerksamkeitseffekt); gekauft werden vor allem Aktien, die medial präsent sind oder zuvor stark gewonnen oder verloren haben, was Echtzeitkurse und Newsfeeds der Plattform verstärken.","Begründung, warum die Wirtschaftspsychologie hier greift: Finanzentscheidungen sind Entscheidungen unter Unsicherheit, und reale Anleger weichen systematisch vom Rationalmodell der traditionellen Finanzmarkttheorie ab. Die Behavioral Finance erklärt das über ihre zwei Säulen (Grenzen der Arbitrage und Psychologie der Akteure). Die ständige Verfügbarkeit von Kursen fördert zudem häufiges mentales Bilanzieren (mentale Buchführung), was die Verlusterfahrungen und damit die beschriebenen Effekte verstärkt."],"quelle":"Block 5 Finanzpsychologie; Musterantwort des Profs eingearbeitet"},{"id":"6a","punkte":5,"teil":"Fragenteil (31 Punkte, 31 Minuten)","frage":["Ordnen Sie die wirtschaftspolitischen Kernaussagen der Rede von Friedrich Merz einer der beiden Grundpositionen aus Commanding Heights (Keynes oder Hayek) zu und begründen Sie Ihre Zuordnung anhand geeigneter Kriterien."],"loesung":["Hinweis zur Quelle: Der genaue Wortlaut der Merz-Rede liegt in den Wissensinventaren nicht vor. Die Musterlösung zeigt deshalb das Zuordnungsschema und die nach den bekannten marktliberalen Kernaussagen erwartbare Zuordnung. In der Klausur immer konkrete Redeaussagen zitieren und einzeln zuordnen.","Die beiden Grundpositionen: Keynes steht für instabile Märkte, staatliche Nachfragesteuerung, antizyklische Fiskal- und Geldpolitik und Regulierung des Finanzsystems (Cambridge, keynesianische Schule). Hayek steht für Vertrauen in den freien Markt und den Preismechanismus als dezentralen Informationsträger, Skepsis gegenüber zentraler Planung und die Priorität stabilen Geldes mit Inflation unter zwei Prozent (Österreichische Schule, über Friedman auch Chicago).","Zuordnung: Marktliberale Kernaussagen wie weniger Staat, Bürokratieabbau, steuerliche Entlastung, Eigenverantwortung und Angebotspolitik entsprechen der Hayek-Position.","Begründungskriterium 1, Rolle des Staates: Wer staatliche Eingriffe zurückfahren und die Koordination dem Markt überlassen will, argumentiert mit dem Preismechanismus als überlegenem Informationsträger, also hayekianisch.","Begründungskriterium 2, Finanzsystem und Geld: Der Vorrang von Geldwertstabilität und solider Haushaltsführung vor kreditfinanzierter Nachfragestützung entspricht Hayek; Keynes würde in der Krise Defizite zur Stabilisierung akzeptieren.","Differenzierung für die volle Punktzahl: Der Battle of Ideas ist nicht abgeschlossen (Globalisierung, Nachhaltigkeit, CSR, Populismus halten ihn aktuell); auch marktliberale Positionen akzeptieren heute einen staatlichen Ordnungsrahmen, es geht um Grade der Intervention, nicht um ein Entweder-Oder."],"quelle":"Block 8 Commanding Heights"},{"id":"6b","punkte":6,"teil":"Fragenteil (31 Punkte, 31 Minuten)","frage":["Ein Unternehmen verkauft 15 Stück eines Produkts zum Preis von 130,90 Euro inklusive 19 Prozent Umsatzsteuer. Die Gesamtkosten betragen 1.500 Euro, die Investitionsbasis 1.000 Euro. Die Finanzierung besteht zu 70 Prozent aus Eigenkapital (Kostensatz 10 Prozent) und zu 30 Prozent aus Fremdkapital (Kostensatz 5 Prozent). Berechnen Sie den WACC und den Economic Profit. Zeigen Sie den Rechenweg und deuten Sie das Ergebnis."],"loesung":["Schritt 1, Nettopreis: 130,90 Euro geteilt durch 1,19 = 110,00 Euro (Umsatzsteuer herausrechnen, sie ist kein Ertrag des Unternehmens).","Schritt 2, Umsatz: 15 Stück mal 110,00 Euro = 1.650 Euro.","Schritt 3, Gewinn: 1.650 Euro minus 1.500 Euro Gesamtkosten = 150 Euro.","Schritt 4, WACC: 0,7 mal 10 Prozent plus 0,3 mal 5 Prozent = 7,0 Prozent plus 1,5 Prozent = 8,5 Prozent.","Schritt 5, Kapitalkosten: 8,5 Prozent mal 1.000 Euro Investitionsbasis = 85 Euro.","Schritt 6, Economic Profit: 150 Euro minus 85 Euro = 65 Euro.","Deutung: Der Economic Profit (Übergewinn) zeigt, dass das Unternehmen mehr verdient, als sein eingesetztes Kapital kostet; erst oberhalb der Kapitalkosten entsteht echter Wert. Das ist relevant für das Management (Steuerung, Zielsetzung, Anreize) und für die Stakeholder (Kapitalgeber erhalten ihre risikogerechte Verzinsung, darüber hinaus bleibt Wertschaffung für das Unternehmen).","Typische Fallen: die Umsatzsteuer nicht herausrechnen und die Gewichtung von Eigen- und Fremdkapital beim WACC vertauschen. Beide Fehler kosten die Folgepunkte gleich mit. Formeln parat haben: WACC = EK-Anteil mal EK-Kostensatz plus FK-Anteil mal FK-Kostensatz; Economic Profit = Gewinn minus WACC mal Investitionsbasis."],"quelle":"Block 3 Wertorientierung; Referenzrechnung"}],"total":31},{"key":"sim1","title":"Simulation 1 (volle Klausur, 90 Punkte)","fragen":[{"id":"A1","punkte":3,"teil":"Teil A: Reproduktion","frage":["Nennen Sie die drei wichtigsten Gütekriterien quantitativer Forschung und erklären Sie jedes in einem Satz. (Bonuskapitel Forschungsmethoden)"],"loesung":["Validität (Gültigkeit): Wird wirklich das gemessen, was gemessen werden soll?","Reliabilität (Zuverlässigkeit): Ergibt eine Wiederholung der Messung dieselben Ergebnisse?","Objektivität (intersubjektive Vergleichbarkeit): Ist die Studie so standardisiert, dass sie bei verschiedenen Studienleitern dieselben Ergebnisse liefert?"],"quelle":"Block 1, Bonuskapitel"},{"id":"A2","punkte":3,"teil":"Teil A: Reproduktion","frage":["Welche vier Aussagetypen unterscheidet die Typologie der Aussagen? Nennen Sie zu jedem Typ das passende Merkwort."],"loesung":["Deskriptive Aussagen BESCHREIBEN einen Sachverhalt (Ist-Zustand, wertfrei).","Explikative Aussagen ERKLÄREN einen Sachverhalt (nomologische Hypothesen, Theorie, Falsifikation).","Normative Aussagen BEWERTEN einen Sachverhalt (Begründung über gesellschaftliche Normen).","Präskriptive Aussagen FORDERN einen Sachverhalt (Soll-Zustand, so soll es sein)."],"quelle":"Block 1"},{"id":"A3","punkte":2,"teil":"Teil A: Reproduktion","frage":["Auf welchen zwei Säulen ruht die Behavioral Finance?"],"loesung":["Erste Säule: Grenzen der Arbitrage (Fehlbewertungen werden nicht sofort korrigiert, weil der Fundamentalwert ungenau bekannt ist, Fehlbewertungen sich halten können und Arbitrage Kosten und Risiken hat).","Zweite Säule: Psychologie der Akteure (Verlustaversion, Heuristiken, Urteilsfehler und Herdenverhalten realer Anleger)."],"quelle":"Block 5"},{"id":"A4","punkte":2,"teil":"Teil A: Reproduktion","frage":["Was besagt der Endowment-Effekt? Nennen Sie ein Beispiel aus dem Marketing."],"loesung":["Endowment-Effekt (Besitztumseffekt): Menschen schätzen den Wert eines Gegenstands, den sie besitzen, höher ein als denselben Gegenstand, den sie nicht besitzen; er tritt schnell ein und hängt eng mit dem Referenzpunkt der Prospect Theory zusammen.","Marketing-Beispiel: Ein Auto wird übers Wochenende verliehen (Probefahrt) oder Kleidung wird zur Anprobe nach Hause geschickt (Zalando); durch die Gewöhnung will man den Besitz nicht mehr hergeben."],"quelle":"Block 5"},{"id":"A5","punkte":3,"teil":"Teil A: Reproduktion","frage":["Beschreiben Sie das AGIL-Modell nach Talcott Parsons: die vier Funktionen und je eine zugehörige Institution."],"loesung":["Adaptation: Anpassung und Ressourcenbeschaffung; ökonomische Institutionen wie Märkte und Unternehmen.","Goal Attainment: Zielerreichung und Steuerung; politische Institutionen wie Parteien, Regierungen, Recht.","Integration: soziale Integration über Regeln und akzeptierte Verhaltensweisen; Sozialisationsinstanzen wie Schulen und Ausbildung.","Latent Structure Maintenance: Strukturerhaltung und Wertorientierung; kulturelle Institutionen wie Wissenschaft, Religion, Kunst. Merksatz: Jede Gesellschaft braucht alle vier Bereiche, um zusammenzuhalten."],"quelle":"Block 3"},{"id":"A6","punkte":3,"teil":"Teil A: Reproduktion","frage":["Welche drei Auswahlverfahren haben nach Schmidt und Hunter (1998) die höchste prädiktive Validität (mit r-Werten)? Was zeigt die revidierte Fassung von Sackett et al. (2022) im Trend?"],"loesung":["Höchste Einzelvaliditäten 1998: Arbeitsproben (r = .54), allgemeine kognitive Fähigkeit GMA (r = .51) und strukturiertes Einstellungsgespräch (r = .51).","Trend der Revision (Sackett et al., 2022): Die meisten Validitäten sinken um etwa .10 bis .20 Punkte (Grund: systematische Überkorrektur der Varianzeinschränkung in den alten Metaanalysen); das strukturierte Einstellungsgespräch wird zum am höchsten bewerteten Verfahren, die Rangfolge bleibt grob erhalten."],"quelle":"Block 4, Selbstlerneinheit"},{"id":"A7","punkte":2,"teil":"Teil A: Reproduktion","frage":["Was versteht man unter mentaler Buchführung (Mental Accounting)? Nennen Sie ein Beispiel."],"loesung":["Mentale Buchführung (Thaler, 1985): Wir verbuchen Transaktionen auf verschiedenen mentalen Konten und sind je nach Konto unterschiedlich preissensitiv.","Beispiel: Mit Kreditkarte fällt das Ausgeben leichter als mit Bargeld; beim Weihnachtseinkauf ist man weniger preisbewusst; hart verdientes Geld wird anders behandelt als ein Kapitalgewinn oder ein Erbe."],"quelle":"Block 5"},{"id":"A8","punkte":3,"teil":"Teil A: Reproduktion","frage":["Nennen Sie die fünf Kernmerkmale des Job Characteristics Model von Hackman und Oldham."],"loesung":["Die fünf Kernmerkmale: Anforderungsvielfalt (Skill variety), Ganzheitlichkeit (Task identity), Bedeutung/Wichtigkeit (Task significance), Autonomie und Rückmeldung über die Ergebnisse (Feedback).","Zusatz für die volle Punktzahl: Sie wirken über die psychologischen Erlebniszustände Bedeutsamkeit, erlebte Verantwortung und Wissen um die Resultate auf intrinsische Motivation, Zufriedenheit und Effektivität; Messinstrument ist der Job Diagnostic Survey."],"quelle":"Block 2"},{"id":"A9","punkte":2,"teil":"Teil A: Reproduktion","frage":["Was ist ein Nudge und was bedeutet libertärer (sanfter) Paternalismus?"],"loesung":["Nudge (Stupser): eine auf psychologischen Einsichten beruhende Lenkung des Verhaltens ohne Verbote, etwa über Standardvorgaben, Darstellung oder soziale Normen (Sunstein und Thaler).","Libertärer (sanfter) Paternalismus: Der Staat lenkt Individuen zu ihrem eigenen Vorteil in bestimmte Richtungen, gewährleistet aber die Wahlfreiheit."],"quelle":"Block 6"},{"id":"A10","punkte":3,"teil":"Teil A: Reproduktion","frage":["Wie entsteht Buchgeld und was ist Fiat-Geld? Erklären Sie den Zusammenhang."],"loesung":["Buchgeld (Giralgeld) entsteht, wenn eine Geschäftsbank einen Kredit gewährt und den Betrag auf das Konto des Kunden bucht; auf diese Weise schaffen Geschäftsbanken Geld.","Fiat-Geld ist das gesetzliche Zahlungsmittel von Regierung oder Zentralbank; es hat keinen inneren Wert und keine Rohstoffdeckung, sein Wert beruht allein auf Vertrauen, Akzeptanz und rechtlicher Anerkennung.","Zusammenhang: Buchgeld ist die digitale Repräsentation von Geld im Bankensystem und eine Form von Fiat-Geld, weil es durch das Vertrauen in System und Währung gestützt wird."],"quelle":"Block 5, Seminar Geldschöpfung"},{"id":"A11","punkte":2,"teil":"Teil A: Reproduktion","frage":["Unterscheiden Sie Verfügbarkeitsheuristik und Repräsentativitätsheuristik."],"loesung":["Verfügbarkeitsheuristik: Leicht verfügbare (präsente, erinnerbare) Information wird bei Urteilen überbewertet.","Repräsentativitätsheuristik: Wahrscheinlichkeiten werden danach bewertet, wie gut etwas einem Prototyp entspricht (man hält Start-ups für meist erfolgreich, weil der Prototyp erfolgreich ist)."],"quelle":"Block 5"},{"id":"B1","punkte":6,"teil":"Teil B: Anwendung","frage":["Ein Konzern ersetzt seine unstrukturierten Bewerbungsgespräche vollständig durch eine KI-gestützte Videoanalyse, die Mimik und Sprache der Bewerber auswertet. Bewerten Sie dieses Vorgehen aus Sicht der Personalpsychologie. Beziehen Sie die Gütekriterien der Personalauswahl und die Befunde von Schmidt und Hunter sowie Sackett et al. ein."],"loesung":["Ausgangsbefund: Unstrukturierte Interviews sind ohnehin schwache Prädiktoren (1998 r = .38, revidiert nur .19); sie zu ersetzen ist also kein Verlust an Prognosekraft.","Aber: Auch das KI-Verfahren muss sich an den Gütekriterien messen lassen: prognostische Validität (sagt es Berufserfolg vorher?), Reliabilität und Objektivität; für Mimik- und Sprachanalyse liegen in den behandelten Quellen keine Validitätsbelege vor.","Benchmark: Die validesten bekannten Verfahren sind strukturiertes Interview, GMA und Arbeitsproben; die praktische Kernaussage von Schmidt und Hunter lautet, GMA mit einem inhaltlich ergänzenden Verfahren zu kombinieren (inkrementelle Validität, z. B. Integrity-Tests plus 27 Prozent).","Fairness: Bei GMA besteht der größte Validitäts-Diversitäts-Zielkonflikt (B-W d = .79); auch bei KI-Verfahren ist zu prüfen, ob sie Subgruppen systematisch benachteiligen.","Fazit: Nicht das Etikett KI entscheidet, sondern belegte Validität. Empfehlung: strukturierte, validierte Verfahren als Basis, KI höchstens als geprüfte Ergänzung, nicht als unvalidierter Vollersatz."],"quelle":"Block 4; KI-Bezug"},{"id":"B2","punkte":6,"teil":"Teil B: Anwendung","frage":["Erklären Sie mit dem vierfachen Muster der Risikopräferenzen der Prospect Theory, warum dieselbe Person gleichzeitig Lotto spielt, eine Handyversicherung abschließt und an einer fast sicher verlorenen Aktienposition festhält."],"loesung":["Grundlage: s-förmige Wertfunktion (Gewinnbereich konkav, Verlustbereich konvex, Referenzpunkt Status quo) plus Übergewichtung kleiner und Untergewichtung hoher Wahrscheinlichkeiten.","Lotto: tiefe Gewinnwahrscheinlichkeit, Gewinnbereich: risikoliebend, weil die kleine Chance übergewichtet wird.","Handyversicherung: tiefe Verlustwahrscheinlichkeit, Verlustbereich: risikoscheu (Certainty effect), man zahlt eine sichere Prämie, um die unwahrscheinliche negative Konsequenz ganz auszuschließen.","Aktienposition: hohe Verlustwahrscheinlichkeit, Verlustbereich: risikosuchend (Possibility effect), man klammert sich an die Hoffnung, den absehbaren Verlust doch noch zu vermeiden, auch auf die Gefahr, mehr zu verlieren.","Fazit: Alle drei Verhaltensweisen folgen demselben vierfachen Muster der Risikopräferenzen; sie sind aus Sicht der Erwartungsnutzentheorie inkonsistent, aus Sicht der Prospect Theory systematisch."],"quelle":"Block 5"},{"id":"B3","punkte":6,"teil":"Teil B: Anwendung","frage":["Erläutern Sie das Prinzipal-Agent-Modell am Beispiel der CEO-Vergütung. Diskutieren Sie anschließend die Leitfrage der agentischen Organisation: Fallen Agency-Kosten weg, wenn KI-Agenten Entscheidungen treffen und Prozesse orchestrieren?"],"loesung":["Modell: In Auftragsbeziehungen delegiert der Prinzipal (Aktionäre) Aufgaben an den Agenten (CEO); durch Informationsasymmetrie entstehen Agency-Probleme (hidden characteristics, hidden action, hidden intention) und Agency-Kosten.","CEO-Vergütung: Die Kopplung der Bezüge an den Aktienkurs soll die Interessen angleichen (Shareholder Value); Kritik: stetig steigende Bezüge und wachsende Kluft zur übrigen Belegschaft.","Agentische Organisation (McKinsey): Organisationen werden von autonom oder teilautonom handelnden KI-Agenten geprägt, die Entscheidungen treffen und Prozesse orchestrieren.","Diskussion: KI-Agenten haben keine eigenen Interessen im klassischen Sinn, was opportunistisches Verhalten reduzieren könnte; zugleich entstehen neue Kontrollprobleme, denn autonome Systeme erfordern neue Governance-Frameworks zur Risikokontrolle. Die Agency-Kosten fallen also nicht einfach weg, sie verschieben sich in Richtung Überwachung und Steuerung der Systeme."],"quelle":"Block 8; KI-Bezug"},{"id":"B4","punkte":5,"teil":"Teil B: Anwendung","frage":["Ein Stromanbieter feiert seine neue Werbekampagne: 93 Prozent gestützte Bekanntheit, 66 Prozent Werbeerinnerung. Der Vorstand folgert, die Kampagne sei ein ökonomischer Erfolg. Nehmen Sie kritisch Stellung und nutzen Sie das E.ON-Beispiel aus der Vorlesung."],"loesung":["Kernunterscheidung: Werbewirkung (Bekanntheit, Erinnerung) und ökonomischer Erfolg sind zwei verschiedene Dinge.","E.ON-Beleg: Trotz 93 Prozent gestützter Bekanntheit und 66 Prozent Werbeerinnerung kostete die Mix-it-Baby-Kampagne 2001 rund 22,5 Millionen Euro und brachte nur etwa 1.100 Neukunden mit rund 0,7 Millionen Euro Jahresumsatz, also rund 20.500 Euro Werbeausgaben pro Neukunde.","Verallgemeinerung: Zwischen Werbeausgaben und Markenwert besteht kein monokausaler Zusammenhang (Streudiagramm-Vergleich mit Bestimmtheitsmaß von nur 6 Prozent).","Konsequenz: Der Vorstand braucht eine umfassende Markenstrategie (Marketing, Kundensegmente, Distribution, Produkt, Mitarbeiter, Markenportfolio) und muss den ökonomischen Impact (Akquisitionskosten je Neukunde, Umsatz) messen, nicht nur Erinnerungswerte."],"quelle":"Block 9"},{"id":"B5","punkte":5,"teil":"Teil B: Anwendung","frage":["Unterscheiden Sie sanften Paternalismus im engeren Sinn von sanfter Wohltätigkeit (Libertarian benevolence) und nennen Sie den zentralen Kritikpunkt an der zweiten Variante."],"loesung":["Sanfter Paternalismus im engeren Sinn: gewährleistet Wahlfreiheit, lenkt Individuen aber zu ihrem eigenen Vorteil (Beispiele: Warnhinweise auf Raucherwaren, Süßigkeiten nicht zuvorderst in der Schulkantine).","Sanfte Wohltätigkeit (Libertarian benevolence): lenkt Verhalten zum Vorteil der Allgemeinheit, ohne es einzufordern (Beispiele: angenommene Spendenbereitschaft bei Nicht-Widerspruch, Ökostrom mit Preisaufschlag als Standard).","Zentraler Kritikpunkt: Die zweite Variante ermöglicht Trittbrettfahren ökonomisch rational Handelnder auf Kosten der schlecht Informierten und Trägen und droht die Kooperationsbereitschaft der Wohlwollenden zu untergraben; bei öffentlichen Gütern sind verbindliche Regeln oft fairer und unvermeidbar."],"quelle":"Block 6"},{"id":"B6","punkte":6,"teil":"Teil B: Anwendung","frage":["Ein Online-Shop zeigt fiktive Lagerbestände (nur noch 2 verfügbar), einen ablaufenden Countdown und errechnet für jeden Kunden individuelle Preise. Erklären Sie die psychologischen Mechanismen und bewerten Sie das Vorgehen aus Sicht des Konsumentenschutzes."],"loesung":["Künstliche Verknappung: Fiktive Lagerbestände und Countdown setzen unter Zeitdruck und schränken die Entscheidungssouveränität ein (ein Online-Kleiderhändler wurde deswegen wegen Irreführung abgemahnt).","Verlustaversion und Knappheitsdruck: Das drohende Verpassen wird als Verlust gerahmt und wiegt psychologisch schwerer als ein gleich großer Gewinn.","Personalisierte Preise: Der Anbieter nutzt Daten, um individuelle Zahlungsbereitschaften abzuschöpfen; die Preistransparenz sinkt, Vergleichbarkeit geht verloren.","Impulsive Konsumgelüste und Gegenwartsfokus: Das Design nutzt finanzpsychologische Kurzsichtigkeit aus (Fokus auf das Heute).","Bewertung: Konsumentenschutz ist hier gefordert, weil die Souveränität der Kaufentscheidung gezielt unterlaufen wird; Transparenzpflichten und Verbot irreführender Knappheitssignale sind die passenden Antworten."],"quelle":"Block 7 Konsumentenschutz; KI-Bezug"},{"id":"B7","punkte":5,"teil":"Teil B: Anwendung","frage":["Sollte ein autonomes Fahrzeug bei einem unvermeidbaren Unfall so programmiert werden, dass es die Zahl der Opfer minimiert? Diskutieren Sie anhand des Trolley-Problems und des Projekts Moral Machine."],"loesung":["Trolley-Logik: Die Weichen-Variante (einer statt fünf) halten die meisten für vertretbar, das aktive Schubsen von der Brücke lehnen die meisten ab; der Unterschied liegt im aktiven Töten gegenüber dem Unterlassen und in der persönlichen Nähe der Handlung.","Utilitaristische (konsequentialistische) Position: Opferzahl minimieren, die größere Zahl geretteter Leben zählt.","Deontologische Position: Die Menschenwürde ist unantastbar, Menschen dürfen nie bloßes Mittel sein (das Bundesverfassungsgericht kippte 2006 aus diesem Grund das Luftsicherheitsgesetz zum Flugzeugabschuss).","Moral Machine (MIT): sammelt als Massenexperiment weltweite Präferenzen für solche Entscheidungen und zeigt, dass moralische Intuitionen kulturell variieren; eine einheitliche Programmiervorschrift ist damit nicht einfach empirisch ableitbar.","Fazit: Für die Wirtschaft (Robotaxis) sind Wertekonflikte der Normalfall; eine reine Opferzahl-Programmierung wäre utilitaristisch konsequent, kollidiert aber mit der deontologischen Rechtsordnung. Eigene Position knapp begründen."],"quelle":"Block 6"},{"id":"B8","punkte":5,"teil":"Teil B: Anwendung","frage":["Erklären Sie die Idee der digitalen Dividende als Finanzierungsweg eines bedingungslosen Grundeinkommens und ordnen Sie die zugespitzte Grundfrage des Seminars ein: Sollen die Produktivitätsgewinne der vierten industriellen Revolution privatisiert oder sozialisiert werden?"],"loesung":["Digitale Dividende: Wenn die Produktivitätsgewinne aus Daten und Automatisierung als gesellschaftlicher Ertrag verstanden werden, könnte daraus, analog zu Coles social dividend (1935), ein Grundeinkommen gespeist werden (Bezahlung mit Daten).","Kontext technologische Arbeitslosigkeit: Der Begriff stammt von Keynes (1930); Unternehmer wie Musk und Sikka befürworten wegen der Automatisierung ein Grundeinkommen als Puffer zur Qualifizierung.","Einordnung der Grundfrage: Privatisierung bedeutet, die Gewinne fließen den Kapitaleignern zu (Shareholder Value); Sozialisierung bedeutet, sie werden über ein UBI breit verteilt.","Kritische Abwägung: Die Finanzierungsmodelle bleiben in den Seminarfolien bewusst dünn (Schweizer Referendum 2016 zeigte die Größenordnung: Sozialausgaben stiegen auf rund ein Drittel des BIP); empirisch senkte das finnische Experiment den Stress, veränderte das Arbeitsverhalten aber kaum. Ein UBI sichert zudem die materielle Existenz, ersetzt aber nicht die latenten Funktionen der Arbeit nach Jahoda."],"quelle":"Block 6 UBI; KI-Bezug"},{"id":"C","punkte":7,"teil":"Teil C: Zeitungsartikel-Transfer","frage":["Fiktiver Artikel (Wirtschaftsteil, Juli 2026): Die App weiß, was du kaufst, bevor du es weißt. Die Supermarktkette Fresco baut ihre KI-App massiv aus. Wer sie nutzt, bekommt personalisierte Angebote auf Basis seiner Kaufhistorie, Standarddaten sind bereits angekreuzt, wer nicht widerspricht, teilt auch Standort und Zahlungsdaten. Produkte, die der Algorithmus empfiehlt, erscheinen ganz oben, mit Hinweisen wie 87 Prozent der Kunden in deinem Viertel kaufen das. Ein Probeabo der Premiumstufe verlängert sich automatisch. Verbraucherschützer sprechen von digitaler Verführung, die Kette von einem besseren Einkaufserlebnis.","Aufgabe: Erklären Sie das Vorgehen der Supermarktkette mit 4 bis 6 wirtschaftspsychologischen Konzepten. Beziehen Sie jedes Konzept in einem Satz auf den Fall."],"loesung":["Nudging über Defaults (Trägheit und Aufschieben): Voreingestellte Häkchen bei Datenfreigabe und die automatische Abo-Verlängerung nutzen aus, dass Menschen Standards selten aktiv ändern (Wirkprinzip der Standardvorgaben wie bei Madrian und Shea).","Sanfte Wohltätigkeit versus Eigeninteresse: Anders als beim klassischen Nudge zum Vorteil des Kunden lenkt die App zum Vorteil des Anbieters; genau hier setzt die Kritik am Trittbrettfahren auf Kosten der Trägen und schlecht Informierten an.","Soziale Normen als Nudge: Der Hinweis 87 Prozent der Kunden in deinem Viertel kaufen das nutzt die Wahrnehmung der Gruppennorm als Richtschnur (soziale Einflüsse, Herdenverhalten).","Verfügbarkeitsheuristik und Salienz: Was der Algorithmus oben platziert, ist kognitiv leicht verfügbar und wird überproportional gewählt (Darstellung und Präsentation nach Sunstein).","Endowment-Effekt: Das Probeabo lässt Besitz entstehen; nach der Gewöhnung will man die Premiumstufe nicht mehr hergeben, die Kündigungsschwelle steigt.","Konstruktion der Konsumrealität durch KI-Medien: Die personalisierte Angebotswelt zeigt jedem Nutzer eine andere Wirklichkeit (vergleiche personalisierte Werbung bei den Renew-Mülleimern in London 2012); was als Angebot erscheint, ist eine algorithmisch konstruierte Auswahl.","Punktelogik: 7 Punkte = etwa 6 Konzepte plus je ein Fallbezug in einem Satz; reine Definitionen ohne Fallbezug geben keine vollen Punkte."],"quelle":"Transfer; Konzepte je in einem Satz auf den Fall beziehen"},{"id":"D","punkte":5,"teil":"Teil D: Stellungnahme","frage":["Starke Marken sind unverwechselbar im Kopf verankert. Nehmen Sie zu dieser Aussage aus konstruktivistischer Sicht kritisch Stellung: Was heißt das für den Wert einer Marke, und wo liegen die Grenzen der Steuerbarkeit durch Werbung?"],"loesung":["These bestätigen: Eine Marke ist ein in der Psyche des Konsumenten verankertes Vorstellungsbild von einem Produkt oder einer Dienstleistung (Meffert); ihr Wert liegt nicht in objektiven Produkteigenschaften, sondern im konstruierten Bild, sie ist das Paradebeispiel des Konstruktivismus in der Wirtschaftspsychologie.","Wertmechanik: Marken stiften Nutzen über Risikoreduktion, Informationseffizienz und ideellen Nutzen; alle drei Funktionen wirken über das Vorstellungsbild im Kopf.","Ökonomischer Beleg: Starke Marken erzielten in der McKinsey Brand Stretch Studie einen Total Return to Shareholders von plus 2,0 Prozentpunkten gegenüber dem Marktdurchschnitt, schwache Marken minus 3,1.","Konstruktionsmechanismus: Bedeutung entsteht über kollektiv geteilte kulturelle Referenzketten (Beispielkette Tokio Hotel, U2, Beatles), nicht im Produkt selbst.","Grenze der Steuerbarkeit: Zwischen Werbeausgaben und Markenwert besteht kein monokausaler Zusammenhang (Bestimmtheitsmaß nur 6 Prozent); nötig ist eine umfassende Markenstrategie von Produkt bis Mitarbeitern. Fazit: Die Aussage trifft den Kern, aber das Kopfbild lässt sich nicht einfach kaufen."],"quelle":"Stellungnahme Konstruktivismus, Block 9"},{"id":"E","punkte":6,"teil":"Teil E: Rechenaufgabe","frage":["Ein Unternehmen verkauft 10 Stück eines Produkts zum Preis von 238,00 Euro inklusive 19 Prozent Umsatzsteuer. Die Gesamtkosten betragen 1.760 Euro, die Investitionsbasis 1.500 Euro. Die Finanzierung besteht zu 60 Prozent aus Eigenkapital (Kostensatz 12 Prozent) und zu 40 Prozent aus Fremdkapital (Kostensatz 4 Prozent). Berechnen Sie den WACC und den Economic Profit. Zeigen Sie den Rechenweg und deuten Sie das Ergebnis."],"loesung":["Schritt 1, Nettopreis: 238,00 Euro geteilt durch 1,19 = 200,00 Euro.","Schritt 2, Umsatz: 10 Stück mal 200,00 Euro = 2.000 Euro.","Schritt 3, Gewinn: 2.000 Euro minus 1.760 Euro = 240 Euro.","Schritt 4, WACC: 0,6 mal 12 Prozent plus 0,4 mal 4 Prozent = 7,2 Prozent plus 1,6 Prozent = 8,8 Prozent.","Schritt 5, Kapitalkosten: 8,8 Prozent mal 1.500 Euro = 132 Euro.","Schritt 6, Economic Profit: 240 Euro minus 132 Euro = 108 Euro.","Deutung: Das Unternehmen verdient 108 Euro mehr, als sein eingesetztes Kapital kostet; es schafft echten Wert (ROIC 16 Prozent liegt über dem WACC von 8,8 Prozent). Stellhebel sind Preis, Menge, Kosten und Kapitaleinsatz."],"quelle":"Rechenweg"}],"total":90},{"key":"sim2","title":"Simulation 2 (volle Klausur, 90 Punkte)","fragen":[{"id":"A1","punkte":3,"teil":"Teil A: Reproduktion","frage":["Unterscheiden Sie quantitative und qualitative Forschung (je zwei Merkmale) und nennen Sie ein Gütekriterium qualitativer Forschung. (Bonuskapitel Forschungsmethoden)"],"loesung":["Quantitative Forschung: überwiegend numerische Daten (Fragebögen, Experimente), statistische Auswertung; Vorgehen deduktiv und variablenorientiert, oft zur Prüfung von Hypothesen.","Qualitative Forschung: überwiegend verbale Äußerungen (Interviews, Dokumente), Auswertung per Inhaltsanalyse oder interpretativen Verfahren; Vorgehen induktiv und einzelfallorientiert, oft zur Generierung von Hypothesen.","Gütekriterium qualitativer Forschung: zum Beispiel intersubjektive Nachvollziehbarkeit, theoretische Verankerung oder Bestätigung durch andere Forscher."],"quelle":"Block 1, Bonuskapitel"},{"id":"A2","punkte":2,"teil":"Teil A: Reproduktion","frage":["Was ist eine Hypothese? Nennen Sie die typischen Formen und ein Beispiel. (Bonuskapitel Forschungsmethoden)"],"loesung":["Hypothesen sind konkrete, statistisch überprüfbare Aussagen in der Form je-desto oder wenn-dann.","Beispiel: Je öfter Mitarbeiter eine E-Mail-Benachrichtigung bekommen, desto unzufriedener sind sie am Abend."],"quelle":"Block 1, Bonuskapitel"},{"id":"A3","punkte":3,"teil":"Teil A: Reproduktion","frage":["Erläutern Sie die Kernaussage der Zwei-Faktoren-Theorie von Herzberg mit je zwei Beispielen und nennen Sie einen zentralen Kritikpunkt."],"loesung":["Kernaussage: Arbeitszufriedenheit ist zweidimensional; Motivatoren erhöhen die Zufriedenheit (inhaltliche Aspekte wie Verantwortung, Anerkennung), Hygienefaktoren vermindern nur die Unzufriedenheit (Kontextaspekte wie Bezahlung, Status).","Die Beseitigung von Hygienemängeln macht nur nicht unzufrieden; Zufriedenheit entsteht erst über Motivatoren.","Kritik: empirisch kaum bestätigt, und für manche Beschäftigte ist Lohn sehr wohl ein Motivator; historischer Verdienst bleibt der Hinweis, dass Menschen nicht nur für Geld arbeiten."],"quelle":"Block 2"},{"id":"A4","punkte":2,"teil":"Teil A: Reproduktion","frage":["Welche latenten Funktionen erfüllt Erwerbsarbeit nach Jahoda? Nennen Sie mindestens vier."],"loesung":["Latente Funktionen der Erwerbsarbeit nach Jahoda: Zeitstruktur, soziale Kontakte, kollektive Ziele, Status und Aktivität."],"quelle":"Block 2, Bezug im UBI-Abschnitt Block 6"},{"id":"A5","punkte":3,"teil":"Teil A: Reproduktion","frage":["Von welchen drei Faktoren hängt nach dem Taylor-Russell-Modell die Erfolgsquote bei Einstellungen ab, und welche vier Felder ergeben sich im Quadrantenmodell?"],"loesung":["Drei Faktoren: Validitätskoeffizient des Verfahrens, Grundquote (Anteil grundsätzlich Geeigneter unter den Bewerbern) und Selektionsquote (Anteil der Eingestellten an den Bewerbern).","Vier Felder: EG (eingestellt und geeignet, richtige Einstellung), EU (eingestellt, aber ungeeignet, Fehlbesetzung), AG (abgelehnt, aber geeignet, verpasste Chance), AU (abgelehnt und ungeeignet, richtige Ablehnung).","Erfolgsquote = Anteil EG an allen Eingestellten; sie steigt mit höherer Validität und strengerer Selektionsquote (die Taylor-Russell-Tafeln geben die Werte an)."],"quelle":"Block 4; Klausur-Priorisierung: können"},{"id":"A6","punkte":2,"teil":"Teil A: Reproduktion","frage":["Was bezeichnet der Fordismus und was war der Fünf-Dollar-Tag?"],"loesung":["Fordismus: Massenproduktion standardisierter Güter durch weitgehende Arbeitsteilung und getaktete Fließbandarbeit (Fertigungszeit des Model T sank von rund zwölfeinhalb Stunden auf etwa 93 Minuten), verbunden mit vergleichsweise hohen Löhnen.","Fünf-Dollar-Tag (1914): nahezu Verdopplung des Lohns bei verkürzter Arbeitszeit als Antwort auf eine Fluktuation von rund 370 Prozent; Wirkung: Bindung der Belegschaft, höhere Kaufkraft, Image als Wohltäter, zugleich soziale Kontrolle über das Sociological Department."],"quelle":"Block 8"},{"id":"A7","punkte":3,"teil":"Teil A: Reproduktion","frage":["Was besagt Pikettys Kernthese, und wie verändert das KI-Piketty-Szenario das Verhältnis von Kapital und Arbeit?"],"loesung":["Pikettys Kernthese: Die Rendite von Kapital liegt langfristig über der Wachstumsrate der Wirtschaft; Erträge aus Kapital wachsen schneller als Erträge aus Arbeit, Vermögen konzentriert sich.","KI-Piketty-Szenario: Solange Maschinen bedient werden müssen, sind Kapital und Arbeit Komplemente und das Grenzprodukt des Kapitals fällt; mit KI und Robotik werden Kapital und Arbeit zu Substituten, die Kapitalquote steigt nachhaltig, die Lohnquote fällt (diskutierte Zuspitzung: Gini-Koeffizient der USA von 0,42 auf bis zu 0,95)."],"quelle":"Block 9; KI-Bezug"},{"id":"A8","punkte":2,"teil":"Teil A: Reproduktion","frage":["Warum gelten gesicherte Eigentumsrechte (Property Rights) als fehlende Grundlage vieler Entwicklungsländer? (Commanding Heights)"],"loesung":["Property Rights bezeichnen die Verbriefung von Rechten und die klare Zuordnung, wem was gehört; ohne formal gesicherte Eigentumsrechte lässt sich Kapital nicht mobilisieren, weshalb vielen Entwicklungsländern die Grundlage fehlt, an globalen Entwicklungen teilzuhaben."],"quelle":"Block 8"},{"id":"A9","punkte":3,"teil":"Teil A: Reproduktion","frage":["Auf welchen drei Ebenen zeigt sich Organisationskultur nach Schein? Nennen Sie je ein Beispiel."],"loesung":["Artefakte: sichtbare Erscheinungen (etwa Büroeinrichtung, Kleidung, Rituale).","Bekundete Werte: die offiziell vertretenen Normen und Leitbilder.","Grundannahmen: unausgesprochene, selbstverständliche Überzeugungen, die das Verhalten tatsächlich steuern."],"quelle":"Block 3"},{"id":"A10","punkte":3,"teil":"Teil A: Reproduktion","frage":["Definieren Sie das bedingungslose Grundeinkommen (UBI) und grenzen Sie es von der negativen Einkommensteuer nach Friedman ab."],"loesung":["UBI: eine Form der sozialen Sicherung, bei der alle Bürgerinnen und Bürger regelmäßig einen festen Geldbetrag erhalten, bedingungslos: ohne Bedürftigkeitsprüfung, ohne Gegenleistung, zusätzlich zu jedem anderen Einkommen.","Abgrenzung: Die negative Einkommensteuer nach Friedman zahlt unterhalb einer Einkommensgrenze aus statt einzuziehen; sie integriert Steuer- und Transfersystem, zahlt aber nicht jedem denselben Sockel."],"quelle":"Block 6"},{"id":"A11","punkte":2,"teil":"Teil A: Reproduktion","frage":["Unterscheiden Sie Legalität, Legitimität und Ethik als Bewertungsebenen unternehmerischen Handelns."],"loesung":["Legalität: Handeln ist gesetzeskonform. Legitimität: Handeln gilt darüber hinaus als berechtigt und akzeptiert im Sinne von Stakeholdern und Gesellschaft. Ethik: die Ebene der moralischen Bewertung des Handelns selbst. Ein Unternehmen kann legal handeln, ohne legitim oder ethisch zu sein (Beispiel Theranos)."],"quelle":"Block 8"},{"id":"B1","punkte":6,"teil":"Teil B: Anwendung","frage":["Ein Softwareunternehmen stellt vollständig auf Remote-Arbeit um und wirbt mit maximaler Flexibilität. Nach einem Jahr klagen Beschäftigte über Erschöpfung und Distanz zum Team. Analysieren Sie die Lage arbeitspsychologisch und geben Sie Gestaltungsempfehlungen."],"loesung":["Diagnose 1, Entgrenzung: Bei ständiger Erreichbarkeit weitet sich Arbeit auf Freizeit und Familienzeit aus; Work-Life-Balance und Arbeitsqualität leiden, was die Erschöpfung erklärt.","Diagnose 2, soziale Isolation: Remote-Arbeitende können sozial isoliert und in der betrieblichen Kommunikation benachteiligt werden; das Bedürfnis nach Austausch, Zugehörigkeit und Gemeinschaft bleibt unerfüllt (Distanz zum Team).","Diagnose 3, Gesundheit: überwiegendes Stillsitzen, Fehlhaltungen und Bildschirmfokus belasten zusätzlich.","Empfehlung 1, Grenzen setzen: klare Erreichbarkeitsregeln nach dem Vorbild der VW-E-Mail-Funkstille (2011).","Empfehlung 2, Präsenz- und Austauschformate: gezielte gemeinsame Zeiten für Kommunikation und Innovation (Lehre aus dem Yahoo-Fall 2013), ergänzt um Teamgestaltung.","Empfehlung 3, Befähigung: Beschäftigte über gute Arbeitsplatzgestaltung informieren, zur Vermeidung schädigender Verhaltensweisen befähigen und motivieren; Autonomie und Rückmeldung als Motivationsmerkmale (Job Characteristics Model) erhalten."],"quelle":"Block 2"},{"id":"B2","punkte":5,"teil":"Teil B: Anwendung","frage":["Im Seminar wurde das Soziales-Dilemma-Spiel mit den Strategien X und Y gespielt. Erklären Sie anhand der Auszahlungslogik, warum Defektion individuell rational, aber kollektiv schädlich ist, und übertragen Sie die Lehre auf internationale Klimaverhandlungen."],"loesung":["Auszahlungslogik: Bei 4Y gewinnen alle 10 Euro, bei 4X verlieren alle 10 Euro; in gemischten Konstellationen gewinnt X auf Kosten von Y (etwa 3X und 1Y: X verliert 10, Y gewinnt 30; 1X und 3Y: X gewinnt 30, Y verliert 10). X entspricht der Defektion, Y der Kooperation.","Individuell rational: In fast allen gemischten Konstellationen stellt sich der Einzelne mit X besser; kollektiv optimal ist aber die vollständige Kooperation (4Y), während 4X allen den Verlust bringt (N-Personen-Gefangenendilemma).","Verschärfung: Bonusmultiplikatoren in späten Runden erhöhen den Anreiz zur Defektion, wenn die Einsätze am höchsten sind.","Übertragung Klimaverhandlungen: Das Seminar nennt ausdrücklich das Scheitern von Klimaverhandlungen am Gefangenendilemma; die Studie von Bechtel und Scheve zeigt, dass die Unterstützung für Klimaabkommen am stärksten von der Anzahl kooperierender Länder abhängt, also von Reziprozität.","Lehre: Normen der Gegenseitigkeit tragen die Kooperation, aber in anonymen Zusammenhängen braucht es verbindliche Regeln bis hin zu Sanktionen."],"quelle":"Block 6"},{"id":"B3","punkte":6,"teil":"Teil B: Anwendung","frage":["In einem Tarifkonflikt bietet die Arbeitgeberseite bei 5 Prozent Inflation eine Nominallohnerhöhung von 2 Prozent an und verweist auf die schwierige Lage. Die Belegschaft reagiert zunächst ruhig, die Leistung sinkt aber messbar. Erklären Sie den Fall mit finanz- und arbeitspsychologischen Konzepten (Geldillusion, Fairness, Reziprozität)."],"loesung":["Geldillusion: Die nominale Erhöhung um 2 Prozent wird zunächst positiver beurteilt, als es der reale Verlust von 3 Prozent rechtfertigt, weil Menschen in nominalen Größen denken (Shafir et al.); das erklärt die anfängliche Ruhe.","Reallohnsenkung ohne Widerstand: Genau diesen Mechanismus beschreiben Akerlof et al.: In Inflationsjahren lassen sich Reallöhne leichter senken.","Equity-Theorie (Adams): Fairness bemisst sich am Verhältnis von Beiträgen und Belohnungen; wird die reale Kürzung erkannt, entsteht wahrgenommene Ungerechtigkeit und das Bedürfnis nach Korrektur, etwa durch reduzierten Einsatz.","Fair-wage-effort und Gift exchange (Akerlof): Die Leistung hängt davon ab, ob der Lohn als gerecht empfunden wird; bleibt das Geschenk des Arbeitgebers aus, sinkt im Gegenzug der Einsatz (Reziprozität), was den messbaren Leistungsabfall erklärt.","Gegenbeispiel Henry Ford: Der Fünf-Dollar-Tag zeigt die umgekehrte Wirkung, hoher Lohn als Geschenk senkte Fluktuation und Kosten.","Empfehlung: Transparente Begründung und spürbare Gegenleistungen (Einmalzahlungen, Beteiligung), sonst zahlt das Unternehmen die Ersparnis über Leistungsverlust zurück."],"quelle":"Block 5 und Block 2"},{"id":"B4","punkte":6,"teil":"Teil B: Anwendung","frage":["Analysieren Sie den Fall Theranos mit dem Prinzipal-Agent-Modell: Welche Informationsasymmetrien lagen vor, welche Erwartungen wurden bei welchen Stakeholdern geweckt, und welche Rolle spielte das Whistleblowing?"],"loesung":["Informationsasymmetrien: hidden characteristics (die tatsächliche Leistungsfähigkeit der Technologie und der Gründerin war den Investoren verborgen) und hidden intention (die Absichten von Elizabeth Holmes gegenüber den Kapitalgebern).","Stakeholder-Erwartungen: Kunden erwarteten verlässliche Bluttests, Partner (Apotheken) ein funktionierendes Produkt, Investoren Rendite aus einer Durchbruchstechnologie, Politik und Medien die Erfolgsgeschichte einer visionären Gründerin.","Whistleblowing: Erst Insider deckten die Täuschung auf; das Whistleblowing kompensierte die Informationsasymmetrie, an der externe Kontrolle gescheitert war.","Bewertungsraster: Theranos zeigt das Auseinanderfallen von Legalität, Legitimität und Ethik; Holmes wurde wegen Betrugs verurteilt.","Psychologische Ergänzung: Glaubwürdigkeitsurteile (Microexpressions nach Ekman) und die Psychologie der Unehrlichkeit (Ariely) erklären, warum viele ihr glaubten; Arielys eigene Forschung geriet später in die Kritik, was vor vorschnellen Vertrauensurteilen warnt."],"quelle":"Block 8"},{"id":"B5","punkte":5,"teil":"Teil B: Anwendung","frage":["Warum kann höhere Einkommensungleichheit zu geringerem Sparen führen? Erklären Sie mit der Relative-income-Hypothese und den Ausgabenkaskaden nach Frank."],"loesung":["Relative-income-Hypothese (Duesenberry): Die Sparquote korreliert positiv mit der Einkommensposition innerhalb der Vergleichsgruppe; wer relativ zur Referenzgruppe viel verdient, spart viel.","Ausgabenkaskaden (Frank): Menschen orientieren sich in sozialen Vergleichen nach oben; höhere Ausgaben der Spitze veranlassen die jeweils darunterliegenden zu Mehrausgaben.","Folge: Bei höherer Ungleichheit wächst der Abstand zur Referenzgruppe nach oben, die Kaskade zieht sich durch alle Schichten und drückt die Sparquote (Erklärungsansatz für die niedrigere Sparquote der USA gegenüber Europa)."],"quelle":"Block 5"},{"id":"B6","punkte":6,"teil":"Teil B: Anwendung","frage":["Eine Personalleiterin will künftig nur noch unstrukturierte Gespräche und ein graphologisches Gutachten einsetzen, weil man Menschen im freien Gespräch am besten kennenlerne. Beraten Sie sie evidenzbasiert mit den Befunden von Schmidt und Hunter (1998) und Sackett et al. (2022)."],"loesung":["Evidenz gegen den Plan: Unstrukturierte Interviews erreichen 1998 nur r = .38, revidiert .19; Graphologie liegt bei r = .02, also praktisch null Vorhersagekraft.","Bessere Alternativen: strukturiertes Einstellungsgespräch (r = .51, revidiert das am höchsten bewertete Verfahren), GMA (r = .51, revidiert .31) und Arbeitsproben (r = .54, revidiert .33).","Kombinationslogik: GMA plus ein inhaltlich ergänzendes Verfahren maximiert die Prognose (Integrity-Tests: Multiple R = .65, plus 27 Prozent; Arbeitsproben oder strukturiertes Interview: je .63).","Einordnung: Personalauswahlverfahren erklären insgesamt etwa 30 bis 50 Prozent der Varianz künftiger Arbeitsleistung; gerade deshalb sollte man die validesten Verfahren wählen.","Gesprächsargument: Das Bedürfnis, Menschen kennenzulernen, erfüllt das strukturierte Interview ebenfalls, nur mit nachweislich besserer Prognose; die Struktur erhöht zugleich Objektivität und Reliabilität."],"quelle":"Block 4, Selbstlerneinheit"},{"id":"B7","punkte":5,"teil":"Teil B: Anwendung","frage":["Ein Konzern stellt eine Entlassungswelle gegenüber dem Betriebsrat als Standortsicherung, gegenüber den Aktionären als Effizienzprogramm dar. Analysieren Sie dieses Kommunikationsverhalten mit den Techniken zur Konstruktion sozialer Realität und dem Befund der Choice Blindness."],"loesung":["Fragmenting kombiniert mit Framing: Ein und derselbe Sachverhalt (die Entlassung) wird adressatenspezifisch unterschiedlich dargestellt, gegenüber dem Betriebsrat anders als gegenüber Aktionären; genau das beschreibt die Vorlesung als Technik zur Konstruktion sozialer Realität.","Konstruktivistische Deutung: Kommunikation bildet Wirklichkeit nicht ab, sondern erzeugt sie; jede Adressatengruppe erhält ein eigenes Narrativ (Storytelling im Management).","Group Think als Risiko: Widerspruch gegen die offizielle Lesart unterbleibt in Hierarchien (Bezug Asch), wodurch sich das konstruierte Bild intern stabilisiert.","Choice Blindness (Johansson): Menschen konstruieren Sinn post hoc und rationalisieren auch vertauschte Entscheidungen; übertragen heißt das, Belegschaft und Öffentlichkeit übernehmen nachträglich die gelieferte Begründung, was solche Kommunikation wirksam und manipulierbar macht.","Bewertung: wirksam, aber riskant; fliegt die Doppelbotschaft auf, zerstört sie Vertrauen und Legitimität."],"quelle":"Block 9"},{"id":"B8","punkte":5,"teil":"Teil B: Anwendung","frage":["Erläutern Sie den Begriff der technologischen Arbeitslosigkeit (Keynes 1930) und die Prognosen von Frey und Osborne zur Computerisierung. Welche Antwort auf diese Entwicklung diskutiert das Seminar Universal Basic Income, und welches Kompetenzprofil empfiehlt die Vertiefungsvorlesung für die KI-Arbeitswelt?"],"loesung":["Technologische Arbeitslosigkeit (Keynes, 1930): Die Einsparung von Arbeit läuft schneller als das Finden neuer Verwendungen für Arbeit.","Frey und Osborne: Zu den Verlierern der Computerisierung dürften Berufe wie Steuerberater, Taxifahrer oder Kreditanalysten gehören, zu den Gewinnern Zahnärzte, Sozialarbeiter und vor allem Therapeuten.","Antwort des Seminars: das bedingungslose Grundeinkommen, diskutiert unter anderem über die digitale Dividende (Produktivitätsgewinne aus Daten und Automatisierung als gesellschaftlicher Ertrag); Befürworter wie Musk und Sikka argumentieren mit der Automatisierung.","Kompetenzprofil der Vertiefung: die H-Form, zwei sich ergänzende Wissensdomänen plus höhere kognitive und sozioemotionale Fähigkeiten, durch KI verbunden (vergleichbar mit Haupt- und Nebenfach); diese Folie trägt ausdrücklich den Vermerk Klausur."],"quelle":"Block 2, Block 6, Block 8; KI-Bezug"},{"id":"C","punkte":7,"teil":"Teil C: Zeitungsartikel-Transfer","frage":["Fiktiver Artikel (Wirtschaftsteil, Juli 2026): Rekordgewinn, Stellenabbau, Grunderbe-Debatte. Der Versicherungskonzern Novaria meldet einen Rekordgewinn und kündigt zugleich an, 3.000 Stellen in der Sachbearbeitung durch KI-Agenten zu ersetzen. Die Dividende steigt, der Aktienkurs springt um 8 Prozent. Die Gewerkschaft fordert eine Vier-Tage-Woche bei vollem Lohnausgleich, der Vorstand verweist auf den Wettbewerb. Zeitgleich debattiert der Bundestag über ein staatlich finanziertes Grunderbe, finanziert aus einer Abgabe auf Automatisierungsgewinne. Ökonomen warnen, ohne Gegensteuern könne die Schere zwischen Kapital- und Arbeitseinkommen weiter aufgehen.","Aufgabe: Erklären Sie die im Artikel beschriebene Entwicklung mit 4 bis 6 wirtschaftspsychologischen und wirtschaftstheoretischen Konzepten aus der Vorlesung. Beziehen Sie jedes Konzept in einem Satz auf den Fall."],"loesung":["Technologische Arbeitslosigkeit (Keynes 1930): Der Ersatz von 3.000 Sachbearbeitungsstellen durch KI-Agenten ist der klassische Fall, dass Arbeitseinsparung schneller läuft als die Schaffung neuer Verwendungen.","KI-Piketty-Szenario: Rekordgewinn und steigende Dividende bei sinkender Lohnsumme zeigen die Verschiebung vom Arbeits- zum Kapitaleinkommen; wenn KI Arbeit substituiert statt ergänzt, steigt die Kapitalquote nachhaltig.","Agentische Organisation: KI-Agenten, die Prozesse orchestrieren, versprechen geringere Agency-Kosten, erfordern aber neue Governance-Frameworks zur Risikokontrolle.","Latente Funktionen der Arbeit (Jahoda): Der Stellenabbau kostet die Betroffenen nicht nur Einkommen, sondern Zeitstruktur, soziale Kontakte, Status und Aktivität; das erklärt die gesellschaftliche Schärfe der Debatte.","Umverteilungsdebatte: Grunderbe, Vermögensteuern und Staatsfonds werden in der Vorlesung ausdrücklich als Antworten auf das Ende des Generationenausgleichs diskutiert; die Abgabe auf Automatisierungsgewinne entspricht der Logik der digitalen Dividende.","Fairness und Reziprozität: Rekorddividende bei gleichzeitigem Stellenabbau verletzt die Equity-Wahrnehmung der Belegschaft und gefährdet den Gift-exchange, was Leistungs- und Vertrauensverluste erwarten lässt.","Punktelogik: 7 Punkte = etwa 6 Konzepte plus je ein Fallbezug in einem Satz."],"quelle":"Transfer; Konzepte je in einem Satz auf den Fall beziehen"},{"id":"D","punkte":5,"teil":"Teil D: Stellungnahme","frage":["Der Staat soll sich in Wirtschaftskrisen heraushalten, der Markt regelt das besser. Nehmen Sie zu dieser Aussage kritisch Stellung und nutzen Sie dabei die beiden Grundpositionen aus Commanding Heights (Keynes gegen Hayek)."],"loesung":["Pro Marktposition (Hayek): Der Preismechanismus ist der überlegene dezentrale Informationsträger, zentrale Planung scheitert am Wissensproblem; Priorität hat stabiles Geld (Inflation unter zwei Prozent).","Contra (Keynes): Märkte können instabil sein; in der Krise stabilisiert der Staat über Nachfragesteuerung und antizyklische Fiskal- und Geldpolitik, und das Finanzsystem braucht Regulierung.","Empirischer Einwand gegen das reine Heraushalten: Der Krisenvergleich aus Commanding Heights zeigt, dass Bailouts ganzer Volkswirtschaften nötig werden können (too big to fail, aber auch too small to bail out); ein Rückzug des Staates ist in Systemkrisen real kaum durchgehalten worden.","Differenzierung: Der Battle of Ideas ist nicht abgeschlossen; Globalisierung, Nachhaltigkeit, CSR und Populismus halten ihn aktuell, und die wirtschaftspsychologische Konsequenz fordert, Regelungslücken nachhaltig und sozial zu füllen statt den größten Profit zu suchen.","Fazit: Die Aussage ist in ihrer Absolutheit nicht haltbar; vertretbar ist eine Position der Grade: Marktkoordination als Regel, staatliche Intervention als begründete Ausnahme mit klarem Exit."],"quelle":"Stellungnahme Commanding Heights"},{"id":"E","punkte":6,"teil":"Teil E: Rechenaufgabe","frage":["Ein Unternehmen verkauft 25 Stück eines Produkts zum Preis von 95,20 Euro inklusive 19 Prozent Umsatzsteuer. Die Gesamtkosten betragen 1.820 Euro, die Investitionsbasis 1.200 Euro. Die Finanzierung besteht zu 50 Prozent aus Eigenkapital (Kostensatz 11 Prozent) und zu 50 Prozent aus Fremdkapital (Kostensatz 3 Prozent). Berechnen Sie den WACC und den Economic Profit. Zeigen Sie den Rechenweg und deuten Sie das Ergebnis."],"loesung":["Schritt 1, Nettopreis: 95,20 Euro geteilt durch 1,19 = 80,00 Euro.","Schritt 2, Umsatz: 25 Stück mal 80,00 Euro = 2.000 Euro.","Schritt 3, Gewinn: 2.000 Euro minus 1.820 Euro = 180 Euro.","Schritt 4, WACC: 0,5 mal 11 Prozent plus 0,5 mal 3 Prozent = 5,5 Prozent plus 1,5 Prozent = 7,0 Prozent.","Schritt 5, Kapitalkosten: 7,0 Prozent mal 1.200 Euro = 84 Euro.","Schritt 6, Economic Profit: 180 Euro minus 84 Euro = 96 Euro.","Deutung: Das Unternehmen verdient 96 Euro mehr, als sein eingesetztes Kapital kostet (ROIC 15 Prozent über WACC 7 Prozent); es schafft echten Wert. Erst oberhalb der Kapitalkosten beginnt Wertschaffung, relevant für Steuerung, Anreize und Kapitalgeber."],"quelle":"Rechenweg"}],"total":90}]</script>
<script>

/* ===== THEME ===== */
(function(){
  const KEY='wipsy_theme';
  let t; try{t=localStorage.getItem(KEY);}catch(e){}
  if(t!=='dark'&&t!=='light') t='light';
  const apply=v=>{document.documentElement.dataset.theme=v;
    const b=document.getElementById('themeToggle'); if(b) b.textContent=(v==='dark'?'☀':'◐');};
  apply(t);
  document.getElementById('themeToggle').onclick=()=>{
    t=(t==='dark'?'light':'dark'); try{localStorage.setItem(KEY,t);}catch(e){} apply(t);
  };
})();

/* ===== KLAUSURTRAINING ===== */
const EXAMS = JSON.parse(document.getElementById('exam-data').textContent);
const EX_KEY = 'wipsy_exam_v1';
let EXST = (()=>{try{return JSON.parse(localStorage.getItem(EX_KEY))||{};}catch(e){return{};}})();
function exSave(){try{localStorage.setItem(EX_KEY,JSON.stringify(EXST));}catch(e){}}
function exEsc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let EXTIMER=null;

function exScore(ex){
  const st=EXST[ex.key]||{}; let got=0,rated=0;
  for(const q of ex.fragen){ if(st[q.id]!==undefined){got+=st[q.id]*q.punkte; rated++;} }
  return {got:Math.round(got*10)/10, rated};
}
function stopExamTimer(){ if(EXTIMER){clearInterval(EXTIMER); EXTIMER=null;} }

function renderExamHome(){
  stopExamTimer();
  const el=document.getElementById('examBody');
  let h='<h1 class="page">Klausurtraining</h1>'+
    '<p class="sub">Format der echten Klausur: 90 Minuten, 90 Punkte, nur offene Fragen, Taschenrechner erlaubt. Regel: 1 Punkt = 1 Minute. Erst komplett schreiben (Stift und Papier empfohlen), dann Loesungen aufdecken und selbst bewerten.</p>'+
    '<div class="exam-list">';
  for(const ex of EXAMS){
    const s=exScore(ex);
    const pct=ex.total? Math.round(s.got/ex.total*100):0;
    h+='<button class="cat" data-ex="'+ex.key+'"><span class="bar-top"></span>'+
      '<h3>'+exEsc(ex.title)+'</h3>'+
      '<div class="cnt">'+ex.fragen.length+' Fragen · '+ex.total+' Punkte</div>'+
      '<div class="prog"><i style="width:'+pct+'%"></i></div>'+
      '<div class="pct"><span>'+(s.rated? s.got+' / '+ex.total+' Punkte ('+s.rated+' bewertet)':'noch nicht bearbeitet')+'</span><span>'+(s.rated?pct+'%':'')+'</span></div></button>';
  }
  h+='</div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>renderExam(b.dataset.ex));
  show('exam');
}

function renderExam(key){
  stopExamTimer();
  const ex=EXAMS.find(e=>e.key===key); if(!ex) return;
  const el=document.getElementById('examBody');
  const s=exScore(ex);
  let h='<div class="exam-top">'+
    '<button class="btn sm" id="exBack">&larr; Übersicht</button>'+
    '<span class="name" style="font-weight:800">'+exEsc(ex.title)+'</span>'+
    '<div class="spacer"></div>'+
    '<span class="exam-score" id="exScore"></span>'+
    '<span class="exam-timer" id="exTimer">90:00</span>'+
    '<button class="btn sm" id="exTimerBtn">Timer starten</button>'+
    '<button class="btn sm ghost" id="exAllSol">Alle Lösungen</button>'+
    '</div>';
  let teil='';
  for(const q of ex.fragen){
    if(q.teil && q.teil!==teil){ teil=q.teil; h+='<div class="exam-teil">'+exEsc(teil)+'</div>'; }
    h+='<div class="exam-q" id="exq-'+q.id+'">'+
      '<div class="qhead"><span class="qid">Frage '+exEsc(q.id)+'</span><span class="qpts">'+q.punkte+' Punkte · '+q.punkte+' Min</span></div>'+
      q.frage.map(p=>'<p>'+exEsc(p)+'</p>').join('')+
      '<button class="btn sm" data-sol="'+q.id+'">Lösung anzeigen</button>'+
      '<div class="exam-sol hidden" id="exsol-'+q.id+'">'+
      (q.quelle?'<div class="src">Quelle: '+exEsc(q.quelle)+'</div>':'')+
      q.loesung.map(p=>'<p>'+exEsc(p)+'</p>').join('')+
      '<div class="exam-rate"><span>Selbstbewertung:</span>'+
      '<button class="g" data-rate="1" data-q="'+q.id+'">voll ('+q.punkte+' P)</button>'+
      '<button class="y" data-rate="0.5" data-q="'+q.id+'">teilweise</button>'+
      '<button class="r" data-rate="0" data-q="'+q.id+'">daneben</button>'+
      '</div></div></div>';
  }
  el.innerHTML=h;
  document.getElementById('exBack').onclick=renderExamHome;
  el.querySelectorAll('[data-sol]').forEach(b=>b.onclick=()=>{
    document.getElementById('exsol-'+b.dataset.sol).classList.toggle('hidden');
  });
  document.getElementById('exAllSol').onclick=()=>{
    el.querySelectorAll('.exam-sol').forEach(x=>x.classList.remove('hidden'));
  };
  const paint=()=>{
    const sc=exScore(ex);
    document.getElementById('exScore').innerHTML='<b>'+sc.got+'</b> / '+ex.total+' P · '+sc.rated+'/'+ex.fragen.length+' bewertet';
    const st=EXST[ex.key]||{};
    el.querySelectorAll('[data-rate]').forEach(b=>{
      const on = st[b.dataset.q]!==undefined && String(st[b.dataset.q])===b.dataset.rate;
      b.classList.toggle('on',on);
    });
  };
  el.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{
    if(!EXST[ex.key])EXST[ex.key]={};
    EXST[ex.key][b.dataset.q]=parseFloat(b.dataset.rate);
    exSave(); paint();
  });
  let remain=90*60;
  document.getElementById('exTimerBtn').onclick=function(){
    if(EXTIMER){ stopExamTimer(); this.textContent='Timer starten'; return; }
    this.textContent='Pause';
    EXTIMER=setInterval(()=>{
      remain--;
      const t=document.getElementById('exTimer'); if(!t){stopExamTimer();return;}
      const mm=Math.max(0,Math.floor(remain/60)), ss=Math.max(0,remain%60);
      t.textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
      if(remain<=600) t.classList.add('warn');
      if(remain<=0){ stopExamTimer(); t.textContent='00:00'; alert('Zeit um! Stift fallen lassen wie in der echten Klausur.'); }
    },1000);
  };
  paint();
  show('exam'); window.scrollTo(0,0);
}
document.getElementById('navExam').onclick=()=>{ if(typeof stopTimerClock==='function') stopTimerClock(); renderExamHome(); };
</script>
