n diese drei erfüllt sind, darf man den Daten zuverlässige Aussagen entnehmen. Für qualitative Forschung gelten etwas andere Kriterien, etwa intersubjektive Nachvollziehbarkeit und theoretische Verankerung."]},{"h":"Statistik mit Augenmaß: signifikant ist nicht gleich bedeutsam","body":["Bei der Auswertung trennt man die deskriptive Statistik, die Daten nur beschreibt, etwa durch Mittelwert und Standardabweichung, von der Inferenzstatistik, die Schlüsse über Zusammenhänge und Unterschiede zulässt und prüft, ob ein Ergebnis vielleicht nur zufällig zustande kam. Ein Ergebnis gilt als signifikant, wenn man mit mindestens fünfundneunzig Prozent Wahrscheinlichkeit ausschließen kann, dass es bloß Zufall war. Und hier liegt eine der wichtigsten Einsichten überhaupt, die du dir gut einprägen solltest: Signifikanz ist nicht dasselbe wie Bedeutsamkeit. Bei sehr großen Stichproben werden nämlich auch winzige, praktisch belanglose Unterschiede signifikant. Deshalb sollte man immer auch die Effektstärke angeben, sie zeigt, ob ein Effekt überhaupt eine bedeutsame Größe hat."]},{"h":"Die Werkzeuge der Datenerhebung","body":["Unter den Erhebungsverfahren ragt das Experiment heraus, denn nur in ihm lassen sich kausale Zusammenhänge zweifelsfrei nachweisen. Im Experiment verändert der Versuchsleiter absichtlich eine Bedingung, das ist die unabhängige Variable, und misst die Folgen, die abhängige Variable. Entscheidend ist die Randomisierung, also die zufällige Zuordnung der Versuchspersonen zu den Bedingungen, damit unbekannte Störvariablen die Ergebnisse nicht systematisch verzerren. Merke dir den Kernsatz: Kausalität behauptet man nur dort, wo ein Experiment vorliegt.","Die in der Praxis häufigste Methode ist allerdings die Befragung, meist mit validierten Skalen. Zwei Begriffe sind hier wichtig. Die Stichprobe sollte repräsentativ sein, das heißt, sie spiegelt die Merkmale der Grundgesamtheit wider, idealerweise als Vollerhebung, sonst über möglichst viele, zufällig gewählte Personen. Und die Fragen dürfen nicht suggestiv sein, sonst droht soziale Erwünschtheit, also dass Befragte das antworten, was gut ankommt, statt was stimmt. Weil einzelne Studien irren können, fasst die Metaanalyse die Kennwerte vieler Studien zusammen und sagt genauer, ob ein Effekt wirklich existiert und wie groß er ist. Ein Problem dabei ist der Publication Bias, denn meist werden nur Studien mit signifikanten Ergebnissen publiziert, was das Gesamtbild verzerrt. Auf der qualitativen Seite steht als Beispiel die Inhaltsanalyse, bei der man Texte anhand theoretisch abgeleiteter Kategorien kodiert."]},{"h":"Ein Klassiker zum Abschluss","body":["Damit das alles nicht zu abstrakt bleibt, ein berühmtes Beispiel, das zugleich die Bedeutung der Sozialpsychologie aus dem ersten Teil belegt: das Asch-Experiment zur Konformität. Solomon Asch zeigte, wie stark sich Menschen dem Druck einer Gruppe anpassen. Viele Versuchspersonen gaben bewusst falsche Antworten, weil die Mehrheit sie vorgab, obwohl die richtige Lösung offensichtlich war, etwa ein Drittel der Antworten war angepasst. Spannend sind die Bedingungen, unter denen die Konformität sank: Ein einziger Verbündeter, der ebenfalls richtig antwortete, senkte die Anpassung deutlich, und wenn anonym geantwortet wurde, sank sie stark. Das Fazit fasst den Geist des ganzen Blocks zusammen: Unser Verhalten ist stark durch soziale Einflüsse geprägt, und genau solche Einflüsse macht die Wirtschaftspsychologie mit ihren Methoden sichtbar."]}],"raster":[{"kat":"PB","begriff":"Empirische Forschung / Wissenschaftstheorie","warum":"Wissen wird erhoben, nicht erdacht","muss":true,"gew":6,"ktag":"","terms":["Empirische","Forschung","Wissenschaftstheorie"]},{"kat":"PB","begriff":"Neun Schritte des Forschungsprozesses","warum":"methodisches Grundgerüst","muss":true,"gew":7,"ktag":"","terms":["Schritte","Forschungsprozesses"]},{"kat":"PB","begriff":"Hypothese (je-desto / wenn-dann)","warum":"prüfbare Aussage","muss":false,"gew":5,"ktag":"","terms":["Hypothese"]},{"kat":"PB","begriff":"Operationalisierung","warum":"Konstrukt messbar machen","muss":true,"gew":6,"ktag":"","terms":["Operationalisierung"]},{"kat":"PB","begriff":"Quantitativ vs. qualitativ (+ Mixed Methods)","warum":"Methodenverständnis","muss":true,"gew":7,"ktag":"","terms":["Quantitativ","Mixed","Methods","qualitativ"]},{"kat":"PB","begriff":"Gütekriterien: Validität / Reliabilität / Objektivität","warum":"Bonuskapitel-Pflicht","muss":true,"gew":10,"ktag":"","terms":["Gütekriterien","Validität","Reliabilität","Objektivität"]},{"kat":"PB","begriff":"Deskriptive vs. Inferenzstatistik","warum":"Beschreiben vs. Schließen","muss":false,"gew":5,"ktag":"","terms":["Deskriptive","Inferenzstatistik"]},{"kat":"PB","begriff":"Signifikanz vs. Effektstärke","warum":"zentrale statistische Einsicht","muss":true,"gew":8,"ktag":"","terms":["Signifikanz","Effektstärke"]},{"kat":"PB","begriff":"Experiment: UV, AV, Randomisierung","warum":"nur Experiment zeigt Kausalität","muss":true,"gew":9,"ktag":"","terms":["Experiment","Randomisierung"]},{"kat":"PB","begriff":"Repräsentativität / soziale Erwünschtheit","warum":"Qualität von Befragungen","muss":true,"gew":6,"ktag":"","terms":["Repräsentativität","Erwünschtheit","soziale"]},{"kat":"PB","begriff":"Metaanalyse / Publication Bias","warum":"Aggregation und ihre Verzerrung","muss":true,"gew":6,"ktag":"","terms":["Metaanalyse","Publication","Bias"]},{"kat":"PB","begriff":"Asch-Experiment (Konformität)","warum":"Beleg für soziale Einflüsse","muss":true,"gew":6,"ktag":"","terms":["Asch-Experiment","Asch","Experiment","Konformität"]},{"kat":"PK","begriff":"Warum nur das Experiment Kausalität zeigt","warum":"UV/AV/Randomisierung gegen Störvariablen","muss":true,"gew":9,"ktag":"","terms":["Experiment","Kausalität","zeigt"]},{"kat":"PK","begriff":"Die drei Gütekriterien inhaltlich erklären","warum":"je eine prüfende Frage","muss":true,"gew":9,"ktag":"","terms":["Gütekriterien","inhaltlich","erklären"]},{"kat":"PK","begriff":"Signifikanz ist nicht Bedeutsamkeit","warum":"große Stichprobe macht Kleines signifikant","muss":true,"gew":8,"ktag":"","terms":["Signifikanz","Bedeutsamkeit","nicht"]},{"kat":"PZ","begriff":"Empirische Wissenschaft -> Methodenteil","warum":"Definition und Forschungspraxis greifen ineinander","muss":true,"gew":6,"ktag":"","terms":["Empirische","Wissenschaft","Methodenteil"]},{"kat":"PZ","begriff":"Gütekriterien -> Block 2 / 4","warum":"Wiederkehr bei Arbeit und Personalauswahl","muss":false,"gew":5,"ktag":"","terms":["Gütekriterien","Block"]},{"kat":"KD","begriff":"Gütekriterien als Bonuskapitel-Pflicht","warum":"mindestens eine Bonuskapitel-Frage sicher","muss":true,"gew":9,"ktag":"","terms":["Gütekriterien","Bonuskapitel-Pflicht","Bonuskapitel","Pflicht"]},{"kat":"KD","begriff":"Randomisierung gegen Störvariablen","warum":"wichtiges Detail","muss":false,"gew":4,"ktag":"","terms":["Randomisierung","Störvariablen"]}],"fehler":["Signifikanz mit Bedeutsamkeit gleichsetzen und die Effektstärke ignorieren.","Kausalität ohne Experiment behaupten (Korrelation mit Kausalität verwechseln).","Die drei Gütekriterien verwechseln oder nur unvollständig nennen.","Quantitativ und qualitativ als besser oder schlechter werten statt als gleichwertige Werkzeuge.","Operationalisierung mit der Hypothese verwechseln."]}]},{"key":"Block1b","label":"Block 1b · Konsum, Markt & Werbung","color":"#d98b2b","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Konsum: Motive, Entscheidung und Preis","lernziel":"Verstehen, welche Motive Konsum antreiben, wie Kaufentscheidungen psychologisch ablaufen und warum die Preiswahrnehmung oft von der reinen Zahl abweicht.","konzepte":"Sieben Konsummotive (Trommsdorff & Teichert), Means-End-Kette und Laddering, vier Kaufentscheidungstypen (Felser), kompensatorische vs. nonkompensatorische Strategien, Satisficing, Preisschwellen, Veblen-Effekt vs. Preis-Qualitäts-Heuristik, Anker- und Kompromisseffekt, gebrochene Preise, Pain of Paying.","lesezeit":"etwa 14 bis 16 Minuten","sections":[{"h":"Warum wir kaufen: Konsummotive und das Means-End-Modell","body":["Block 1b behandelt die Konsumseite der Wirtschaftspsychologie, also Konsum, Kunden, Angebot, Marktforschung und Werbung, das sind die Fichter-Kapitel zwei bis sechs. Ein eigener Foliensatz existiert dazu nicht, der Professor hat aber angekündigt, dass ein Teil aus dem Fichter geprüft wird, also ist dieser Stoff klausurrelevant. Beginnen wir mit der Frage, warum Menschen überhaupt konsumieren. Trommsdorff und Teichert nennen sieben Konsummotive, die du sicher aufzählen können solltest: erstens Ökonomik, also Sparsamkeit und Rationalität, zweitens Prestige, Ausdruck und Anerkennung, drittens Konformität, viertens Lust, Erregung und Neugier, fünftens Sex und Erotik, sechstens Angst, Furcht und Risiko, und siebtens Konsistenz im Sinne der Dissonanzvermeidung. Wichtig ist die Einordnung: Die berühmte Maslow-Pyramide gilt als überholt, weil Motive nicht zwingend hierarchisch aufeinander aufbauen, und es gibt überhaupt keine allgemein akzeptierte, abschließende Motivationstheorie. Präsentiere Maslow in der Klausur also nicht als gültiges Modell.","Wie aus einer Produkteigenschaft ein Motiv wird, beschreibt die Means-End-Kette. Sie verknüpft drei Ebenen, von konkret zu abstrakt: die Eigenschaften eines Produkts, die daraus folgenden Funktionen und Nutzen, und schließlich die dahinterliegenden Werte und Ziele. Gemessen wird sie per Laddering nach Reynolds und Gutman, also durch wiederholtes Nachfragen, warum einem etwas wichtig ist, bis man bei einer hierarchischen Wertekarte landet. Merke dir die Richtung, von den Eigenschaften über den Nutzen zu den Werten, denn die wird gern abgefragt. Ein verwandtes Problem: Erfragte Motive weichen oft vom tatsächlichen Verhalten ab, weil nicht alle Motive bewusst oder sozial erwünscht zugänglich sind, man denke an die gelobten sparsamen Autos und die gekauften SUVs. Solche verdeckten Motive erreicht man nur über Tiefeninterviews und projektive Verfahren."]},{"h":"Wie wir uns entscheiden","body":["Nicht jeder Kauf läuft gleich ab. Felser unterscheidet vier Typen der Kaufentscheidung. Die impulsive Entscheidung ist spontan und emotional, die habituelle folgt der Gewohnheit und der Markentreue wie auf Autopilot, die extensive Entscheidung bei hohem Involvement durchläuft alle Phasen bewusst, und die limitierte Entscheidung läuft unter Zeit- und Wissensdruck über Faustregeln. Wie man am Ende zwischen Alternativen wählt, beschreiben zwei Familien von Strategien, deren Zuordnung selten sitzt und die du dir deshalb gut einprägen solltest. Kompensatorische Strategien lassen die Schwäche eines Attributs durch die Stärke eines anderen ausgleichen, sind aber aufwendig; dazu gehören die EQW-Regel mit gleicher Gewichtung und die WADD-Regel als gewichtete Summe in der Logik des Homo oeconomicus. Nonkompensatorische Strategien betrachten nur Teil-Attribute und sind Heuristiken; dazu gehören die EBA-Regel mit Mindestwerten je Attribut und die LEX-Regel, bei der das wichtigste Attribut allein entscheidet. Der Gegenbegriff zur Optimierung ist das Satisficing nach Herbert Simon: Man wählt nicht die beste, sondern eine gut genug erscheinende Alternative, indem man Mindestanforderungen festlegt. Betsch ordnet den Ablauf in drei Phasen, die präselektionale Suche, die selektionale Bewertung und die postselektionale Ausführung mit Erfahrungssammlung."]},{"h":"Die Psychologie des Preises","body":["Ein eigenes, prüfungsdichtes Feld ist die Preiswahrnehmung. Sie verläuft nicht als glatte Kurve, sondern über Schwellen: Es gibt eine absolute obere Schwelle, ab der etwas als zu teuer oder unfair gilt, eine absolute untere Schwelle, unter der Qualitätszweifel aufkommen, und dazwischen einen akzeptierten Bereich, in dem Preisänderungen kaum auffallen. Besonders prüfungsrelevant sind zwei Mechanismen, die erklären, dass der Absatz bei steigendem Preis sogar steigen kann, und die du sauber trennen musst. Die Preis-Qualitäts-Heuristik nutzt den Preis als Qualitätssignal, klassisch belegt durch die McConnell-Bier-Studie, in der teureres Bier besser schmeckte. Der Veblen-Effekt dagegen beruht auf Status und Luxus, in der Variante des Geltungskonsums etwa beim Prius als sichtbarem Statussymbol. Beide führen zu mehr Absatz bei höherem Preis, aber aus völlig verschiedenen Gründen. Hinzu kommen zwei weitere Effekte: Der Ankereffekt lässt uns bei geringem Preiswissen an einer willkürlichen Vorgabe orientieren, sodass ein höheres Startgebot den Endpreis hebt. Der Kompromisseffekt, auch Extremeness Aversion, sorgt dafür, dass ein sehr teures Zusatzprodukt die bisher teuerste Option plötzlich attraktiver macht. Schließlich wirken gebrochene Preise wie 2,99, weil die linke Ziffer dominiert und die Neun mit Preisgünstigkeit assoziiert wird, und der Pain of Paying nach Prelec und Loewenstein erklärt, dass Barzahlung mehr Schmerz auslöst als Karte oder Flatrate, sodass die Entkopplung von Konsum und Bezahlung den Konsum erhöht."]}],"raster":[{"kat":"PB","begriff":"Sieben Konsummotive (Trommsdorff & Teichert)","warum":"klassischer Aufzählungs-Prüfstoff","muss":true,"gew":7,"ktag":"","terms":["Konsummotive","Trommsdorff","Teichert"]},{"kat":"PB","begriff":"Means-End-Kette und Laddering","warum":"Eigenschaften → Nutzen → Werte","muss":true,"gew":6,"ktag":"","terms":["Means-End-Kette","Means","Kette","Laddering","End"]},{"kat":"PB","begriff":"Vier Kaufentscheidungstypen (Felser)","warum":"impulsiv, habituell, extensiv, limitiert","muss":true,"gew":7,"ktag":"","terms":["Kaufentscheidungstypen","Felser"]},{"kat":"PZ","begriff":"Kompensatorisch (EQW, WADD) vs. nonkompensatorisch (EBA, LEX)","warum":"Zuordnung der vier Regeln sitzt selten","muss":true,"gew":8,"ktag":"","terms":["Kompensatorisch","EQW","WADD","EBA","LEX"]},{"kat":"PZ","begriff":"Veblen-Effekt vs. Preis-Qualitäts-Heuristik","warum":"beide Preis hoch → mehr Absatz, andere Mechanik","muss":true,"gew":8,"ktag":"","terms":["Veblen-Effekt","Veblen","Effekt","Preis-Qualitäts-Heuristik","Preis","Qualitäts","Heuristik"]},{"kat":"PB","begriff":"Satisficing (Simon)","warum":"gut genug statt optimal","muss":true,"gew":5,"ktag":"","terms":["Satisficing","Simon"]},{"kat":"KD","begriff":"Anker- und Kompromisseffekt, gebrochene Preise, Pain of Paying","warum":"Preiswahrnehmung","muss":true,"gew":6,"ktag":"","terms":["Anker-","Anker","Kompromisseffekt","Preise","Pain","Paying","gebrochene"]},{"kat":"KD","begriff":"Maslow-Pyramide als überholt einordnen","warum":"typische Falle","muss":true,"gew":5,"ktag":"","terms":["Maslow-Pyramide","Maslow","Pyramide","überholt","einordnen"]}],"fehler":["Die vier Entscheidungsregeln falsch zuordnen: kompensatorisch sind EQW und WADD, nonkompensatorisch EBA und LEX.","Veblen-Effekt und Preis-Qualitäts-Heuristik vermischen (Status vs. Preis als Qualitätssignal).","Die Maslow-Pyramide als gültiges Modell präsentieren.","Die Richtung der Means-End-Kette umdrehen (sie geht von Eigenschaften über Nutzen zu Werten)."]},{"title":"Kunden und Angebot","lernziel":"Verstehen, wie Kundenzufriedenheit und -bindung entstehen und wie ein Angebot auf gesättigten Märkten positioniert und qualitativ beurteilt wird.","konzepte":"Diskonfirmationsparadigma, Kano-Modell und Herzberg-Mapping, Net Promoter Score, Investment-Modell (Rusbult), rationale und emotionale Bindung, drei Positionierungsstrategien, USP/KISS/FIRST/VOICE, Grund- und Zusatznutzen, drei Qualitätsarten, Gap-Modell und SERVQUAL, Produktentwicklung und Modifikation.","lesezeit":"etwa 13 bis 15 Minuten","sections":[{"h":"Kundenzufriedenheit: das Diskonfirmationsparadigma","body":["Wie entsteht Zufriedenheit? Das Diskonfirmationsparadigma erklärt es über den Abgleich von Erwartung und Erlebnis. Zufrieden ist ein Kunde, wenn die tatsächliche Leistung, das Ist, seine Erwartung, das Soll, erreicht, was man Konfirmation nennt, oder sie übertrifft, die positive Diskonfirmation. Bleibt das Ist hinter dem Soll zurück, spricht man von negativer Diskonfirmation und damit Unzufriedenheit, hinzu kommt eine emotionale Komponente. Eng damit verbunden ist das Kano-Modell mit drei Merkmalsarten, das du mit Herzbergs Zwei-Faktoren-Theorie verknüpfen solltest. Die Basismerkmale werden vorausgesetzt, ihr Fehlen macht unzufrieden, ihre Erfüllung aber nur neutral, sie entsprechen Herzbergs Hygienefaktoren. Die Begeisterungsmerkmale können nur Zufriedenheit auslösen, niemals Unzufriedenheit, sie entsprechen den Motivatoren. Dazwischen liegen die Leistungsmerkmale, die erwartet werden und in beide Richtungen wirken. Gemessen wird Zufriedenheit unter anderem über den Net Promoter Score von Reichheld, der auf einer einzigen Frage nach der Weiterempfehlung von null bis zehn beruht: Promoter geben neun oder zehn, Detraktoren null bis sechs, die Sieben und Acht gelten als indifferent und zählen nicht, und der NPS ist der Prozentsatz der Promoter minus dem Prozentsatz der Detraktoren. Weitere Verfahren sind die Critical Incident Technique, SERVQUAL und der Implizite Assoziationstest."]},{"h":"Kundenbindung","body":["Warum bleiben Kunden? Das Investment-Modell von Rusbult nennt drei Faktoren: die Zufriedenheit mit der Beziehung, die Attraktivität verfügbarer Alternativen und die bereits geleisteten Investitionen. Moser trennt rationale Ursachen, also situative, ökonomische, vertragliche und technische Gründe, von emotionalen Ursachen wie Involvement, Vertrauen, Commitment und Erlebnissen. Psychologisch erklären mehrere Theorien die Bindung: die kognitive Dissonanz über die nachträgliche Rechtfertigung des Kaufs, die Risikowahrnehmung und die Lerntheorie mit operanter Konditionierung und Modelllernen nach Bandura. Wichtig ist die Kehrseite: Zwang erzeugt Reaktanz, also eine Gebundenheit statt einer echten Verbundenheit, was die Bindung untergräbt."]},{"h":"Das Angebot positionieren","body":["Auf gesättigten Märkten entscheidet die Positionierung. Es gibt drei Grundstrategien: die Kostenführerschaft über Skaleneffekte wie bei Aldi, die Konzentration auf ein Segment, also die Nische, und die Differenzierung, das Abheben über Produkt, Service oder Image. Kroeber-Riel und Esch definieren Positionierung als alle Maßnahmen, die das Angebot so in die subjektive Wahrnehmung der Abnehmer einfügen, dass es sich von der Konkurrenz abhebt und vorgezogen wird, denn die Wahrnehmung zählt mehr als die objektiven Eigenschaften. Dazu gehören vier Kürzel nach Ries und Trout: USP für das Alleinstellungsmerkmal, KISS für keep it short and simple, FIRST für den Ersten am Markt und VOICE für hohen Werbeaufwand, während der Me-Too-Anbieter nur zum tieferen Preis nachahmt. Wichtig ist die Unterscheidung von Grundnutzen und Zusatznutzen: Der Grundnutzen, der Gebrauchswert, ist in einer Kategorie gleich, der meist symbolische Zusatznutzen differenziert über die Marke, und wenn sich ein Zusatznutzen verbreitet, wird er selbst zum Grundnutzen."]},{"h":"Qualität und Produktentwicklung","body":["Qualität ist nicht gleich Qualität, man unterscheidet drei Arten je nachdem, wann man sie beurteilen kann. Die Prüfqualität lässt sich schon vor dem Kauf prüfen, die Erfahrungsqualität zeigt sich erst mit der Zeit, und die Vertrauensqualität kann man selbst nie prüfen, etwa eine faire Herstellung. Bei Dienstleistungen misst man Qualität über das Gap-Modell von Parasuraman, das die Lücke zwischen Erwartung und Leistung erfasst, und über SERVQUAL mit fünf Dimensionen: Souveränität, Einfühlung, Entgegenkommen, Zuverlässigkeit und das Materielle. In der Produktentwicklung gilt, dass nur etwa zwanzig bis dreißig Prozent neuer Produkte langfristig am Markt bleiben und der beste Erfolgsindikator die Wiederkaufrate ist, wobei die meisten Neuheiten bloße Linienerweiterungen statt echter Innovationen sind. Eine Produktmodifikation darf dabei den Wesenskern nicht zerstören, sonst erscheint das Produkt nicht mehr als dasselbe, ein warnendes Beispiel ist der zu stark veränderte Twingo, ein gelungenes der Beetle."]}],"raster":[{"kat":"PZ","begriff":"Diskonfirmationsparadigma (Konfirmation vs. positive Diskonfirmation)","warum":"Ist-Soll-Abgleich","muss":true,"gew":8,"ktag":"","terms":["Diskonfirmationsparadigma","Konfirmation","Diskonfirmation"]},{"kat":"PZ","begriff":"Kano-Modell mit Herzberg-Mapping","warum":"Basis = Hygiene, Begeisterung = Motivator","muss":true,"gew":8,"ktag":"","terms":["Kano-Modell","Kano","Herzberg-Mapping","Herzberg","Mapping"]},{"kat":"PB","begriff":"Net Promoter Score (Definition und Berechnung)","warum":"%Promoter minus %Detraktor, 7-8 indifferent","muss":true,"gew":6,"ktag":"","terms":["Promoter","Score","Definition","Berechnung"]},{"kat":"PK","begriff":"Drei Positionierungsstrategien","warum":"Kostenführerschaft, Nische, Differenzierung","muss":true,"gew":7,"ktag":"","terms":["Positionierungsstrategien"]},{"kat":"PB","begriff":"USP, KISS, FIRST, VOICE; Grund- vs. Zusatznutzen","warum":"Positionierungsbegriffe","muss":true,"gew":6,"ktag":"","terms":["USP","KISS","FIRST","VOICE","Grund-","Grund","Zusatznutzen"]},{"kat":"PB","begriff":"Drei Qualitätsarten (Prüf-, Erfahrungs-, Vertrauensqualität)","warum":"wann beurteilbar","muss":true,"gew":6,"ktag":"","terms":["Qualitätsarten","Prüf-","Prüf","Erfahrungs-","Erfahrungs","Vertrauensqualität"]},{"kat":"KD","begriff":"Investment-Modell (Rusbult); rationale vs. emotionale Bindung","warum":"Bindungsfaktoren","muss":false,"gew":4,"ktag":"","terms":["Investment-Modell","Investment","Rusbult","Bindung"]},{"kat":"KD","begriff":"Gap-Modell und SERVQUAL (fünf Dimensionen)","warum":"Dienstleistungsqualität","muss":false,"gew":4,"ktag":"","terms":["Gap-Modell","SERVQUAL","Dimensionen","Gap"]}],"fehler":["Kano und Herzberg falsch zuordnen: Basismerkmal ist der Hygienefaktor, Begeisterungsmerkmal der Motivator.","Konfirmation und positive Diskonfirmation verwechseln (Ist gleich Soll vs. Ist über Soll).","Beim NPS die indifferenten Werte sieben und acht mitzählen.","Die drei Qualitätsarten durcheinanderbringen (Prüfung vor dem Kauf, Erfahrung mit der Zeit, Vertrauen nie prüfbar)."]},{"title":"Marktforschung und Werbung","lernziel":"Verstehen, wie man Märkte erforscht und wie Werbung psychologisch wirkt, samt der klassischen Fallen wie AIDA, subliminaler Werbung und Vampireffekt.","konzepte":"Sekundär- und Primärforschung, Handels- und Verbraucherpanel, Sensoriktests, Neuro-Marketing-Kritik, fünf Werbefunktionen, AIDA als überholt, Elaboration-Likelihood-Model, Mere-Exposure-Effekt, Furchtappell und Vampireffekt, Bildgestaltung, subliminale Werbung (Vicary), Image (Gardner & Levy) und Imageeffekt.","lesezeit":"etwa 13 bis 15 Minuten","sections":[{"h":"Wie man den Markt erforscht","body":["Bevor es um Werbung geht, kurz zur Marktforschung. Man trennt die Sekundärforschung, die auf vorhandene Daten zurückgreift, das sogenannte Desk Research, von der Primärforschung, die neue Daten erhebt, das Field Research. Eine wichtige Form sind Panels: Das Handelspanel erfasst die Verkaufszahlen der Händler, etwa über Nielsen, das Verbraucherpanel lässt Haushalte ihre Einkäufe scannen, etwa über die GfK, und zeigt damit das echte Kaufverhalten. Bei Lebensmitteln nutzt man DIN-genormte Sensoriktests, von Unterschiedstests wie der Dreiecksprüfung über Hedoniktests bis zu beschreibenden Tests mit Experten. Ein modisches, aber kritisch zu sehendes Feld ist das Neuro-Marketing mit fMRT: Es zeigt, wo im Gehirn etwas aktiv ist, aber nicht warum, bringt oft keinen Mehrwert gegenüber einer Befragung und leidet unter methodischen Problemen wie den Voodoo-Korrelationen. Das Etikett Neuro verleiht einen unverdienten Glaubwürdigkeitsvorschuss, weshalb man es nur bei echten neuropsychologischen Daten verwenden sollte."]},{"h":"Wie Werbung wirkt","body":["Werbung erfüllt für Konsumenten fünf Funktionen, die du nennen können solltest: Wissen, Unterhaltung, Normen im Sinne der Sozialisierung, Emotionen und Identität. Für den Anbieter unterscheidet man Einführungs-, Verdrängungs- und Imagewerbung. Das alte Stufenmodell AIDA, also Attention, Interest, Desire und Action von 1898, gilt wie die Maslow-Pyramide als überholt, weil es zu starr und empirisch unbestätigt ist, du solltest es nur als historisches Modell einordnen. Das tragfähige Modell ist heute das Elaboration-Likelihood-Model von Petty und Cacioppo. Es unterscheidet zwei Wege der Verarbeitung: die zentrale Route, die bewusst und aufwendig über starke Argumente läuft, und die periphere Route, die oberflächlich über heuristische Reize wie Prominente oder stimmungsvolle Bilder läuft. Welche Route greift, hängt von Motivation und Fähigkeit ab, und daraus folgt direkt die Gestaltungsregel: Bei hoher Verarbeitungstiefe braucht es informative Argumente, bei geringer positive Hinweisreize. Eng verwandt ist der Mere-Exposure-Effekt von Zajonc, wonach allein die wiederholte Darbietung eines Reizes ihn positiver erscheinen lässt, was die Markenwahl begünstigt."]},{"h":"Emotion, Bild und die typischen Fallen","body":["Werbung arbeitet stark mit Emotionen, und hier lauern einige Fallen. Furcht wirkt nach Hovland nur, wenn die Botschaft als persönlich relevant erlebt wird und zugleich ein konkreter Lösungsweg gezeigt wird, sonst löst sie Abwehr aus. Der Vampireffekt beschreibt, dass Erotik die Aufmerksamkeit auf sich zieht, weg vom Produkt, also gerade nicht automatisch verkaufsfördernd wirkt. Bei der Bildgestaltung gelten einfache Regeln: Bild vor Text, Menschen vor Dingen, wobei das Kindchenschema besonders stark aktiviert, wenig vor viel und groß vor klein, und das Bild muss zum Produkt passen. Eine klassische Prüfungsfalle ist die subliminale Werbung: Vicary behauptete 1957, das unmerkliche Aufblitzen von EAT POPCORN steigere den Konsum, doch das war ein Betrug. Tatsächlich wirkt Subliminales nur subtil und mild aktivierend, niemals gegen den Willen. Zum Abschluss das Image: Gardner und Levy definieren es als ein auf Eindrücken basierendes, sozial geteiltes Vorstellungsbild, das anders als das Prestige auch negativ sein kann und vor allem der Vereinfachung und Orientierung dient. Wie mächtig Images sind, zeigen die Imageeffekt-Studien von Fichter: Identische Inhalte werden je nach Layout, Quelle oder zugeschriebenem Image unterschiedlich bewertet, etwa je nachdem, ob ein Text der NZZ oder dem Blick zugeschrieben wird. Wir urteilen nach Images statt nach Fakten, und das gilt sogar für Experten."]}],"raster":[{"kat":"PZ","begriff":"Elaboration-Likelihood-Model (zentrale vs. periphere Route)","warum":"abhängig von Motivation und Fähigkeit","muss":true,"gew":8,"ktag":"","terms":["Elaboration-Likelihood-Model","Elaboration","Likelihood","Model","Route"]},{"kat":"PB","begriff":"Fünf Werbefunktionen für Konsumenten","warum":"Wissen, Unterhaltung, Normen, Emotionen, Identität","muss":true,"gew":6,"ktag":"","terms":["Werbefunktionen","Konsumenten"]},{"kat":"PB","begriff":"Mere-Exposure-Effekt (Zajonc)","warum":"wiederholte Darbietung wirkt positiv","muss":true,"gew":6,"ktag":"","terms":["Mere-Exposure-Effekt","Mere","Exposure","Effekt","Zajonc"]},{"kat":"PB","begriff":"Image (Gardner & Levy) und Imageeffekt","warum":"Urteil nach Image statt Fakten","muss":true,"gew":6,"ktag":"","terms":["Image","Gardner","Levy","Imageeffekt"]},{"kat":"KD","begriff":"Subliminale Werbung (Vicary-Betrug) und Vampireffekt","warum":"typische Fallen","muss":true,"gew":6,"ktag":"","terms":["Subliminale","Werbung","Vicary-Betrug","Vicary","Betrug","Vampireffekt"]},{"kat":"KD","begriff":"AIDA als überholt einordnen","warum":"typische Falle","muss":true,"gew":5,"ktag":"","terms":["AIDA","überholt","einordnen"]},{"kat":"PK","begriff":"Furchtappell (Hovland): Relevanz und Lösungsweg","warum":"Bedingungen der Wirkung","muss":false,"gew":5,"ktag":"","terms":["Furchtappell","Hovland","Relevanz","Lösungsweg"]},{"kat":"KD","begriff":"Sekundär- vs. Primärforschung, Panels, Neuro-Marketing-Kritik","warum":"Methodenüberblick","muss":false,"gew":4,"ktag":"","terms":["Sekundär-","Sekundär","Primärforschung","Panels","Neuro-Marketing-Kritik","Neuro","Marketing"]}],"fehler":["AIDA als gültiges Wirkmodell präsentieren statt als überholt.","Subliminale Werbung als wirksame Beeinflussung gegen den Willen darstellen (Vicary war Betrug).","Den Vampireffekt für verkaufsfördernd halten, obwohl er vom Produkt ablenkt.","Die zentrale und die periphere Route des ELM verwechseln."]}]},{"key":"Block2","label":"Block 2 · Arbeit","color":"#e0a52e","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Arbeit analysieren, gestalten und wirklich motivieren","lernziel":"Verstehen, wie man Arbeit systematisch analysiert und so gestaltet, dass sie gesund, produktiv und motivierend ist, und warum die populären Modelle von Maslow und Herzberg überholt sind, während das Job Characteristics Model trägt.","konzepte":"Arbeitsanalyse (Job Diagnostic Survey, Work Design Questionnaire), Gestaltungskriterien (Hacker & Richter, DIN EN ISO 9241), Job Rotation/Enlargement/Enrichment/Crafting, Arbeitszufriedenheit und ihre Messung, Zwei-Faktoren-Theorie (Herzberg), Maslow-Kritik, Job Characteristics Model (Hackman & Oldham), Flow, Zielsetzungstheorie, Zürcher Modell.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"","body":["Stell dir vor, du sollst einen Arbeitsplatz besser machen, sagen wir ein Callcenter, in dem die Leute reihenweise kündigen. Dein erster Reflex ist vielleicht, sofort etwas zu ändern. Genau das ist der Fehler, den die Arbeitspsychologie vermeiden will. Bevor man etwas verbessern kann, muss man verstehen, woraus die Arbeit überhaupt besteht. Deshalb gelten Arbeitsanalyse und Arbeitsgestaltung als zwei der vornehmsten Aufgaben des Fachs. Das Schöne daran ist, dass hier beide Seiten gewinnen: Eine gut gestaltete Arbeit lässt sich ohne gesundheitliche Schädigung und trotzdem produktiv ausführen. Das war historisch keine Selbstverständlichkeit, denn in der frühen Industrialisierung waren viele Arbeitsplätze menschenunwürdig und zugleich ineffizient. Dass man die Passung zwischen Mensch und Arbeit überhaupt als Problem erkannte, verdanken wir frühen Wirtschaftspsychologen wie Hugo Münsterberg."]},{"h":"Erst analysieren, dann gestalten","body":["Die Arbeitsanalyse folgt dem ganz normalen Forschungsprozess: Fragestellung, Methodenwahl, Datenerhebung, Auswertung, Empfehlung. In der Praxis nimmt man aus Zeit- und Kostengründen meist standardisierte Fragebogen, manchmal auch Beobachtung. Bei der Beobachtung lohnt ein kritischer Blick, denn sie kann zum Deckmantel für übertriebene Leistungskontrolle werden, du kennst das Band am Telefon: dieses Gespräch kann zu Schulungszwecken aufgezeichnet werden.","Zwei Fragebogen solltest du namentlich kennen. Der Job Diagnostic Survey von Hackman und Oldham misst vor allem, wie motivierend eine Arbeit ist, und zwar über Merkmale wie Anforderungsvielfalt, Ganzheitlichkeit, Bedeutung für andere, Autonomie und Rückmeldung. Je höher eine Arbeit auf diesen Merkmalen liegt, desto motivierender ist sie. Der neuere Work Design Questionnaire von Morgeson und Humphrey erfasst zusätzlich soziale Merkmale wie Unterstützung und kontextuelle wie Ergonomie. Merk dir an dieser Stelle eine Kleinigkeit, die später zum Aha-Moment wird: Genau dieselben Tätigkeitsmerkmale begegnen uns gleich wieder bei der Frage, was motiviert. Das ist kein Zufall, sondern die rote Linie dieses Kapitels."]},{"h":"Gestalten heißt, Schäden verhindern und Aufgaben gut zuschneiden","body":["Wenn man verstanden hat, woraus die Arbeit besteht, kann man sie gestalten. Hacker und Richter nennen dafür vier Kriterien, die du dir als aufsteigende Treppe merken kannst: Die Arbeit muss erstens überhaupt ausführbar sein, sie darf zweitens nicht schädigen, etwa durch Lärm oder Schadstoffe, sie soll drittens nicht beeinträchtigen, etwa durch Überforderung oder Monotonie, und sie soll viertens sogar die Persönlichkeit fördern. Wichtig ist die Haltung dahinter: Korrektive Gestaltung, also bestehende Mängel beheben, ist gut, aber präventive Gestaltung, also Schäden gar nicht erst entstehen lassen, ist besser.","Gestaltung betrifft nicht nur die Umgebung, sondern auch die Aufgabe selbst. Die Norm DIN EN ISO 9241 nennt sieben Kriterien guter Aufgaben, und wenn du sie liest, erkennst du die JDS-Merkmale wieder: Benutzerorientierung, Vielseitigkeit, Ganzheitlichkeit, Bedeutsamkeit, Handlungsspielraum, soziale Rückmeldung und Entwicklungsmöglichkeit. Eine gute Aufgabe berücksichtigt also den Menschen, ist abwechslungsreich, als Ganzes erkennbar, sinnvoll, gibt Spielraum, liefert Rückmeldung und lässt wachsen.","Das wirksamste Mittel gegen Monotonie ist, die Struktur der Arbeit zu variieren, und hier musst du vier Begriffe sauber auseinanderhalten, weil sie in der Klausur gern verwechselt werden. Job Rotation bedeutet, dass Mitarbeiter ihre Aufgaben zeitweise tauschen, der Baggerführer und der Kranführer wechseln sich ab. Job Enlargement erweitert das Aufgabenfeld quantitativ, also mehr vom Gleichen, der Baggerführer bedient zusätzlich den Kran. Job Enrichment erweitert qualitativ, die Aufgaben werden anspruchsvoller, der Baggerführer übernimmt nun auch Wartung und Ausbildung. Job Crafting schließlich gilt als Ideal: Der Stelleninhaber gestaltet seine Arbeit selbst, inhaltlich wie in den sozialen und emotionalen Bezügen. Dass das Grenzen hat, zeigt das Gegenbeispiel des Linienpiloten, bei dem feste Verfahren sicherheitsrelevant sind und Eigenbau unerwünscht ist.",". . ."]},{"h":"Zufriedenheit ist nicht Motivation","body":["Warum dieser ganze Aufwand? Weil gut gestaltete Arbeit zufriedener und motivierter macht. Aber jetzt kommt eine Unterscheidung, die du nicht verwischen darfst: Arbeitszufriedenheit ist die rückblickende Einstellung zur Arbeit, Arbeitsmotivation ist der Antrieb für künftiges Handeln. Beide überlappen sich, sind aber nicht dasselbe.","Weil Arbeitszufriedenheit eine Einstellung ist, misst man sie wie Einstellungen, entweder global mit einem einzigen Item oder mit Skalen, die einzelne Facetten erfassen, etwa Tätigkeit, Lohn, Chef, Kollegen. Das klingt einfach, ist es aber nicht, und der Grund ist lehrreich: Frau Müller liebt das Großraumbüro, weil es Kommunikation erleichtert, Herr Meier fühlt sich vom Lärm gestört. Mittelt man beide, bekommt man einen Wert, der für niemanden gilt. Arbeitszufriedenheit hängt eben nicht nur von der Situation ab, sondern auch von der Person."]},{"h":"Herzberg: zwei Dimensionen statt einer Skala","body":["Die prominenteste Idee zur Arbeitszufriedenheit stammt von Herzberg. Seine Zwei-Faktoren-Theorie behauptet etwas Überraschendes: Zufriedenheit und Unzufriedenheit liegen nicht auf einer Skala von schlecht bis gut, sondern sind zwei unabhängige Dimensionen. Die eine wird von Motivatoren bestimmt, das sind inhaltliche Dinge wie Sinn, Verantwortung und Entfaltung, sie können Zufriedenheit erzeugen. Die andere wird von Hygienefaktoren bestimmt, das sind Kontextdinge wie Gehalt, Sicherheit und Führungsstil, sie können Unzufriedenheit verhindern. Die entscheidende Konsequenz: Wenn du nur die Hygienefaktoren in Ordnung bringst, machst du die Leute höchstens nicht unzufrieden, aber noch lange nicht zufrieden, das gelingt erst über die Motivatoren.","So einleuchtend das ist, du musst die Kritik mitdenken, denn sie ist klausurrelevant: Empirisch ließ sich die Theorie kaum bestätigen, und inhaltlich stimmt sie nicht für alle, denn für manche Menschen ist Lohn sehr wohl ein Motivator. Herzbergs bleibender Verdienst ist der Hinweis, dass Menschen nicht nur für Geld arbeiten. Und noch ein Zusammenhang über den Block hinaus: Dieses Zwei-Faktoren-Denken ist die Wurzel des Kano-Modells aus dem Konsum-Block, dort entsprechen die Basismerkmale den Hygienefaktoren und die Begeisterungsmerkmale den Motivatoren."]},{"h":"Maslow: schönes Bild, falsche Theorie","body":["Fast jeder kennt die Maslow-Pyramide, und genau das ist ihr Problem. Maslow hat sie nie als Pyramide gezeichnet und auch nicht zur Erklärung von Arbeitsmotivation gedacht. Sie behauptet, Motive seien hierarchisch geordnet, von physiologischen unten bis zur Selbstverwirklichung oben, und höhere Motive würden erst aktiv, wenn die niederen befriedigt sind. Das klingt vernünftig, stimmt aber nicht, und das ist ein ausdrückliches Lernziel: Motive bauen nicht zwingend aufeinander auf, die vorgeschlagenen Motivklassen bilden die menschliche Motivstruktur nicht wirklichkeitsgetreu ab, und empirisch ließ sich das Modell nicht bestätigen. Warum hält es sich trotzdem so hartnäckig? Weil ein anschauliches Bild in geometrischer Form schwer zu verdrängen ist, auch wenn seine ganze Legitimation aus einer guten Gestalt besteht. Die Lehre für dich: Ein eingängiges Schaubild ist noch kein Beleg."]},{"h":"Das Job Characteristics Model: hier schließt sich der Kreis","body":["Die fundierte Alternative ist das Job Characteristics Model von Hackman und Oldham. Es fand empirische Bestätigung und sagt konkret, was eine Tätigkeit motivierend macht. Fünf Kernmerkmale wirken: Anforderungsvielfalt, Ganzheitlichkeit und Bedeutung erzeugen das Erleben von Bedeutsamkeit, Autonomie erzeugt erlebte Verantwortung, und Rückmeldung erzeugt Wissen über die eigenen Resultate. Diese drei psychologischen Erlebniszustände führen dann zu den Wirkungen: hohe intrinsische Motivation, hohe Zufriedenheit, gute Leistung und weniger Fehlzeiten. Ob das gelingt, hängt von Moderatoren ab, vor allem vom Wachstumsbedürfnis der Person, von ihrem Wissen und Können und von der Zufriedenheit mit dem Kontext. Und jetzt der versprochene Aha-Moment: Gemessen wird dieses Modell mit dem Job Diagnostic Survey, also genau dem Analyse-Instrument vom Anfang. Die Vorlesung zeigt das Modell sogar zweimal, einmal als Grundmodell der Arbeitsmotivation und einmal als Grundmodell der Arbeitsanalyse, gemeint ist beide Male dasselbe. Analyse und Motivation sind hier zwei Seiten derselben Medaille.","Zwei weitere Ansätze runden das Bild ab. Die Flow-Theorie von Csikszentmihalyi beschreibt den Zustand optimaler Aktivierung, der sich einstellt, wenn eine Aufgabe angemessen schwierig ist, nicht zu leicht und nicht zu schwer. Daraus folgt etwas Praktisches: Auch Überqualifizierte passen nicht, denn sie sind unterfordert, erleben keinen Flow und bleiben unmotiviert. Die Zielsetzungstheorie von Locke und Latham sagt, dass gute Ziele schwierig, aber erreichbar und klar spezifiziert sein sollen, und dass akzeptierte Ziele zusätzlich motivieren, in der Praxis als Management by Objectives. Wer es genauer mag, findet im Zürcher Modell von Bruggemann eine empirisch besser fundierte Sicht auf Zufriedenheit: Aus einem Soll-Ist-Vergleich entstehen über das Anspruchsniveau sechs verschiedene Formen, von progressiver bis resignativer Zufriedenheit, was zeigt, dass gleich hohe Zufriedenheitswerte qualitativ völlig unterschiedlich zustande kommen können.","Wenn du dieses Kapitel auf einen Kern eindampfst, dann auf diesen: Dieselben fünf Tätigkeitsmerkmale sind zugleich Diagnoseinstrument und Motivationstheorie. Die Klausur fragt hier selten nackte Jahreszahlen ab, sie will Verständnis: Warum ist Maslow überholt, warum trägt das Job Characteristics Model, und wie hängen Analyse, Gestaltung und Motivation zusammen."]}],"raster":[{"kat":"PB","begriff":"Job Diagnostic Survey / Work Design Questionnaire","warum":"Instrumente der Arbeitsanalyse","muss":false,"gew":5,"ktag":"","terms":["Diagnostic","Survey","Work","Design","Questionnaire"]},{"kat":"PB","begriff":"Vier Gestaltungskriterien (Hacker & Richter)","warum":"Ausführbarkeit/Schädigungslosigkeit/Beeinträchtigungsfreiheit/Persönlichkeitsförderlichkeit","muss":false,"gew":5,"ktag":"","terms":["Gestaltungskriterien","Hacker","Richter"]},{"kat":"PB","begriff":"Sieben ISO-Kriterien guter Aufgaben (9241)","warum":"humane Aufgabengestaltung","muss":false,"gew":4,"ktag":"","terms":["ISO-Kriterien","ISO","Kriterien","Aufgaben"]},{"kat":"PB","begriff":"Job Rotation / Enlargement / Enrichment / Crafting","warum":"klassische Verwechslungsgruppe","muss":true,"gew":8,"ktag":"","terms":["Rotation","Enlargement","Enrichment","Crafting"]},{"kat":"PB","begriff":"Zwei-Faktoren-Theorie (Herzberg)","warum":"Motivator vs. Hygienefaktor","muss":true,"gew":9,"ktag":"","terms":["Zwei-Faktoren-Theorie","Faktoren","Theorie","Herzberg"]},{"kat":"PB","begriff":"Maslow-Pyramide (als überholt)","warum":"Lernziel: Kritik begründen","muss":true,"gew":9,"ktag":"","terms":["Maslow-Pyramide","Maslow","Pyramide"]},{"kat":"PB","begriff":"Job Characteristics Model (Hackman & Oldham)","warum":"zentrale, empirisch fundierte Motivationstheorie","muss":true,"gew":10,"ktag":"","terms":["Characteristics","Model","Hackman","Oldham"]},{"kat":"PB","begriff":"Flow / Zielsetzungstheorie / Zürcher Modell","warum":"ergänzende Ansätze","muss":false,"gew":5,"ktag":"","terms":["Flow","Zielsetzungstheorie","Zürcher"]},{"kat":"PK","begriff":"Wirkkette des Job Characteristics Model","warum":"5 Merkmale -> 3 Erlebniszustände -> Outcomes; Moderatoren","muss":true,"gew":10,"ktag":"","terms":["Wirkkette","Characteristics","Model"]},{"kat":"PK","begriff":"Herzberg zweidimensional","warum":"Hygiene beseitigt nur Unzufriedenheit","muss":true,"gew":9,"ktag":"","terms":["Herzberg","zweidimensional"]},{"kat":"PK","begriff":"Maslow-Kritik begründen","warum":"Motive nicht hierarchisch; empirisch nicht bestätigt","muss":true,"gew":9,"ktag":"","terms":["Maslow-Kritik","Maslow","Kritik","begründen"]},{"kat":"PK","begriff":"Job-Begriffe unterscheiden","warum":"Rotation/Enlargement/Enrichment/Crafting trennen","muss":true,"gew":8,"ktag":"","terms":["Job-Begriffe","Begriffe","Job","unterscheiden"]},{"kat":"PZ","begriff":"JDS-Merkmale = JCM-Merkmale","warum":"Analyse und Motivation sind zwei Seiten derselben Medaille","muss":true,"gew":9,"ktag":"","terms":["JDS-Merkmale","JDS","Merkmale","JCM-Merkmale","JCM"]},{"kat":"PZ","begriff":"Herzberg = Wurzel des Kano-Modells (Block 1b)","warum":"blockübergreifendes Verständnis","muss":false,"gew":6,"ktag":"","terms":["Herzberg","Wurzel","Kano-Modells","Kano","Modells","Block"]},{"kat":"PZ","begriff":"Maslow & Herzberg überholt vs. JCM/Zürcher fundiert","warum":"populär vs. belegt","muss":true,"gew":8,"ktag":"","terms":["Maslow","Herzberg","JCM","Zürcher","überholt","fundiert"]},{"kat":"KD","begriff":"Zufriedenheit (rückblickend) vs. Motivation (Antrieb)","warum":"Grundunterscheidung","muss":true,"gew":6,"ktag":"","terms":["Zufriedenheit","Motivation","Antrieb"]},{"kat":"KD","begriff":"Messproblem Arbeitszufriedenheit (Aggregation)","warum":"Müller/Meier-Beispiel","muss":false,"gew":4,"ktag":"","terms":["Messproblem","Arbeitszufriedenheit","Aggregation"]}],"fehler":["Motivator und Hygienefaktor vertauschen: Motivatoren erzeugen Zufriedenheit, Hygienefaktoren verhindern nur Unzufriedenheit.","Maslow oder Herzberg als gültige Theorien darstellen, statt sie als überholt einzuordnen.","Das Job Characteristics Model und den Job Diagnostic Survey nicht verknüpfen (gemessen wird das Modell mit dem JDS).","Job Crafting (selbst gestaltet) mit Job Enrichment (qualitativ erweitert) verwechseln.","Behaupten, gute Hygienefaktoren machten zufrieden, statt nur nicht unzufrieden."]},{"title":"Wenn Arbeit belastet - Stress, Burnout und Sicherheit","lernziel":"Verstehen, wie aus Anforderungen Stress und Burnout entstehen, wie man sie bewältigt und vorbeugt, und warum Arbeitssicherheit im Kern ein psychologisches und kein technisches Problem ist.","konzepte":"Belastung vs. Beanspruchung, Stressoren, Eustress und Distress (Selye), Burnout und Maslach Burnout Inventory, problembezogenes und emotionsbezogenes Coping, Ressourcenkonservierung (Hobfoll), Verhaltens- und Verhältnisprävention, Arbeitssicherheit, menschliche vs. technische Fehler, Systemsicherheit, Sicherheitskultur, Incident Reporting.","lesezeit":"etwa 10 bis 12 Minuten","sections":[{"h":"","body":["Man hört ständig, wir würden immer mehr arbeiten. Das stimmt so nicht, denn in vielen Ländern ist die Arbeitszeit seit den 1950er-Jahren deutlich gesunken. Wenn trotzdem viele über wachsende Last klagen, hat das andere Gründe: die Entgrenzung der Arbeit, die Norm, immer beschäftigt zu wirken, und Kommunikationsmittel, die das Abschalten erschweren. Genau deshalb kümmern sich Organisationen heute im betrieblichen Gesundheitsmanagement darum, wie groß die Belastung ist und wie man ihr begegnet."]},{"h":"Die wichtigste Unterscheidung des Kapitels","body":["Hier liegt der Begriff, den du am sichersten beherrschen musst, weil er die häufigste Verwechslung ist. Belastung meint die objektiven, von außen wirkenden Einflüsse, die Stressoren. Dazu gehören materiell-technische Faktoren wie Lärm und schwere Lasten, soziale wie Streit und Mobbing und personenbezogene wie ungeeignete Bewältigungsstrategien. Beanspruchung dagegen meint die subjektive Reaktion darauf, also Müdigkeit, Konzentrationsschwäche, Rückenschmerzen. Der Clou ist, dass dieselbe Belastung bei verschiedenen Menschen ganz unterschiedliche Beanspruchung erzeugt, je nachdem, mit welchen Fähigkeiten und Eigenschaften jemand ihr begegnet. Selye hat ergänzt, dass Stress nicht nur schlecht sein muss, er unterscheidet Eustress, die nützliche Aktivierung, von Distress, der schädlichen Belastung. Weil die Grenze schmal ist, meint man mit Stress heute meist nur noch die negative Seite."]},{"h":"Burnout: mehr als nur müde","body":["Als Folge dauerhafter Überlastung wird seit Jahren vermehrt Burnout diagnostiziert. Du solltest es über drei Kennzeichen beschreiben können: emotionale Erschöpfung, Depersonalisation, also Zynismus und Abstumpfung gegenüber anderen, und reduzierte Leistungsfähigkeit. Gemessen wird es klassisch mit dem Maslach Burnout Inventory, das genau diese drei Dimensionen abbildet. Es gibt eine Debatte darum, ob Burnout nur ein modisches Wort für die alte Erschöpfungsdepression ist, und tatsächlich etikettieren sich manche vorschnell selbst. Andererseits hat der Begriff das Bewusstsein für die Gefahren eines Zuviel an Arbeit geschärft. Riskant wird es, wenn über lange Zeit zu viel Arbeit mit passiv-defensiven Bewältigungsstrategien beantwortet wird, begünstigt durch geringe Resilienz und Rollenkonflikte, oft schleichend und anfangs unbemerkt."]},{"h":"Bewältigen und vorbeugen","body":["Gegen Belastung helfen Ressourcen, sie wirken wie ein Puffer. Zentral ist der Copingstil, und auch hier musst du zwei Wege trennen. Beim problembezogenen Coping suchst du eine Lösung für die Belastung selbst, sprichst das Problem an oder änderst dein Arbeitsverhalten. Beim emotionsbezogenen Coping veränderst du nur deine eigene Reaktion, durch Verdrängung, Bagatellisierung oder Konsum, was kurzfristig lindert, aber langfristig dysfunktional ist, solange die Ursache bleibt. Hobfoll hat das im Modell der Ressourcenkonservierung zugespitzt: Menschen streben danach, nützliche Ressourcen aufzubauen, und wenn diese schwinden, droht eine Verlustspirale, die sich als Stress äußert. Der Blick verschiebt sich damit von der Belastung auf die Bewältigung. Auf der Vorbeugeseite trennt man Verhaltensprävention, die am Individuum ansetzt, etwa Stresstraining und Sport, von Verhältnisprävention, die die Bedingungen verbessert, etwa Arbeitsgestaltung und gesunde Kantine. Und so banal es klingt, die einfachste wirksame Maßnahme ist Erholung.",". . ."]},{"h":"Wenn Belastung zur Gefahr wird: Arbeitssicherheit","body":["Wenn Last extrem wird, geht es um Leib und Leben, und damit sind wir bei der Arbeitssicherheit. Dass sie wirkt, zeigt ein eindrücklicher Vergleich: Beim Bau des ersten Gotthardtunnels starben fast zweihundert Menschen, beim zweiten, über hundert Jahre später, nur noch neun. Jetzt kommt der entscheidende Punkt, der oft unterschätzt wird: Arbeitssicherheit ist ein psychologisches Feld, denn die meisten Unfälle entstehen nicht durch technische Mängel, sondern durch menschliche Fehler. Auf individueller Ebene spielen Alter und Risikoneigung eine Rolle und eine niedrige Ausprägung im Big-Five-Faktor Verträglichkeit, vermutlich weil sich solche Personen weniger diszipliniert an Regeln halten. Auf organisationaler Ebene wirken Leistungsdruck und eine mangelnde Sicherheitskultur.","Ob aus einer latenten Gefahr eine konkrete Gefährdung wird, hängt von der Informationsverarbeitung ab. Man muss die Gefahr erst wahrnehmen und richtig einordnen, dann das Risiko korrekt einschätzen, was unter Zeitdruck schwerfällt, und schließlich motiviert und fähig sein, es zu vermeiden. Das Tückische ist, dass riskantes Verhalten oft kurzfristig belohnt wird, etwa mit einem früheren Feierabend, weshalb man sicheres Verhalten aktiv belohnen sollte.","In besonders heiklen Bereichen wie Luftfahrt oder Kraftwerken spricht man von Systemsicherheit. Die Grundidee ist, Sicherheit nicht als Zustand zu sehen, sondern als Leistung, die man aktiv herstellt. Dazu baut man mehrere unabhängige Sicherheitsbarrieren auf, sodass beim Durchbrechen einer Barriere die nächste greift, und man pflegt eine Sicherheitskultur, die von Führung und Belegschaft gelebt werden muss. Das vielleicht wichtigste Werkzeug sind Incident-Reporting-Systeme, mit denen gefährliche Vorfälle vertraulich gemeldet werden, ihnen verdankt die Zivilluftfahrt einen Großteil ihrer Sicherheit. Für die Klausur reicht hier ein klarer Dreiklang: Belastung und Beanspruchung sauber trennen, Burnout über seine drei Dimensionen beschreiben und begründen können, warum Sicherheit zuerst eine Frage des Menschen und seiner Kultur ist."]}],"raster":[{"kat":"PB","begriff":"Belastung vs. Beanspruchung","warum":"objektiv vs. subjektiv, häufigste Verwechslung","muss":true,"gew":10,"ktag":"","terms":["Belastung","Beanspruchung"]},{"kat":"PB","begriff":"Eustress / Distress (Selye)","warum":"positiver vs. negativer Stress","muss":false,"gew":4,"ktag":"","terms":["Eustress","Distress","Selye"]},{"kat":"PB","begriff":"Burnout (drei Dimensionen)","warum":"Erschöpfung / Depersonalisation / reduzierte Leistung","muss":true,"gew":8,"ktag":"","terms":["Burnout","Dimensionen"]},{"kat":"PB","begriff":"Maslach Burnout Inventory","warum":"Messinstrument","muss":true,"gew":6,"ktag":"","terms":["Maslach","Burnout","Inventory"]},{"kat":"PB","begriff":"Coping problembezogen vs. emotionsbezogen","warum":"zwei Bewältigungswege","muss":true,"gew":7,"ktag":"","terms":["Coping","problembezogen","emotionsbezogen"]},{"kat":"PB","begriff":"Ressourcenkonservierung (Hobfoll)","warum":"Verlustspirale","muss":false,"gew":5,"ktag":"","terms":["Ressourcenkonservierung","Hobfoll"]},{"kat":"PB","begriff":"Verhaltens- vs. Verhältnisprävention","warum":"Individuum vs. Bedingungen","muss":false,"gew":5,"ktag":"","terms":["Verhaltens-","Verhaltens","Verhältnisprävention"]},{"kat":"PB","begriff":"Systemsicherheit / Sicherheitsbarrieren","warum":"Sicherheit als aktiv hergestellte Leistung","muss":true,"gew":6,"ktag":"","terms":["Systemsicherheit","Sicherheitsbarrieren"]},{"kat":"PB","begriff":"Incident Reporting","warum":"wichtigstes Sicherheitswerkzeug (Luftfahrt)","muss":true,"gew":6,"ktag":"","terms":["Incident","Reporting"]},{"kat":"PK","begriff":"Burnout-Mechanik","warum":"schleichend, defensive Bewältigung, Risikofaktoren","muss":true,"gew":6,"ktag":"","terms":["Burnout-Mechanik","Burnout","Mechanik"]},{"kat":"PK","begriff":"Wirkung der Coping-Arten","warum":"emotionsbezogen kurzfristig hilfreich, langfristig dysfunktional","muss":true,"gew":6,"ktag":"","terms":["Wirkung","Coping-Arten","Coping","Arten"]},{"kat":"PZ","begriff":"Sicherheit ist psychologisch, nicht technisch","warum":"Unfälle meist menschliche Fehler","muss":true,"gew":7,"ktag":"","terms":["Sicherheit","psychologisch","nicht","technisch"]},{"kat":"KD","begriff":"Niedrige Verträglichkeit erhöht Unfallrisiko (Salgado)","warum":"Big-Five-Bezug","muss":false,"gew":4,"ktag":"","terms":["Niedrige","Verträglichkeit","Unfallrisiko","Salgado","erhöht"]},{"kat":"KD","begriff":"Gotthard-Vergleich (fast 200 vs. 9 Tote)","warum":"Wirksamkeit von Sicherheit","muss":false,"gew":3,"ktag":"","terms":["Gotthard-Vergleich","Gotthard","Vergleich","Tote"]}],"fehler":["Belastung und Beanspruchung vertauschen: Belastung ist der objektive Stressor, Beanspruchung die subjektive Reaktion.","Eustress und Distress vertauschen (nützliche vs. schädliche Aktivierung).","Burnout nur als Müdigkeit beschreiben und Depersonalisation sowie reduzierte Leistung weglassen.","Arbeitsunfälle vor allem technisch erklären, obwohl meist menschliche Fehler die Ursache sind.","Problembezogenes und emotionsbezogenes Coping verwechseln."]},{"title":"Zusammen arbeiten und sich selbst führen","lernziel":"Verstehen, wann Gruppenarbeit nützt und wann sie schadet, was Unternehmer erfolgreich macht und wie man sich selbst realistisch steuert, mit besonderem Blick auf die psychologischen Verzerrungen, die dabei im Weg stehen.","konzepte":"Gruppenarbeit als soziotechnisches System, Vor- und Nachteile, Gruppendenken (Janis), soziales Faulenzen, Trittbrettfahren, Sucker-Effect, optimale Gruppengröße, Romantik des Teams, Teamdesign und Teambuilding, Unternehmertum und Selbstständigkeit, Unternehmerpersönlichkeit, unternehmerische Findigkeit/Orientierung/Business Plan, Überoptimismus und Optimism Bias, Selbstmanagement, SMART-Ziele, Planning Fallacy.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"","body":["Diese drei Themen wirken auf den ersten Blick zusammengewürfelt, haben aber einen gemeinsamen Nenner: Es geht überall darum, sich und andere realistisch zu steuern, und zwar gegen psychologische Verzerrungen, die uns systematisch täuschen. Behalte diesen roten Faden im Kopf, dann fällt der Rest leichter."]},{"h":"Gruppenarbeit: Regelfall, nicht Wundermittel","body":["Der Mensch ist seit jeher ein soziales Wesen, und genau genommen ist die isolierte Einzelarbeit der Sonderfall, ein Erbe der Industrialisierung, die Arbeit in kleinste, monoton abzuleistende Teile zerlegte. Die Wiederentdeckung der Gruppenarbeit begann mit den Hawthorne-Studien und mit Untersuchungen des Tavistock-Instituts, die zeigten, dass Arbeitsgruppen zufriedener, sicherer und effizienter waren. Daraus entstand die Sicht der Arbeit als soziotechnisches System, in dem technische und soziale Faktoren zusammenwirken, und es folgte ein regelrechter Hype um teilautonome Arbeitsgruppen, den Kritiker später als Managementmode verspotteten.","Heute sieht man es nüchterner: In der Produktion ist Gruppenarbeit der Einzelarbeit überlegen, sofern die Voraussetzungen stimmen, in Management und Verwaltung ist sie umstritten. Um zu verstehen, warum, teilt man Vor- und Nachteile in zwei Bereiche. Bei der Informationsverarbeitung kann eine Gruppe mehr Wissen aufnehmen, aber das Wissen kann auch verpuffen, berühmtes Beispiel ist das Brainstorming, bei dem die Gruppe oft schlechter ist als die Summe der Einzelnen. Manchmal verhindert die Gruppe sogar die richtige Lösung, denn wenn nur eine Person sie kennt, setzt sie sich meist nicht durch. Im Extremfall kippt das in Gruppendenken, also die nachteilige Anpassung der eigenen Meinung an die erwartete Gruppenmeinung, begünstigt durch Abschottung, Homogenität und das Streben nach Einmütigkeit.","Bei der Motivation ist die Bilanz ähnlich zwiespältig. Gruppenarbeit macht oft mehr Spaß und befriedigt soziale Bedürfnisse, aber es drohen drei Motivationsverluste, die du genau auseinanderhalten musst. Trittbrettfahren ist das bewusste Sich-weniger-Anstrengen. Soziales Faulenzen ist der unbewusste Leistungsabfall, einfach weil andere da sind. Der Sucker-Effect ist subtiler: Wer glaubt, andere seien Trittbrettfahrer, senkt die eigene Leistung, um nicht der Dumme zu sein, der ausgebeutet wird. Bei komplexen Aufgaben gilt eine Gruppe von etwa fünf Personen als günstig, weil sich die Beiträge dann gut abstimmen lassen.","Daraus folgt eine ernüchternde Einsicht, die Allen und Hecht als Romantik des Teams bezeichnet haben: Die Leistungsfähigkeit von Teams wird oft sozialromantisch überhöht, der wahre Nutzen ist häufig sozio-emotional, nicht leistungsbezogen, und gerade in Verwaltung und Management werden zu oft Teams gebildet. Das heißt nicht, dass Teams schlecht sind, aber sie sind kein Selbstläufer. Man kann nachhelfen, über Teamdesign, also die kluge Zusammensetzung, und über Teambuilding, also die Entwicklung durch Gespräche und gemeinsame Aktivitäten. Eine zufällig zusammenarbeitende Gruppe ist eben noch kein Team.",". . ."]},{"h":"Unternehmertum: keine Gene, aber Verzerrungen","body":["Wechseln wir die Perspektive vom Team zur einzelnen Unternehmerin. Zuerst die Begriffe: Unternehmertum bezeichnet die Einstellung, innovativ und ökonomisch klug neue Geschäftsmöglichkeiten zu finden und zu nutzen, Selbstständigkeit dagegen den unabhängigen Erwerbsstatus. Beide gehen oft Hand in Hand. Die alte Frage, ob es eine angeborene Unternehmerpersönlichkeit gibt, wurde lange verneint, und auch heute gilt: Die Big Five allein genügen nicht. Metaanalysen von Frese und Gielnik zeigen aber eine Reihe begünstigender Merkmale, etwa Selbstwirksamkeit, Leistungsmotivation, Eigeninitiative, Stresstoleranz und eine internale Kontrollüberzeugung.","Statt nur auf Eigenschaften zu schauen, lohnt sich der Blick auf drei unternehmerische Konzepte. Unternehmerische Findigkeit ist die Fähigkeit, Chancen zu entdecken, ohne gezielt gesucht zu haben, sie hängt von Kreativität und Intelligenz ab. Unternehmerische Orientierung ist ein Stück Unternehmenskultur, nämlich autonomes, proaktives und innovatives Handeln mit Risikofreude. Und der Business Plan ist nur scheinbar unpsychologisch, denn aktive Handlungsplanung hängt positiv mit Erfolg zusammen, allerdings nur, wenn der Gründer ihn selbst aufstellt und nicht ein Berater.","Der psychologisch spannendste Punkt ist der Überoptimismus. Ein gewisses Maß an Optimismus ist nötig, sonst würde einen die Höhe der Anforderungen abschrecken, aber er kippt leicht in Overconfidence, das Überschätzen der eigenen Fähigkeiten. Wie verbreitet das ist, zeigt eine Zahl: Ein Drittel von dreitausend befragten Gründern hielt das eigene Scheitern für schlicht unmöglich. Kahneman nennt den Optimism Bias womöglich die bedeutendste der kognitiven Verzerrungen, weil er Segen und Risiko zugleich ist, zu Beginn hilft er über Hürden, später führt er schnell zu Fehlentscheidungen. Genau hier verbindet sich dieser Block mit der Finanzpsychologie, denn dort begegnen dir dieselben Verzerrungen wieder."]},{"h":"Selbstmanagement: gegen die eigene Zeitblindheit","body":["Die moderne Arbeitswelt gibt uns mehr Freiheit und Autonomie, aber die Kehrseite ist, dass wir uns immer öfter selbst führen müssen, statt Anweisungen zu folgen. Selbstmanagement ist definiert als alle Bemühungen, das eigene Verhalten zielgerichtet zu beeinflussen, mit Schwerpunkt auf dem Umgang mit Zeit. Es ruht, anders als viele Ratgeber, auf der Lerntheorie und der kognitiven Verhaltenstherapie. Praktisch läuft es so ab, dass man zuerst das Problem konkret identifiziert, sein Verhalten beobachtet, dann ein Ziel definiert, das nach der Zielsetzungstheorie SMART sein sollte, also spezifisch, messbar, ausführbar, relevant und terminierbar, und schließlich mit Belohnung und Stimuluskontrolle arbeitet, etwa das Handy außer Sichtweite legt. Die wichtigste Transfertechnik ist schlicht die Wiederholung, denn Zielverfolgung wird mit Übung zur Gewohnheit.","Eine besondere Verzerrung verdient den Schluss: die Planning Fallacy von Kahneman und Tversky. Wir unterschätzen systematisch, wie lange Projekte dauern, weil wir uns auf zu wenige Informationen stützen, und ausgerechnet wer besonders schnell sein will, ist noch anfälliger. Das Gegenmittel ist, zuerst zu schätzen, wie lange andere oder ähnliche Projekte gebraucht haben, und Pufferzeiten einzuplanen. Sei skeptisch gegenüber Zeitmanagement-Gurus, deren Methoden oft theoretisch unfundiert sind und nur die Autoren reich machen, ein seriöses Werkzeug ist dagegen der Selbstführungsansatz von Manz mit dosierter Selbstverbalisierung. Und falls du am Sinn von Planung zweifelst: Sie hängt stark mit Erfolg zusammen, reduziert Stress und gibt das beruhigende Gefühl von Kontrolle. Gut geplante Projekte werden vielleicht nicht immer rechtzeitig fertig, aber sicher früher als nicht geplante. Das ist die Pointe des ganzen dritten Teils: Ob Team, Gründung oder eigener Schreibtisch, der Gegner ist immer die eigene Selbsttäuschung, und genau die liebt die Klausur."]}],"raster":[{"kat":"PB","begriff":"Gruppenarbeit als soziotechnisches System","warum":"Hawthorne/Tavistock, Wiederentdeckung","muss":false,"gew":4,"ktag":"","terms":["Gruppenarbeit","System","soziotechnisches"]},{"kat":"PB","begriff":"Gruppendenken (Janis)","warum":"Kerngefahr der Gruppenarbeit","muss":true,"gew":8,"ktag":"","terms":["Gruppendenken","Janis"]},{"kat":"PB","begriff":"Soziales Faulenzen / Trittbrettfahren / Sucker-Effect","warum":"drei Motivationsverluste, exakt zu trennen","muss":true,"gew":8,"ktag":"","terms":["Soziales","Faulenzen","Trittbrettfahren","Sucker-Effect","Sucker","Effect"]},{"kat":"PB","begriff":"Romantik des Teams (Allen & Hecht)","warum":"kritische Bewertung von Teamarbeit","muss":true,"gew":6,"ktag":"","terms":["Romantik","Teams","Allen","Hecht"]},{"kat":"PB","begriff":"Optimale Gruppengröße (etwa 5)","warum":"konkrete prüfbare Zahl","muss":false,"gew":4,"ktag":"","terms":["Optimale","Gruppengröße"]},{"kat":"PB","begriff":"Teamdesign / Teambuilding","warum":"Optimierung von Gruppen","muss":false,"gew":4,"ktag":"","terms":["Teamdesign","Teambuilding"]},{"kat":"PB","begriff":"Unternehmertum vs. Selbstständigkeit","warum":"Definitionen","muss":false,"gew":5,"ktag":"","terms":["Unternehmertum","Selbstständigkeit"]},{"kat":"PB","begriff":"Unternehmerpersönlichkeit (Big Five genügen nicht)","warum":"typische Prüfaussage","muss":true,"gew":8,"ktag":"","terms":["Unternehmerpersönlichkeit","Five"]},{"kat":"PB","begriff":"Findigkeit / Orientierung / Business Plan","warum":"drei unternehmerische Konzepte","muss":true,"gew":7,"ktag":"","terms":["Findigkeit","Orientierung","Business","Plan"]},{"kat":"PB","begriff":"Überoptimismus / Optimism Bias","warum":"Kahneman; Segen und Risiko","muss":true,"gew":7,"ktag":"","terms":["Überoptimismus","Optimism","Bias"]},{"kat":"PB","begriff":"Selbstmanagement + SMART-Ziele","warum":"systematische Selbststeuerung","muss":true,"gew":7,"ktag":"","terms":["Selbstmanagement","SMART-Ziele","SMART","Ziele"]},{"kat":"PB","begriff":"Planning Fallacy (Kahneman & Tversky)","warum":"Zeit systematisch unterschätzen","muss":true,"gew":8,"ktag":"","terms":["Planning","Fallacy","Kahneman","Tversky"]},{"kat":"PK","begriff":"Gruppenarbeit Vor- und Nachteile","warum":"Informationsverarbeitung und Motivation getrennt","muss":true,"gew":7,"ktag":"","terms":["Gruppenarbeit","Vor-","Nachteile"]},{"kat":"PK","begriff":"Selbstmanagement-Ablauf","warum":"Problem -> Beobachtung -> SMART-Ziel -> Belohnung/Stimuluskontrolle -> Wiederholung","muss":true,"gew":6,"ktag":"","terms":["Selbstmanagement-Ablauf","Selbstmanagement","Ablauf"]},{"kat":"PZ","begriff":"Verzerrungen als roter Faden","warum":"Romantik des Teams, Überoptimismus, Planning Fallacy gegen Selbsttäuschung","muss":true,"gew":7,"ktag":"","terms":["Verzerrungen","Faden","roter"]},{"kat":"PZ","begriff":"Optimism Bias & Planning Fallacy -> Kahneman / Block 5","warum":"blockübergreifend","muss":false,"gew":6,"ktag":"","terms":["Optimism","Bias","Planning","Fallacy","Kahneman","Block"]},{"kat":"KD","begriff":"Business Plan wirkt nur, wenn selbst erstellt","warum":"wichtiges Detail","muss":false,"gew":4,"ktag":"","terms":["Business","Plan","wirkt","selbst","erstellt"]},{"kat":"KD","begriff":"Gründungsentscheidung: Geschäftsidee, Motivation, Wissen","warum":"kompensieren fehlende Eigenschaften","muss":true,"gew":6,"ktag":"","terms":["Gründungsentscheidung","Geschäftsidee","Motivation","Wissen"]}],"fehler":["Trittbrettfahren (bewusst) und soziales Faulenzen (unbewusst) verwechseln.","Den Sucker-Effect mit bloßem Faulenzen gleichsetzen, statt als Schutz vor Ausbeutung zu verstehen.","Behaupten, Teams seien generell leistungsüberlegen, und die Romantik des Teams ignorieren.","Die Big Five als ausreichend für die Unternehmerpersönlichkeit darstellen.","Die Planning Fallacy als bewusste Faulheit deuten statt als systematische Fehleinschätzung."]}]},{"key":"Block3","label":"Block 3 · Organisation & Wertorientierung","color":"#c97b3c","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Rahmen, Organisationskultur und -klima","lernziel":"Verstehen, wie AGIL, das Grundmodell der wertorientierten Führung und das 7-S-Modell die Organisation rahmen, und die Organisationskultur mit ihren Funktionen sicher vom Klima abgrenzen.","konzepte":"AGIL-Modell (Parsons), Grundmodell der wertorientierten Unternehmensführung, McKinsey-7-S, Aufbau- und Ablauforganisation, Vision vs. Slogan, Organisationskultur (Definition und sechs Funktionen), Schein-Modell, Organisationsklima, OCI, starke Kultur.","lesezeit":"etwa 13 bis 15 Minuten","sections":[{"h":"Ein Rahmen für die Organisation: AGIL, Grundmodell und 7-S","body":["Block 3 hat zwei Gesichter. Die eine Hälfte ist klassische Organisationspsychologie, also Kultur, Wandel und Führung, die andere ist die finanzielle Wertorientierung mit Kennzahlen wie dem Economic Profit. Beide hängen über eine Leitidee zusammen: Eine Organisation soll so gestaltet und geführt werden, dass sie Wert schafft, wirtschaftlich wie sozial. Beginnen wir mit dem weitesten Rahmen, dem AGIL-Modell von Talcott Parsons, das ausdrücklich als klausurrelevant markiert ist. Es besagt, dass jedes soziale System vier Grundfunktionen erfüllen muss. Adaptation steht für Anpassung und Ressourcenbeschaffung, getragen von Ökonomie und Unternehmen. Goal Attainment steht für Zielerreichung und Steuerung, getragen von Politik und Recht. Integration steht für den sozialen Zusammenhalt, getragen von Schule und Ausbildung. Und Latent Structure Maintenance steht für den Erhalt von Strukturen und Werten, getragen von Wissenschaft, Religion und Kunst. Das Modell ordnet das Unternehmen in einen gesamtgesellschaftlichen Funktionszusammenhang ein. Merke dir die vier Buchstaben samt der tragenden Institutionen, das ist ein gesetzter Punkt.","Eine Stufe konkreter steht das Grundmodell der wertorientierten Unternehmensführung. Es denkt in drei verschachtelten Ebenen, der Makroebene der Gesellschaft, der Mesoebene des Unternehmens und der Mikroebene des Individuums, und auf jeder Ebene wirken vier Organisationselemente: Kultur, Sozialisation, Politik und Ressourcen. Das Unternehmen sitzt also eingeklemmt zwischen den externen Erwartungen von außen und den internen Ansprüchen von innen. Der Leitsatz dazu lautet structure follows strategy, die Struktur folgt also der Strategie. Wie man Strategie dann mit der Organisation umsetzt, beschreibt das McKinsey-7-S-Modell mit seinen sieben Elementen Strategy, Structure, Systems, den Shared Values im Zentrum, Skills, Staff und Style. Verwechsle dieses 7-S-Modell nicht mit dem Michigan-Modell aus Block 4.","Zur Struktur selbst gehört die Unterscheidung von Aufbau- und Ablauforganisation. Die Aufbauorganisation ist die statische Frage, wer wofür zuständig ist, mit den drei Grundstrukturen Hierarchie, Matrix und vollständige Vernetzung. Die Ablauforganisation ist die dynamische Frage nach der Reihenfolge der Prozesse. Und schließlich braucht ein Unternehmen eine Vision. Sie wird nach vier Kriterien beurteilt, sie soll richtungsweisend, plausibel, anspornend und prägnant sein, und Saint-Exupéry hat ihr Wesen im Bild der Sehnsucht nach dem endlosen Meer gefasst. Verwechsle die Vision nicht mit dem Slogan: Die Vision ist die interne Sehnsucht, etwa Nikes Crush Adidas, der Slogan die externe Werbebotschaft, Nikes Just do it."]},{"h":"Organisationskultur: Definition und sechs Funktionen","body":["Jetzt zum vielleicht prüfungswichtigsten Begriff des Blocks, denn die Organisationskultur sollst du laut Notiz mit Definition und allen sechs Funktionen auswendig wiedergeben können. Die Definition: Die Organisationskultur ist ein über die Zeit gewachsenes System aus Regeln, Normen, Werten und typischen Verhaltensweisen, das meist unbewusst wirkt, das Verhalten stark beeinflusst und sich nur schwer messen und verändern lässt. Kauffeld nennt sechs Funktionen, und die solltest du als Liste parat haben: die Abgrenzung gegenüber anderen Organisationen, die Identitätsstiftung im Sinne eines Wir-Gefühls, die Förderung der Bindung, die Stabilität des Systems, die Vermittlung von Verhaltensmaßstäben und die Sozialisation neuer Mitglieder.","Wie Kultur aufgebaut ist, zeigt das Schein-Modell mit drei Ebenen. Ganz oben die Artefakte, das sichtbare Look and Feel, darunter die Werte, und ganz unten die grundlegenden Annahmen, die kaum noch bewusst sind. Diese Grundannahmen gliedern sich nach Nerdinger in vier Bereiche: die Beziehung zur Umwelt, die Natur der Wirklichkeit, die Natur der menschlichen Tätigkeit, also Handeln gegen Abwarten, und die Natur der menschlichen Beziehungen, also kooperativ gegen individualistisch. Verwechsle die drei Ebenen nicht mit den vier Bereichen der Grundannahmen."]},{"h":"Klima ist nicht Kultur","body":["Eng verwandt, aber klar zu trennen ist das Organisationsklima. Es ist die längerfristige psychologische Wetterlage eines Betriebs, also die Umgangsformen, die gemeinsam erlebte Stimmung und der Aktivierungsgrad, mit den Facetten affektiv, kognitiv und instrumentell nach Ostroff. Der entscheidende Unterschied, der gern abgefragt wird: Das Klima ist bewusst wahrnehmbar und relativ überdauernd und lässt sich deshalb leicht messen, etwa per Mitarbeiterbefragung, und auch gestalten. Die Kultur dagegen bleibt unterschwellig und unbewusst, bildet sich langsam und ist schwer zu operationalisieren und zu verändern. Historisch stammt die Kultur aus der anthropologischen Betrachtung, das Klima aus der Human-Relations-Bewegung. Eine starke Kultur hat im Übrigen zwei Seiten: Sie schafft Orientierung, Motivation und gute Kommunikation, kann aber auch ausgrenzen und mit wachsender Größe in Subkulturen zerfallen. Ein verbreitetes Messinstrument ist das Organizational Culture Inventory, das anonym zwölf Verhaltenssets in den drei Stilen konstruktiv, passiv-defensiv und aggressiv-defensiv erfasst."]}],"raster":[{"kat":"PZ","begriff":"AGIL-Modell (Parsons): vier Funktionen und Institutionen","warum":"[K!] Folie 44, gesellschaftlicher Funktionsrahmen","muss":true,"gew":9,"ktag":"K!","terms":["AGIL-Modell","AGIL","Parsons","Funktionen","Institutionen"]},{"kat":"PB","begriff":"Organisationskultur: Definition und sechs Funktionen","warum":"[K!] auswendig (Notion VL 22.04)","muss":true,"gew":10,"ktag":"K!","terms":["Organisationskultur","Definition","Funktionen"]},{"kat":"PB","begriff":"Organisationskultur vs. Organisationsklima","warum":"Kultur unbewusst/schwer messbar, Klima bewusst/messbar","muss":true,"gew":8,"ktag":"","terms":["Organisationskultur","Organisationsklima"]},{"kat":"PK","begriff":"Schein-Modell: drei Ebenen (Artefakte, Werte, Grundannahmen)","warum":"nicht mit den vier Bereichen der Annahmen verwechseln","muss":true,"gew":6,"ktag":"","terms":["Schein-Modell","Schein","Ebenen","Artefakte","Werte","Grundannahmen"]},{"kat":"PK","begriff":"Grundmodell wertorientierte Führung (Makro/Meso/Mikro)","warum":"vier Elemente, structure follows strategy","muss":false,"gew":5,"ktag":"","terms":["Grundmodell","Führung","Makro","Meso","Mikro","wertorientierte"]},{"kat":"KD","begriff":"McKinsey 7-S; Aufbau- vs. Ablauforganisation","warum":"strukturelles Grundgerüst","muss":false,"gew":4,"ktag":"","terms":["McKinsey","Aufbau-","Aufbau","Ablauforganisation"]},{"kat":"KD","begriff":"Vision: vier Kriterien, Abgrenzung zum Slogan","warum":"Saint-Exupéry; Nike","muss":false,"gew":4,"ktag":"","terms":["Vision","Kriterien","Abgrenzung","Slogan"]},{"kat":"KD","begriff":"OCI und starke Kultur (Chancen und Kehrseiten)","warum":"Subkulturen mit wachsender Größe","muss":false,"gew":3,"ktag":"","terms":["OCI","Kultur","Chancen","Kehrseiten","starke"]}],"fehler":["Organisationskultur und -klima gleichsetzen: Kultur ist unbewusst und schwer messbar, Klima bewusst und gestaltbar.","Die drei Schein-Ebenen mit den vier Bereichen der Grundannahmen vermischen.","Das 7-S-Modell mit dem Michigan-Modell aus Block 4 verwechseln.","Vision und Slogan gleichsetzen (interne Sehnsucht vs. externe Werbebotschaft).","Bei AGIL die tragenden Institutionen weglassen."]},{"title":"Wandel, Führung, Wissen und Partizipation","lernziel":"Verstehen, wie sich Organisationsentwicklung und Change Management unterscheiden, wie Wandel nach Lewin und Kotter abläuft und welche Führungsansätze und Beteiligungsformen das Lehrbuch trennt.","konzepte":"Organisationsentwicklung vs. Change Management, Lewins drei Phasen, Kotters acht Stufen, vier Führungsansätze, klassische Führungsstile, Reifegradmodell, transformationale und transaktionale Führung, MbO und SMART, Wissensmanagement und Münchner Modell, Partizipation und Empowerment.","lesezeit":"etwa 13 bis 15 Minuten","sections":[{"h":"Wandel gestalten: OE gegen Change Management","body":["Organisationen müssen sich verändern, und dafür gibt es zwei Schulen, deren Unterschied du sicher beherrschen solltest. Die Organisationsentwicklung, kurz OE, ist die planvolle, langfristige Weiterentwicklung einer Organisation, die die Betroffenen direkt beteiligt, humanistisch ausgerichtet ist, das Wohlbefinden ernst nimmt und sowohl von oben als auch von unten getragen wird, meist ausgelöst von internen Anstößen. Sie ist eher Prozessberatung als Inhaltsberatung. Das Change Management dagegen setzt auf externe Berater, orientiert sich an ökonomischen Kennzahlen wie Kosten und Produktivität, ist projektgetrieben und läuft top-down, oft ausgelöst von externem Druck, mit der größeren Gefahr wenig sozialverträglicher Maßnahmen. Merke: OE beteiligt und ist langfristig-humanistisch, Change Management ist ökonomisch-projektgetrieben und radikaler.","Den Ablauf von Wandel beschreiben zwei Modelle, die du nicht vermischen solltest. Lewins Phasenmodell ist deskriptiv und kennt drei Phasen: das Unfreezing, also das Auftauen und Aufbrechen alter Strukturen, das Moving als eigentliche Veränderung und das Refreezing als Verfestigung. Gerade das Auftauen ist laut Notiz zentral, denn ohne es verpufft jede Veränderung. Kotters Modell ist managementorientiert und kennt acht Stufen, deren Reihenfolge gern vertauscht wird: erstens Dringlichkeit erzeugen, zweitens eine Führungskoalition bilden, drittens eine Vision entwickeln, viertens sie kommunizieren, fünftens Hindernisse beseitigen, sechstens kurzfristige Erfolge definieren, siebtens diese konsolidieren und weiter anstoßen, achtens die Veränderung in der Kultur verankern. In der Praxis kombiniert man beide: Lewins Auftauen entspricht Kotters ersten vier Stufen, das Moving den Stufen fünf und sechs, das Refreezing den Stufen sieben und acht."]},{"h":"Führung: vier Ansätze und die wichtigen Stile","body":["Die Personalführung will Menschen durch orientierende, unterstützende und motivierende Interaktion dazu befähigen und bewegen, ihr Bestes für die Organisationsziele zu geben, im Unterschied zur Unternehmensführung, die das Unternehmen als Ganzes ausrichtet. Das Lehrbuch ordnet die Führungsforschung in vier Gruppen. Der eigenschaftsorientierte Ansatz geht von stabilen Persönlichkeitseigenschaften aus, der alte Great-Man-Gedanke; heute sind einige Zusammenhänge bestätigt, etwa Extraversion, Intelligenz und vor allem Eigenschaften, die in Stresssituationen stabil bleiben, also emotionale Resilienz, aber schwächer als früher gedacht. Der verhaltensorientierte Ansatz beschreibt erlernbare Führungsstile, von autoritär über partizipativ bis laissez-faire; mitarbeiterorientierte Stile hängen stärker mit Zufriedenheit zusammen, ohne klaren Erfolgsvorteil. Der situationsorientierte Ansatz betont die Lage, sein bekanntester Vertreter ist das Reifegradmodell von Hersey und Blanchard, das den Stil an den Reifegrad aus Motivation und Fähigkeit anpasst: bei geringer Reife telling, bei mittlerer selling und participating, bei hoher delegating, intuitiv plausibel, empirisch aber dünn. Der interaktionsorientierte Ansatz schließlich rückt das Zusammenspiel von Führendem und Mitarbeiter in den Blick.","Aus diesem letzten Ansatz stammt die häufig geprüfte Unterscheidung von transformationaler und transaktionaler Führung. Die transformationale Führung nach Bass inspiriert und begeistert über eine Vision und hat vier Dimensionen: inspirierende Motivierung, intellektuelle Stimulierung, individuelle Mitarbeiterorientierung und idealisierter Einfluss. Die transaktionale Führung ist dagegen nüchterne Leistung gegen Gegenleistung über Zielvereinbarung, Kontrolle und Belohnung oder Strafe, treffend illustriert durch den Satz, solange die Zahlen stimmen, könne man machen, was man wolle. Eng damit verbunden ist das Management by Objectives, bei dem man mit jedem Mitarbeiter persönliche Ziele vereinbart, die in Summe den Unternehmenserfolg ergeben. Die Ziele sollen SMART sein, also spezifisch, messbar, ausführbar, relevant und terminierbar, wobei gerade das T beantwortet, wann ein Ziel überhaupt beendet ist."]},{"h":"Wissen und Beteiligung","body":["Zwei kürzere, aber prüfbare Themen runden die Organisationsseite ab. Das Wissensmanagement ist der planvolle, gesteuerte Umgang mit dem Wissen einer Organisation und umfasst vier Schritte: Identifikation, Speicherung, Nutzbarmachung und Aktualisierung, wobei die Nutzbarmachung der schwierigste ist. Das Münchner Modell von Reinmann-Rothmeier nennt entsprechend vier Aspekte: Wissensgenerierung, Wissensrepräsentation, Wissensnutzung und Wissenskommunikation. Die zentrale Einsicht: Wissensmanagement ist mehr Psychologie als Technik, denn Wikis und Intranets nützen nichts, wenn die Wissensträger nicht teilen wollen, etwa aus Rivalität oder aus Angst, sich überflüssig zu machen. Es ist im Kern eine Frage der Organisationskultur. Schließlich die Partizipation: Man unterscheidet die indirekte, formell über Betriebsräte geregelte Beteiligung von der direkten, eher informellen und psychologisch interessanteren Beteiligung im eigenen Arbeitsbereich. Partizipation steigert Leistung, Zufriedenheit und Akzeptanz, kann aber auch Konflikte und langsamere Entscheidungen bringen. Das Empowerment ist eine besondere, von der Führungskraft ausgehende Form direkter Partizipation durch Delegation verantwortungsvoller Aufgaben."]}],"raster":[{"kat":"PB","begriff":"OE vs. Change Management","warum":"beteiligend/humanistisch vs. ökonomisch/top-down","muss":true,"gew":8,"ktag":"","terms":["Change","Management"]},{"kat":"PK","begriff":"Lewin: drei Phasen (Unfreeze, Moving, Refreeze)","warum":"[K] das Auftauen ist zentral","muss":true,"gew":7,"ktag":"K","terms":["Lewin","Phasen","Unfreeze","Moving","Refreeze"]},{"kat":"PZ","begriff":"Transformationale (4 Dimensionen) vs. transaktionale Führung","warum":"häufig geprüfte Unterscheidung","muss":true,"gew":8,"ktag":"","terms":["Transformationale","Dimensionen","Führung"]},{"kat":"PB","begriff":"Vier Führungsansätze (Eigenschaft, Verhalten, Situation, Interaktion)","warum":"Kernstruktur von Kap. 8.3","muss":true,"gew":7,"ktag":"","terms":["Führungsansätze","Eigenschaft","Verhalten","Situation","Interaktion"]},{"kat":"PK","begriff":"MbO und SMART","warum":"[K] T = terminierbar","muss":true,"gew":6,"ktag":"K","terms":["SMART"]},{"kat":"KD","begriff":"Kotter: acht Stufen (Reihenfolge)","warum":"Reihenfolge wird gern vertauscht","muss":false,"gew":5,"ktag":"","terms":["Kotter","Stufen","Reihenfolge"]},{"kat":"KD","begriff":"Reifegradmodell (Hersey/Blanchard)","warum":"Stil
