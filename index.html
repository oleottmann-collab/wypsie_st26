agement","Aldi"]},{"kat":"PZ","begriff":"Geschäftsmodell NICHT über Produkt/Markt, sondern über Nutzen","warum":"Häufigster Denkfehler; der Kern von Stählers Definition.","muss":true,"gew":8,"ktag":"","terms":["Geschäftsmodell","NICHT","Produkt","Markt","Nutzen","sondern"]},{"kat":"KD","begriff":"Umsatz sofort, Zahlung an Lieferanten erst nach ca. 90 Tagen","warum":"Konkreter Mechanismus; rund 370 Mio Euro Umsatz pro Tag.","muss":true,"gew":7,"ktag":"","terms":["Umsatz","Zahlung","Lieferanten","Tagen","sofort","erst"]},{"kat":"KD","begriff":"Kapitalpool ca. 30 Mrd Euro / Geldeinsammelstelle","warum":"Pointe des Falls; sogar Frage nach Giralgeldschöpfung.","muss":true,"gew":6,"ktag":"","terms":["Kapitalpool","Euro","Geldeinsammelstelle"]},{"kat":"PK","begriff":"Drei Leitfragen (welcher Nutzen / wie erbracht / wie Geld)","warum":"Merkhilfe für die drei Komponenten.","muss":true,"gew":6,"ktag":"","terms":["Leitfragen","Nutzen","Geld"]},{"kat":"PB","begriff":"Dynamic Capabilities (Teece)","warum":"Fähigkeit zur laufenden Anpassung an Marktveränderungen (Taylor Swift).","muss":false,"gew":5,"ktag":"","terms":["Dynamic","Capabilities","Teece"]},{"kat":"PK","begriff":"Plattformökonomie: Spotify vs OnlyFans","warum":"Gleiche Reichweite, völlig verschiedene Monetarisierung (Aufmerksamkeitsökonomie).","muss":false,"gew":5,"ktag":"","terms":["Plattformökonomie","Spotify","OnlyFans"]}],"fehler":["Geschäftsmodell über das Produkt definieren: Genau das ist der Fehler; es wird über den gestifteten Nutzen definiert.","Produkt in die Value Proposition stecken: Produkt und Markt gehören in die Wertschöpfungsarchitektur.","Working Capital als bloßen Preisvorteil deuten: Es ist der Zahlungsrhythmus: Geld sofort herein, spät hinaus, dazwischen investierbar.","Aldi-Zahlen falsch erinnern: Zahlungsziel rund 90 Tage, Kapitalpool rund 30 Mrd, Umsatz rund 370 Mio pro Tag."]},{"title":"Der Streit um die Spielregeln und die Frage nach Ethik","lernziel":"Du verstehst den Grundkonflikt zwischen Keynes und Hayek samt seinen institutionellen Folgen, kannst ihn auf heutige Debatten anwenden und beurteilst unternehmerisches Handeln mit dem Dreiklang aus Legalität, Legitimität und Ethik am Fall Theranos.","konzepte":"Keynes gegen Hayek und ihre Schulen, die makroökonomischen Kenngrößen und neuen Wohlstandsmaße, die Rolle des Finanzsystems, Bretton Woods mit IWF, Weltbank und AIIB, Property Rights und Krisenvergleich, der offene Battle of Ideas, der Fall Theranos sowie Legalität, Legitimität und Ethik mit Microexpressions und der Psychologie der Unehrlichkeit.","lesezeit":"etwa 5 bis 6 Minuten","sections":[{"h":"","body":["Der vielleicht größte wirtschaftspolitische Streit des 20. Jahrhunderts hat zwei Namen, und die Dokumentarfilmreihe Commanding Heights macht ihn anschaulich. Dieses Seminar ist ausdrücklich als klausurrelevant überschrieben, also lohnt es sich, den Gegensatz wirklich zu verstehen und nicht nur zwei Namen zu lernen. John Maynard Keynes steht für die Überzeugung, dass Märkte instabil sein können und der Staat eingreifen soll, indem er die Nachfrage steuert und über antizyklische Fiskal- und Geldpolitik für Vollbeschäftigung und Stabilität sorgt. Diese Richtung verbindet man mit Cambridge und der keynesianischen Schule. Friedrich August von Hayek steht für das genaue Gegenteil: Vertrauen in den freien Markt und in den Preismechanismus als dezentralen Informationsträger, tiefe Skepsis gegenüber zentraler Planung und die Priorität stabilen Geldes. Diese Richtung verbindet man mit der Österreichischen Schule und, über Milton Friedman, mit Chicago und der London School of Economics. Du erkennst hier das Paradigmen-Duell aus Lerntext 1 wieder: zwei geschlossene Weltbilder, die auf dieselben Fragen entgegengesetzte Antworten geben.","Aus diesem Streit folgt zunächst, woran man eine Volkswirtschaft überhaupt misst. Auf Keynes gehen die klassischen makroökonomischen Kenngrößen zurück, mit denen man eine Wirtschaft steuert und beurteilt: die Arbeitslosenquote, das Bruttoinlandprodukt und die Inflationsrate. Heute diskutiert man darüber hinaus neue ökonomische und psychologische Maße, die ein volleres Bild geben sollen, etwa Sicherheit und Finanzstabilität, einen Happiness-Index für die Zufriedenheit, den CO2-Fußabdruck, einen Korruptionsindex und den Human-Development-Index. An dieser Stelle knüpft das Seminar sichtbar an die Glücksforschung und die Nachhaltigkeitsdebatte aus den Blöcken 6 und 7 an. Der Gegensatz zieht sich auch durch das Finanzsystem: Bei Keynes steht die Regulierung im Vordergrund, um Instabilität zu verhindern, während bei Hayek der freie Markt Vorrang hat und stabiles Geld höchste Priorität genießt, mit einer angestrebten Inflation von unter zwei Prozent.","Wie sehr Ideen zu Institutionen werden, zeigt Bretton Woods, die Wirtschaftsordnung für die Nachkriegszeit, an der Keynes beteiligt war. Damals entstanden der Internationale Währungsfonds, dessen Vorsitz traditionell aus Europa kommt, und die Weltbank als Weltentwicklungsbank, deren Vorsitz traditionell die USA stellen. Diese beiden Vorsitze sind ein beliebtes Prüfungsdetail, also merke dir die Zuordnung. Dass diese Ordnung in Bewegung ist, zeigt die Gründung der Asiatischen Infrastrukturinvestmentbank im Jahr 2015, einer Konkurrenzorganisation, die vor allem Russland und China vorantrieben, weil ihnen Reformen der alten Institutionen zu langsam gingen. Damit deutet sich eine neue Blockbildung an. Ein weiteres Schlüsselthema sind die Property Rights, die gesicherten Eigentumsrechte. Ohne die klare, verbriefte Zuordnung, wem was gehört, lässt sich Kapital nicht mobilisieren, und gerade in vielen Entwicklungsländern fehlt diese Grundlage, während Korruption als große Barriere wirkt. Der Krisenvergleich rundet das Bild: Rettungsaktionen für ganze Volkswirtschaften können zur Zerreißprobe werden, denn manche sind too big to fail, andere wiederum too small to bail out.","Der entscheidende Punkt ist, dass dieser Battle of Ideas nicht entschieden ist. Globalisierung, Nachhaltigkeit, Corporate Social Responsibility, Populismus und Fake News halten ihn lebendig, vor dem Hintergrund der Entwicklungen in den USA, Russland, dem Mittleren Osten und China, und die Neue Seidenstraße steht für eine neue Blockbildung. Die wirtschaftspsychologische Konsequenz, die das Seminar zieht, ist klar: Regelungslücken sollte man nachhaltig und sozial füllen, statt den kleinsten gemeinsamen Nenner und den größten Profit zu suchen, und Unternehmen stärker in die Verantwortung nehmen, und zwar entlang von Absatzmarkt, Beschaffungsmarkt und Finanzmarkt.","Damit ist die Brücke zur Ethik geschlagen, und der Fall Theranos macht sie greifbar. Die Gründerin Elizabeth Holmes versprach eine revolutionäre Bluttechnologie, die es nie gab, und wieder erkennst du das Prinzipal-Agent-Modell: Investoren konnten ihre verborgenen Eigenschaften und Absichten nicht durchschauen, bis es zu spät war. Um solches Handeln zu beurteilen, führt das Seminar einen Dreiklang ein, den du nicht vermischen darfst. Legalität bedeutet, dass ein Unternehmen gesetzeskonform handelt und geltendes Recht einhält. Legitimität geht weiter und fragt, ob das Handeln auch berechtigt und akzeptiert ist, im Sinne von Stakeholdern, Gesellschaft und ethischen Erwartungen. Ethik schließlich ist die moralische Bewertung des Handelns selbst. Der Clou liegt darin, dass diese Ebenen auseinanderfallen können: Ein Unternehmen kann legal handeln und trotzdem nicht legitim oder nicht ethisch sein, und genau dieses Auseinanderfallen zerstört Vertrauen. Wie schwer ehrliche Einschätzung fällt, zeigen zwei psychologische Zugänge: die Microexpressions nach Paul Ekman, also winzige, unwillkürliche Gesichtsausdrücke, die echte Emotionen verraten, und die Psychologie der Unehrlichkeit nach Dan Ariely, dessen Würfel- und Matrix-Experimente nahelegen, dass viele Menschen in kleinem Umfang schummeln, solange sie ihr Selbstbild als ehrliche Person bewahren können. Dass ausgerechnet Teile von Arielys Forschung später selbst in die Kritik gerieten, ist eine schöne Schlusspointe, denn sie führt dich genau dorthin zurück, wo Block 8 begann: zur Vorsicht gegenüber Modellen, zur Bedeutung von Falsifizierbarkeit und zu der Einsicht, dass am Ende ein Urteil nötig ist, das kein Modell allein fällen kann."]}],"raster":[{"kat":"PB","begriff":"Keynes: Markt instabil, Staat steuert Nachfrage, Regulierung","warum":"Eine Hälfte des klausurrelevanten Battle of Ideas.","muss":true,"gew":10,"ktag":"","terms":["Keynes","Markt","Staat","Nachfrage","Regulierung"]},{"kat":"PB","begriff":"Hayek: freier Markt, Preismechanismus, stabiles Geld","warum":"Die andere Hälfte; Gegensatz muss klar sein.","muss":true,"gew":10,"ktag":"","terms":["Hayek","Markt","Preismechanismus","Geld"]},{"kat":"PK","begriff":"Legalität, Legitimität, Ethik (Theranos)","warum":"Bewertungsraster für unternehmerisches Handeln.","muss":true,"gew":9,"ktag":"","terms":["Legalität","Legitimität","Ethik","Theranos"]},{"kat":"PZ","begriff":"Ebenen können auseinanderfallen (legal, aber nicht legitim/ethisch)","warum":"Kernlehre des Falls Theranos; Auseinanderfallen zerstört Vertrauen.","muss":true,"gew":8,"ktag":"","terms":["Ebenen","können","auseinanderfallen"]},{"kat":"PK","begriff":"Bretton Woods: IWF (Vorsitz Europa), Weltbank (Vorsitz USA)","warum":"Beliebtes Klausurdetail; Zuordnung der Vorsitze.","muss":true,"gew":8,"ktag":"","terms":["Bretton","Woods","IWF","Vorsitz","Europa","Weltbank","USA"]},{"kat":"PK","begriff":"Makro-Kenngrößen: Arbeitslosenquote, BIP, Inflationsrate","warum":"Gehen auf Keynes zurück; Grundgrößen der Steuerung.","muss":true,"gew":7,"ktag":"","terms":["Makro-Kenngrößen","Makro","Kenngrößen","Arbeitslosenquote","BIP","Inflationsrate"]},{"kat":"PZ","begriff":"Finanzsystem: Keynes Regulierung vs Hayek stabiles Geld (unter 2%)","warum":"Verlängert den Grundgegensatz ins Finanzsystem.","muss":true,"gew":7,"ktag":"","terms":["Finanzsystem","Keynes","Regulierung","Hayek","Geld"]},{"kat":"KD","begriff":"Neue Wohlstandsmaße: Happiness-Index, CO2-Fußabdruck, Korruptionsindex, HDI","warum":"Brücke zur Glücksforschung und Nachhaltigkeit (Block 6/7).","muss":true,"gew":6,"ktag":"","terms":["Wohlstandsmaße","Happiness-Index","Happiness","Index","CO2-Fußabdruck","CO2","Fußabdruck"]},{"kat":"KD","begriff":"AIIB 2015 (Russland und China)","warum":"Konkurrenzorganisation, neue Blockbildung.","muss":true,"gew":6,"ktag":"","terms":["AIIB","Russland","China","2015"]},{"kat":"PB","begriff":"Property Rights","warum":"Ohne gesicherte Eigentumsrechte lässt sich Kapital nicht mobilisieren.","muss":true,"gew":6,"ktag":"","terms":["Property","Rights"]},{"kat":"PB","begriff":"Theranos / Elizabeth Holmes","warum":"Fallanker für die Ethikebenen; wegen Betrugs verurteilt.","muss":true,"gew":6,"ktag":"","terms":["Theranos","Elizabeth","Holmes"]},{"kat":"PZ","begriff":"Battle of Ideas nicht abgeschlossen (CSR, Populismus, Seidenstraße)","warum":"Aktualität; Konsequenz: Regelungslücken sozial füllen, Verantwortung der Unternehmen.","muss":true,"gew":6,"ktag":"","terms":["Battle","Ideas","CSR","Populismus","Seidenstraße","nicht","abgeschlossen"]},{"kat":"KD","begriff":"Schulen: Cambridge/keynesianisch vs Oesterreichisch/Chicago/LSE","warum":"Zuordnung der Denkschulen.","muss":false,"gew":5,"ktag":"","terms":["Schulen","Cambridge","Oesterreichisch","Chicago","LSE"]},{"kat":"KD","begriff":"Microexpressions (Ekman) und Ariely (Unehrlichkeit)","warum":"Verhaltensbeobachtung; Ariely später selbst in Kritik.","muss":false,"gew":4,"ktag":"","terms":["Microexpressions","Ekman","Ariely","Unehrlichkeit"]},{"kat":"KD","begriff":"too big to fail / too small to bail out","warum":"Krisenvergleich.","muss":false,"gew":4,"ktag":"","terms":["fail","small","bail"]}],"fehler":["Keynes und Hayek vertauschen: Keynes steht für Staat und Nachfragesteuerung, Hayek für freien Markt und stabiles Geld.","IWF- und Weltbank-Vorsitz vertauschen: IWF-Vorsitz traditionell Europa, Weltbank-Vorsitz traditionell USA.","Legalität mit Legitimität gleichsetzen: Ein Unternehmen kann legal handeln und trotzdem illegitim oder unethisch sein.","AIIB-Jahr oder Akteure falsch: Gegründet 2015, vor allem auf Betreiben von Russland und China.","Stabiles Geld der falschen Seite zuordnen: Inflation unter zwei Prozent als Priorität ist die Hayek-Position, nicht Keynes."]}]},{"key":"Block9","label":"Block 9 · Konstruktivismus & Ungleichheit","color":"#e2953a","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Die Brille, die wir nicht absetzen können","lernziel":"Du verstehst, was der Konstruktivismus behauptet und was nicht, kannst seine Kerndefinition wiedergeben, erklärst, warum Kommunikation keine Informationsübertragung ist, und leitest daraus die Bedeutung für das Management ab.","konzepte":"Wahrnehmung als Filter (Holzkamp), Kerndefinition des Konstruktivismus (Janich), vier Seiten einer Nachricht (Schulz von Thun), keine übertragene Information (Maturana und Varela), Bedeutung für das Management (Gabler), Grenzen des Konstruktivismus.","lesezeit":"etwa 5 Minuten","sections":[{"h":"","body":["Stell dir vor, du könntest die Welt sehen, wie sie wirklich ist. Der Konstruktivismus, das Beispielparadigma der Wirtschaftspsychologie aus Block 8, behauptet: Das kannst du nicht, und zwar grundsätzlich nicht. Was Menschen von ihrer Umwelt in sich aufnehmen, ist vielfältig gefiltert. Schon bei der Wahrnehmung optischer oder akustischer Signale werden Anteile herausgefiltert oder Gestalten hineininterpretiert, und was durchkommt, hängt von der Bedeutung der Signale für die empfangende Person ab. Bedeutung meint dabei nach Holzkamp das Verhältnis zwischen psychischen Charakteristika und den objektiven Beschaffenheiten der Umwelt. Ob dir der Geruch von frischem Brot auffällt, hängt eben auch davon ab, ob du hungrig bist.","Die Kerndefinition liefert Janich, und sie ist ein Kandidat für die Klausur: Wir sehen die Welt von vornherein niemals so, wie sie wirklich ist, sondern nach Maßgabe unserer Wahrnehmungsfähigkeit, Bedeutung und jeweils konkreter Perspektive. Es werden nicht nur Informationen weggefiltert, sondern durch physiologische, unbewusste oder bewusste Aktivität werden Umweltgegebenheiten überhaupt erst zu ganzheitlichen Objekten gestaltet, also konstruiert. Die erkenntnistheoretische Perspektive, die jede Erkenntnistätigkeit als konstruierende begreift, heißt Konstruktivismus. Merke dir die Konsequenz gleich mit: In deiner Vorstellung, deinem Wissen über die Welt, über andere Menschen und sogar über dich selbst stecken konstruktive Anteile. Wenn Menschen kommunizieren, treffen ihre Konstruktionen aufeinander, es entstehen Narrative, und deshalb hat Storytelling im Management und besonders im Marketing eine so große Bedeutung.","Was Kommunikation unter dieser Annahme bedeutet, zeigen zwei Klassiker. Schulz von Thun unterscheidet vier Seiten einer Nachricht: die Sachebene (worüber ich informiere), die Selbstoffenbarung (was ich von mir kundgebe), die Beziehungsebene (was ich von dir halte) und den Appell (wozu ich dich veranlassen möchte). Die Vorlesung illustriert das mit dem Kapern-Beispiel: Die Frau sagt beim Abendessen Da ist was Grünes! und meint auf der Selbstoffenbarungsebene Ich weiß nicht, was es ist, auf der Beziehungsebene Du wirst es wissen und als Appell Sag mir, was es ist. Der Mann hört aber Mir schmeckt das nicht, Du bist ein mieser Koch und Lass nächstes Mal das Grüne weg, und antwortet gereizt, sie könne ja woanders essen gehen. Gesendet wurde ein Satz, empfangen wurde ein anderer.","Maturana und Varela radikalisieren den Gedanken biologisch: In der Kommunikation gibt es keine übertragene Information. Jede Person sagt, was sie sagt, und hört, was sie hört, gemäß ihrer eigenen Strukturdeterminiertheit; dass etwas gesagt wird, garantiert nicht, dass es gehört wird. Das Phänomen der Kommunikation hängt nicht davon ab, was übermittelt wird, sondern davon, was im Empfänger geschieht. Information wird also nicht von A nach B transportiert, sondern vom Empfänger nach internen Regeln, biologischen Konditionierungen und kulturellen Einbettungen erst erzeugt, heute zunehmend technologievermittelt.","Für das Management ist das keine philosophische Spielerei. Der Konstruktivismus postuliert, dass Wissen nicht das Ergebnis eines Abbildens, sondern eines Erfindens der Wirklichkeit ist. Das Gehirn erzeugt kein fotografisches Abbild, sondern schafft mithilfe der Sinneswahrnehmungen ein eigenes Bild der Welt. Wahr ist, was wahrgenommen wird. Wichtig für die Klausur: Der Konstruktivismus verleugnet die Wirklichkeit nicht. Er behauptet nur, dass Aussagen über die Wirklichkeit dem eigenen Erleben, der eigenen Geschichte und den eigenen beschränkten Wahrnehmungsmöglichkeiten entspringen; er nimmt Abschied von der absoluten Wahrheit. Daraus folgt für die Betriebswirtschaftslehre: Management heißt nicht in erster Linie, die Wirklichkeit richtig zu erkennen und die richtigen Schlüsse zu ziehen. Schon in der Betrachtung der unternehmerischen Wirklichkeit wird diese konstruiert, gestaltet, erfunden. Führungskräfte haben deshalb viele Möglichkeiten, Unternehmen zu entwickeln, denn Management ist letztlich die Konstruktion, Gestaltung beziehungsweise Erfindung von Führung.","Und die Grenzen? Die Vorlesung markiert sie ausdrücklich, wenn auch nur mit einem Videobeispiel ohne Text: Konstruktion findet innerhalb objektiver physischer und biologischer Beschränkungen statt. Wer gegen eine Wand läuft, hat sie nicht falsch konstruiert, sondern übersehen. Genau diese Doppelbewegung, radikale Subjektivität der Erkenntnis bei anerkannter Realität, macht den Ansatz wissenschaftlich anschlussfähig."]}],"raster":[{"kat":"PB","begriff":"Konstruktivismus (Janich): jede Erkenntnistätigkeit als konstruierende","warum":"Kerndefinition des Blocks; Grundlage aller weiteren Themen.","muss":true,"gew":10,"ktag":"","terms":["Konstruktivismus","Janich","jede","Erkenntnistätigkeit","konstruierende"]},{"kat":"PB","begriff":"Wahrnehmung als Filter; Bedeutung (Holzkamp)","warum":"Erklärt, WARUM konstruiert wird: filtern plus hineininterpretieren; Bedeutung als Verhältnis Psyche/Umwelt.","muss":true,"gew":7,"ktag":"","terms":["Wahrnehmung","Filter","Bedeutung","Holzkamp"]},{"kat":"PB","begriff":"Vier Seiten einer Nachricht (Schulz von Thun)","warum":"Prüfbares Modell mit Kapern-Beispiel; zeigt Empfängerkonstruktion.","muss":true,"gew":8,"ktag":"","terms":["Seiten","einer","Nachricht","Schulz","Thun"]},{"kat":"PK","begriff":"Keine übertragene Information; Strukturdeterminiertheit (Maturana/Varela)","warum":"Biologische Radikalisierung; entscheidend ist, was im Empfänger geschieht.","muss":true,"gew":9,"ktag":"","terms":["Keine","übertragene","Information","Strukturdeterminiertheit","Maturana","Varela"]},{"kat":"PK","begriff":"Subjektive Wirklichkeitskonstruktion, keine allgemeingültige Wirklichkeit","warum":"Grundannahme; Basis für Marken, Medien, Management.","muss":true,"gew":8,"ktag":"","terms":["Subjektive","Wirklichkeitskonstruktion","keine","allgemeingültige","Wirklichkeit"]},{"kat":"PZ","begriff":"Bedeutung für das Management: Wissen als Erfinden; Wahr ist, was wahrgenommen wird; Management als Konstruktion von Führung","warum":"Anwendungspointe der Vorlesung (Gabler); typische offene Klausurfrage.","muss":true,"gew":10,"ktag":"K!","terms":["Bedeutung","Management","Wissen","Erfinden","Wahr","wahrgenommen"]},{"kat":"PZ","begriff":"Konstruktivismus verleugnet Wirklichkeit nicht; Abschied von absoluter Wahrheit","warum":"Häufigstes Missverständnis; Grenzen des Ansatzes.","muss":true,"gew":7,"ktag":"","terms":["Konstruktivismus","verleugnet","Wirklichkeit","Abschied","absoluter","Wahrheit"]},{"kat":"KD","begriff":"Narrative und Storytelling in Management und Marketing","warum":"Direkter Folienbegriff; Brücke zu Marken (Teil 4).","muss":false,"gew":4,"ktag":"","terms":["Narrative","Storytelling","Management","Marketing"]}],"fehler":["Konstruktivismus als Leugnung der Realität darstellen: Er bestreitet nur die Erkennbarkeit der Welt an sich, nicht ihre Existenz.","Vier Seiten nur aufzählen, ohne Sender- und Empfängerseite zu trennen: Die Pointe des Kapern-Beispiels ist die Diskrepanz der Deutungen.","Maturana/Varela als Kommunikationstipp missverstehen: Es ist eine biologische These über Strukturdeterminiertheit, kein Ratgeber.","Bedeutung (Holzkamp) vergessen: Wahrnehmung hängt von der Bedeutung der Signale für die Person ab, nicht nur von den Reizen.","Wahr ist, was wahrgenommen wird ohne Management-Kontext zitieren: Der Satz gehört zur Gabler-Passage über Wissen als Erfinden."]},{"title":"Wie soziale Realität gemacht wird","lernziel":"Du kennst die sechs Techniken zur Konstruktion sozialer Realität mit ihren Definitionen, verstehst Choice Blindness und seine Folgen für die Forschung, und kannst an Metaverse, personalisierter Werbung und sozialen Medien zeigen, wie Realitätskonstruktion praktisch aussieht.","konzepte":"Framing, Agenda Setting, Fragmenting, Playing it both ways, Group Think, Confirmation Bias; Choice Blindness (Johansson); Renew-Mülleimer und Walgreens; Scheitern des Metaverse; soziale Medien; Zeugenaussagen; Image (Fichter 6.11); ABC-Regel und Theranos-Kritik; Doing Gender.","lesezeit":"etwa 6 Minuten","sections":[{"h":"","body":["Wenn Wirklichkeit konstruiert wird, kann man sie auch strategisch konstruieren. Die Vorlesung nennt sechs Techniken zur Konstruktion sozialer Realität, und diese Liste solltest du frei aufsagen können. Framing: Frames sind emotional und normativ besetzte, überwiegend unbewusst vermittelte Basisvorstellungen vom Menschen, der Gesellschaft und politischen Aufgaben; sie bilden den Rahmen politischer Öffentlichkeitsarbeit. Agenda Setting: Thematisierung und Themenstrukturierung, ursprünglich aus Medien und Politik, zunehmend wichtig in der Unternehmenskommunikation, intern in der Führung und extern in den Public Relations. Fragmenting: ein Teilaspekt wird herausgegriffen und überakzentuiert, bis ein verzerrtes Gesamtbild entsteht, oder Teilaspekte werden gezielt an verschiedene Gruppen kommuniziert; die Kurzformel aus der Mitschrift lautet: einen Sachverhalt isolieren und positiv rahmen. Playing it both ways: derselbe Sachverhalt, etwa eine Entlassungswelle, wird dem Betriebsrat anders dargestellt als den Aktionären. Group Think: Eine Gruppe an sich kompetenter Personen trifft schlechtere oder realitätsfernere Entscheidungen, weil jede Person ihre Meinung an die erwartete Gruppenmeinung anpasst; am Ende stimmt die Gruppe Dingen zu, die jedes Mitglied allein ablehnen würde; laut Mitschrift unterbleibt vor allem der Widerspruch gegen Vorgesetzte, und der Bezug ist das Asch-Konformitätsexperiment. Confirmation Bias: die Neigung, Informationen so auszuwählen, zu suchen und zu interpretieren, dass sie die eigenen Erwartungen bestätigen, während widersprechende Informationen unbewusst ausgeblendet werden.","Wie wenig wir unsere eigenen Entscheidungen durchschauen, zeigt Choice Blindness. In Petter Johanssons Experimenten wählen Versuchspersonen zwischen zwei Gesichtern; durch einen Kartentrick bekommen sie danach das nicht gewählte Foto in die Hand und begründen dann flüssig eine Wahl, die sie nie getroffen haben, ohne die Vertauschung zu bemerken. Die Mitschrift hält drei Lehren fest. Erstens: Wir konstruieren Sinn post hoc, die Begründung kommt nach der Entscheidung, nicht vor ihr. Zweitens, in Johanssons Worten: know that you don't know yourself, die Selbsteinsicht ist begrenzt. Drittens folgt daraus Vorsicht für die qualitative Forschung: Wer Menschen nach den Gründen ihres Verhaltens fragt, erhält Konstruktionen, keine Abbilder innerer Prozesse; außerdem sind Präferenzen und Urteile manipulierbar.","Die Wirtschaft baut solche Konstruktionen längst in ihre Infrastruktur ein. In London stellte die Firma Renew zu den Olympischen Spielen 2012 zweihundert Hightech-Mülleimer auf, die über Bildschirme gezielte Werbung zeigen: Sie tracken per WLAN die MAC-Adresse vorbeilaufender Smartphones, messen Geschwindigkeit, Entfernung und Verweildauer und erkennen wiederkehrende Passanten; rund 35.000 Euro kostet so ein Gerät. Die US-Kette Walgreens ersetzte Kühlschranktüren durch Screens, die statt der Ware ein digitales Abbild samt Werbung zeigen, was ein Teil der Kundschaft ausdrücklich hasst. In beiden Fällen wird zwischen Mensch und Welt eine individuell zugeschnittene Werberealität geschoben.","Das ehrgeizigste Projekt konstruierter Wirklichkeit ist bisher gescheitert: das Metaverse. Zuckerberg hatte alles auf diese Karte gesetzt und sogar den Firmennamen in Meta geändert, inzwischen ist die Idee weitgehend aufgegeben; die Sparte Reality Labs strich rund zehn Prozent der Stellen, das VR-Geschäft verbuchte 19,1 Milliarden Dollar Jahresverlust, davon 6,2 Milliarden allein im vierten Quartal, und Meta setzt nun auf Extended Reality und KI-Wearables wie die Ray-Ban-Brillen. Warum ging die Wette schief? Erstens war die Technik für eine Verbraucherplattform nicht reif; die Vision der Plattform deckte sich nicht mit dem technologischen Status quo. Zweitens sind VR-Headsets schlicht unbequem: Per Ola Kristensson ließ 2022 in Cambridge Menschen eine komplette 40-Stunden-Woche im virtuellen Arbeitsraum verbringen; sein Fazit: Man kann, aber man wird es hassen; die Teilnehmenden berichteten geringere wahrgenommene Produktivität, mehr Frustration, stärkere Angst, mehr Simulatorkrankheit und stärkere visuelle Ermüdung. Drittens nennt die Vorlesung die Gestaltpsychologie als weiteren Grund: Unsere Wahrnehmung folgt Gestaltprinzipien, die künstliche Welten offenbar nicht überzeugend bedienen.","Sozialen Medien traut die Vorlesung die Konstruktion sozialer Realität im großen Stil zu, mit den Mechanismen Social Proof, Echo-Kammer und Filterblase, Social Norm Compliance, Fear of Missing Out sowie Dopamin und Instant Gratification. Der aktuelle Aufhänger: Australien verbietet als weltweit erstes Land ab dem 10. Dezember 2025 Social-Media-Plattformen wie TikTok, Instagram, Facebook, Snapchat, X, Reddit, YouTube und Twitch für alle unter 16 Jahren; die Plattformen müssen Minderjährige aussperren, sonst drohen Strafen bis 50 Millionen australische Dollar; ausgenommen sind Gaming-Plattformen, Messenger sowie Bildungs- und Gesundheitsangebote. Dass konstruierte Wahrnehmung auch vor Gericht Folgen hat, zeigt das Thema Zeugenaussagen: Erinnerung ist Rekonstruktion, und das Quarks-Sozialexperiment führt vor, wie unzuverlässig sichere Zeugen sein können.","Zwei Ergänzungen runden das Bild. Erstens das Image, das Fichter in Kapitel 6.11 ausdrücklich an die erkenntnistheoretische Grundannahme der Wirtschaftspsychologie bindet: Unser Wissen über die Dinge ist unvollständig und verzerrt. Die Vorlesungsfolie zeigt denselben Bericht über den Preiskampf von Migros und Coop parallel im Boulevardblatt Blick und in der NZZ. Im Experiment wurden inhaltlich identische Artikel je nach Layout völlig unterschiedlich beurteilt: der NZZ-Artikel als seriös, gut recherchiert und glaubwürdig, aber schwer lesbar, der Blick-Artikel als oberflächlich, tendenziös und schlecht recherchiert, aber leicht lesbar. Wir urteilen nach Meinungsbildern, nicht nach Fakten, und Expertise schützt davor nicht. Zweitens die Managementpraxis: Ein Ratgeber empfiehlt dialogorientierte Führung nach der ABC-Regel (Akzeptanz, Beteiligung, Commitment), den Manager als Schleusenwärter, der die Informationsflut kanalisiert, und als Transformator, der Informationen zielgruppenspezifisch übersetzt, sowie das ständige Wiederholen der Kernbotschaft, denn die wiederholte Information prägt sich ein. Die Vorlesung setzt daneben nur zwei Worte: Kritik? Vgl. Theranos. Dieselben Techniken, mit denen man Strategie verankert, können eine Wirklichkeit ohne Substanz erzeugen. Und als Exkurs zeigt Doing Gender, wie tief Konstruktion reicht: Geschlecht ist nach diesem Ansatz nicht etwas, das wir haben, sondern etwas, das wir in jeder Interaktion tun und gemeinsam konstruieren."]}],"raster":[{"kat":"PB","begriff":"Sechs Techniken: Framing, Agenda Setting, Fragmenting, Playing it both ways, Group Think, Confirmation Bias","warum":"Zentrale Aufzählung des Blocks; laut Notion betont.","muss":true,"gew":10,"ktag":"","terms":["Techniken","Framing","Agenda","Setting","Fragmenting","Playing"]},{"kat":"PK","begriff":"Framing (Frames als unbewusste Basisvorstellungen) vs. Agenda Setting (Themenstrukturierung)","warum":"Beide Definitionen wörtlich auf der Folie; Verwechslungsgefahr.","muss":true,"gew":8,"ktag":"","terms":["Framing","Frames","unbewusste","Basisvorstellungen","Agenda","Setting"]},{"kat":"PK","begriff":"Fragmenting (isolieren und positiv rahmen) vs. Playing it both ways (Betriebsrat gegen Aktionäre)","warum":"Unternehmensbezogene Techniken; Beispiel Entlassungen.","muss":true,"gew":8,"ktag":"","terms":["Fragmenting","isolieren","positiv","rahmen","Playing","both"]},{"kat":"PK","begriff":"Group Think (Anpassung an erwartete Gruppenmeinung; Asch; Widerspruch gegen Vorgesetzte unterbleibt)","warum":"Folien-Definition plus Notion-Ergänzung.","muss":true,"gew":8,"ktag":"","terms":["Group","Think","Anpassung","erwartete","Gruppenmeinung","Asch"]},{"kat":"PB","begriff":"Confirmation Bias (Bestätigungsfehler)","warum":"Kognitionspsychologische Definition wörtlich auf der Folie.","muss":true,"gew":7,"ktag":"","terms":["Confirmation","Bias","Bestätigungsfehler"]},{"kat":"PK","begriff":"Choice Blindness (Johansson): Sinn post hoc; know that you don't know yourself; Folgen für qualitative Forschung; Manipulierbarkeit","warum":"Notion-Schwerpunkt; verbindet Konstruktivismus mit Methodenlehre.","muss":true,"gew":9,"ktag":"","terms":["Choice","Blindness","Johansson","Sinn","post","know"]},{"kat":"PK","begriff":"Soziale Medien: Social Proof, Echo-Kammer, Filterblase, Social Norm Compliance, FOMO, Dopamin/Instant Gratification; Australien-Verbot ab 10.12.2025","warum":"Aktualitätsbezug der Vorlesung; plausible Transferfrage.","muss":true,"gew":7,"ktag":"","terms":["Soziale","Medien","Social","Proof","Echo-Kammer","Filterblase"]},{"kat":"PZ","begriff":"Metaverse-Scheitern: Technik nicht reif; VR-Studie (Kristensson: Man kann, aber man wird es hassen); Gestaltpsychologie; 19,1 Mrd. Dollar Verlust","warum":"Ausführlichste Fallstudie des Decks (drei Textfolien).","muss":true,"gew":8,"ktag":"","terms":["Metaverse-Scheitern","Technik","reif","VR-Studie","Kristensson","kann"]},{"kat":"PZ","begriff":"Image (Fichter 6.11): NZZ/Blick-Experiment; Urteil nach Meinungsbildern statt Fakten","warum":"Fichter-Anbindung; Folie verweist ausdrücklich auf Kapitel 6.11.","muss":true,"gew":6,"ktag":"","terms":["Image","Fichter","Blick-Experiment","Urteil","Meinungsbildern","statt"]},{"kat":"KD","begriff":"Renew-Mülleimer (MAC-Tracking, London 2012) und Walgreens-Screens","warum":"Illustrationen personalisierter Werberealität.","muss":false,"gew":4,"ktag":"","terms":["Renew-Mülleimer","MAC-Tracking","London","Walgreens-Screens"]},{"kat":"KD","begriff":"ABC-Regel (Akzeptanz, Beteiligung, Commitment); Schleusenwärter/Transformator; Kritik: vgl. Theranos","warum":"Managementratgeber plus kritische Einordnung.","muss":false,"gew":5,"ktag":"","terms":["ABC-Regel","Akzeptanz","Beteiligung","Commitment","Schleusenwärter","Transformator"]},{"kat":"KD","begriff":"Doing Gender (Hagemann-White; Geschlecht als Tun); Zeugenaussagen (Quarks)","warum":"Exkurse mit Konstruktivismus-Bezug.","muss":false,"gew":4,"ktag":"","terms":["Doing","Gender","Hagemann-White","Geschlecht","Zeugenaussagen","Quarks"]}],"fehler":["Framing und Fragmenting verwechseln: Framing rahmt Grundvorstellungen, Fragmenting zerlegt die Botschaft in Teilaspekte.","Playing it both ways vergessen oder mit Fragmenting gleichsetzen: Es ist die adressatenspezifische Doppel-Darstellung.","Group Think mit Milgram statt Asch verbinden: Es geht um Konformität mit der Gruppenmeinung, nicht um Gehorsam.","Choice Blindness als reinen Wahrnehmungstrick abtun: Die Pointe sind die post-hoc-Begründungen und ihre Folgen für Interviews und qualitative Forschung.","Beim Metaverse nur Zuckerberg nennen: Prüfbar sind die Gründe (Technikreife, Headset-Studie, Gestaltpsychologie) und der Schwenk zu XR/KI-Wearables."]},{"title":"Ungleichheit zwischen Wahrnehmung und Daten","lernziel":"Du kannst die Vermögensverteilung in Deutschland mit den UBS-Zahlen belegen, erklärst den Unterschied zwischen Einkommens- und Vermögensschere, gibst Pikettys These samt empirischer Kritik wieder und entwickelst das KI-Piketty-Szenario mit seinen drei Mechanismen und den Folgen für Deutschland.","konzepte":"Wahrnehmung von Ungleichheit; staatliche Umverteilung; UBS Global Wealth Report 2026; Piketty (Kapitalrendite gegen Wachstumsrate); KI-Piketty-Szenario (Substitution, Kapitalquote, Gini); drei Mechanismen; CalPers-Zitat, Grundeinkommen und Vermögensteuer, G7/G8/G2.","lesezeit":"etwa 6 Minuten","sections":[{"h":"","body":["Der Übergang vom Konstruktivismus zur Ungleichheit ist konsequent, denn auch Ungleichheit ist zuerst ein Wahrnehmungsphänomen. Die Vorlesung verweist auf zwei Videos zur wahrgenommenen und tatsächlichen Verteilung in Deutschland und den USA; der klassische Befund solcher Studien ist, dass Menschen die reale Konzentration massiv unterschätzen. Für Deutschland hält die Mitschrift zwei Punkte fest, die du sauber trennen musst. Bei den Einkommen ist die Schere geringer, als die Rohzahlen nahelegen, weil der Staat kräftig umverteilt; als Größenordnung nennt die Mitschrift rund 50 Cent Umverteilung je verdientem Euro. Beim Vermögen dagegen bleibt die Konzentration hoch, und genau das belegen die aktuellen Zahlen.","Der UBS Global Wealth Report 2026 liefert die Daten: Das weltweite Privatvermögen wuchs 2025 in Dollar gerechnet um 10,8 Prozent, deutlich schneller als in den Vorjahren mit 4,6 Prozent (2024) und 4,2 Prozent (2023), getragen von starken Finanzmärkten und anziehenden Sachwerten. Regional legten Europa, der Nahe Osten und Afrika um 17,5 Prozent zu, der asiatisch-pazifische Raum um 5,9 Prozent, Amerika lag dazwischen, was teils an der Dollarabwertung liegt, die Zuwächse außerhalb der USA rechnerisch verstärkt. Für Deutschland: rund 2,6 Millionen Dollar-Millionäre, ein Prozent mehr als 2024, wobei eine Million Dollar rund 880.000 Euro entspricht. Das sind 3,9 Prozent der Menschen ab 18 Jahren, und sie besitzen rund 46 Prozent des gesamten Privatvermögens; am anderen Ende besaßen 9,8 Prozent der Erwachsenen weniger als jeweils 10.000 Dollar. Ein Land, das Einkommen stark umverteilt, kann also trotzdem eine stark konzentrierte Vermögensverteilung haben.","Damit zu Piketty. Seine berühmte These lautet: Die Rendite von Kapital liegt dauerhaft über der Wachstumsrate der Wirtschaft, Erträge aus Kapital wachsen also schneller als Erträge aus Arbeit, deshalb konzentriert sich Vermögen zwangsläufig, und das Verhältnis von Arbeit und Kapital kann kippen. Die im Deck verlinkte World Inequality Database liefert die Daten dazu. Der Handelsblatt-Artikel auf Folie 150, den die Mitschrift ausdrücklich hervorhebt, prüft die These aber kritisch: Für die Vergangenheit hält sie einer empirischen Analyse nicht stand. Der Grund ist ökonomisch elegant: Solange Maschinen bedient werden müssen, sind Kapital und Arbeit Komplemente. Ein dritter Hammer ist nicht so nützlich wie die ersten beiden, solange Menschen nur zwei Hände haben; Kapital ohne die Arbeit, die es nutzt, ist nahezu wertlos, sein Grenzprodukt fällt bei weiterer Akkumulation rasch. Deshalb schwankt die Kapitalquote am Volkseinkommen seit 200 Jahren zwischen 20 und 40 Prozent, statt immer weiter zu steigen.","Die eigentliche Pointe ist der Blick nach vorn: Die KI-Revolution könnte genau diese Bremse lösen, wie unter anderem Daron Acemoglu befürchtet. Philip Trammell und Dwarkesh Patel fassen es in einem Satz: Piketty was wrong about the past. He is probably right about the future. Wenn Maschinen die Arbeit nicht mehr ergänzen, sondern ersetzen, werden Kapital und Arbeit zu Substituten; die Kapitalquote steigt dann nachhaltig, die Lohnquote fällt, und die beiden Forscher schließen nicht aus, dass der Gini-Koeffizient der US-Einkommensverteilung von heute 0,42 auf 0,95 steigt; der Gini läuft von 0 (jeder hat das Gleiche) bis 1 (einer hat alles), und 0,95 wurde nirgendwo je gemessen.","Drei Mechanismen treiben die Spirale. Erstens die Privatisierung der Renditen: Im Jahr 2000 waren acht Prozent des US-Unternehmenskapitals in privaten Händen, heute sind es 19 Prozent; dazu endet das internationale Aufholen, denn wenn Maschinen Arbeit ersetzen, können Schwellenländer ihren Wohlstand nicht mehr über billige Arbeitskräfte steigern. Zweitens das Ende des Generationenausgleichs: Wer Kapital aufbaut und vererbt, dessen Vermögen wächst über Generationen unbegrenzt, Pikettys Szenario würde Realität. Drittens der geografische Fokus: Die Analyse konzentriert sich auf die USA, wo die Innovatoren von KI und Robotik sitzen, und auf China, das in diesem Szenario sogar davon profitiert, dass seine Erwerbsbevölkerung dramatisch schrumpft; die Mitschrift verallgemeinert: Die Wertschöpfung verlagert sich in Länder mit wertvollen Ressourcen. Für Deutschland ist das Szenario unangenehm: Hiesige Arbeit würde überwiegend durch importierte KI-Vorleistungen ersetzt, deutsche Kapitalbesitzer würden profitieren, aber weniger als amerikanische, die Gesamtbevölkerung würde wegen des geringen Aktienbesitzes am Wertzuwachs kaum partizipieren, und der Sozialstaat, der von Lohnsteuern und Sozialabgaben lebt, wäre am Ende; es wäre eine erhebliche Wohlstandsverschiebung in Richtung Ausland. Der Artikel bleibt fair: Noch ist es nur ein Szenario, gut möglich, dass KI wie die meisten Innovationen die Nachfrage nach Arbeit erhöht; sicher ist nur, dass das System vor einem Umbruch steht, auf den wir schlecht vorbereitet sind.","Die Vorlesung verankert die drei Mechanismen im bekannten Stoff. Zum ersten passt das CalPers-Zitat aus Commanding Heights Teil 3: Bill Christ warnt, wenn das Kapital nicht in die Emerging Markets fließe und dort Reformen fördere, könnten die alten Prognosen von Marx und Engels doch noch wahr werden, eine Konfrontation zwischen den Haves und Have-nots, die das ganze System zum Einsturz bringen kann. Zum zweiten gehören die Debatten um Grundeinkommen, Grunderbe, Vermögensteuern und Staatsfonds. Zum dritten die geopolitischen Machtverschiebungen: G7 als Club von sieben großen demokratischen Industrienationen, G8 als G7 plus Russland von 1998 bis 2014, und die offene Frage der Vorlesung, ob daraus am Ende eine G2 aus USA und China wird."]}],"raster":[{"kat":"PZ","begriff":"Einkommens- gegen Vermögensschere: staatliche Umverteilung (Notion: rund 50 Cent je Euro) dämpft Einkommen, Vermögenskonzentration bleibt hoch","warum":"Notion-Schwerpunkt; typische Fangstelle in offenen Fragen.","muss":true,"gew":9,"ktag":"","terms":["Einkommens-","Vermögensschere","staatliche","Umverteilung","Notion","rund"]},{"kat":"PB","begriff":"UBS Global Wealth Report 2026: plus 10,8 Prozent (2025); Deutschland 2,6 Mio. Dollar-Millionäre; 3,9 Prozent besitzen 46 Prozent; 9,8 Prozent unter 10.000 Dollar","warum":"Zahlenkern der Vermögensfolie.","muss":true,"gew":8,"ktag":"","terms":["Global","Wealth","Report","plus","Prozent","Deutschland"]},{"kat":"PB","begriff":"Piketty-These: Kapitalrendite über Wachstumsrate; Erträge aus Kapital wachsen schneller als aus Arbeit","warum":"Ausgangsthese; von Notion ausdrücklich festgehalten.","muss":true,"gew":8,"ktag":"","terms":["Piketty-These","Kapitalrendite","über","Wachstumsrate","Erträge","Kapital"]},{"kat":"PK","begriff":"Empirische Kritik: Kapital und Arbeit als Komplemente (dritter Hammer); Kapitalquote seit 200 Jahren 20 bis 40 Prozent","warum":"Erklärt, warum die These für die Vergangenheit scheitert.","muss":true,"gew":8,"ktag":"","terms":["Empirische","Kritik","Kapital","Arbeit","Komplemente","dritter"]},{"kat":"PK","begriff":"KI-Kipppunkt: Maschinen ersetzen Arbeit; Kapital und Arbeit werden Substitute; Lohnquote fällt; Gini von 0,42 auf bis zu 0,95 (Trammell/Patel; Acemoglu)","warum":"Kernszenario der Folie 150; Notion: Verhältnis Arbeit/Kapital kann kippen.","muss":true,"gew":10,"ktag":"","terms":["KI-Kipppunkt","Maschinen","ersetzen","Arbeit","Kapital","Substitute"]},{"kat":"PK","begriff":"Drei Mechanismen: Privatisierung der Renditen (8 auf 19 Prozent) plus Ende des Aufholens; Ende des Generationenausgleichs (Erben); Fokus USA/China","warum":"Struktur der Argumentation; separat abprüfbar.","muss":true,"gew":9,"ktag":"","terms":["Mechanismen","Privatisierung","Renditen","Prozent","plus","Ende"]},{"kat":"PZ","begriff":"Deutschland-Folgen: importierte KI; geringe Aktienquote; Sozialstaat von Lohnsteuern am Ende; Wohlstandsverschiebung Richtung Ausland (Notion: Wertschöpfung wandert zu Ressourcenländern)","warum":"Anwendungsfall mit Wertungsteil; gut für offene Fragen.","muss":true,"gew":8,"ktag":"","terms":["Deutschland-Folgen","importierte","geringe","Aktienquote","Sozialstaat","Lohnsteuern"]},{"kat":"PZ","begriff":"Bezüge: CalPers-Zitat (haves/have-nots, Marx/Engels, Commanding Heights Teil 3); Grundeinkommen/Grunderbe/Vermögensteuer/Staatsfonds; G7/G8/G2","warum":"Verbindet Block 9 mit Block 8; eigene Folie 151.","muss":true,"gew":7,"ktag":"","terms":["Bezüge","CalPers-Zitat","haves","have-nots","Marx","Engels"]},{"kat":"KD","begriff":"SZ-Artikel: Superreiche besitzen mehr als ärmere Hälfte; Forderung globale Vermögensteuer; Klima und Demokratie in Gefahr","warum":"Aktueller Aufhänger (Hagelüken, 10.12.2025).","muss":false,"gew":4,"ktag":"","terms":["SZ-Artikel","Superreiche","besitzen","mehr","ärmere","Hälfte"]},{"kat":"KD","begriff":"Einordnung: noch ein Szenario; KI könnte auch Arbeitsnachfrage schaffen","warum":"Differenzierung zeigt Urteilsvermögen.","muss":false,"gew":4,"ktag":"","terms":["Einordnung","noch","Szenario","könnte","Arbeitsnachfrage","schaffen"]}],"fehler":["Einkommens- und Vermögensverteilung vermengen: Umverteilung wirkt auf Einkommen; die 46 Prozent betreffen Vermögen.","Piketty pauschal als widerlegt oder bestätigt darstellen: Die Folie sagt beides: empirisch schwach für die Vergangenheit, plausibel für die KI-Zukunft.","Gini-Skala falsch: 0 gleich Gleichverteilung, 1 gleich maximale Konzentration; USA heute 0,42, Szenario 0,95.","Die drei Mechanismen auf einen (Erben) verkürzen: Privatisierung der Renditen und USA/China-Fokus gehören dazu.","Deutschland-Teil vergessen: importierte KI, geringe Aktienquote, Sozialstaatsfinanzierung; das ist die wahrscheinlichste Transferfrage."]},{"title":"Marken, oder Konstruktivismus mit Preisschild","lernziel":"Du kannst die Marken-Definition nach Meffert samt Klausurhinweis wiedergeben, erklärst die drei Wertfunktionen von Marken, belegst mit Studien, dass sich Markenaufbau lohnt, aber Werbung allein nicht reicht, und verbindest all das mit dem Konstruktivismus.","konzepte":"Musikvideo-Referenzkette (Tokio Hotel, U2, Beatles, Metropolis, Apple 1984); Apple gegen Apple Corps; Marken-Definition (Meffert) mit Klausurhinweis; Gallant Lab, IAT, Big 5; drei Wertfunktionen (McKinsey/MCM); Brand Stretch Studie; E.ON-Fall; R-Quadrat 6 Prozent und Markenstrategie.","lesezeit":"etwa 5 Minuten","sections":[{"h":"","body":["Wo sitzt der Wert einer Marke? Nicht in der Fabrik und nicht im Produkt, sondern im Kopf. Genau deshalb schließt die Vorlesung den Konstruktivismus-Bogen mit den Marken, und genau hier liegt der einzige ausdrückliche Klausurhinweis des Professors in diesem Block: Starke Marken sind unverwechselbar im Kopf verankert, und das ist Konstruktivismus. Die Definition dazu stammt von Meffert (2000, Marketing Centrum Münster): Eine Marke ist ein in der Psyche des Konsumenten verankertes Vorstellungsbild von einem Produkt oder einer Dienstleistung. Die vorbereitenden Folien zeigen, was das heißt: Starke Marken haben ein Gesicht, vom Coca-Cola-Schriftzug bis zum Kranich der Lufthansa, und sie sind einzigartig, wie die Coca-Cola-Flasche, die zwischen sechs Weinflaschen sofort heraussticht.","Wie solche Vorstellungsbilder entstehen, führt die Vorlesung an einer Popkultur-Kette vor: Das Tokio-Hotel-Video Der letzte Tag covert das U2-Video Where the Streets Have No Name und hält sich dicht am Original; das U2-Video war seinerseits ein Remake des spontanen Beatles-Konzerts von 1969 auf dem Dach ihrer Plattenfirma Apple; gedreht wurde bei Tokio Hotel auf dem Dach des Kosmos-Kinos in Berlin. Dazu kommen Anleihen an Fritz Langs Metropolis und an den Apple-Werbefilm 1984, der wiederum von Orwells Roman inspiriert ist. Bedeutung entsteht hier nirgends aus dem Produkt selbst, sondern aus einer Kette kollektiv geteilter Referenzen, also aus Konstruktion. Dass solche Vorstellungsbilder handfesten Wert haben, zeigt der Streit zwischen Apple Corps, der Plattenfirma der Beatles, und Apple Computer: Von 1978 bis 2006 stritten beide um die Markenrechte; der High Court entschied am 8. Mai 2006 zugunsten von Apple Computer, die endgültige Einigung kam am 5. Februar 2007. Und die aktuelle Forschung fragt bereits, wo diese Bilder wohnen: Das Gallant Lab kartiert semantische Konzepte im Kortex, die Vorlesung fragt nach der Verortung von Marken, der Implizite Assoziationstest misst implizite Einstellungen zu Marken über Reaktionszeiten, und der Big-5-Exkurs fragt nach Bezügen zu stabilen Persönlichkeitsunterschieden.","Ökonomisch stiften Marken über drei Funktionen Wert für den Konsumenten, so das McKinsey/MCM-Schema. Erstens Risikoreduktion: Marken reduzieren das Risiko, eine falsche Entscheidung zu treffen, über Sicherheit, Kontinuität und Vertrauen. Zweitens Informationseffizienz: Marken erleichtern die Informationsverarbeitung über Herkunft, Orientierung, Interpretation und Wiedererkennung. Drittens ideeller Nutzen: Selbstverwirklichung, Selbstdarstellung und Identifikation. Alle drei Funktionen laufen über das Vorstellungsbild, nicht über objektive Produkteigenschaften, und genau das macht die Marke zum Paradebeispiel des Paradigmas.","Lohnt sich der Aufbau? Ja: Die McKinsey Brand Stretch Studie von 2001, eine Analyse von 130 Konsumgüterunternehmen in sechs Industrien plus Befragung von 5.000 Konsumenten, findet beim Total Return to Shareholders im Vergleich zum Marktdurchschnitt plus 2,0 Prozentpunkte für starke und minus 3,1 Prozentpunkte für schwache Marken. Aber Vorsicht vor dem Kurzschluss, mehr Werbung sei gleich mehr Marke. Die Werbeausgaben wuchsen um die Jahrtausendwende rasant, in Deutschland von 1998 bis 2000 etwa in der Energieversorgung von 68 auf 176 Millionen Euro, bei den Telekommunikations-Netzanbietern von 547 auf 1.412 Millionen und bei Finanzanlagen und -beratung von 139 auf 494 Millionen. Der Strommarkt zeigt, was das bringt und was nicht: Die E.ON-Kampagnen erreichten im November 2000 beachtliche 93 Prozent gestützte Bekanntheit und 66 Prozent ungestützte Werbeerinnerung, auf den ersten Blick ein Erfolg. Die Mix-it-Baby-Kampagne von 2001 mit Arnold Schwarzenegger kostete dann aber 22,5 Millionen Euro und brachte nur rund 1.100 Neukunden mit 0,7 Millionen Euro Jahresumsatz, also rund 20.500 Euro Werbeausgaben pro Neukunde. Werbewirkung und ökonomischer Impact sind zwei verschiedene Dinge.","Den Schlusspunkt setzt ein Streudiagramm: Trägt man die jährlichen Werbeausgaben für TV und Print gegen den Brand Value ab, erklärt Werbung nur sechs Prozent der Varianz, R-Quadrat gleich sechs Prozent, kein monokausaler Zusammenhang. Wer eine Marke aufbauen will, braucht eine umfassende Markenstrategie: Marketing mit Medienauswahl, Promotions und PR, klar definierte Kundensegmente vom Intermediär bis zum Endkunden, passende Distributionswege vom Einzelhandel über Boutiquen und Internet bis zum Discounter, das Produkt selbst mit Design, Logo, Verpackung und Preis, die Mitarbeiter mit ihren Moments of Truth und Kauferlebnissen, und ein konsistentes Markenportfolio. Anders gesagt: Das Vorstellungsbild im Kopf des Konsumenten wird an jedem Kontaktpunkt mitkonstruiert, nicht nur im Werbeblock."]}],"raster":[{"kat":"PB","begriff":"Marke (Meffert 2000): in der Psyche des Konsumenten verankertes Vorstellungsbild von einem Produkt oder einer Dienstleistung","warum":"Ausdrücklicher KLAUSUR-Hinweis des Professors; wörtlich lernen.","muss":true,"gew":10,"ktag":"K!","terms":["Marke","Meffert","Psyche","Konsumenten","verankertes","Vorstellungsbild"]},{"kat":"PZ","begriff":"Starke Marken sind unverwechselbar im Kopf verankert; Verbindung zum Konstruktivismus","warum":"Der Merksatz des Klausurhinweises; Konstruktivismus-Brücke.","muss":true,"gew":10,"ktag":"K!","terms":["Starke","Marken","unverwechselbar","Kopf","verankert","Verbindung"]},{"kat":"PK","begriff":"Drei Wertfunktionen (McKinsey/MCM): Risikoreduktion (Sicherheit, Kontinuität, Vertrauen); Informationseffizienz (Herkunft, Orientierung, Interpretation, Wiedererkennung); ideeller Nutzen (Selbstverwirklichung, Selbstdarstellung, Identifikation)","warum":"Struktur mit Unterpunkten; klassische offene Frage.","muss":true,"gew":9,"ktag":"","terms":["Wertfunktionen","McKinsey","Risikoreduktion","Sicherheit","Kontinuität","Vertrauen"]},{"kat":"PK","begriff":"Brand Stretch Studie (McKinsey 2001): TRS starke Marken plus 2,0, schwache minus 3,1 Prozentpunkte; 130 Unternehmen, 5.000 Konsumenten","warum":"Beleg, dass sich Markenaufbau lohnt.","muss":true,"gew":7,"ktag":"","terms":["Brand","Stretch","Studie","McKinsey","starke","Marken"]},{"kat":"PZ","begriff":"E.ON-Fall: 93 Prozent gestützte Bekanntheit, 66 Prozent ungestützte Werbeerinnerung, aber rund 20.500 Euro Werbeausgaben pro Neukunde (22,5 Mio. Ausgaben, 1.100 Neukunden)","warum":"Werbewirkung gegen ökonomischen Impact; Zahlen prüfbar.","muss":true,"gew":8,"ktag":"","terms":["ON-Fall","Prozent","gestützte","Bekanntheit","ungestützte","Werbeerinnerung"]},{"kat":"PZ","begriff":"R-Quadrat gleich 6 Prozent: kein monokausaler Zusammenhang Werbung/Markenwert; umfassende Markenstrategie (Marketing, Kundensegmente, Distribution, Produkt, Mitarbeiter/Moments of Truth, Markenportfolio)","warum":"Schlussfolie; verhindert den Kurzschluss Werbung gleich Marke.","muss":true,"gew":8,"ktag":"","terms":["R-Quadrat","gleich","Prozent","kein","monokausaler","Zusammenhang"]},{"kat":"KD","begriff":"Referenzkette: Tokio Hotel covert U2, das das Beatles-Rooftop-Konzert (1969, Apple) zitiert; Metropolis; Apple-Spot 1984 (Orwell)","warum":"Konstruktion von Bedeutung über kulturelle Anspielungen.","muss":false,"gew":5,"ktag":"","terms":["Referenzkette","Tokio","Hotel","covert","Beatles-Rooftop-Konzert","Apple"]},{"kat":"KD","begriff":"Apple gegen Apple Corps (1978 bis 2006; Urteil 8.5.2006; Einigung 5.2.2007)","warum":"Ökonomischer Wert des Vorstellungsbilds.","muss":false,"gew":4,"ktag":"","terms":["Apple","Corps","Urteil","Einigung"]},{"kat":"KD","begriff":"Werbeausgaben-Wachstum 1998 bis 2000 (Energie 68 auf 176; Telko 547 auf 1.412; Finanz 139 auf 494 Mio. Euro)","warum":"Kontextzahlen zum Strommarkt-Beispiel.","muss":false,"gew":3,"ktag":"","terms":["Werbeausgaben-Wachstum","Energie","Telko","Finanz","Euro"]},{"kat":"KD","begriff":"Forschung: Gallant Lab (semantische Hirnkarten, Verortung von Marken?); IAT; Big-5-Exkurs","warum":"Ausblick; als offene Fragen formuliert.","muss":false,"gew":3,"ktag":"","terms":["Forschung","Gallant","semantische","Hirnkarten","Verortung","Marken"]}],"fehler":["Die Definition frei paraphrasieren: Vorstellungsbild, Psyche des Konsumenten und Produkt oder Dienstleistung müssen vorkommen (Meffert 2000).","Den Klausurhinweis ohne Konstruktivismus-Bezug wiedergeben: Der Prof will die Verbindung (Markenwert als konstruiertes Vorstellungsbild).","Die drei Wertfunktionen ohne Unterpunkte nennen: Zu jeder Funktion gehören die Stichworte (etwa Vertrauen, Wiedererkennung, Identifikation).","Bekanntheit mit Erfolg gleichsetzen: E.ON zeigt hohe Werbewirkung bei fraglichem ökonomischem Impact (20.500 Euro pro Neukunde).","R-Quadrat 6 Prozent als Beleg gegen Markenwert lesen: Es widerlegt nur den monokausalen Werbeeffekt, nicht den Wert starker Marken.","Niveaustufen: Was musst du erinnert haben?","Die Stufen bauen aufeinander auf. Prozentangaben beziehen sich auf die Summe der erreichten Gewichtungspunkte über alle vier Teile.","A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","Du gibst die tragenden Begriffe frei wieder: die Konstruktivismus-Definition (Janich), die sechs Techniken sozialer Realität als Liste, die Marken-Definition nach Meffert mit dem Merksatz unverwechselbar im Kopf verankert, die Piketty-These sowie die Grundzahlen der Vermögensverteilung (3,9 Prozent besitzen rund 46 Prozent).","B. Gutes Niveau (etwa 70%)","Zusätzlich erklärst du die Mechanismen: die vier Seiten einer Nachricht am Kapern-Beispiel, Maturana/Varela (keine übertragene Information, Strukturdeterminiertheit), alle sechs Techniken mit Definition, Choice Blindness mit den Folgen für qualitative Forschung, die empirische Kritik an Piketty (Komplemente, Kapitalquote 20 bis 40 Prozent) und die drei Wertfunktionen von Marken mit Unterpunkten.","C. Sehr gutes Niveau (etwa 85%)","Zusätzlich sitzen Details und Zusammenhänge: die Management-Bedeutung (Wissen als Erfinden, Wahr ist, was wahrgenommen wird, Abschied von der absoluten Wahrheit), das KI-Piketty-Szenario mit den drei Mechanismen und dem Gini-Sprung von 0,42 auf 0,95, die Deutschland-Folgen, die Metaverse-Gründe samt Kristensson-Studie, das NZZ/Blick-Image-Experiment sowie die E.ON-Zahlen und R-Quadrat gleich 6 Prozent.","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)","Alles sitzt flüssig und du wendest es an: Du analysierst eine Unternehmenskommunikation mit den sechs Techniken, verbindest das CalPers-Zitat mit dem KI-Piketty-Szenario und den Verteilungsdebatten (Grundeinkommen, Grunderbe, Vermögensteuer, Staatsfonds, G2), leitest aus Choice Blindness Konsequenzen für Interviews ab, erklärst die Marke als Paradebeispiel des Konstruktivismus über die Referenzkette und begründest, warum Werbeausgaben allein keinen Markenwert schaffen."]}]}]</script>
<script>
/* ===== DATEN ===== */
const DATA = JSON.parse(document.getElementById('cards-data').textContent);
const BUILD = "2026-07-09 · 324 Karten + Active Recall (32 Lerntexte) + Klausurtraining";
const CATS = [
 {name:"Grundlagen & Methoden", c:"#f0a23c", icon:"G"},
 {name:"Konsum, Markt & Werbung", c:"#e9b949", icon:"K"},
 {name:"Arbeit", c:"#e0883a", icon:"A"},
 {name:"Organisation", c:"#d7733e", icon:"O"},
 {name:"Personal", c:"#e0654a", icon:"P"},
 {name:"Finanzpsychologie", c:"#f0b429", icon:"F"},
 {name:"Gesellschaft", c:"#cf8a4a", icon:"G"},
 {name:"Gesellschaft II", c:"#d99a55", icon:"II"},
 {name:"Vertiefung I: Theorie & Kommunikation", c:"#dd6f3a", icon:"V1"},
 {name:"Vertiefung II: Keynes, Hayek & Ungleichheit", c:"#c2603c", icon:"V2"},
 {name:"Vertiefung III: Globalisierung & Fallstudien", c:"#e0913f", icon:"V3"},
];
const catColor = n => (CATS.find(c=>c.name===n)||{}).c || "#5b8cff";

/* ===== ZUSTAND (Spaced Repetition, localStorage) ===== */
const LS_KEY="wipsy_sr_v2";
const DAY=86400000;
let STATE=load();
function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return {};} }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(STATE));}catch(e){} }
function cs(id){ if(!STATE[id]) STATE[id]={box:0,due:0,reps:0,lapses:0,w:0,s:0,m:0,e:0}; return STATE[id]; }
function isDue(id){ const s=STATE[id]; if(!s||s.reps===0) return true; return s.due<=Date.now(); }
function isLearned(id){ const s=STATE[id]; return !!s && s.reps>0; }
function intervalForBox(b){ const map={1:1,2:2,3:4,4:8,5:16}; return (map[b]||32)*DAY; }
function applyRating(id,g){
  const s=cs(id); s.reps++; s[g]=(s[g]||0)+1;
  if(g==='w'){ s.box=0; s.due=Date.now(); s.lapses++; }
  else{
    if(g==='s') s.box=Math.max(1,s.box);
    else if(g==='m') s.box=s.box+1;
    else s.box=s.box+2;
    if(s.box>6) s.box=6;
    s.due=Date.now()+intervalForBox(s.box);
  }
  save();
}

/* ===== STATISTIK ===== */
function statsFor(list){
  let learned=0,open=0,due=0,corr=0,total=0;
  for(const card of list){
    const id=card.id, s=STATE[id];
    if(isLearned(id)) learned++; else open++;
    if(isDue(id)) due++;
    if(s){ const r=(s.s||0)+(s.m||0)+(s.e||0); corr+=r; total+=r+(s.w||0); }
  }
  const quote = total>0 ? Math.round(corr/total*100) : null;
  return {n:list.length,learned,open,due,quote,total};
}
const byCat = name => DATA.filter(c=>c.cat===name);

/* ===== VIEWS ===== */
const V={home:document.getElementById('viewHome'),study:document.getElementById('viewStudy'),stats:document.getElementById('viewStats'),ar:document.getElementById('viewAR'),exam:document.getElementById('viewExam')};
function show(v){ for(const k in V) V[k].classList.toggle('hidden',k!==v); window.scrollTo(0,0); }

function renderHead(){
  const g=statsFor(DATA);
  document.getElementById('headStats').innerHTML=
    `<span class="chip">Gelernt <b>${g.learned}</b>/${g.n}</span>`+
    `<span class="chip">Heute fällig <b>${g.due}</b></span>`+
    `<span class="chip">Erfolgsquote <b>${g.quote===null?'–':g.quote+'%'}</b></span>`;
}

function renderHome(){
  renderHead();
  const g=statsFor(DATA);
  document.getElementById('homeSub').textContent=
    `${DATA.length} Karten in ${CATS.length} Kategorien • Klausur 22.07.2026 • ${g.due} Karten jetzt fällig`;
  const grid=document.getElementById('catGrid'); grid.innerHTML='';
  for(const cat of CATS){
    const list=byCat(cat.name); if(!list.length) continue;
    const s=statsFor(list);
    const pct = s.n? Math.round(s.learned/s.n*100):0;
    const el=document.createElement('button');
    el.className='cat'; el.style.setProperty('--cc',cat.c);
    el.innerHTML=`<span class="bar-top"></span>
      <h3><span class="ico">${cat.icon}</span>${cat.name}</h3>
      <div class="cnt">${s.n} Karten · <span class="due">${s.due} fällig</span></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="pct"><span>${s.learned} gelernt · ${s.open} offen</span><span>${pct}%</span></div>`;
    el.onclick=()=>startSession(cat.name);
    grid.appendChild(el);
  }
  document.getElementById('homeFoot').innerHTML=
    `Eine Datei, keine Installation, keine Internetverbindung nötig. Fortschritt wird lokal gespeichert.<br>Build ${BUILD}`;
}

/* ===== STUDY SESSION (Gating-Scheduler) =====
   Lernpsychologie: statt alle neuen Karten auf einmal (reines Enkodieren,
   Cognitive Load) werden neue Karten portioniert eingeführt (Retrieval Practice
   in kleinen Häppchen). Gating-Regel: die nächste neue Karte wird erst
   freigegeben, wenn eine aktuell in Einführung befindliche Karte mindestens
   auf "Schwer" bewertet wurde. "Erneut"/Wiederholen hält den Slot belegt und
   blockiert damit neue Karten. Wiedervorlagen erfolgen mit Abstand (nicht
   direkt hintereinander) -> Desirable Difficulty / Mini-Spacing. */
let SESS=null;

// Wie viele NEUE Karten gleichzeitig in Einführung sein dürfen. Default 1 (striktes Gating).
function maxConcurrentNew(){
  const el=document.getElementById('newLimit');
  const v = el? parseInt(el.value,10):1;
  return (v>=1 && v<=5)? v : 1;
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildSession(catName){
  let pool = catName? byCat(catName) : DATA.slice();
  const all=document.getElementById('allMode').checked;
  // Wiederholungen: bereits gelernte, fällige Karten (bei "Alle üben" alle gelernten)
  let review = pool.filter(c=> isLearned(c.id) && (all || isDue(c.id)));
  // Neue Karten: noch nie bewertet, in Blockreihenfolge (zusammenhängende Enkodierung)
  let fresh  = pool.filter(c=> !isLearned(c.id));
  shuffleArr(review); // gelernte Karten mischen (Interleaving)
  return {
    cat:catName,
    queue: review.map(c=>c.id),   // aktive Runde: Wdh + eingeführte neue Karten
    newPool: fresh.map(c=>c.id),  // noch nicht eingeführte neue Karten
    unstable: 0,                  // eingeführte neue Karten ohne erste ">= Schwer"-Bewertung
    learning: {},                 // id -> true, solange in Einführung (Gate offen erst bei >= Schwer)
    maxNew: maxConcurrentNew(),
    total: review.length + fresh.length,
    done:0, revealed:false, showInfo:false
  };
}

// Führt neue Karten ein, solange das Gating-Limit nicht erreicht ist.
function fillNew(){
  while(SESS.unstable < SESS.maxNew && SESS.newPool.length){
    const id=SESS.newPool.shift();
    SESS.learning[id]=true;
    SESS.unstable++;
    const pos=Math.min(SESS.queue.length, 2); // kurz nach vorne, mit kleinem Abstand
    SESS.queue.splice(pos,0,id);
  }
}

function startSession(catName){
  SESS=buildSession(catName);
  fillNew();
  document.getElementById('studyName').textContent=catName||'Alle Kategorien';
  show('study'); renderCard();
}
function startAllDue(){ startSession(null); }

function renderSessBar(){
  const pct=SESS.total? Math.round(SESS.done/SESS.total*100):0;
  document.getElementById('sessFill').style.width=pct+'%';
  document.getElementById('sessCount').textContent=`${SESS.done} / ${SESS.total}`;
}
function renderCard(){
  renderSessBar();
  const body=document.getElementById('studyBody');
  if(!SESS.queue.length && SESS.newPool.length) fillNew(); // Sicherung: neue Karten nachziehen
  if(!SESS.queue.length){ return renderDone(); }
  const id=SESS.queue[0];
  const card=DATA.find(c=>c.id===id);
  const cc=catColor(card.cat);
  const hasInfo=card.hasInfo;
  body.style.setProperty('--cc',cc);
  let html=`<div class="card" style="--cc:${cc}">
    <div class="tagrow"><span class="tag">${card.cat}</span>
      <button class="infobtn" id="infoBtn" ${hasInfo?'':'disabled'} title="Zusatzwissen (i)">i</button></div>
    <div class="qlabel">Frage</div>
    <div class="frage">${esc(card.q)}</div>`;
  if(SESS.revealed){
    html+=`<div class="divider"></div><div class="alabel">Antwort</div>
      <div class="antwort">${esc(card.a_short||card.a)}</div>`;
    if(SESS.showInfo && hasInfo) html+=zusatzHTML(card);
    html+=`<div class="actions">
      <button class="rate again" data-g="w">Wiederholen<small>1</small></button>
      <button class="rate hard" data-g="s">Schwer<small>2</small></button>
      <button class="rate mid" data-g="m">Mittel<small>3</small></button>
      <button class="rate easy" data-g="e">Einfach<small>4</small></button></div>`;
  }else{
    html+=`<div class="reveal-hint">Tippen oder Leertaste, um die Antwort zu zeigen</div>`;
  }
  html+=`</div>`;
  body.innerHTML=html;

  if(!SESS.revealed){

  }

  if(ib && hasInfo) ib.onclick=(e)=>{e.stopPropagation(); SESS.showInfo=!SESS.showInfo; if(!SESS.revealed)reveal(); else renderCard();};
  body.querySelectorAll('.rate').forEach(b=> b.onclick=()=>rate(b.dataset.g));
}
function zusatzHTML(card){

  const f=(cls,label,key)=> x[key]?`<div class="zfield"><div class="zk ${cls}">${label}</div><div class="zv">${esc(x[key])}</div></div>`:'';
  h+=f('def','Definition','definition');

}
function reveal(){ if(SESS.revealed)return; SESS.revealed=true; renderCard(); }
function rate(g){
  const id=SESS.queue.shift();
  const wasLearning = !!SESS.learning[id];
  applyRating(id,g);
  if(g==='w'){
    // Erneut: Karte bleibt in der Runde, mit Abstand wieder einreihen.
    // Bleibt "unstable" -> blockiert weiterhin neue Karten (Gating).
    const pos=Math.min(SESS.queue.length,4);
    SESS.queue.splice(pos,0,id);
  } else {
    // >= Schwer
    if(wasLearning){
      SESS.learning[id]=false;
      SESS.unstable--;              // Gate öffnet: nächste neue Karte darf kommen
      if(g==='s'){
        // Schwer: heute nochmal sehen, zählt aber schon als stabilisiert
        const pos=Math.min(SESS.queue.length,6);
        SESS.queue.splice(pos,0,id);
      } else {
        SESS.done++;                // Mittel/Einfach: für diese Sitzung erledigt
      }
    } else {
      SESS.done++;                  // Wiederholungskarte (oder schon stabilisiert) erledigt
    }
  }
  fillNew();
  SESS.revealed=false; SESS.showInfo=false;
  renderCard(); renderHead();
}

/* ===== ACTIVE RECALL (Blurting) ===== */
const AR = JSON.parse(document.getElementById('ar-data').textContent);
const AR_KEY = "wipsy_ar_v1";
let ARST = (()=>{ try{return JSON.parse(localStorage.getItem(AR_KEY))||{};}catch(e){return{};} })();
function arSave(){ try{localStorage.setItem(AR_KEY,JSON.stringify(ARST));}catch(e){} }
function arRes(bi,ti){ return (ARST[bi]&&ARST[bi][ti])||null; }
function arSetRes(bi,ti,o){ if(!ARST[bi])ARST[bi]={}; ARST[bi][ti]=o; arSave(); }

function arNorm(s){ return (s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function arAuto(text,r){
  const t=arNorm(text); let hit=0;
  for(const term of r.terms){ if(term && term.length>=3 && t.includes(arNorm(term))) hit++; }
  if(!hit) return 'red';
  return (hit/r.terms.length>=0.5)?'green':'yellow';
}
const AR_W={green:1,yellow:0.5,red:0};
function arQuote(raster,states){
  let got=0,max=0;
  raster.forEach((r,i)=>{ max+=r.gew; got+=r.gew*AR_W[states[i]]; });
  return max?Math.round(got/max*100):0;
}
function arNiveau(q){
  if(q>=85) return {l:'Sehr gut bis Klausurniveau',b:'green'};
  if(q>=70) return {l:'Gutes Niveau',b:'yellow'};
  if(q>=50) return {l:'Mindestniveau bestanden',b:'yellow'};
  return {l:'Erneut lesen',b:'red'};
}

/* Timer */
let arTimerInt=null, arTimerStart=null;
function arFmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function updTimer(){ const el=document.getElementById('arTimer'); if(!el||arTimerStart==null)return;
  el.textContent=arFmt(Math.floor((Date.now()-arTimerStart)/1000)); }
function startTimerClock(){ if(arTimerInt)clearInterval(arTimerInt); arTimerInt=setInterval(updTimer,1000); updTimer(); }
function stopTimerClock(){ if(arTimerInt){clearInterval(arTimerInt);arTimerInt=null;} }

/* Schreibphase */
function startBlurt(bi,ti){

/* Auswertung */
function evaluateBlurt(bi,ti){
  const t=AR[bi].teile[ti];
  const txt=arDraft[dkey(bi,ti)]||'';
  const states=t.raster.map(r=>arAuto(txt,r));
  const elapsed=arTimerStart!=null?Math.floor((Date.now()-arTimerStart)/1000):null;
  ARSESS={bi,ti,states,elapsed};
  renderResults();
}
function arRC(b){ return b==='green'?'var(--good)':b==='yellow'?'var(--mid)':'var(--again)'; }

function renderResults(){
  const {bi,ti,states,elapsed}=ARSESS;
  const b=AR[bi],t=b.teile[ti],R=t.raster;
  const q=arQuote(R,states), nv=arNiveau(q), rc=arRC(nv.b);
  const cnt={green:0,yellow:0,red:0}; states.forEach(s=>cnt[s]++);
  arSetRes(bi,ti,{quote:q,niveau:nv.l,ts:Date.now()});
  const tstr=elapsed!=null?` · ${Math.floor(elapsed/60)} min ${elapsed%60} s`:'';
  show('ar');
  let h=`<div class="study-top"><button class="btn sm" id="arBack">← ${esc(arShort(b.label))}</button><span class="name">Auswertung · Teil ${ti+1}</span></div>`;
  h+=`<div class="res-top">
    <div class="ring" style="--p:${q};--rc:${rc}"><i><b id="qNum">${q}%</b><small>Erinnerung</small></i></div>
    <div class="res-meta"><div class="niv" id="nivTxt" style="color:${rc}">${nv.l}</div>
      <div class="sub2">${esc(t.title)} ${tstr}</div>
      <div class="res-counts">
        <span class="dotg">● <b id="cG">${cnt.green}</b> erinnert</span>
        <span class="doty">● <b id="cY">${cnt.yellow}</b> angerissen</span>
        <span class="dotr">● <b id="cR">${cnt.red}</b> fehlt</span></div>
      <div class="sub2" style="margin-top:9px">Der Abgleich erkennt Stichwoerter, nicht den Sinn. Pruefe unten jedes Konzept und korrigiere die Ampel. Die Quote rechnet live mit.</div>
    </div></div>`;
  h+=`<div class="miss-grid" id="missGrid"></div>`;
  if(t.fehler&&t.fehler.length){
    h+=`<div class="fehler-list"><h4>Typische Fehler in diesem Teil</h4><ul>`;
    t.fehler.forEach(f=>h+=`<li>${esc(f)}</li>`); h+=`</ul></div>`;
  }
  h+=`<div class="sec-h">Alle Konzepte · Einschaetzung anpassen</div><div class="concept-list" id="cList"></div>`;
  h+=`<div class="res-actions">
    <button class="btn primary" id="relearnBtn">Nur fehlende Inhalte erneut lernen</button>
    <button class="btn" id="reReadBtn">Lerntext erneut lesen</button>
    <button class="btn" id="reBlurtBtn">Nochmal blurten</button>
    <button class="btn ghost" id="arBack2">Zur Blockuebersicht</button></div>`;
  arBody().innerHTML=h;
  renderConceptList(); renderMissGroups();
  document.getElementById('arBack').onclick=()=>openARBlock(bi);
  document.getElementById('arBack2').onclick=()=>openARBlock(bi);
  document.getElementById('relearnBtn').onclick=renderRelearn;
  document.getElementById('reReadBtn').onclick=()=>{ arTimerStart=null; openLerntext(bi,ti); };
  document.getElementById('reBlurtBtn').onclick=()=>{ arDraft[dkey(bi,ti)]=''; arTimerStart=null; startBlurt(bi,ti); };
  window.scrollTo(0,0);
}

function renderConceptList(){
  const {bi,ti,states}=ARSESS; const R=AR[bi].teile[ti].raster;
  const el=document.getElementById('cList'); el.innerHTML='';
  R.forEach((r,i)=>{
    const row=document.createElement('div'); row.className='concept-row '+states[i];

      <div class="cr-warum">${esc(r.warum)}</div></div>
      <div class="seg" data-i="${i}">
        <button class="g${states[i]==='green'?' on':''}" data-s="green">Erinnert</button>
        <button class="y${states[i]==='yellow'?' on':''}" data-s="yellow">Angerissen</button>
        <button class="r${states[i]==='red'?' on':''}" data-s="red">Fehlt</button></div>`;
    el.appendChild(row);
  });
  el.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    ARSESS.states[+seg.dataset.i]=btn.dataset.s; recomputeRes();
  }));

function recomputeRes(){
  const {bi,ti,states}=ARSESS; const R=AR[bi].teile[ti].raster;
  const q=arQuote(R,states), nv=arNiveau(q), rc=arRC(nv.b);
  document.getElementById('qNum').textContent=q+'%';
  const ring=document.querySelector('.ring'); ring.style.setProperty('--p',q); ring.style.setProperty('--rc',rc);
  const nt=document.getElementById('nivTxt'); nt.textContent=nv.l; nt.style.color=rc;
  const cnt={green:0,yellow:0,red:0}; states.forEach(s=>cnt[s]++);
  document.getElementById('cG').textContent=cnt.green;
  document.getElementById('cY').textContent=cnt.yellow;
  document.getElementById('cR').textContent=cnt.red;
  document.querySelectorAll('#cList .concept-row').forEach((row,i)=>{
    row.className='concept-row '+states[i];
    row.querySelectorAll('.seg button').forEach(btn=>btn.classList.toggle('on',btn.dataset.s===states[i]));
  });
  renderMissGroups();
  arSetRes(bi,ti,{quote:q,niveau:nv.l,ts:Date.now()});
}

function renderMissGroups(){
  const {bi,ti,states}=ARSESS; const R=AR[bi].teile[ti].raster;
  const g={PB:[],PK:[],PZ:[],KLA:[]};
  R.forEach((r,i)=>{ if(states[i]!=='red')return;
    if(r.kat==='KD'||r.ktag) g.KLA.push(r);
    if(r.kat==='PB') g.PB.push(r); else if(r.kat==='PK') g.PK.push(r); else if(r.kat==='PZ') g.PZ.push(r);
  });
  const card=(title,arr,kl)=>{
    let h=`<div class="miss-card${kl?' klausur':''}"><h4>${title} <span class="gw">(${arr.length})</span></h4>`;
    if(!arr.length) h+=`<div class="none">● alles erinnert</div>`;
    else { h+=`<ul>`; arr.forEach(r=>h+=`<li>${esc(r.begriff)}${r.ktag?`<span class="kbadge">[${r.ktag}]</span>`:''}</li>`); h+=`</ul>`; }
    return h+`</div>`;
  };
  document.getElementById('missGrid').innerHTML=
    card('Fehlende Schluesselbegriffe',g.PB,false)+
    card('Fehlende Konzepte',g.PK,false)+
    card('Fehlende Zusammenhaenge',g.PZ,false)+
    card('Klausurrelevante Luecken',g.KLA,true);
}

function renderRelearn(){
  const {bi,ti,states}=ARSESS; const b=AR[bi],t=b.teile[ti],R=t.raster;
  const miss=R.map((r,i)=>({r,st:states[i]})).filter(x=>x.st!=='green');
  let h=`<div class="study-top"><button class="btn sm" id="arBack">← Auswertung</button><span class="name">Erneut lernen · Teil ${ti+1}</span></div>`;
  if(!miss.length){
    h+=`<div class="panel"><div class="big">✓</div><h2>Nichts offen</h2><p>Du hast alle Konzepte dieses Teils erinnert.</p></div>`;
  } else {
    h+=`<p class="sub">${miss.length} Konzepte sind noch offen (gelb oder rot). Lies sie gezielt, dann blurte erneut.</p><div class="concept-list">`;
    miss.forEach(({r,st})=>{
      h+=`<div class="concept-row ${st}"><div class="cr-main"><div class="cr-top"><span class="kat">${r.kat}</span><span class="cr-begriff">${esc(r.begriff)}</span>${r.ktag?`<span class="kbadge">[${r.ktag}]</span>`:''}<span class="gw">${r.gew} P.</span></div><div class="cr-warum">${esc(r.warum)}</div></div></div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="res-actions"><button class="btn primary" id="reReadBtn">Ganzen Lerntext lesen</button><button class="btn" id="reBlurtBtn">Erneut blurten</button><button class="btn ghost" id="backRes">Zurueck zur Auswertung</button></div>`;
  arBody().innerHTML=h;
  document.getElementById('arBack').onclick=renderResults;
  document.getElementById('backRes').onclick=renderResults;
  document.getElementById('reReadBtn').onclick=()=>{ arTimerStart=null; openLerntext(bi,ti); };
  document.getElementById('reBlurtBtn').onclick=()=>{ arDraft[dkey(bi,ti)]=''; arTimerStart=null; startBlurt(bi,ti); };

}
