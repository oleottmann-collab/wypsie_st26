ität, external etwa fortschreitende Rationalisierung oder engstirnige Vorgesetzte. Nun zeigt eine deutsche Studie, dass gerade die internal attribuierenden Arbeitslosen schneller wieder eine Stelle finden. Das klingt zunächst hart, ergibt aber Sinn: Wer die Ursache bei sich selbst sucht, sieht auch bei sich den Hebel und wird aktiv, während jemand, der alles auf äußere Mächte schiebt, eher resigniert. Eng verwandt ist die antizipierte Arbeitslosigkeit, also die bloße Angst vor dem Jobverlust. Borg unterscheidet hier affektive Befürchtungen, das diffuse Bangen, von kognitiven Bedenken, dem nüchternen Abwägen. Schon diese Unsicherheit senkt Leistung und Einstellung zur Arbeit, weil Betroffene sich innerlich zurückziehen, um einen möglichen Verlust besser zu verkraften.",". . ."]},{"h":"Die unsichtbare Wirtschaft: unbezahlte Arbeit und Volunteering","body":["Zum Schluss dieses Teils ein blinder Fleck der öffentlichen Debatte. Wenn wir von der Wirtschaft reden, meinen wir meist den formellen Sektor mit bezahlten, besteuerten Jobs. Der ist aber nur ein Ausschnitt. Unbezahlte Arbeit umfasst alle Tätigkeiten, die nicht entlohnt werden, obwohl sie es grundsätzlich könnten: Hausarbeit, Kinderbetreuung, Eigenarbeit am Haus, Nachbarschaftshilfe, Gemeinschaftsgärten. Der Oberbegriff dafür ist Selbstversorgungswirtschaft. Verwechsle das nicht mit der Schattenwirtschaft im engeren Sinn, die illegale Dinge meint, also Schwarzarbeit, Schmuggel, Drogenhandel. Die Zahlen sind verblüffend: In Deutschland wurden 2013 rund 89 Milliarden Stunden unbezahlt gearbeitet, mehr als die 66 Milliarden Stunden Erwerbsarbeit. Diese Leistung taucht im Bruttoinlandprodukt nicht auf, obwohl sie wesentlich zum Wohlstand beiträgt. Das BIP ist also ein lückenhaftes Maß für das, was eine Gesellschaft tatsächlich leistet.","Ein besonders interessanter Teil davon ist die Freiwilligenarbeit, das Volunteering. Sie passiert nicht spontan, sondern ist Ergebnis einer bewussten Entscheidung, und genau deshalb fragt man nach den Motiven. Clary und Kollegen nennen sechs psychologische Funktionen, die je nach Person unterschiedlich stark wirken. Man engagiert sich aus Werten wie Nächstenliebe, aus dem Wunsch nach Erfahrung und dem Einsatz brachliegender Fähigkeiten, für den eigenen Selbstwert und das persönliche Wachstum, für die Karriere, zur sozialen Anpassung, also um Beziehungen zu pflegen, und zum Schutz, um etwa Schuldgefühle zu mindern oder eigene Probleme zu bearbeiten. Meist liegen mehrere Motive gleichzeitig vor. Was die Aufgaben selbst attraktiv macht, ist an erster Stelle ihre Sinnhaftigkeit, dann die Autonomie, also genau die Merkmale, die in der bezahlten Arbeit oft hinter die reine Existenzsicherung zurücktreten. Organisiert ein Unternehmen solche Einsätze, spricht man von Corporate Volunteering.","Damit hast du die erste Hälfte von Block 6 beisammen. Präge dir für die Klausur drei Dinge besonders ein: erstens, dass Erwartungen ansteckend sind und Konjunkturprognosen deshalb scheitern; zweitens die fünf latenten Funktionen der Arbeit, die erklären, warum Arbeitslosigkeit so tief trifft; und drittens den Unterschied zwischen Selbstversorgungswirtschaft und Schattenwirtschaft. Im zweiten Teil geht es darum, wie der Staat Verhalten lenkt, und warum das bei kollektiven Problemen wie dem Klima an Grenzen stößt."]}],"raster":[{"kat":"PB","begriff":"Konjunkturindikatoren: vorlaufend / gleichlaufend / nachlaufend","warum":"Grundraster; Frühindikatoren sind das psychologisch Relevante","muss":true,"gew":7,"ktag":"","terms":["Konjunkturindikatoren"]},{"kat":"PB","begriff":"ICS (Konsumentenstimmung) vs. ifo/KOF/WIFO (Unternehmen)","warum":"Wer misst was; häufige Verwechslung","muss":false,"gew":4,"ktag":"","terms":["ICS","Konsumentenstimmung","KOF","WIFO","Unternehmen"]},{"kat":"PK","begriff":"Erwartungen treiben die Konjunktur, Menschen beeinflussen sich gegenseitig","warum":"Kernmechanismus des ganzen Konjunkturteils","muss":true,"gew":9,"ktag":"","terms":["Erwartungen","Konjunktur","Menschen","treiben","beeinflussen","gegenseitig"]},{"kat":"PZ","begriff":"Warum Prognose prinzipiell unmöglich (selbstzerstörende Vorhersage)","warum":"Zentrale Einsicht, Lernziel 1, Kontrollfrage 1","muss":true,"gew":8,"ktag":"","terms":["Prognose","Vorhersage","prinzipiell","unmöglich"]},{"kat":"PB","begriff":"Stimmungskongruente Informationsaufnahme + emotional contagion (Spiegelneurone)","warum":"Erklärt Persistenz und Ansteckung von Stimmungen","muss":true,"gew":5,"ktag":"","terms":["Stimmungskongruente","Informationsaufnahme","Spiegelneurone","emotional","contagion"]},{"kat":"KD","begriff":"Zirkularitätsproblem: Stimmung darf nicht am selben Verhalten gemessen werden wie Konjunktur","warum":"Typischer Denkfehler, sauberes Verständnis","muss":false,"gew":3,"ktag":"","terms":["Zirkularitätsproblem","Stimmung","Verhalten","Konjunktur"]},{"kat":"KD","begriff":"Keynes / Generationengerechtigkeit (Dozentenhinweis, [K])","warum":"Brücke zur Nachhaltigkeit, eigens hervorgehoben","muss":false,"gew":4,"ktag":"","terms":["Keynes","Generationengerechtigkeit","Dozentenhinweis"]},{"kat":"PK","begriff":"Folgen der Arbeitslosigkeit (34% vs. 16%, schlimmste Ursache, kausal)","warum":"Belegt Schwere und Kausalität","muss":true,"gew":7,"ktag":"","terms":["Folgen","Arbeitslosigkeit","Ursache"]},{"kat":"PZ","begriff":"Latente Funktionen der Arbeit (Jahoda) erklären das WARUM, nicht der Konsumverlust","warum":"Wichtigster Zusammenhang des AL-Teils","muss":true,"gew":9,"ktag":"","terms":["Latente","Funktionen","Arbeit","Jahoda","Konsumverlust"]},{"kat":"PB","begriff":"Die fünf latenten Funktionen (Zeitstruktur, soziale Erfahrung, kollektive Ziele, Status/Identität, regelm. Tätigkeit)","warum":"Klassische Prüfungsaufzählung, Kontrollfrage 3","muss":true,"gew":8,"ktag":"","terms":["Funktionen","Zeitstruktur","Erfahrung","Ziele","Status","Identität","Tätigkeit"]},{"kat":"PK","begriff":"Moderatoren der AL (Kirchler), v.a. Kontrollüberzeugung","warum":"Erklärt individuelle Unterschiede, Lernziel 3","muss":false,"gew":6,"ktag":"","terms":["Moderatoren","Kirchler","Kontrollüberzeugung"]},{"kat":"PZ","begriff":"Internal attribuierende finden schneller wieder Arbeit (Uhlendorff)","warum":"Paradox wirkender, aber prüfbarer Zusammenhang","muss":false,"gew":6,"ktag":"","terms":["Internal","Arbeit","Uhlendorff","attribuierende","finden","schneller","wieder"]},{"kat":"PB","begriff":"Antizipierte AL: affektive Befürchtungen vs. kognitive Bedenken (Borg)","warum":"Feinunterscheidung, gern gefragt","muss":false,"gew":4,"ktag":"","terms":["Antizipierte","Befürchtungen","Bedenken","Borg"]},{"kat":"PB","begriff":"Selbstversorgungswirtschaft vs. Schattenwirtschaft (legal vs. illegal)","warum":"Begriffsabgrenzung, leicht verwechselt","muss":true,"gew":6,"ktag":"","terms":["Selbstversorgungswirtschaft","Schattenwirtschaft"]},{"kat":"PZ","begriff":"Unbezahlte Arbeit > Erwerbsarbeit (Stunden), vom BIP nicht erfasst","warum":"BIP als lückenhaftes Wohlstandsmaß","muss":false,"gew":5,"ktag":"","terms":["Unbezahlte","Arbeit","Erwerbsarbeit","Stunden","BIP"]},{"kat":"PB","begriff":"Volunteering + sechs Funktionen (Clary); Sinnhaftigkeit und Autonomie","warum":"Lernziel 5, Kontrollfrage 4","muss":true,"gew":6,"ktag":"","terms":["Volunteering","Funktionen","Clary","Sinnhaftigkeit","Autonomie"]}],"fehler":["Konjunkturfolgen nur ökonomisch erklären: Arbeitslosigkeit trifft primär über die latenten Funktionen, nicht über das fehlende Geld.","ICS und ifo/KOF/WIFO vertauschen: ICS misst die Konsumentenstimmung, ifo/KOF/WIFO die Unternehmenserwartungen.","Attribution falsch herum erinnern: Nicht external, sondern internal attribuierende Arbeitslose finden schneller eine neue Stelle.","Selbstversorgungswirtschaft mit Schattenwirtschaft gleichsetzen: unbezahlte legale Arbeit ist nicht dasselbe wie Schwarzarbeit/Schmuggel.","Behaupten, Stimmungen erklärten die Konjunktur, obwohl die Stimmung am selben Verhalten gemessen wird (Zirkelschluss).","Nur drei oder vier latente Funktionen nennen; für das gute Niveau sollten alle fünf sitzen."]},{"title":"Verhalten lenken, von Nudges bis zum Klima","lernziel":"Verstehen, mit welchen Ansätzen der Staat Verhalten beeinflusst, warum sanftes Stupsen funktioniert und wo es an Grenzen stößt, und wie sich Globalisierung und Nachhaltigkeit als Probleme der Kooperation und der Identität begreifen lassen.","konzepte":"Regulierungsansätze, libertärer Paternalismus und Nudge, vier Themenbereiche und vier Werkzeuge des Stupsens, Grenzen der sanften Regulierung, sanfte Wohltätigkeit, Globalisierung und Arnetts vier Konsequenzen, Nachhaltigkeit, soziale Dilemmata und Public good games, Reziprozität, Greenwash und Interventionstechniken.","lesezeit":"etwa 13 bis 16 Minuten","sections":[{"h":"","body":["Im ersten Teil hast du gesehen, dass die Wirtschaft von Erwartungen und Stimmungen getrieben wird. Jetzt drehen wir die Perspektive um und fragen: Wenn Menschen so vorhersehbar von Psychologie geleitet werden, kann der Staat das nutzen, um sie zu besserem Verhalten zu bewegen? Die Antwort lautet ja, aber mit wichtigen Einschränkungen, und genau diese Einschränkungen sind das Klausurrelevante."]},{"h":"Vier Wege, Märkte zu lenken","body":["Regulierung meint alle staatlichen Maßnahmen, die dafür sorgen, dass Märkte im Sinne politischer und gesellschaftlicher Ziele funktionieren. Dafür gibt es vier Werkzeugkästen. Der erste sind schlichte Gebote und Verbote. Der zweite sind marktwirtschaftliche Instrumente, etwa Lenkungssteuern auf Alkohol, Tabak oder Energie, die ein Verhalten verteuern, ohne es zu verbieten. Der dritte ist die Lenkung des Verhaltens über psychologische Einsichten. Und der vierte, eine Zuspitzung des dritten, ist der libertäre Paternalismus. In den letzten Jahren sind vor allem die letzten beiden populär geworden. Viele Regierungen haben eigene Verwaltungseinheiten geschaffen, um Regulierung mit psychologischem Wissen so zu verfeinern, dass man Ziele mit möglichst wenigen Verboten erreicht. Ausgelöst haben das der Rechtswissenschaftler Cass Sunstein und der Verhaltensökonom Richard Thaler, die die Begriffe libertarian paternalism und Nudge, also Stupser, geprägt haben.","Den Begriff libertärer oder sanfter Paternalismus solltest du wörtlich draufhaben, denn der Dozent hat ihn eigens hervorgehoben. Er bezeichnet einen Ansatz, der die Entscheidungen von Individuen zu deren eigenem Vorteil in bestimmte Richtungen lenkt, ohne die Wahlfreiheit einzuschränken. Das Wort paternalistisch steckt drin, weil jemand entscheidet, was gut für dich ist; das Wort libertär, weil du jederzeit anders könntest. Ein Nudge schubst, er zwingt nicht."]},{"h":"Warum Stupsen überhaupt wirkt","body":["Damit du nicht nur weißt, dass Nudges wirken, sondern auch warum, hat Sunstein die zugrunde liegenden Erkenntnisse vier Themenbereichen zugeordnet. Erstens die Trägheit und das Aufschieben. Wir verschieben unangenehme Dinge, und das schadet Gesundheit, Finanzen oder politischer Beteiligung. Vorgegebene Standards und einfache Handlungsanweisungen helfen; die Aufforderung, sich impfen zu lassen, wirkt besser, wenn gleich mitgeteilt wird, wann und wo. Zweitens die Darstellung, das Framing, und die Salienz. Wie eine Information präsentiert wird, verändert das Verhalten. Der Hinweis auf einen Geldverlust beim Kauf ineffizienter Geräte wirkt stärker als der Hinweis auf einen Gewinn bei sparsamen, und ein Joghurt mit 80 Prozent fettfrei verkauft sich besser als einer mit 20 Prozent Fett, obwohl es dasselbe ist. Drittens die sozialen Einflüsse. Was wir für die Norm in unserer Gemeinschaft halten, lenkt uns stark, gerade in unsicheren Situationen, und Kooperation beruht auf Fairness und der Erwartung, dass andere ebenfalls mitziehen. Viertens unsere Schwierigkeiten mit Wahrscheinlichkeiten. Menschen neigen zu unrealistischem Optimismus, schätzen das eigene Risiko zu niedrig ein und konzentrieren sich, besonders unter starken Emotionen, auf das Ergebnis statt auf dessen Wahrscheinlichkeit.","Aus diesen vier Einsichten ergeben sich vier besonders wirksame Werkzeuge, und auch diese Liste ist Prüfungsstoff. Erstens Deklarationspflichten, die informierte Entscheidungen ermöglichen, etwa die Warnbilder auf Zigarettenpackungen oder die Energieetiketten auf Geräten. Zweitens vorgegebene Standardoptionen, die Defaults, und hier kommt das eindrücklichste Beispiel des ganzen Kapitels: die Organspende. In Ländern mit einer Widerspruchslösung, dem Opt-out, bei dem Zustimmung angenommen wird, solange niemand aktiv widerspricht, sind über 90 Prozent zur Spende bereit. In Ländern mit einer Zustimmungslösung, dem Opt-in, wie in Deutschland, der Schweiz und den USA, geben in den USA nur 28 Prozent ihre Organe explizit frei. Dieselben Menschen, dieselbe Grundeinstellung, völlig andere Ergebnisse, nur weil die Voreinstellung anders ist. Drittens die Erhöhung der Salienz: In den USA senkt eine separat ausgewiesene Alkoholsteuer den Konsum stärker, als wenn sie schon im Preis steckt, weil sie sichtbarer ist. Viertens die Unterstützung sozialer Normen, indem man auf das Verhalten der Mehrheit hinweist. Hier lauert aber eine Falle, die du dir merken solltest: Lenkt man die Aufmerksamkeit auf ein verbreitetes Fehlverhalten, etwa indem man betont, wie viele Menschen Steuern hinterziehen oder im Park Müll liegen lassen, kann man dieses Verhalten sogar verstärken, weil es dann normal erscheint."]},{"h":"Wo das sanfte Stupsen an Grenzen stößt","body":["Nun der kritische Teil, und der ist mindestens so wichtig wie die Werkzeuge selbst. Nudges sind populär und können viel Schaden vermeiden, wo Urteilsfehler und Selbstkontrollprobleme zu schlechten Entscheidungen führen. Aber sie sind kein Allheilmittel. Kalorienangaben auf Speisekarten in New York und Informationen zum Stromverbrauch in Großbritannien blieben enttäuschend wirkungslos. Vor allem bei sozialen Dilemmata, bei denen individuelle Fehlentscheidungen öffentliche Kosten verursachen, sind verbindliche Lenkungsabgaben oft die bessere Wahl als unverbindliche Stupser.","Hier hilft eine feine, aber wichtige Unterscheidung, die das Lehrbuch als Exkurs führt. Was man gemeinhin sanften Paternalismus nennt, zerfällt eigentlich in zwei Dinge. Der sanfte Paternalismus im engeren Sinn lenkt die Menschen zu ihrem eigenen Vorteil, etwa mit Warnhinweisen auf Zigaretten oder der Vorschrift, dass Schulkantinen Süßigkeiten nicht zuvorderst präsentieren. Die sanfte Wohltätigkeit dagegen lenkt das Verhalten zum Vorteil der Allgemeinheit, ohne es einzufordern, etwa die angenommene Spendenbereitschaft oder die automatische Lieferung von teurerem Ökostrom an alle, die nicht widersprechen. Diese zweite Variante ist heikler, denn sie lädt zum Trittbrettfahren ein: Die ökonomisch Cleveren steigen aus und profitieren auf Kosten der schlecht Informierten, der Trägen und derjenigen, die ihren fairen Beitrag leisten wollen. Genau deshalb gilt: Wo öffentliche Güter im Spiel sind, sind verbindliche Regeln oft fairer und manchmal unvermeidbar.",". . ."]},{"h":"Globalisierung verändert nicht nur Märkte, sondern Identitäten","body":["Globalisierung ist nichts Neues, sie läuft seit Jahrhunderten, hat sich aber durch billige Kommunikation und billigen Transport stark beschleunigt. Die Zahl der Mobilfunkverträge stieg von 738 Millionen im Jahr 2000 auf 7 Milliarden 2015, die der Internetnutzer von 400 Millionen auf 3,2 Milliarden. Wirtschaftlich führt das zu globaler Arbeitsteilung und globalem Wettbewerb. Unternehmen sind nicht mehr an einen Standort gebunden und optimieren ihre Kosten über viele Länder, sodass auch Arbeitskräfte und ganze Standorte in den Wettbewerb geraten. Textilarbeiterinnen in der Türkei konkurrieren mit solchen in Bangladesch. Das verbilligt Konsumgüter und steigert den materiellen Wohlstand, hat aber Schattenseiten: Volkswirtschaften verlieren Gestaltungsspielraum, es entsteht Druck, Steuern sowie Sozial- und Umweltstandards niedrig zu halten, und internationale Konzerne lassen sich schwer besteuern. Solange die Globalisierung der Standards der Globalisierung der Märkte hinterherhinkt, gibt es gute Gründe für Globalisierungskritik.","Psychologisch am interessantesten ist aber eine andere Konsequenz. Nach Arnett verändert die Globalisierung die Identitäten der Menschen, und er nennt vier Folgen. Erstens entstehen bikulturelle Identitäten: Viele Jugendliche wachsen mit einem globalen Bewusstsein auf, halten aber privat an ihrer lokalen Identität fest, was Beweglichkeit bringt, aber auch innere Spannungen. Zweitens kommt es zu Identitätskonflikten, wenn die Anpassung misslingt; das Vertrauen in die eigene Kultur geht verloren, die globale bleibt unerreichbar, und besonders dort, wo die Unterschiede groß sind, steigen die Raten von Depression, Suizid, Drogenkonsum und Gewalt unter jungen Menschen. Drittens gibt es selbstgewählte Kulturen: Identität beruht weniger auf vorgegebenen Rollen als auf eigenen Entscheidungen, und manche schließen sich Gruppen an, die mehr Sinn und Struktur bieten, oft religiös-fundamentalistisch, manchmal aber auch säkular wie die Heavy-Metal-Szene. Viertens dehnt sich die Phase des beginnenden Erwachsenseins aus, das emerging adulthood, in der junge Leute Ausbildungen, Beziehungen und Weltbilder ausprobieren. Diese vier Konsequenzen sind ein typischer Prüfungsblock. Der zentrale Satz, an dem du sie aufhängst, lautet: Globalisierung ist nicht nur ein ökonomischer, sondern ein Identitätsprozess.",". . ."]},{"h":"Nachhaltigkeit ist im Kern ein Kooperationsproblem","body":["Damit sind wir beim letzten und vielleicht wichtigsten Thema. Nachhaltigkeit heißt, die Bedürfnisse der Gegenwart zu befriedigen, ohne die Möglichkeiten künftiger Generationen zu beeinträchtigen; so lautet die vielzitierte Definition der WCED von 1987. Diesen Satz solltest du sinngemäß wiedergeben können. Doch warum verhalten wir uns so oft nicht nachhaltig? Die Antwort des Kapitels ist klar: wegen sozialer Dilemmata, also Konflikten zwischen Eigennutz und Gemeinnutz. Für den Einzelnen ist es oft rational, die Folgen des eigenen Handelns für andere, für die Umwelt oder für künftige Generationen zu ignorieren. Es lohnt sich, den Abfall auf die Straße zu werfen, solange nur wenige das tun. Würden es alle tun, litten alle. Aus kollektiver Sicht braucht es also Regeln. Unter Ökonomen dominiert die Ansicht, Nachhaltigkeit erreiche man am besten durch geänderte Regeln, vor allem durch Anreize wie eine CO2-Abgabe. Viele Psychologen halten dagegen, es brauche vor allem eine Änderung der sozialen Normen. Wer recht hat, hängt von den Bedingungen ab.","Um das zu klären, haben Verhaltensökonomen unzählige Experimente gemacht, die Public good games. Dabei legen Personen einen Teil ihres Startkapitals in eine gemeinsame Kasse, deren Inhalt anschließend verdoppelt und gleichmäßig verteilt wird. Die reine ökonomische Theorie sagt voraus, dass niemand etwas einzahlt, weil sich Trittbrettfahren immer lohnt. Die Realität sieht anders aus: Die Beiträge liegen im Mittel zwischen 40 und 60 Prozent. Sie sinken bei mehrmaliger Wiederholung, bleiben aber über null; sie sind höher mit festen als mit zufälligen Partnern; sie steigen, wenn man sich sehen oder miteinander reden kann; und sie steigen, wenn man unkooperative Mitspieler bestrafen darf, selbst wenn das den Bestrafenden etwas kostet. Daraus folgt eine schöne Erkenntnis: Die meisten Menschen sind weder reine Egoisten noch bedingungslose Heilige, sondern bedingt kooperativ. Sie kooperieren, sofern die anderen es auch tun. Diese Norm der Gegenseitigkeit, die Reziprozität, ist der Schlüssel zum ganzen Thema. Kooperation gelingt in überschaubaren, nicht anonymen Situationen leicht, zwischen einem Landwirt und einem Imker etwa, in anonymen Märkten dagegen kaum, sodass es dort verbindliche Regeln braucht.","Genau dieses Dilemma macht das Seminar mit einem Spiel erfahrbar. Vier Gruppen entscheiden sich in jeder Runde geheim für Strategie X oder Y, ohne miteinander zu reden. Wählen alle vier X, verlieren alle 10 Euro. Bei drei X und einem Y verliert jedes X 10 Euro, das eine Y gewinnt 30. Bei zwei zu zwei gewinnen die X je 20 und die Y verlieren je 20. Bei einem X und drei Y gewinnt das X 30, die Y verlieren je 10. Wählen alle Y, gewinnen alle 10. Strategie X ist also die Defektion, der Eigennutz, Strategie Y die Kooperation. Individuell lohnt sich X in fast jeder gemischten Konstellation, kollektiv ist aber das gemeinsame Y optimal, während das gemeinsame X allen schadet. Es ist ein N-Personen-Gefangenendilemma. Gespielt werden zehn Runden mit Startkapital, und in einzelnen Runden verfünf- oder verzehnfachen Bonusmultiplikatoren den Einsatz, was die Versuchung zur Defektion am Ende stark erhöht. Das Seminar nennt als Anwendung das Scheitern von Klimaverhandlungen am Gefangenendilemma und schließt mit dem Verweis auf eine Wirtschaft, die sich an der Natur orientiert. Du siehst sofort, dass dieses Spiel exakt die Befunde der Public good games illustriert.","Dass das nicht nur Laborspielerei ist, zeigt eine Studie von Bechtel und Scheve. Sie befragten je 2000 Menschen in Deutschland, Frankreich, Großbritannien und den USA, welche Merkmale einer globalen Klimavereinbarung ihre Unterstützung beeinflussen. Eine Rolle spielten die Kosten, die Anzahl der mitmachenden Länder, deren Emissionsanteil, die Höhe der Sanktionen und die Art der Kontrolle. Den stärksten Effekt neben den Kosten hatte die Anzahl der kooperierenden Länder. Mit anderen Worten: Reziprozität wirkt auch im ganz Großen. Viele Menschen sind bereit, ihren Teil beizutragen, wenn ihre Regierung sicherstellt, dass die anderen Länder ebenfalls liefern. Die Psychologie unterstützt die Kooperationsbereitschaft, aber die Koordination braucht formale Regeln und notfalls Sanktionen.","Bleibt die Frage, woran nachhaltiges Verhalten im Alltag scheitert. Auf der Herstellerseite lohnt sich Nachhaltigkeit oft nur, wenn sie sich rechnet, durch Imagegewinn oder Vorsprung; andernfalls bleibt sie ein Nischendasein, oder man bedient das gute Gewissen der Kundschaft nur oberflächlich, was man Greenwash nennt. Auf der Verbraucherseite klafft eine große Lücke zwischen Einstellung und Verhalten. In Befragungen geben sich viele sehr umweltbewusst, handeln aber erst, wenn soziale Normen oder die Kontrolle des Umfelds nachhelfen. Nach van Raaij entscheiden drei Faktoren, ob aus Einstellung Verhalten wird: ob man eine persönliche Verantwortung akzeptiert, ob man sich informiert, und wie man Vor- und Nachteile abwägt, beeinflusst vom regulatorischen und sozialen Umfeld. Wichtig ist auch Rückmeldung über den Erfolg, denn sie stärkt die Kontrollüberzeugung; deshalb führt die Meldung hoher Recyclingquoten nicht zu weniger, sondern zu mehr Recycling. Homburg und Matthies schließlich unterscheiden situative Interventionen, also technische Erleichterungen und finanzielle Anreize, von persönlichen, also Wissen und Normen. Situative Maßnahmen wirken sicher, können aber Trotzreaktionen, also Reaktanz, auslösen. Reine Wissensvermittlung reicht selten. Und auf finanzielle Anreize zu verzichten, wäre falsch, denn bei Pfand oder Lenkungsabgaben geht es nicht ums Bestrafen, sondern darum, dass jeder die vollen Kosten seines Konsums trägt statt sie auf andere abzuwälzen, was schlicht fair ist.","Die Botschaft, mit der du Block 6 verlassen solltest, ist unbequem, aber ehrlich: Appelle an die individuelle Moral reichen nicht, weil unsere Kooperationsbereitschaft auf Gegenseitigkeit beruht und diese auf anonymen Märkten zusammenbricht. Deshalb braucht es faire Regeln, um genau die Normen am Leben zu halten, auf die wir uns sonst gern verlassen würden. Für die Klausur sind die heißesten Kandidaten dieses Teils der libertäre Paternalismus mit seinen vier Werkzeugen, die Unterscheidung zwischen sanftem Paternalismus und sanfter Wohltätigkeit, Arnetts vier Globalisierungsfolgen und die Logik der sozialen Dilemmata samt der 40-bis-60-Prozent-Regel der Public good games."]}],"raster":[{"kat":"PB","begriff":"Libertärer/sanfter Paternalismus: lenkt zum eigenen Vorteil, ohne die Wahlfreiheit einzuschränken ([K])","warum":"Vom Dozenten eigens hervorgehoben, wörtlich können","muss":true,"gew":9,"ktag":"","terms":["Libertärer","Paternalismus","Vorteil","Wahlfreiheit","sanfter"]},{"kat":"PB","begriff":"Nudge (Stupser); schubst, zwingt nicht","warum":"Grundbegriff der psychologischen Regulierung","muss":true,"gew":6,"ktag":"","terms":["Nudge","Stupser"]},{"kat":"PK","begriff":"Vier Regulierungsansätze (Gebote/Verbote, marktwirtsch. Instrumente, psych. Lenkung, libertärer Paternalismus)","warum":"Ordnungsrahmen des Regulierungsteils","muss":false,"gew":6,"ktag":"","terms":["Regulierungsansätze","Gebote","Verbote","Instrumente","Lenkung","Paternalismus"]},{"kat":"PB","begriff":"Vier Werkzeuge: Deklaration, Standardoptionen/Defaults, Salienz, Normen ([K])","warum":"Eigens hervorgehoben (Folie 150), Prüfungsliste","muss":true,"gew":9,"ktag":"","terms":["Werkzeuge","Deklaration","Standardoptionen","Defaults","Salienz","Normen"]},{"kat":"PK","begriff":"Vier Themenbereiche, warum Nudging wirkt (Trägheit, Framing/Salienz, soziale Einflüsse, Wahrscheinlichkeiten)","warum":"Begründung der Wirkung, Kontrollfrage 5","muss":false,"gew":6,"ktag":"","terms":["Themenbereiche","Nudging","Trägheit","Framing","Salienz","Einflüsse","Wahrscheinlichkeiten"]},{"kat":"KD","begriff":"Organspende: Opt-out > 90% vs. Opt-in USA 28%","warum":"Eindrücklichstes Default-Beispiel","muss":true,"gew":7,"ktag":"","terms":["Organspende","Opt-out","Opt-in","USA"]},{"kat":"KD","begriff":"Cialdini-Falle: Fehlverhalten betonen kann es verstärken","warum":"Wichtige Einschränkung beim Werkzeug Normen","muss":false,"gew":4,"ktag":"","terms":["Cialdini-Falle","Cialdini","Falle","Fehlverhalten"]},{"kat":"PZ","begriff":"Grenzen der Nudges: bei sozialen Dilemmata sind Lenkungsabgaben/Regeln passender","warum":"Kritische Würdigung, klausurrelevant","muss":true,"gew":7,"ktag":"","terms":["Grenzen","Nudges","Dilemmata","Lenkungsabgaben","Regeln"]},{"kat":"PZ","begriff":"Sanfter Paternalismus vs. sanfte Wohltätigkeit (Trittbrettfahren, öffentliche Güter)","warum":"Beliebte, anspruchsvolle Abgrenzung","muss":false,"gew":7,"ktag":"","terms":["Sanfter","Paternalismus","Wohltätigkeit","Trittbrettfahren","sanfte"]},{"kat":"PB","begriff":"Globalisierung: Treiber (Kommunikation, Transport), Schattenseiten, Standards hinken hinterher","warum":"Kontrollfragen 7/9/10","muss":false,"gew":5,"ktag":"","terms":["Globalisierung","Treiber","Kommunikation","Transport","Schattenseiten","Standards"]},{"kat":"PB","begriff":"Arnett: vier Konsequenzen (bikulturelle Identität, Identitätskonflikte, selbstgewählte Kulturen, emerging adulthood)","warum":"Identitätswandel, Kontrollfrage 10","muss":true,"gew":7,"ktag":"","terms":["Arnett","Konsequenzen","Identität","Identitätskonflikte","Kulturen"]},{"kat":"PZ","begriff":"Globalisierung verändert nicht nur Märkte, sondern Identitäten","warum":"Psychologischer Kern des Globalisierungsteils","muss":true,"gew":6,"ktag":"","terms":["Globalisierung","Märkte","Identitäten","verändert","nicht","sondern"]},{"kat":"PB","begriff":"WCED-Definition der Nachhaltigkeit (Bedürfnisse der Gegenwart ohne künftige zu beeinträchtigen)","warum":"Standarddefinition, oft wörtlich gefragt","muss":true,"gew":7,"ktag":"","terms":["WCED-Definition","WCED","Definition","Nachhaltigkeit","Bedürfnisse","Gegenwart"]},{"kat":"PK","begriff":"Soziale Dilemmata = Konflikt Eigennutz vs. Gemeinnutz","warum":"Hauptgrund nicht nachhaltigen Verhaltens","muss":true,"gew":8,"ktag":"","terms":["Soziale","Dilemmata","Konflikt","Eigennutz","Gemeinnutz"]},{"kat":"KD","begriff":"Public good games: Beiträge 40 bis 60% (nicht 0, nicht 100)","warum":"Empirischer Kernbefund","muss":true,"gew":7,"ktag":"","terms":["Public","Beiträge","good","games"]},{"kat":"PZ","begriff":"Reziprozität / bedingte Kooperation; auch global (Bechtel/Scheve: Anzahl kooperierender Länder)","warum":"Verbindet Labor und Klimapolitik","muss":true,"gew":8,"ktag":"","terms":["Reziprozität","Kooperation","Bechtel","Scheve","Anzahl","Länder","bedingte"]},{"kat":"KD","begriff":"Seminar-Spiel: X = Defektion, Y = Kooperation; N-Personen-Gefangenendilemma","warum":"Seminarinhalt, Transfer auf Klimaverhandlungen","muss":false,"gew":5,"ktag":"","terms":["Seminar-Spiel","Seminar","Spiel","Defektion","Kooperation","N-Personen-Gefangenendilemma","Personen"]},{"kat":"PK","begriff":"Greenwash + Einstellungs-Verhaltens-Lücke; van Raaij drei Faktoren","warum":"Warum Umweltbewusstsein selten in Verhalten mündet","muss":false,"gew":4,"ktag":"","terms":["Greenwash","Einstellungs-Verhaltens-Lücke","Einstellungs","Verhaltens","Lücke","Raaij","Faktoren"]},{"kat":"PZ","begriff":"Appelle an Moral reichen nicht; faire Regeln nötig, um Reziprozitätsnormen zu erhalten","warum":"Schlussbotschaft des Blocks","muss":true,"gew":7,"ktag":"","terms":["Appelle","Moral","Regeln","Reziprozitätsnormen","reichen","nicht","faire"]}],"fehler":["Vier Themenbereiche (warum Nudging wirkt) mit den vier Werkzeugen (Deklaration, Defaults, Salienz, Normen) verwechseln.","Nudge mit Verbot oder Zwang gleichsetzen und die erhaltene Wahlfreiheit vergessen.","Opt-in und Opt-out vertauschen; die Opt-out-Widerspruchslösung führt zur hohen Spendenbereitschaft.","Sanften Paternalismus (zum eigenen Vorteil) und sanfte Wohltätigkeit (zum Vorteil der Allgemeinheit, Trittbrettfahrerproblem) nicht trennen.","Bei Public good games die ökonomische Vorhersage (Beitrag null) für das tatsächliche Ergebnis halten; real sind es 40 bis 60 Prozent.","Strategie X und Y im Seminar-Spiel vertauschen (X ist Defektion, Y ist Kooperation).","Annehmen, ein Normen-Nudge wirke immer positiv; das Betonen von Fehlverhalten kann es verstärken (Cialdini).","Globalisierung rein ökonomisch erzählen und Arnetts Identitätsfolgen weglassen."]}]},{"key":"Block7","label":"Block 7 · Entwicklung, Schluss & Ethik","color":"#cf8f3a","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Entwicklung der Märkte und Wertewandel","lernziel":"Verstehen, welche psychologischen Voraussetzungen wirtschaftlichen Aufbruch tragen, wie Menschen auf Wandel reagieren und wie sich Werte wandeln.","konzepte":"Max Weber und Bandura, Reaktionen auf Wandel und Maschinenstürmer, Schweizer Landwirtschaft, Werte und Einstellungen (Rokeach), Ingleharts Knappheits- und Sozialisierungshypothese, mehrdimensionaler Wertewandel, Grenzen des Nachweises.","lesezeit":"etwa 11 bis 13 Minuten","sections":[{"h":"Was wirtschaftlichen Aufbruch antreibt","body":["Block 7 schließt das Lehrbuch ab und behandelt drei große Themen: die Entwicklung von Märkten und Werten, die Frage nach Wohlstand und Glück, und schließlich die Ethik. Beginnen wir mit der Frage, warum manche Gesellschaften wirtschaftlich aufbrechen. Dafür gibt es zwei ganz verschiedene Erklärungen, die du nicht vermischen solltest. Max Weber führte den Aufschwung 1934 auf die protestantische, calvinistische Ethik zurück: Wenn Leistung und Erfolg im Diesseits als Zeichen göttlicher Gunst gelten, gibt das dem Unternehmertum Auftrieb. Bandura erklärt dasselbe Phänomen 1977 lerntheoretisch über die differenzielle Verstärkung: Gesellschaften belohnen und bestrafen Verhalten, und wo Unternehmer hohes Ansehen genießen und Misserfolg akzeptiert wird, etwa in der fehlertoleranten Start-up-Kultur des Silicon Valley, entsteht Innovation. Wichtig ist die Balance, denn übertriebene Fehlertoleranz senkt wieder die Motivation."]},{"h":"Wie Menschen auf Wandel reagieren","body":["Wandel löst typische Reaktionen aus, im Konsum wie in der Produktion. Im Konsum werden technische Neuerungen rasch angenommen, gleichzeitig sind aber althergebrachte Produkte gefragt, von Retro und Vintage bis zur Selbstversorgung, als Gegenreaktion auf Tempo und Technisierung, vor allem in städtisch-aufgeschlossenen Milieus. In der Produktion gab es Widerstand bis zum Anzünden von Fabriken durch die Maschinenstürmer, was Fichter ausdrücklich als Beispiel nennt. Geändert hat dieser Widerstand wenig, und der bekämpfte Wandel erwies sich oft als Segen, etwa die Mechanisierung der Textilindustrie, die in die Industrialisierung und steigenden Wohlstand mündete. Die Lehre: Mehrwert-Technologien sind kaum aufzuhalten, aber Proteste können konstruktiv dazu beitragen, den Wandel fair zu gestalten.","Wie stark soziale Normen rationales Wirtschaften verhindern können, zeigt die Studie zur Schweizer Landwirtschaft. Hochleistungskühe und Kraftfutter steigern die Milchmenge, doch der Preis halbierte sich in zwanzig Jahren, und die Einkommen sind tief. Eine extensive Weidehaltung ohne Kraftfutter wäre bei diesen Preisen wirtschaftlicher, teils mit doppeltem Einkommen pro Arbeitsstunde, dennoch hält man an der Intensivproduktion fest, um unter Berufskollegen nicht als Außenseiter zu gelten. Futtermittel- und Maschinenhändler verstärken das über Schulen und Medien. Hier verhindert eine soziale Norm das ökonomisch rationale Verhalten."]},{"h":"Werte, Einstellungen und der Wertewandel","body":["Damit zum Wertewandel, und zuerst zu einer Begriffsunterscheidung nach Rokeach, die du sicher beherrschen solltest. Werte sind allgemeine Leitlinien des Verhaltens, nicht auf bestimmte Objekte bezogen, weshalb es nur wenige gibt. Einstellungen sind dagegen objektbezogen und daher zahlreich. Die Ableitungskette läuft von den Werten über die Einstellungen zum Verhalten, und Wertewandel misst man vor allem über regelmäßige Umfragen. Ingleharts These ist eine Wertsubstitution von materiellen zu postmateriellen Werten wie Selbstentfaltung und Autonomie, vor allem bei Jüngeren. Er erklärt sie mit zwei Hypothesen, die man leicht verwechselt. Die Knappheitshypothese besagt, dass wertvoll ist, was knapp ist, sodass der Wandel sofort mit steigendem Wohlstand eintreten kann. Die Sozialisierungshypothese besagt, dass uns die frühen Lebensjahre prägen, sodass der Wandel erst im Generationenwechsel sichtbar wird, weil, wer als Kind Entbehrung erlitt, materiellen Gütern verbunden bleibt. Beide Prozesse schließen sich nicht aus.","Meulemann und Wiswede halten gegen Ingleharts eindimensionale Sicht und betonen einen mehrdimensionalen Wandel: In der Arbeit verlieren Pflicht und Disziplin zugunsten hedonistischer und intrinsischer Werte wie Selbstverwirklichung, was einen kooperativen Führungsstil verlangt; im Konsum zeigen sich Sublimierung, Individualisierung und ein hybrider Konsum von Luxus neben Bescheidenheit. Eine wichtige Mahnung zum Schluss: Wertewandel ist schwer nachzuweisen, weil sich oft nur Verhalten oder Lebensstile ändern, nicht die Werte selbst. Die gesunkene Toleranz gegenüber Steuerhinterziehung etwa ist kein neuer Wert, sondern eine Folge veränderter Umstände wie hoher Staatsverschuldung. Relativ gut belegt sind nur die Tendenzen zu Autonomie und Hedonismus."]}],"raster":[{"kat":"PB","begriff":"Max Weber (protestantische Ethik) vs. Bandura (Lerntheorie)","warum":"zwei Erklärungen für wirtschaftlichen Aufbruch","muss":true,"gew":6,"ktag":"","terms":["Weber","Ethik","Bandura","Lerntheorie"]},{"kat":"PB","begriff":"Werte vs. Einstellungen (Rokeach)","warum":"wenige/allgemein vs. viele/objektbezogen","muss":true,"gew":6,"ktag":"","terms":["Werte","Einstellungen","Rokeach"]},{"kat":"PZ","begriff":"Inglehart: Knappheits- vs. Sozialisierungshypothese","warum":"sofort vs. erst im Generationenwechsel","muss":true,"gew":7,"ktag":"","terms":["Inglehart","Knappheits-","Knappheits","Sozialisierungshypothese"]},{"kat":"KD","begriff":"Wertewandel schwer nachweisbar","warum":"oft nur Verhalten und Umstände, nicht die Werte","muss":true,"gew":5,"ktag":"","terms":["Wertewandel","schwer","nachweisbar"]},{"kat":"KD","begriff":"Reaktionen auf Wandel; Maschinenstürmer","warum":"Widerstand vs. späterer Segen","muss":false,"gew":4,"ktag":"","terms":["Reaktionen","Wandel","Maschinenstürmer"]},{"kat":"KD","begriff":"Schweizer Landwirtschaft","warum":"soziale Norm verhindert rationales Verhalten","muss":false,"gew":4,"ktag":"","terms":["Schweizer","Landwirtschaft"]},{"kat":"KD","begriff":"Mehrdimensionaler Wertewandel (Meulemann/Wiswede)","warum":"Arbeit und Konsum, kooperativer Stil","muss":false,"gew":4,"ktag":"","terms":["Mehrdimensionaler","Wertewandel","Meulemann","Wiswede"]}],"fehler":["Max Weber und Bandura als dieselbe Erklärung behandeln statt als zwei verschiedene.","Knappheits- und Sozialisierungshypothese vertauschen (sofortiger Wandel vs. Generationenwechsel).","Werte und Einstellungen gleichsetzen statt nach Allgemeinheit und Objektbezug zu trennen.","Jeden geänderten Lebensstil vorschnell als Wertewandel deuten."]},{"title":"Wohlstand, Glück und Lebenszufriedenheit","lernziel":"Verstehen, warum mehr Wohlstand nicht dauerhaft glücklicher macht, und die zentralen Begriffe und Befunde der Glücksforschung sicher auseinanderhalten.","konzepte":"Wohlstand, Lebensqualität, Nutzen und Erfahrungsnutzen, zwei Grenzen des Nutzenkonzepts, Lebenszufriedenheit vs. emotionales Wohlbefinden, 75.000-Dollar-Sättigung, Easterlin-Paradox, Adaptation und soziale Vergleiche, hedonische Tretmühle, positionale Güter und Geltungskonsum.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"Wohlstand, Nutzen und ihre Tücken","body":["Der zweite große Themenkreis ist das Verhältnis von Wohlstand und Glück, und hier lohnt zuerst eine saubere Begriffsklärung. Der Wohlstand ist der am Einkommen gemessene materielle Lebensstandard. Die Lebensqualität ist ein breiteres, multidimensionales Konstrukt mit Indikatoren wie Einkommen und Lebenserwartung. Der Nutzen meint entweder den Wert im Sinne der maximalen Zahlungsbereitschaft oder das Nutzenniveau, das über Entscheidungen definiert ist, selbst aber nicht messbar. Der Erfahrungsnutzen schließlich ist das tatsächlich erlebte Nutzenniveau, das sich erst nach der Entscheidung bestimmen lässt. Das traditionelle ökonomische Nutzenkonzept hat dabei zwei wesentliche Schwächen. Erstens lässt sich nicht empirisch prüfen, ob Entscheidungen den Nutzen wirklich erhöhen, denn die Annahme der Nutzenmaximierung schließt nutzenmindernde Entscheidungen von vornherein aus; erst die Verhaltensökonomie zieht über den Erfahrungsnutzen das Gegenteil in Betracht. Zweitens sind nur Veränderungen über Zahlungsbereitschaften messbar, nicht die Nutzenniveaus selbst, sodass am Ende das Einkommen oder das Bruttoinlandsprodukt die einzige messbare Zielgröße bleibt."]},{"h":"Lebenszufriedenheit ist nicht emotionales Wohlbefinden","body":["Jetzt zu einer Unterscheidung, die das Lehrbuch ausdrücklich betont und die hohe Verwechslungsgefahr birgt. Die Lebenszufriedenheit ist die kognitive Bewertung der eigenen Lebenssituation, erhoben über Standardfragen, im Englischen life evaluation. Das emotionale Wohlbefinden ist das aktuelle Glückserleben, die momentane Stimmung, erhoben über die Experience sampling method oder die Day reconstruction method, im Englischen hedonic. Der berühmte Befund von Kahneman und Deaton aus dem Jahr 2010: Das emotionale Wohlbefinden steigt mit dem Einkommen nur bis etwa 75.000 Dollar, dann tritt eine Sättigung ein, während die Lebenszufriedenheit auch von 100.000 auf 200.000 weiter steigt. Halte das genau auseinander, denn die 75.000-Dollar-Sättigung gilt nur fürs emotionale Wohlbefinden. Auch die Korrelate unterscheiden sich: Einkommen und Ausbildung wirken eher auf die Zufriedenheit, Gesundheit, Einsamkeit und Rauchen eher auf das emotionale Wohlbefinden."]},{"h":"Das Easterlin-Paradox und die hedonische Tretmühle","body":["Der zentrale Befund dieses Themenkreises ist das Easterlin-Paradox von 1974. Im Querschnitt gibt es einen positiven Zusammenhang, reichere Menschen und reichere Länder sind zufriedener. Im Längsschnitt aber verschwindet dieser Zusammenhang, denn trotz stark gestiegenem Wohlstand steigt die Zufriedenheit über die Zeit nicht. Präg dir die Richtung genau ein: Querschnitt positiv, Längsschnitt verschwindet, nicht umgekehrt. In entwickelten Ländern erklärt das Einkommen nur zwei bis fünf Prozent der Zufriedenheitsunterschiede. Erklärt wird das Paradox über zwei Prozesse. Erstens die Adaptation, also die Gewöhnung: Der Effekt veränderter Umstände verschwindet, und die Dauer von Gefühlen wird überschätzt. Zweitens die sozialen Vergleiche: Es zählt der relative Status, und das Anspruchsniveau steigt mit der Vergleichsgruppe, evolutionspsychologisch, weil früher der relative Vorrat zählte. Beide zusammen ergeben die hedonische Tretmühle, das Bild vom Rennen, ohne voranzukommen: Mehr Güter bringen kein dauerhaftes Mehr an Glück. Diese drei Stichworte, Adaptation, relative Position und Tretmühle, sind laut Notiz besonders betont.","Zwei Ergänzungen runden das Bild. Lebenszufriedenheit lässt sich durchaus mit gewisser Validität messen, denn die Antworten korrelieren mit objektiven Maßen wie dem Lächeln oder der Fremdeinschätzung durch Freunde. Das zentrale Problem ist aber der Fragekontext: Vorangehende Fragen, etwa zum Familienleben, beeinflussen die Antworten stark, sodass spezifische Zufriedenheiten das globale Urteil prägen. Und schließlich die positionalen Güter nach Frank: Das sind Güter, bei denen der Vergleich mit der Referenzgruppe besonders zählt, etwa Autos und Häuser, im Gegensatz zu nichtpositionalen Gütern wie Ferien, bei denen die absolute Menge zählt. Zu viele positionale Güter erzeugen einen Wettlauf wie ein Wettrüsten, ein Nullsummenspiel, in dem alle teurer kaufen und niemand gewinnt, mit gesellschaftlichem Wohlfahrtsverlust. Das ist die moderne Form von Veblens Geltungskonsum, dem demonstrativen Konsum als sozialem Marker, der laut Vorlesung zu Stress, längeren Arbeitszeiten, Verschuldung und Umweltschäden führt."]}],"raster":[{"kat":"PB","begriff":"Lebenszufriedenheit (kognitiv) vs. emotionales Wohlbefinden (aktuell)","warum":"andere Messmethoden und Korrelate","muss":true,"gew":9,"ktag":"","terms":["Lebenszufriedenheit","Wohlbefinden"]},{"kat":"PZ","begriff":"Easterlin-Paradox: Querschnitt positiv, Längsschnitt verschwindet","warum":"richtige Richtung beachten","muss":true,"gew":9,"ktag":"","terms":["Easterlin-Paradox","Easterlin","Paradox","Querschnitt","Längsschnitt"]},{"kat":"PK","begriff":"Adaptation, soziale Vergleiche, hedonische Tretmühle","warum":"[K] Notion Folie 165/166","muss":true,"gew":8,"ktag":"K","terms":["Adaptation","Vergleiche","Tretmühle","soziale","hedonische"]},{"kat":"KD","begriff":"75.000-Dollar-Sättigung (Kahneman/Deaton)","warum":"gilt nur fürs emotionale Wohlbefinden","muss":true,"gew":7,"ktag":"","terms":["Dollar-Sättigung","Dollar","Sättigung","Kahneman","Deaton","000-Dollar-Sättigung","000"]},{"kat":"PB","begriff":"Positionale vs. nichtpositionale Güter (Frank), Geltungskonsum (Veblen)","warum":"relativer Status, Nullsummen-Wettlauf","muss":true,"gew":6,"ktag":"","terms":["Positionale","Frank","Geltungskonsum","Veblen","nichtpositionale"]},{"kat":"KD","begriff":"Grenzen des ökonomischen Nutzenkonzepts (zwei Probleme)","warum":"Niveau nicht prüfbar und nicht messbar","muss":true,"gew":5,"ktag":"","terms":["Grenzen","Nutzenkonzepts","Probleme","ökonomischen"]},{"kat":"KD","begriff":"Wohlstand, Lebensqualität, Nutzen, Erfahrungsnutzen","warum":"Begriffe sauber trennen","muss":false,"gew":4,"ktag":"","terms":["Wohlstand","Lebensqualität","Nutzen","Erfahrungsnutzen"]}],"fehler":["Lebenszufriedenheit und emotionales Wohlbefinden gleichsetzen.","Die 75.000-Dollar-Sättigung auf die Lebenszufriedenheit beziehen statt nur aufs emotionale Wohlbefinden.","Das Easterlin-Paradox in der falschen Richtung wiedergeben (es verschwindet im Längsschnitt, nicht im Querschnitt).","Positionale und nichtpositionale Güter verwechseln."]},{"title":"Schlussbemerkungen: gute Wissenschaft und verantwortliche Wirtschaftspsychologie","lernziel":"Verstehen, was seriöse Wissenschaft ausmacht, wo Wirtschaftspsychologie missbraucht werden kann und warum Nudging der ausdrücklich klausurrelevante Punkt dieses Blocks ist.","konzepte":"Falsifizierbarkeit und die sechs Lilienfeld-Warnhinweise, Doppelrolle und Verantwortung der Wirtschaftspsychologie, drei Beispiele ambivalenten Einsatzes, Boosts vs. Nudges, Nudging mit vier Gründen und Nudging for Tips, Organspende- vs. Mensa-Fall.","lesezeit":"etwa 11 bis 13 Minuten","sections":[{"h":"Was Wissenschaft von Esoterik trennt","body":["Bevor es um Ethik geht, zieht das Schlusskapitel eine Grenze, die für das ganze Fach gilt: die zwischen Wissenschaft und Pseudowissenschaft. Das zentrale Kriterium ist die Falsifizierbarkeit, denn eine Behauptung ist nur dann wissenschaftlich, wenn sie überprüfbar und im Prinzip widerlegbar ist. Hier schließt sich der Bogen zur Wissenschaftstheorie aus Block 1 und 8, zu Hempel-Oppenheim und Popper. Lilienfeld und Kollegen nennen 2012 sechs Warnhinweise für Pseudowissenschaft, die du als Liste kennen solltest: erstens fehlende peer-reviewte Veröffentlichungen, zweitens kein definierter Gültigkeitsbereich, sodass die Theorie alles erklärt, drittens eine hypertechnische Sprache, viertens außergewöhnliche Erfolgsversprechen, fünftens Anekdoten statt seriöser Studien und sechstens kein Bezug zu etablierten Theorien. Ein Coaching, das verspricht, Energiefelder in Meridianen heilten Burnout, verletzt fast alle diese Punkte."]},{"h":"Was Wirtschaftspsychologie darf","body":["Daraus folgt die Frage nach Macht und Verantwortung des Fachs. Schon Münsterbergs psychotechnische Eignungstests nützten der Gesellschaft, etwa indem sie die Unfallzahlen bei Straßenbahnfahrern senkten, können aber ebenso zum Nachteil von Arbeitnehmern und Konsumenten eingesetzt werden, weil ein Kräfteungleichgewicht besteht. Die Verantwortung liegt darin, das Wissen zum Wohl aller Marktteilnehmer einzusetzen. Das Lehrbuch nennt drei Beispiele für den ambivalenten Einsatz. Erstens Konsum- und Kleinkredite, die psychologisch geschickt den Fokus aufs Heute legen, also die finanzpsychologische Kurzsichtigkeit ausnutzen und die Zinsen in schwer verständlichen Angaben verstecken. Zweitens die künstliche Verknappung, die über fiktive Lagerbestände oder Zeitdruck die Entscheidungssouveränität einschränkt. Drittens personalisierte Preise, bei denen Algorithmen den Preis an die Zahlungsbereitschaft anpassen, was als unfair empfunden wird und die Informationsasymmetrie verschärft. Als Gegenmodell zu manipulativen Eingriffen stehen die Boosts nach Hertwig: Statt die Entscheidungsarchitektur zu ändern, klärt man die Menschen über psychologische Tricks auf und stärkt ihre Kompetenz, weshalb Wirtschaftspsychologie ins Schulcurriculum gehöre."]},{"h":"Nudging: der ausdrücklich klausurrelevante Punkt","body":["Der einzige ausdrücklich als klausurrelevant markierte Punkt dieses Blocks ist das Nudging, also das sanfte Stupsen über die Gestaltung der Entscheidungsarchitektur. Du solltest die vier Gründe nennen können, warum Nudges überhaupt wirken: erstens die Trägheit und der Hang zum Aufschieben, zweitens das Framing, also die Wirkung der Präsentation, drittens soziale Einflüsse nach dem Prinzip Go with the Flow, und viertens unsere Schwierigkeiten im Umgang mit Wahrscheinlichkeiten. Wichtig ist die Spannung zwischen Eigen- und Gemeinnutzen, denn am Ende steht beim Nudging oft der Eigennutzen dessen, der stupst. Das beste Beispiel ist Nudging for Tips am Kartenterminal: Prozentuale Trinkgeldvorschläge von etwa fünf bis zwanzig Prozent führen zu höheren Beträgen als runde Festbeträge, das erhöht den Umsatz, und der Kreditkartenanbieter verdient an der Gebühr auf das Trinkgeld mit. Hier zeigt sich der libertäre Paternalismus aus Block 6 in privatwirtschaftlicher Anwendung, und die ethische Grenze liegt bei der Entscheidungssouveränität und der Transparenz der Voreinstellung. Verwandt ist die Frage staatlicher Beeinflussung: Die Salatvorwahl in der Mensa ist harmlos, weil eine Anordnung ohnehin unvermeidlich ist, während die Organspende-Widerspruchsregelung heikler ist, weil wenig informierte Personen ungefragt zu Spendern würden, was einen demokratischen Diskurs verlangt."]}],"raster":[{"kat":"PZ","begriff":"Nudging: vier Gründe und Eigen- vs. Gemeinnutzen","warum":"[K!] Notion 27.05, Anwendung Nudging for Tips","muss":true,"gew":9,"ktag":"K!","terms":["Nudging","Gründe","Eigen-","Eigen","Gemeinnutzen"]},{"kat":"PB","begriff":"Falsifizierbarkeit und sechs Lilienfeld-Warnhinweise","warum":"Abgrenzung von Pseudowissenschaft","muss":true,"gew":7,"ktag":"","terms":["Falsifizierbarkeit","Lilienfeld-Warnhinweise","Lilienfeld","Warnhinweise"]},{"kat":"PK","begriff":"Drei Beispiele ambivalenten WP-Einsatzes","warum":"Konsumkredite, Verknappung, personalisierte Preise","muss":true,"gew":6,"ktag":"","terms":["Beispiele","WP-Einsatzes","Einsatzes","ambivalenten"]},{"kat":"PB","begriff":"Boosts (Hertwig) vs. Nudges (Thaler)","warum":"Kompetenz aufbauen vs. Architektur ändern","muss":true,"gew":6,"ktag":"","terms":["Boosts","Hertwig","Nudges","Thaler"]},{"kat":"KD","begriff":"Doppelrolle der WP (Münsterberg, Verantwortung)","warum":"Nutzen und Missbrauch","muss":false,"gew":4,"ktag":"","terms":["Doppelrolle","Münsterberg","Verantwortung"]},{"kat":"KD","begriff":"Organspende- vs. Mensa-Fall staatlicher Beeinflussung","warum":"Eingriffstiefe, demokratischer Diskurs","muss":false,"gew":4,"ktag":"","terms":["Organspende-","Organspende","Mensa-Fall","Mensa","Fall","Beeinflussung","staatlicher"]}],"fehler":["Boosts und Nudges gleichsetzen: Boosts bauen Kompetenz auf, Nudges ändern die Entscheidungsarchitektur.","Beim Nudging die Spannung von Eigen- und Gemeinnutzen übersehen.","Die Falsifizierbarkeit als Nebensache behandeln statt als zentrales Wissenschaftskriterium.","Nudging for Tips als reine Kundenfreundlichkeit deuten statt als interessengeleiteten Default."]},{"title":"Angewandte Ethik: Moral, Dilemmata und das autonome Fahren","lernziel":"Verstehen, wie Kohlberg moralisches Urteilen ordnet, worin der Grundkonflikt zwischen Deontologie und Utilitarismus besteht und wie Moral Machine und die Ethik-Kommission das autonome Fahren beurteilen.","konzepte":"Kohlbergs drei Niveaus und sechs Stufen, Trolley-Problem in zwei Varianten, deontologisch vs. utilitaristisch, Schirachs Terror, Moral-Machine-Experiment und drei Cluster, Ethik-Kommission zum automatisierten Fahren, Gigerenzer zu Risiko und Framing.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"Moralentwicklung nach Kohlberg","body":["Der letzte Teil widmet sich der angewandten Ethik, die in zwei Seminaren vertieft wurde. Den Rahmen liefert Kohlbergs Modell der Moralentwicklung mit drei Niveaus zu je zwei Stufen, deren Reihenfolge du kennen solltest. Auf dem präkonventionellen Niveau bleibt die Moral egozentrisch und die Regeln äußerlich: In Stufe eins geht es um Gehorsam gegenüber Stärkeren, in Stufe zwei um eine strategische Tauschgerechtigkeit. Auf dem konventionellen Niveau sind die Regeln internalisiert und man sieht sich als Mitglied der Gesellschaft: Stufe drei orientiert sich an den Erwartungen von Bezugspersonen, dem guten Jungen oder dem guten Mädchen, Stufe vier an Gesetz, Recht und Ordnung. Auf dem postkonventionellen Niveau werden Regeln respektiert, aber durch rationale Prinzipien relativiert: Stufe fünf denkt in einem Sozialvertrag, Stufe sechs in universellen Prinzipien."]},{"h":"Das Trolley-Problem und zwei Ethiken","body":["Worum es in der Ethik im Kern geht, macht das Trolley-Problem anschaulich. In der ersten Variante stellt man eine Weiche um, sodass die Bahn statt mehrerer Menschen nur einen tötet, und die meisten stimmen dem zu. In der zweiten Variante müsste man einen schweren Mann von einer Brücke auf das Gleis schubsen, um die Bahn zu stoppen, und obwohl die Bilanz identisch ist, einer statt mehrerer, lehnen die meisten das ab. Der Grund liegt im Konflikt zweier Ethiken. Die utilitaristische Sicht zählt nur die Zahl der Geretteten, für sie sind beide Fälle gleich. Die deontologische Sicht beruft sich auf die Menschenwürde und verbietet, einen Menschen aktiv als Mittel zu benutzen, weshalb das Schubsen unzulässig ist, während der Tod an der Weiche als hingenommene Nebenfolge gilt. Denselben Konflikt macht Schirachs Theaterstück Terror erfahrbar, in dem ein Kampfpilot ein entführtes Flugzeug abschießt, um den Absturz in ein volles Stadion zu verhindern, und das Publikum über Schuld oder Freispruch abstimmt. Praxisbezüge sind die Triage in der Medizin und die Programmierung autonomer Fahrzeuge."]},{"h":"Moral Machine und das autonome Fahren","body":["Genau dort setzt das Moral-Machine-Experiment von Awad und Kollegen an, 2018 in Nature veröffentlicht. Über eine Online-Plattform wurden rund 39,61 Millionen Entscheidungen aus 233 Ländern und Territorien gesammelt, bei denen Menschen in unvermeidbaren Unfällen autonomer Fahrzeuge zwischen zwei Ausgängen wählten, ausgewertet über neun Faktoren mit einer Conjoint-Analyse. Die drei stärksten globalen Präferenzen lauten: Menschen vor Tieren verschonen, mehr Leben verschonen und junge Leben verschonen. Zugleich fand die Studie drei moralische Cluster, einen westlichen, einen östlichen und einen südlichen, die zur Inglehart-Welzel-Kulturkarte passen, und die auffälligste Differenz ist, dass die Präferenz, Junge vor Alten zu verschonen, im östlichen Cluster deutlich schwächer ist. Entscheidend für die ethische Beurteilung: Diese Präferenzen sind deskriptiv, nicht normativ, denn aus dem, was Menschen bevorzugen, folgt keine ethische Pflicht. Genau das betont die deutsche Ethik-Kommission zum automatisierten Fahren von 2017 mit ihren zwanzig Thesen: Automatisiertes Fahren ist bei positiver Risikobilanz ethisch geboten, der Schutz menschlichen Lebens hat höchste Priorität, und jede Qualifizierung von Menschen nach persönlichen Merkmalen wie Alter oder Geschlecht ist unzulässig. Hier prallen Bevölkerungspräferenz und Menschenwürde aufeinander."]},{"h":"Risiko verstehen: Gigerenzer","body":["Ein letzter Gedanke aus der Übung verbindet die Ethik mit der Entscheidungspsychologie aus Block 5. Gigerenzer betont, dass das Framing einer Information das Urteil stark prägt und dass Risikokompetenz bedeutet, Wahrscheinlichkeiten richtig zu verstehen, statt sich von Darstellung und Emotion leiten zu lassen. Seine zugespitzten Thesen aus der Notiz: Medien und Politiker erzeugten oft Panik statt Aufklärung, und eine Bürokratisierung statt echter Forschung erzeuge Mittelmaß, sodass Spitzenforschung nicht mehr gesehen werde. Damit schließt sich der Kreis des ganzen Fachs: Wirtschaftspsychologie soll Menschen nicht nur verstehen, sondern sie befähigen, in einer komplexen Welt kompetent und souverän zu entscheiden."]}],"raster":[{"kat":"PZ","begriff":"Trolley-Problem (Weiche vs. Schubsen); deontologisch vs. utilitaristisch","warum":"gleiche Bilanz, anderes Urteil","muss":true,"gew":8,"ktag":"","terms":["Trolley-Problem","Trolley","Problem","Weiche","Schubsen"]},{"kat":"PK","begriff":"Kohlberg: drei Niveaus, sechs Stufen","warum":"präkonventionell, konventionell, postkonventionell","muss":true,"gew":7,"ktag":"","terms":["Kohlberg","Niveaus","Stufen"]},{"kat":"PB","begriff":"Moral Machine (Awad 2018): Eckdaten, 3 Präferenzen, 3 Cluster","warum":"39,61 Mio / 233 Länder / 9 Faktoren","muss":true,"gew":7,"ktag":"","terms":["Moral","Machine","Awad","Eckdaten","Präferenzen","Cluster"]},{"kat":"PZ","begriff":"Aus Präferenzen folgt keine ethische Pflicht","warum":"deskriptiv vs. normativ","muss":true,"gew":6,"ktag":"","terms":["Präferenzen","Pflicht","folgt","keine","ethische"]},{"kat":"PK","begriff":"Ethik-Kommission autonomes Fahren (2017)","warum":"keine Qualifizierung nach Merkmalen, Lebensschutz","muss":true,"gew":6,"ktag":"","terms":["Ethik-Kommission","Ethik","Kommission","Fahren","autonomes"]},{"kat":"KD","begriff":"Schirach, Terror (Pilot-Dilemma)","warum":"macht den Grundkonflikt erfahrbar","muss":false,"gew":4,"ktag":"","terms":["Schirach","Terror","Pilot-Dilemma","Pilot","Dilemma"]},{"kat":"KD","begriff":"Gigerenzer: Framing und Risikokompetenz","warum":"Panik statt Aufklärung (Notion 10.06)","muss":false,"gew":4,"ktag":"","terms":["Gigerenzer","Framing","Risikokompetenz"]}],"fehler":["Deontologische und utilitaristische Sicht verwechseln (Menschenwürde vs. Zahl der Geretteten).","Die Weiche- und die Schubsen-Variante als ethisch gleich behandeln, obwohl das Urteil verschieden ausfällt.","Aus den Moral-Machine-Präferenzen eine ethische Pflicht ableiten (deskriptiv ist nicht normativ).","Kohlbergs Niveaus oder Stufen in falscher Reihenfolge nennen."]}]},{"key":"Block8","label":"Block 8 · Vertiefungen & Commanding Heights","color":"#dd6f3a","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Wie eine Wissenschaft denkt","lernziel":"Du verstehst, welche vier Arten von Aussagen eine Wissenschaft trennt, was ein Modell leistet und wo es täuscht, und warum die gewohnte Wissenschaft bei großen Gegenwartsproblemen an ihre Grenzen kommt.","konzepte":"die vier Aussagentypen (deskriptiv, explikativ, normativ, präskriptiv), Hempel-Oppenheim-Schema und Falsifikation, ikonische und sprachliche Modelle, Modellplatonismus und das Box-Diktum, das Paradigma nach Kuhn, Post Normal Science sowie das H-Form-Kompetenzprofil.","lesezeit":"etwa 5 Minuten","sections":[{"h":"","body":["Stell dir drei Personen vor dem gleichen Marktdiagramm vor. Die erste sagt nur, was sie sieht. Die zweite erklärt, warum die Kurve so verläuft. Die dritte sagt, wie der Markt eigentlich sein sollte. Diese drei reden nicht aneinander vorbei, weil sie verschiedener Meinung wären, sondern weil sie drei völlig verschiedene Dinge tun. Genau hier setzt die Wissenschaftstheorie an, mit der Block 8 beginnt: Bevor eine Aussage richtig oder falsch sein kann, muss klar sein, welche Art von Aussage überhaupt gemeint ist. Die Vertiefung unterscheidet vier solche Typen, und du verstehst sie am besten, wenn du sie als vier verschiedene Tätigkeiten liest, nicht als vier Vokabeln.","Eine deskriptive Aussage beschreibt. Sie bildet einen Ist-Zustand ab und erhebt den Anspruch, das wertfrei zu tun, etwa der Satz, die Arbeitslosenquote liege bei sechs Prozent. Eine explikative Aussage geht einen Schritt weiter und will erklären. Dafür braucht sie Gesetzmäßigkeiten, sogenannte nomologische Hypothesen, und die systematische Verbindung solcher Gesetzesaussagen ergibt eine Theorie. Wie eine Erklärung logisch funktioniert, beschreibt das Hempel-Oppenheim-Schema: Aus einem allgemeinen Gesetz und den Randbedingungen wird das einzelne Ereignis deduktiv abgeleitet. Und weil eine Erklärung nur dann etwas taugt, wenn sie auch scheitern könnte, prüft man nomologische Hypothesen über den Versuch ihrer Falsifikation, am besten im Experiment. Hier schließt sich ein Kreis zu den Schlussbemerkungen aus Block 7: Dort war Falsifizierbarkeit genau das Kriterium, das seriöse Wissenschaft von Esoterik trennt.","Die beiden anderen Aussagearten verlassen das Beschreiben und Erklären und betreten die Welt des Sollens. Eine normative Aussage begründet etwas mit Normen, also mit Regeln, die eine Gesellschaft festgelegt hat. Eine präskriptive Aussage schreibt vor: So soll es sein, so ist es gut, so ist es richtig. Im moralphilosophischen Sinn beschreibt die präskriptive Ethik genau diesen Sollzustand menschlichen Handelns. Der Gedanke, den du dir hier merken solltest, ist die saubere Trennung: Aus einem Ist folgt nicht von selbst ein Soll. Wer beides vermischt, begeht den klassischen Fehlschluss vom Sein auf das Sollen. Nicht zufällig markiert die Notion-Mitschrift genau diese Typologie der Aussagen (Folie 20) als prüfungsrelevant.","Vom Aussagentyp ist es nur ein kleiner Schritt zum Modell, denn Wirtschaftswissenschaft und Wirtschaftspsychologie arbeiten fast ausschließlich mit Modellen, vom Bruttosozialprodukt über die Inflation bis zum Marktgleichgewicht. Ein Modell konstruiert und strukturiert einen Zusammenhang. Man unterscheidet ikonische Modelle, die etwas materiell oder virtuell abbilden, etwa ein Globus oder eine Modelleisenbahn, von sprachlich-semantischen Modellen wie dem Modell des Marktverhaltens. Theorien lassen sich dabei als Teilklasse von Modellen verstehen. So nützlich Modelle sind, sie haben eine Schattenseite, und die heißt Modellplatonismus: die Neigung, ein Modell gegen die Wirklichkeit zu immunisieren, indem man es bei jedem Widerspruch durch Zusatzannahmen rettet, allen voran durch Ceteris-paribus-Klauseln. Streng mathematische Prinzipal-Agent-Modelle mit ihren sehr engen Annahmen rein rationaler, geldmaximierender Akteure sind ein gutes Beispiel. Zwei Sätze fassen die richtige Haltung: George Box sagt, im Grunde seien alle Modelle falsch, aber einige nützlich. Und Eduard Kaeser warnt, die reale Welt sei alles, was nicht ins Modell passe, und gefährlich werde es erst, wenn Modellbauer ihr Modell mit der Realität verwechseln.","Modelle leben nun nicht einzeln, sondern in größeren gedanklichen Familien, und die nennt man Paradigmen. Ein Paradigma ist ein zusammenhängendes, von vielen Forschern geteiltes Bündel aus Leitsätzen, Fragestellungen, Modellen und Methoden, das ganze Epochen überdauert. Thomas Kuhn hat in seinem Werk von 1962 gezeigt, dass ein Paradigma sogar bestimmt, was überhaupt beobachtet wird, welche Fragen man stellt und wie man die Ergebnisse deutet. Wenn zwei Paradigmen aufeinandertreffen, entsteht ein Richtungsstreit, und genau so einen wirst du in Lerntext 4 wiedersehen: den Battle of Ideas zwischen Keynes und Hayek. Über die gewohnte Wissenschaft hinaus beschreibt die Vertiefung schließlich die Post Normal Science. Ihre Lage lässt sich in vier englischen Stichworten fassen: facts uncertain, values in dispute, stakes high, decisions urgent, also unsichere Fakten, umstrittene Werte, hohe Risiken und dringende Entscheidungen. Beim Klimawandel etwa liefert die Wissenschaft nicht einfach fertige Wahrheit, sondern muss relevante Optionen identifizieren, über die Wünschbarkeit von Zukünften streiten und eine erweiterte Gemeinschaft über die Fachexperten hinaus einbeziehen. Dazu passt die Folie 40, die in der Mitschrift ausdrücklich mit dem Vermerk Klausur steht: Sie zeigt ein Kompetenzprofil in H-Form, also zwei sich ergänzende Wissensdomänen, vergleichbar mit Haupt- und Nebenfach, verbunden durch höhere kognitive und sozioemotionale Fähigkeiten und durch künstliche Intelligenz. Wer in einer Post-Normal-Science-Welt mitreden will, braucht genau dieses Profil."]}],"raster":[{"kat":"PB","begriff":"Vier Aussagentypen: deskriptiv, explikativ, normativ, präskriptiv","warum":"Kern des Textes; die Typologie der Aussagen ist laut Notion (Folie 20) ausdrücklich hervorgehoben.","muss":true,"gew":10,"ktag":"","terms":["Aussagentypen"]},{"kat":"PB","begriff":"Hempel-Oppenheim-Schema","warum":"Benennt die Logik der Erklärung (Deduktion aus Gesetz und Randbedingung); gehört zum explikativen Typ.","muss":true,"gew":7,"ktag":"","terms":["Hempel-Oppenheim-Schema","Hempel","Oppenheim","Schema"]},{"kat":"PB","begriff":"Falsifikation / Falsifizierbarkeit","warum":"Prüfkriterium nomologischer Hypothesen; Brücke zu Block 7 (Evidenz statt Esoterik).","muss":true,"gew":7,"ktag":"","terms":["Falsifikation","Falsifizierbarkeit"]},{"kat":"PB","begriff":"Modellplatonismus","warum":"Zentrale Gefahr beim Umgang mit Modellen; mit Prinzipal-Agent-Modell als Beispiel.","muss":true,"gew":7,"ktag":"","terms":["Modellplatonismus"]},{"kat":"PB","begriff":"Post Normal Science (Funtowicz/Ravetz)","warum":"Folie 15 hervorgehoben; beschreibt Wissenschaft bei unsicheren, umstrittenen Großproblemen.","muss":true,"gew":8,"ktag":"","terms":["Post","Normal","Science","Funtowicz","Ravetz"]},{"kat":"PB","begriff":"H-Form-Kompetenzprofil (Folie 40)","warum":"Notion: ausdrücklich mit Vermerk Klausur. Hoher Punktwert bei Auslassung.","muss":true,"gew":9,"ktag":"","terms":["H-Form-Kompetenzprofil","Form","Kompetenzprofil","Folie"]},{"kat":"PB","begriff":"Box-Diktum (all models are wrong, but some are useful)","warum":"Prägnante Merkformel für die richtige Modellhaltung.","muss":false,"gew":5,"ktag":"","terms":["Box-Diktum","Diktum","Box"]},{"kat":"PK","begriff":"Ikonische vs sprachlich-semantische Modelle","warum":"Grundunterscheidung; Theorie als Teilklasse von Modellen.","muss":false,"gew":4,"ktag":"","terms":["Ikonische","Modelle","sprachlich-semantische","sprachlich","semantische"]},{"kat":"PK","begriff":"Ceteris-paribus / Immunisierung als Mechanismus","warum":"Erklärt, WIE ein Modell gegen Widerlegung abgesichert wird.","muss":true,"gew":6,"ktag":"","terms":["Ceteris-paribus","Ceteris","paribus","Immunisierung","Mechanismus"]},{"kat":"PZ","begriff":"Trennung von Sein und Sollen (Ist vs Soll)","warum":"Verbindet die vier Typen; aus Ist folgt nicht automatisch Soll (häufiger Fehlschluss).","muss":true,"gew":8,"ktag":"","terms":["Trennung","Sein"]},{"kat":"KD","begriff":"Vier PNS-Merkmale: facts uncertain, values in dispute, stakes high, decisions urgent","warum":"Präzise Kennzeichnung; erweiterte Peer-Community.","muss":true,"gew":7,"ktag":"","terms":["PNS-Merkmale","PNS","Merkmale"]},{"kat":"KD","begriff":"Paradigma nach Kuhn","warum":"Rahmen, in dem später der Battle of Ideas (Keynes/Hayek) steht.","muss":true,"gew":6,"ktag":"","terms":["Paradigma","Kuhn"]}],"fehler":["Normativ und präskriptiv gleichsetzen: Beide betreffen das Sollen, sind aber verschieden: normativ = Begründung aus bestehenden Normen, präskriptiv = Forderung eines Sollzustands.","Modell und Theorie unkritisch gleichsetzen: Nur bei formalisierten Theorien synonym; da Theorien sprachliche Gebilde sind, ist die Gleichsetzung sonst restriktiv.","Modellplatonismus als bloßen Rechenfehler deuten: Es geht um die Immunisierung gegen Widerlegung (Ceteris-paribus), nicht um ein falsch gerechnetes Modell.","Box-Diktum halbieren: Nur all models are wrong ohne but some are useful verfehlt die Pointe.","H-Form und die markierten Folien vergessen: Folie 40 ist ausdrücklich Klausur, Folien 15 und 20 sind hervorgehoben."]},{"title":"Der unsichtbare Vertrag, oder das Prinzipal-Agent-Modell","lernziel":"Du verstehst, warum jede Auftragsbeziehung Reibungskosten erzeugt, welche drei Informationsprobleme dahinterstecken und mit welchen Mitteln man sie eindämmt, und du kannst das Modell auf Manager und Unternehmen anwenden.","konzepte":"Prinzipal und Agent, Interessendivergenz, die drei Agency-Kosten, die drei Informationsasymmetrien mit ihren Folgen, die Lösungsansätze Signaling, Screening und Self-Selection, sowie die Anwendung auf Shareholder Value, CEO-Vergütung und die agentische Organisation.","lesezeit":"etwa 5 Minuten","sections":[{"h":"","body":["Jedes Mal, wenn du eine Aufgabe an jemanden abgibst, den du nicht vollständig kontrollieren kannst, betrittst du das Prinzipal-Agent-Modell. Du beauftragst einen Handwerker, ohne ihm bei jeder Schraube zuzusehen. Du gibst einem Fondsmanager dein Geld, ohne jede seiner Entscheidungen zu prüfen. In all diesen Fällen handelt ein Agent mit eigenen Entscheidungsspielräumen im Auftrag eines Prinzipals. Das Modell stammt aus der Neuen Institutionenökonomik, und sein ganzer Reiz besteht darin, dass es ein scheinbar banales Alltagsproblem präzise macht.","Das Grundproblem hat zwei Zutaten, die erst zusammen gefährlich werden. Die erste ist die Interessendivergenz: Was gut für den Agenten ist, ist nicht automatisch gut für den Prinzipal. Die zweite ist die Informationsasymmetrie: Der Agent weiß mehr über sich und sein Handeln als der Prinzipal. Aus dieser Mischung entstehen die Agency-Kosten, und du solltest dir merken, dass sie aus genau drei Bestandteilen bestehen. Da sind erstens die Überwachungs- und Kontrollkosten, die der Prinzipal trägt, um den Agenten im Blick zu behalten. Da sind zweitens die Signalisierungs- und Garantiekosten, die der Agent auf sich nimmt, um Vertrauen herzustellen. Und da ist drittens der Residualverlust, also der Wohlfahrtsverlust, der trotz aller Mühe übrig bleibt, weil sich die Lücke nie ganz schließen lässt. Dieser dritte Posten ist der gedanklich wichtigste, denn er sagt: Eine perfekte Lösung gibt es nicht, es geht immer nur um Eindämmung.","Warum das so ist, zeigen die drei Informationsasymmetrien, die du am besten nach ihrem Zeitpunkt sortierst. Vor dem Vertragsabschluss liegen die hidden characteristics, die verborgenen Eigenschaften: Du kennst die wahre Qualität des Partners noch nicht, und die Folge ist die Gefahr der adversen Selektion, also dass du am Ende ausgerechnet die schlechten Angebote anziehst. Nach dem Vertragsabschluss lauert die hidden action, die verborgene Handlung: Du kannst die Anstrengung des Partners nicht beobachten, und die Folge ist das moralische Risiko, dass er sich auf deine Kosten weniger anstrengt. Und quer dazu liegt die hidden intention, die verborgene Absicht: Du kennst seine wahren Pläne nicht, und wenn du erst einmal von ihm abhängig bist, droht der Hold-up, das Ausnutzen dieser Abhängigkeit. Wer diese drei Typen verwechselt, verliert in der Klausur Punkte, also präge dir die Reihenfolge ein: erst Eigenschaften, dann Handlung, dann Absicht.","Die gute Nachricht ist, dass das Modell gleich die Gegenmittel mitliefert. Man kann die Interessen angleichen, etwa indem man den Agenten über Aktienoptionen oder Firmenanteile am Erfolg beteiligt. Man kann überwachen und Anreizsysteme setzen. Vor allem aber gibt es drei elegantere Mechanismen, die du sauber auseinanderhalten solltest. Beim Signaling ergreift der Agent die Initiative und macht seine Qualität glaubhaft sichtbar, etwa durch ein Zeugnis oder eine Garantie. Beim Screening wird der Prinzipal aktiv und beschafft sich selbst Informationen. Bei der Self-Selection gestaltet der Prinzipal den Vertrag so, dass sich die Agenten durch ihre eigene Wahl verraten und sich gewissermaßen selbst sortieren. Das Kürzel lautet also: Signaling kommt vom Agenten, Screening vom Prinzipal, Self-Selection aus der Vertragsgestaltung.","Wie stark dieses Modell ist, siehst du, sobald du es nach oben auf die Vorstandsebene anwendest. Die Vergütung von CEOs wird in hohem Maße an den Aktienkurs gekoppelt, und genau das ist Interessenangleichung im Reinformat: Der Manager soll fühlen, was die Eigentümer fühlen. Dahinter steht der Shareholder Value, wobei der Marktwert eines Unternehmens schlicht der Aktienkurs mal die Zahl der Aktien ist. Die Kritik daran liegt auf der Hand, denn die Bezüge steigen immer weiter und die Kluft zur übrigen Belegschaft wächst. Ganz aktuell stellt die Vorlesung die Frage nach der agentischen Organisation, also nach Unternehmen, die von autonom handelnden KI-Agenten geprägt sind. Fallen damit die Agency-Kosten weg, weil eine Maschine keine eigenen Interessen verfolgt? Die Antwort ist offen, denn autonome Systeme brauchen ihrerseits neue Steuerungs- und Kontrollstrukturen. Halte diese Brücke fest, denn in Lerntext 4 begegnet dir das Modell ein letztes Mal, wenn es um Elizabeth Holmes geht, deren verborgene Eigenschaften und Absichten die Investoren teuer zu stehen kamen."]}],"raster":[{"kat":"PB","begriff":"Prinzipal und Agent (Auftraggeber / Auftragnehmer)","warum":"Grundbegriffe des Modells aus der Neuen Institutionenökonomik.","muss":true,"gew":8,"ktag":"","terms":["Prinzipal","Agent","Auftraggeber","Auftragnehmer"]},{"kat":"PB","begriff":"Residualverlust","warum":"Wichtigster der drei Kostenposten: zeigt, dass keine perfekte Lösung möglich ist.","muss":true,"gew":7,"ktag":"","terms":["Residualverlust"]},{"kat":"PK","begriff":"Agency-Kosten in drei Teilen: Ueberwachung, Signalisierung, Residualverlust","warum":"Kernstück und häufige Prüfungsfrage; muss vollständig sein.","muss":true,"gew":10,"ktag":"","terms":["Agency-Kosten","Agency","Kosten","Teilen","Ueberwachung","Signalisierung","Residualverlust"]},{"kat":"PK","begriff":"Hidden characteristics -> adverse Selektion (vor Vertrag)","warum":"Erste der drei Asymmetrien; Zeitpunkt und Folge müssen stimmen.","muss":true,"gew":9,"ktag":"","terms":["Hidden","Selektion","Vertrag","characteristics","adverse"]},{"kat":"PK","begriff":"Hidden action -> moralisches Risiko (nach Vertrag)","warum":"Zweite Asymmetrie; häufige Verwechslung mit der ersten.","muss":true,"gew":9,"ktag":"","terms":["Hidden","Risiko","Vertrag","action","moralisches"]},{"kat":"PK","begriff":"Hidden intention -> Hold-up (Ressourcenabhängigkeit)","warum":"Dritte Asymmetrie; quer zu den anderen.","muss":true,"gew":9,"ktag":"","terms":["Hidden","Hold-up","Hold","Ressourcenabhängigkeit","intention"]},{"kat":"PK","begriff":"Signaling, Screening, Self-Selection","warum":"Lösungsansätze; Zuordnung wer aktiv wird ist klausurrelevant.","muss":true,"gew":8,"ktag":"","terms":["Signaling","Screening","Self-Selection","Self","Selection"]},{"kat":"PZ","begriff":"Interessendivergenz UND Informationsasymmetrie als Grundproblem","warum":"Nur zusammen entstehen Agency-Kosten; einzeln harmlos.","muss":true,"gew":9,"ktag":"","terms":["Interessendivergenz","Informationsasymmetrie","Grundproblem"]},{"kat":"PZ","begriff":"Anreizkopplung als Interessenangleichung (Aktienoptionen)","warum":"Verbindet Modell und Praxis (Shareholder Value).","muss":true,"gew":6,"ktag":"","terms":["Anreizkopplung","Interessenangleichung","Aktienoptionen"]},{"kat":"KD","begriff":"Shareholder Value / CEO-Vergütung an Aktienkurs","warum":"Anwendung auf die Vorstandsebene; Marktwert = Kurs mal Aktienzahl.","muss":true,"gew":6,"ktag":"","terms":["Shareholder","Value","CEO-Vergütung","CEO","Vergütung","Aktienkurs"]},{"kat":"KD","begriff":"Agentische Organisation (KI-Agenten, McKinsey)","warum":"Aktuelle Erweiterung; Leitfrage, ob Agency-Kosten wegfallen.","muss":false,"gew":4,"ktag":"","terms":["Agentische","Organisation","KI-Agenten","Agenten","McKinsey"]},{"kat":"KD","begriff":"Brücke zu Theranos (hidden characteristics/intention)","warum":"Querverweis auf Lerntext 4.","muss":false,"gew":3,"ktag":"","terms":["Brücke","Theranos"]}],"fehler":["Asymmetrien und Folgen falsch paaren: Richtig: characteristics -> adverse Selektion, action -> moralisches Risiko, intention -> Hold-up.","Signaling und Screening verwechseln: Signaling geht vom Agenten aus, Screening vom Prinzipal, Self-Selection aus der Vertragsgestaltung.","Agency-Kosten unvollständig nennen: Der Residualverlust wird oft vergessen; ohne ihn fehlt die Pointe, dass keine Lösung perfekt ist.","Zeitpunkt vertauschen: Hidden characteristics liegen vor dem Vertrag, hidden action danach.","Shareholder Value als bloße Gier deuten: Im Modell ist die Kurskopplung Interessenangleichung, nicht nur Bereicherung."]},{"title":"Womit verdient ein Unternehmen wirklich Geld?","lernziel":"Du verstehst, warum ein Geschäftsmodell nicht über das Produkt definiert wird, kannst es nach Stähler in drei Komponenten zerlegen und erklärst am Fall Aldi, wie ein cleverer Zahlungsrhythmus aus einem Discounter eine Art Geldmaschine macht.","konzepte":"der Geschäftsmodell-Begriff nach Stähler mit seinen drei Komponenten und Leitfragen, die Fallstudie Aldi und das Working-Capital-Management, die Dynamic Capabilities nach Teece und die Plattformökonomie am Gegensatz Spotify und OnlyFans.","lesezeit":"etwa 4 bis 5 Minuten","sections":[{"h":"","body":["Die Frage klingt simpel, ist es aber nicht: Womit verdient ein Unternehmen eigentlich Geld? Viele würden mit dem Produkt antworten, und genau das ist der Denkfehler, den Stählers Geschäftsmodell-Begriff korrigiert. Ein Geschäftsmodell wird bewusst nicht über Produkt oder Markt definiert, sondern allein über den gestifteten Nutzen. Es besteht aus drei Komponenten, die du dir am besten als drei Fragen merkst. Die erste ist die Value Proposition, das Nutzenversprechen: Welchen Nutzen ziehen Kunden und andere Stakeholder aus der Verbindung mit dem Unternehmen? Die zweite ist die Architektur der Wertschöpfung: Wie und über welche Stufen wird dieser Nutzen erzeugt? Hier, und erst hier, wohnen übrigens Produkt und Markt. Die dritte ist das Ertragsmodell: Wodurch und aus welchen Quellen fließt das Geld, und wie nachhaltig ist das? Die drei Leitfragen lauten also schlicht: Welchen Nutzen stiftet das Unternehmen, wie erbringt es ihn, und wie verdient es damit Geld?","Wie ergiebig dieses Schema ist, zeigt der Fall Aldi, und er ist deshalb so lehrreich, weil die eigentliche Pointe nicht im Verkaufsregal liegt. Auf der Ebene der Value Proposition steht Aldi für günstige Preise, Verlässlichkeit und zunehmend ein jüngeres, moderneres Markenbild, mit dem klaren Fokus auf langfristige Kundenbindung und den Lifetime Value eines Kunden, also den Wert über die gesamte Kundenbeziehung. Die Wertschöpfungsarchitektur ist ein schlankes Discounter-Modell, in dem Aldi als verlässlicher, zuverlässig zahlender Partner seiner Lieferanten auftritt und die Ware oft schon innerhalb einer Woche abverkauft. Die eigentliche Finanzpointe steckt nun im Ertragsmodell, genauer im Working-Capital-Management. Aldi vereinnahmt den Umsatz sofort, geschätzt rund 370 Millionen Euro pro Tag, zahlt seine Lieferanten aber erst nach etwa 90 Tagen, also lange nachdem die Ware verkauft ist. In dieser Zeitspanne sammelt sich ein riesiger Kapitalbestand an, geschätzte 30 Milliarden Euro, die Aldi weiter investiert. Aus dem Discounter wird so beinahe eine große Geldeinsammelstelle, und die Vorlesung stellt halb provokativ sogar die Frage nach einer Art Giralgeldschöpfung. Dass dabei eine Handelsspanne von nur etwa einem halben Prozent reicht, um einen Tagesgewinn in der Größenordnung von rund 1,85 Millionen Euro zu erzielen, macht deutlich, dass hier mehrere Logiken zugleich wirken, eine Wachstums-, eine Marketing-, eine Lieferantenmanagement- und eine Finanzmarktlogik.","Damit ein Geschäftsmodell über Jahre trägt, darf es nicht erstarren, und an dieser Stelle kommt David Teeces Konzept der Dynamic Capabilities ins Spiel. Gemeint ist die Fähigkeit eines Unternehmens, seine Ressourcen und Kompetenzen laufend an Marktveränderungen anzupassen. Die Vorlesung illustriert das gern an Taylor Swift, die ihr Geschäftsmodell unter dem Stichwort Swiftonomics ständig umbaut und ihre Einnahmen breit über Tour, Merchandise, Streaming und mehr streut. Und schließlich entscheidet oft nicht das Produkt, sondern die Plattform über das Ertragsmodell. In der Plattformökonomie bringen digitale Plattformen Anbieter und Nachfrager zusammen und verdienen an Transaktionen oder Abonnements. Wie unterschiedlich sie Reichweite zu Geld machen, zeigt das Beispiel der Sängerin Lily Allen: Ein Streamingdienst wie Spotify zahlt nur etwa 0,003 bis 0,005 Dollar pro Stream, sodass selbst Millionen Hörer wenig einbringen, während sie über eine Abo-Plattform wie OnlyFans mit wenigen Abonnenten einen ähnlichen Betrag erzielt. Dieselbe Reichweite, völlig verschiedene Einnahmen. Das ist die Logik der Aufmerksamkeitsökonomie, und es ist der beste Beweis für Stählers Ausgangsthese: Nicht das Produkt entscheidet, sondern wie der Nutzen monetarisiert wird."]}],"raster":[{"kat":"PK","begriff":"Geschäftsmodell nach Stähler: drei Komponenten","warum":"Kern des Textes; definiert über den Nutzen, nicht über Produkt oder Markt.","muss":true,"gew":10,"ktag":"","terms":["Geschäftsmodell","Stähler","Komponenten"]},{"kat":"PB","begriff":"Value Proposition (Nutzenversprechen)","warum":"Komponente 1; welcher Nutzen für Kunden und Stakeholder.","muss":true,"gew":8,"ktag":"","terms":["Value","Proposition","Nutzenversprechen"]},{"kat":"PB","begriff":"Architektur der Wertschöpfung","warum":"Komponente 2; hier wohnen Produkt und Markt.","muss":true,"gew":8,"ktag":"","terms":["Architektur","Wertschöpfung"]},{"kat":"PB","begriff":"Ertragsmodell","warum":"Komponente 3; wodurch und wie nachhaltig Geld verdient wird.","muss":true,"gew":8,"ktag":"","terms":["Ertragsmodell"]},{"kat":"PK","begriff":"Working-Capital-Management (Aldi)","warum":"Klausurdetail laut Notion 20.05; die eigentliche Finanzpointe.","muss":true,"gew":9,"ktag":"","terms":["Working-Capital-Management","Working","Capital","Man
