nach Reife: telling bis delegating","muss":true,"gew":5,"ktag":"","terms":["Reifegradmodell","Hersey","Blanchard"]},{"kat":"KD","begriff":"Wissensmanagement (Münchner Modell) und Partizipation/Empowerment","warum":"Psychologie statt Technik; Nutzen und Grenzen","muss":false,"gew":5,"ktag":"","terms":["Wissensmanagement","Münchner","Partizipation","Empowerment"]}],"fehler":["OE und Change Management vertauschen: OE beteiligt und ist langfristig, Change Management ist ökonomisch und top-down.","Transformationale und transaktionale Führung verwechseln (Vision und Inspiration vs. Leistung gegen Gegenleistung).","Die Reihenfolge der acht Kotter-Stufen durcheinanderbringen.","Lewins Auftauen unterschätzen, obwohl es der zentrale erste Schritt ist.","Wissensmanagement rein technisch denken statt als Frage der Kultur."]},{"title":"Wertorientierung: vom Economic Profit zur Strategic Control Map","lernziel":"Verstehen, wie ein Unternehmen finanziell abgebildet und bewertet wird, den Economic Profit und den WACC selbst rechnen können und den Börsenwert über Erwartungen und die Strategic Control Map deuten.","konzepte":"Drei Financial Statements, Income Statement von Top- zu Bottom-Line, Economic Profit mit ROIC und WACC, WACC-Formel, DCF mit FCF und NOPLAT, Total Return to Shareholder und DEEP, Strategic Control Map mit vier Gruppen, Börsenkurs vs. intrinsischer Wert, integriertes Wertsteigerungsmanagement.","lesezeit":"etwa 14 bis 16 Minuten","sections":[{"h":"Die drei Financial Statements","body":["Jetzt zur finanziellen Seite, die im Seminar vertieft wurde. Ein Unternehmen wird über drei Financial Statements abgebildet. Das Income Statement, also die Gewinn-und-Verlust-Rechnung, ist das Geschichtsbuch über einen Zeitraum und stellt Erlöse gegen Kosten. Die Balance Sheet, die Bilanz, ist ein Snapshot zum Stichtag und zeigt Ressourcen und Ansprüche, wobei die Aktiva den Passiva entsprechen. Das Cash Flow Statement zeigt Herkunft und Verwendung der liquiden Mittel und ist die Grundlage jeder Unternehmensbewertung. Das Income Statement liest sich von der Top-Line zur Bottom-Line: Vom Nettoumsatz zieht man die Herstellkosten ab und erhält den Bruttogewinn, nach Abzug der Verwaltungs- und Vertriebskosten das EBITDA, nach den Abschreibungen das EBIT, nach dem Zinsergebnis das EBT und nach Steuern schließlich das Net Income. Der einbehaltene Teil wandert als Gewinnrücklage ins Eigenkapital der Bilanz. Für die Klausur genügt es, das EBIT grob erklären zu können und die Bilanzgrundidee zu kennen, dass die Aktiva den Passiva entsprechen."]},{"h":"Economic Profit: der Wertschöpfungstest","body":["Jetzt zum Herzstück und einem ausdrücklichen Klausurpunkt, denn den Economic Profit sollst du selbst rechnen können. Die Idee dahinter ist anspruchsvoller als der normale Gewinn, denn der Economic Profit ist ein Übergewinn, der zusätzlich die Kosten des eingesetzten Kapitals abzieht. Die Formel lautet: Economic Profit gleich, in Klammern, ROIC minus WACC, mal dem investierten Kapital. Der ROIC ist die tatsächlich erzielte Rendite, also das Betriebsergebnis geteilt durch das investierte Kapital. Der WACC ist der gewichtete durchschnittliche Kapitalkostensatz, also die Mindestrendite, die Eigen- und Fremdkapitalgeber erwarten. Die zentrale Aussage: Wert entsteht nur, wenn der ROIC größer ist als der WACC. Ein buchhalterischer Gewinn kann also ökonomisch trotzdem Wertvernichtung sein, wenn er die Kapitalkosten nicht deckt. Rechnen wir ein Beispiel: Bei einem investierten Kapital von 1.000 Euro, einem Umsatz von 500 Euro, Kosten von 400 Euro und einem WACC von 3,8 Prozent ist das Betriebsergebnis 100 Euro, der ROIC also 10 Prozent, und der Economic Profit beträgt 10 minus 3,8 Prozent mal 1.000 Euro, also rund 62 Euro. Fällt der ROIC unter den WACC, wird der Economic Profit negativ. Den WACC selbst berechnet man als D durch D plus E mal die Fremdkapitalkosten plus E durch D plus E mal die Eigenkapitalkosten; bei 40 Prozent Fremdkapital zu 2 Prozent und 60 Prozent Eigenkapital zu 5 Prozent ergibt das 0,8 plus 3,0, also 3,8 Prozent. Eigenkapitalgeber verlangen dabei einen Risikoaufschlag, weil sie das Insolvenzrisiko tragen. Beeinflussen lässt sich der Economic Profit über die Responsibility Center: Preis und Menge im Revenue Center, Kosten im Cost Center, das Kapital im Investment Center, weshalb Marketing und Vertrieb über Preis mal Menge ein besonders großer Hebel sind."]},{"h":"Vom Cashflow zum Unternehmenswert: DCF und TRS","body":["Den vollen Unternehmenswert ermittelt die DCF-Methode: Man summiert die künftigen Free Cash Flows, abgezinst mit dem WACC, und addiert den diskontierten Restwert. Den Free Cash Flow gewinnt man, indem man vom EBIT die Steuern abzieht und so den NOPLAT erhält, die Abschreibungen wieder hinzurechnet und die Veränderung des Working Capital sowie die Investitionen abzieht. Bemerkenswert ist, dass die DCF-Methode und der diskontierte Economic Profit zuzüglich des investierten Kapitals exakt denselben Wert ergeben. Aus Sicht des Aktionärs zählt der Total Return to Shareholder, also der Wertzuwachs der Aktie plus Dividende. Wichtig ist seine Zerlegung: Nicht beeinflussbar sind das allgemeine Marktniveau und der risikofreie Zins. Beeinflussbar ist der Wert nur über DEEP, die Veränderung der Erwartungen an die wirtschaftliche Leistung, die sich in kurzfristige Erwartungen, STEEP, und langfristige Erwartungen, LTEEP, aufteilt. Die Kernaussage: Das Management schafft Börsenwert vor allem, indem es die Markterwartungen positiv verändert, nicht allein durch nackte Zahlen."]},{"h":"Die Strategic Control Map und der Wert der Erwartungen","body":["Ein im Seminar besonders hervorgehobenes Werkzeug, illustriert am Cisco-Beispiel, ist die Strategic Control Map. Auf der x-Achse steht der Umsatz in Milliarden Dollar, auf der y-Achse das Verhältnis von Marktwert zu Umsatz, das Multiple, und das Produkt beider ergibt den absoluten Marktwert. Daraus entstehen vier strategische Gruppen, die du sicher unterscheiden solltest. Die Second Tier Players haben niedrigen Umsatz und niedriges Multiple, sie sind Me-too-Anbieter. Die Integrated Size Players haben hohen Umsatz, aber niedriges Multiple, sie leben von Skaleneffekten bei schwachen Zukunftserwartungen. Die Focused Attackers haben niedrigen Umsatz, aber hohes Multiple, getragen von immateriellen Werten und starken Erwartungen. Und die Industry Shapers haben beides hoch, Spezialisierung und Skalen. Verwechsle Integrated Size Players und Focused Attackers nicht, denn sie sind gerade spiegelbildlich. Aus der Position folgt die zentrale Managementfrage: Bei hohem Multiple lautet sie, wie erfülle ich die hohen Erwartungen, bei niedrigem Multiple, wie überzeuge ich die Investoren. Ein Unternehmen mit 10 Milliarden Umsatz und einem Multiple von 2 hätte einen Marktwert von 20 Milliarden und läge bei den Integrated Size Players.","Damit schließt sich der Kreis zur Behavioral Finance aus Block 5. Der Börsenkurs und der intrinsische DCF-Wert können erheblich abweichen, weil der intrinsische Wert die nüchterne Sicht eines langfristigen Investors auf die Cashflows ist, während der Börsenkurs aus dem Zusammenspiel vieler Akteure mit heterogenen Erwartungen entsteht, wie das Beispiel Tesla zeigt. Im integrierten System des Wertsteigerungsmanagements treiben nicht-finanzielle Werttreiber wie Kundenbindung die Performance, gemessen wird über Kennzahlen wie den Economic Profit, der intrinsische Wert entsteht über DCF, und ganz oben steht die Kapitalmarktperformance, auf die die Markterwartungen wieder zurückwirken. Genau hier wird der Wertbeitrag eines CEO an der Börse messbar, weshalb seine Vergütung oft an den Marktwert gekoppelt wird, mit allen Anreizen und Fehlanreizen, die das mit sich bringt."]}],"raster":[{"kat":"PZ","begriff":"Economic Profit = (ROIC − WACC) × investiertes Kapital","warum":"[K!] selbst rechnen (Folie 24)","muss":true,"gew":10,"ktag":"K!","terms":["Economic","Profit","ROIC","WACC","Kapital"]},{"kat":"PB","begriff":"ROIC vs. WACC; Wert nur wenn ROIC > WACC","warum":"erzielte Rendite vs. Kapitalkostensatz","muss":true,"gew":9,"ktag":"","terms":["ROIC","WACC","Wert"]},{"kat":"PK","begriff":"Strategic Control Map: vier Gruppen","warum":"[K] Cisco; Integrated Size Players vs. Focused Attackers","muss":true,"gew":8,"ktag":"K","terms":["Strategic","Control","Gruppen"]},{"kat":"PK","begriff":"WACC-Formel (Gewichtung Fremd- und Eigenkapital)","warum":"selbst rechnen können","muss":true,"gew":7,"ktag":"","terms":["WACC-Formel","WACC","Formel","Gewichtung","Fremd-","Fremd","Eigenkapital"]},{"kat":"PK","begriff":"DCF/FCF/NOPLAT; Börsenkurs vs. intrinsischer Wert","warum":"Erwartungen treiben den Kurs","muss":true,"gew":6,"ktag":"","terms":["DCF","FCF","NOPLAT","Börsenkurs","Wert","intrinsischer"]},{"kat":"KD","begriff":"Drei Financial Statements; Income Statement Top- zu Bottom-Line","warum":"EBIT, Net Income, Assets = Liabilities","muss":true,"gew":5,"ktag":"","terms":["Financial","Statements","Income","Statement","Top-","Bottom-Line","Bottom"]},{"kat":"PZ","begriff":"TRS-Dekomposition (DEEP = STEEP + LTEEP)","warum":"Wert über Veränderung der Erwartungen","muss":false,"gew":5,"ktag":"","terms":["TRS-Dekomposition","TRS","Dekomposition","DEEP","STEEP","LTEEP"]},{"kat":"KD","begriff":"Integriertes Wertsteigerungsmanagement; CEO-Wertbeitrag","warum":"Werttreiber bis Kapitalmarkt","muss":false,"gew":4,"ktag":"","terms":["Integriertes","Wertsteigerungsmanagement","CEO-Wertbeitrag","CEO","Wertbeitrag"]}],"fehler":["ROIC und WACC verwechseln: ROIC ist die erzielte Rendite, WACC der Kapitalkostensatz.","Den Economic Profit mit dem buchhalterischen Gewinn gleichsetzen und die Kapitalkosten vergessen.","Integrated Size Players und Focused Attackers vertauschen (hoher Umsatz und niedriges Multiple vs. umgekehrt).","Vergessen, dass Wert nur entsteht, wenn der ROIC größer ist als der WACC.","Den Börsenkurs mit dem intrinsischen DCF-Wert gleichsetzen."]}]},{"key":"Block4","label":"Block 4 · Personal","color":"#e0703a","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Rahmen und Personalauswahl","lernziel":"Verstehen, wie das Michigan-Modell die Personalarbeit als Kreislauf ordnet, aus welchen Schritten die Personalauswahl besteht und warum Belegschaften homogener sind, als man erwartet.","konzepte":"Michigan-Modell (Selection, Appraisal, Rewards, Development), Temperamente nach Hippokrates, vier Themen der Personalauswahl, drei Methoden der Arbeits- und Anforderungsanalyse, Personalmarketing, interne vs. externe Rekrutierung, Gravitation und Sozialisation.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"Personalarbeit als Kreislauf: das Michigan-Modell","body":["Bevor es um einzelne Auswahlverfahren geht, brauchst du ein Rahmenmodell, das die ganze Personalarbeit ordnet, und das ist das Michigan-Modell von Tichy, Fombrun und Devanna. Es beschreibt vier Funktionen, die einen Kreislauf bilden: Selection, also die Auswahl, Appraisal, die Leistungsbeurteilung, Rewards, die Belohnung und Vergütung, und Development, die Entwicklung. Entscheidend ist die Pointe, dass alle vier auf dasselbe Ziel ausgerichtet sind, die Performance, und dass sie als zusammenhängendes System wirken statt isoliert. Wer nur auswählt, aber nicht entwickelt oder fair belohnt, durchbricht den Kreislauf. Verwechsle dieses Modell nicht mit dem 7-S-Modell aus Block 3, das ist eine beliebte Falle.","Historisch reiht sich die Personalpsychologie in einen langen Versuch ein, Menschen zu typisieren. Schon die Temperamentenlehre nach Hippokrates unterschied vier Typen, den lebhaften Sanguiniker, den reizbaren Choleriker, den schwermütigen Melancholiker und den trägen Phlegmatiker. Wissenschaftlich ist das überholt, aber es zeigt die alte Sehnsucht nach Schubladen und leitet zu den modernen Modellen MBTI, Big Five und HEXACO über, die uns im dritten Teil beschäftigen."]},{"h":"Die vier Themen der Personalauswahl","body":["Die Personalauswahl gliedert sich in vier Themen, die logisch aufeinander folgen. Am Anfang steht die Arbeits- und Anforderungsanalyse, die festlegt, welche Eigenschaften, Kenntnisse und Fähigkeiten eine Stelle überhaupt verlangt. Dann folgt das Personalmarketing, das Mitarbeiter findet, gewinnt und bindet. Die Eignungsdiagnostik unterscheidet anschließend Geeignete von Ungeeigneten, und die Auswahlverfahren sind die konkreten Werkzeuge dafür. Die Reihenfolge ist kein Zufall, denn ohne sauber definierte Anforderung weiß man gar nicht, worauf man auswählen soll.","Für die Anforderungsanalyse nennen Eckardt und Schuler drei methodische Zugänge. Der erfahrungsgeleitet-intuitive Zugang ist qualitativ, stützt sich auf Experten und ist aus Ressourcengründen der Praxisstandard. Der arbeitsplatzanalytisch-empirische Zugang ist standardisiert, arbeitet mit Fragebogen und Interviews und lässt die Ergebnisse von Experten übersetzen. Der personenbezogen-empirische Zugang sucht statistische Zusammenhänge zwischen Personenmerkmalen und Erfolg. Diese drei solltest du dem Namen nach unterscheiden können."]},{"h":"Personalmarketing und der interne Arbeitsmarkt","body":["Das Personalmarketing umfasst drei Arbeitsbereiche: die Personalforschung, die etwa Demografie und Zielgruppen analysiert, das interne Personalmarketing, das auf langfristige Bindung über Gehalt, Arbeitszeit, Karriere und Klima zielt, und das externe Personalmarketing, das das Unternehmen als attraktiven Arbeitgeber positioniert, wobei Online-Jobbörsen und die Karriere-Website die häufigsten Kanäle sind. Wichtiger für die Klausur ist die Abwägung zwischen interner und externer Rekrutierung. Die interne Besetzung bietet Aufstiegs- und Motivationspotenzial, eine durchschaubare Personalpolitik, einen Bewerber, der den Betrieb schon kennt, geringe Kosten und schnelle Besetzung, leidet aber unter Betriebsblindheit und einem Versetzungskarussell. Die externe Besetzung bringt neues Wissen und frische Ideen, vermeidet Konflikte mit Ex-Kollegen und vergrößert die Auswahl, ist aber teurer, langsamer und mit einem unbekannten Bewerber verbunden. Ein ausdrücklich hervorgehobener Punkt: Bei interner Beförderung entsteht oft ein Dominoeffekt, weil alle von unten nachrücken, was motivierend wirkt, während Quereinsteiger ihre Grenzen haben."]},{"h":"Warum Belegschaften homogener sind als gedacht","body":["Ein interessanter Befund zum Abschluss des ersten Teils: Belegschaften sind sich oft ähnlicher, als man erwarten würde, und dafür gibt es zwei Mechanismen, die du nicht verwechseln solltest. Die Gravitation beschreibt, dass sich Menschen von Organisationen mit ähnlichen Werten angezogen fühlen, also eine Selbstselektion der Bewerber, ergänzt um die Fremdselektion durch die Firma, die passende Bewerber auswählt. Die organisationale Sozialisation beschreibt dagegen, dass die Firma neuen Mitgliedern ihre Werte, Normen und ihr Wissen vermittelt, oft informell, durch Mentoring und Schulungen. Die Gravitation wirkt also vor dem Eintritt, die Sozialisation danach, und beide erhöhen die Homogenität."]}],"raster":[{"kat":"PB","begriff":"Michigan-Modell: Selection, Appraisal, Rewards, Development","warum":"Rahmenmodell, alle auf Performance, Kreislauf","muss":true,"gew":8,"ktag":"","terms":["Michigan-Modell","Michigan","Selection","Appraisal","Rewards","Development"]},{"kat":"PK","begriff":"Vier Themen der Personalauswahl","warum":"Anforderungsanalyse, Personalmarketing, Eignungsdiagnostik, Verfahren","muss":true,"gew":6,"ktag":"","terms":["Personalauswahl"]},{"kat":"PK","begriff":"Drei Methoden der Arbeits- und Anforderungsanalyse","warum":"erfahrungsgeleitet / arbeitsplatzanalytisch / personenbezogen","muss":true,"gew":6,"ktag":"","terms":["Arbeits-","Arbeits","Anforderungsanalyse"]},{"kat":"PB","begriff":"Intern vs. extern rekrutieren: Vor- und Nachteile","warum":"Kontrollfrage 2","muss":true,"gew":7,"ktag":"","terms":["Intern","Vor-","Nachteile","extern","rekrutieren"]},{"kat":"KD","begriff":"Dominoeffekt bei interner Beförderung, Grenzen von Quereinsteigern","warum":"[K] Notion VL 29.04","muss":true,"gew":5,"ktag":"K","terms":["Dominoeffekt","Beförderung","Grenzen","Quereinsteigern","interner"]},{"kat":"PZ","begriff":"Gravitation vs. Sozialisation erhöhen die Homogenität","warum":"vor vs. nach dem Eintritt","muss":true,"gew":6,"ktag":"","terms":["Gravitation","Sozialisation","Homogenität","erhöhen"]},{"kat":"KD","begriff":"Vier Temperamente (Hippokrates)","warum":"überholt, Übergang zu MBTI/Big Five/HEXACO","muss":false,"gew":3,"ktag":"","terms":["Temperamente","Hippokrates"]}],"fehler":["Das Michigan-Modell mit dem 7-S-Modell aus Block 3 verwechseln.","Gravitation und Sozialisation gleichsetzen: die eine wirkt vor, die andere nach dem Eintritt.","Die vier Auswahlthemen ohne die vorgelagerte Anforderungsanalyse denken.","Interne und externe Rekrutierung nur einseitig bewerten statt mit Vor- und Nachteilen."]},{"title":"Eignungsdiagnostik: Gütekriterien, Taylor-Russell und Verfahren","lernziel":"Verstehen, woran man Auswahlverfahren misst, das Taylor-Russell-Modell sicher beherrschen und die Vorhersagekraft der Verfahren über r-Werte richtig einordnen.","konzepte":"Gütekriterien (Objektivität, Reliabilität, Validität), prognostische und inkrementelle Validität, DIN 33430, trimodaler Ansatz, Taylor-Russell-Modell mit drei Faktoren und Quadranten, Schmidt-Hunter-Übersicht, r-Werte, Nutzenbegriff, Interview-Standardisierung, Assessment-Center.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"Woran man gute Verfahren misst: Gütekriterien","body":["Jedes Auswahlverfahren muss sich an den drei Hauptgütekriterien messen lassen, die du schon aus den Forschungsmethoden in Block 1 kennst. Die Objektivität bedeutet, dass das Ergebnis unabhängig davon ist, wer den Test durchführt und auswertet. Die Reliabilität bedeutet, dass eine Wiederholung dasselbe Ergebnis liefert, sie ist also die Zuverlässigkeit. Die Validität bedeutet, dass der Test wirklich misst, was er messen soll. Den wichtigsten Merksatz präg dir ein: Ein Test kann reliabel sein, ohne valide zu sein, also zuverlässig das Falsche messen. Für die Eignungsdiagnostik kommen zwei Spezialformen hinzu. Die prognostische Validität ist die Vorhersagekraft für den künftigen Berufserfolg, ausgedrückt als Korrelation r, und sie ist das zentrale Bewertungskriterium aller Auswahlverfahren. Die inkrementelle Validität ist der Zuwachs an Vorhersagekraft, den man durch die Kombination mehrerer Verfahren gewinnt. Der einschlägige Standard heißt DIN 33430."]},{"h":"Der trimodale Ansatz der Eignungsdiagnostik","body":["Die vielen einzelnen Verfahren lassen sich in drei Grundansätze sortieren, den trimodalen Ansatz. Der eigenschaftsorientierte Ansatz misst stabile Eigenschaften über Fähigkeits-, Persönlichkeits- und Interessentests, etwa das NEO-FFI. Der simulationsorientierte Ansatz lässt berufsbezogenes Verhalten direkt zeigen, über Arbeitsproben, Fallstudien, Rollenspiele und das Assessment-Center. Der biografieorientierte Ansatz schließt von vergangenem auf künftiges Verhalten und nutzt Lebenslauf, Zeugnisse sowie biografische Fragebogen und Interviews. Diese drei Modi solltest du nicht mit den Standardisierungsgraden der Interviews verwechseln, das ist eine typische Falle."]},{"h":"Taylor-Russell: das Modell, das du auswendig können musst","body":["Jetzt zum wichtigsten Modell des Blocks, denn laut Vorlesungsnotiz musst du das Taylor-Russell-Modell von 1939 können, und zwar auswendig. Es beantwortet die Frage, wovon es abhängt, ob ein Auswahlverfahren die Erfolgsquote tatsächlich verbessert, und nennt dafür drei Faktoren. Erstens den Validitätskoeffizienten des Verfahrens, also seine Vorhersagekraft. Zweitens die Grundquote, das ist der Anteil der grundsätzlich Geeigneten in der Bewerberpopulation. Drittens die Selektionsquote, das ist der Anteil der Eingestellten an allen Bewerbern. Grundquote und Selektionsquote werden gern vertauscht, also halte sie sauber auseinander: die eine beschreibt, wie viele geeignet sind, die andere, wie viele genommen werden.","Dazu gehört das Quadrantenmodell. Stell dir alle Bewerber in vier Feldern vor, je nachdem ob sie eingestellt oder abgelehnt wurden und ob sie geeignet oder ungeeignet sind. Die richtig Eingestellten, geeignet und genommen, nennen wir EG. Die Fehlbesetzungen, ungeeignet und doch genommen, sind EU. Die verpassten Chancen, geeignet, aber abgelehnt, sind AG. Und die richtig Abgelehnten, ungeeignet und abgelehnt, sind AU. Die Erfolgsquote ist der Anteil EG an allen Eingestellten. Sie steigt auf zwei Wegen: mit höherer Validität des Verfahrens, weil die Vorhersage dann treffsicherer wird, und mit einer strengeren Selektionsquote, also einem höheren Cutoff, bei dem man nur die Besten nimmt. Die Taylor-Russell-Tafeln geben für jede Kombination die konkrete Erfolgsrate an.","Wie gut sind Auswahlverfahren wirklich?","Wie treffsicher Auswahl insgesamt ist, zeigt die Schmidt-Hunter-Übersicht, und die sollst du laut Notiz verstehen, nicht auswendig lernen. Die Kernaussage: Personalauswahlverfahren erklären etwa dreißig bis fünfzig Prozent der Schwankung in der späteren Arbeitsleistung. Das ist eine gewisse, aber keine vollständige Vorhersagekraft. Am validesten sind kognitive Fähigkeitstests, strukturierte Verfahren und Arbeitsproben, während die Graphologie gegen null geht, und die Kombination von Verfahren erhöht die Validität. Konkret drückt man das über die Korrelation r aus. Ein Wert von r gleich 0,45, etwa für Schulnoten, erklärt rund zwanzig Prozent der Varianz, weil man r quadrieren muss. Ein r von 0,50 ist sehr gut, ein r von 0,20 die Untergrenze der Brauchbarkeit. Intelligenztests führen als Einzelverfahren, das Assessment-Center erreicht in der Praxis überraschend nur etwa r gleich 0,25, und geschickte Kombinationen kommen bis r gleich 0,60. Wer die Vorhersage steigern will, kombiniert also Verfahren und nutzt die inkrementelle Validität."]},{"h":"Nutzen, Interviews und Assessment-Center","body":["Drei weitere Begriffe runden die Diagnostik ab. Der Nutzen oder die Utility eines Instruments ist nach Blum und Naylor der Grad, in dem sein Einsatz die Qualität der Ausgewählten gegenüber dem Zustand ohne Instrument verbessert, wobei sich Qualität als Anteil Erfolgreicher, als durchschnittlicher Leistungswert oder als monetärer Nutzen fassen lässt. Bei den Interviews unterscheidet man drei Standardisierungsgrade: das unstandardisierte Interview mit spontanen Fragen, das teilstandardisierte mit fester Fragenabfolge bei freier Wortwahl und das vollstandardisierte mit einheitlichem Aufbau und vergleichbarer Auswertung. Das multimodale Interview kombiniert acht feste Komponenten vom Gesprächsbeginn über situative Fragen bis zum Abschluss. Das Assessment-Center schließlich vereint alle drei trimodalen Ansätze als multiple Verfahrenstechnik, mit mehreren Assessoren und Teilnehmern, und sollte nach inkrementeller Validität gestaltet sein, erreicht in der Praxis aber nur ein gerade noch ausreichendes r von etwa 0,25. Über die Hauptgütekriterien hinaus sollte ein guter Test außerdem theoretisch fundiert, fair, unverfälschbar und zumutbar sein."]}],"raster":[{"kat":"PB","begriff":"Drei Gütekriterien: Objektivität, Reliabilität, Validität","warum":"reliabel ist nicht gleich valide","muss":true,"gew":8,"ktag":"","terms":["Gütekriterien","Objektivität","Reliabilität","Validität"]},{"kat":"PK","begriff":"Prognostische vs. inkrementelle Validität","warum":"Vorhersage (r) vs. Zuwachs durch Kombination","muss":true,"gew":8,"ktag":"","terms":["Prognostische","Validität","inkrementelle"]},{"kat":"PB","begriff":"Trimodaler Ansatz: eigenschafts-, simulations-, biografieorientiert","warum":"Strukturmodell der Verfahren","muss":true,"gew":7,"ktag":"","terms":["Trimodaler"]},{"kat":"PZ","begriff":"Taylor-Russell: drei Faktoren (Validität, Grundquote, Selektionsquote)","warum":"[K!] auswendig (Folien 94/95)","muss":true,"gew":10,"ktag":"K!","terms":["Taylor-Russell","Taylor","Russell","Faktoren","Validität","Grundquote","Selektionsquote"]},{"kat":"PK","begriff":"Taylor-Russell-Quadranten EG/EU/AG/AU und Erfolgsquote","warum":"[K!] Erfolgsquote = EG / Eingestellte","muss":true,"gew":9,"ktag":"K!","terms":["Taylor-Russell-Quadranten","Taylor","Russell","Quadranten","Erfolgsquote"]},{"kat":"KD","begriff":"Schmidt-Hunter: 30 bis 50 % erklärte Leistung, Validitätsrangfolge","warum":"[K] verstehen, nicht auswendig","muss":true,"gew":7,"ktag":"K","terms":["Schmidt-Hunter","Schmidt","Hunter","Leistung","Validitätsrangfolge"]},{"kat":"KD","begriff":"r-Werte deuten (r=.45 ergibt rund 20 % Varianz, .20 Untergrenze, bis .60)","warum":"Transferwissen","muss":true,"gew":6,"ktag":"","terms":["Werte","Varianz","Untergrenze","r-Werte","deuten"]},{"kat":"KD","begriff":"Nutzen (Blum/Naylor), Interview-Standardisierung, Assessment-Center (r etwa .25)","warum":"Verfahrensüberblick","muss":false,"gew":4,"ktag":"","terms":["Nutzen","Blum","Naylor","Interview-Standardisierung","Interview","Standardisierung","Assessment-Center"]}],"fehler":["Reliabilität und Validität gleichsetzen: ein Test kann zuverlässig das Falsche messen.","Grundquote und Selektionsquote vertauschen (Anteil Geeigneter vs. Anteil Eingestellter).","Den trimodalen Ansatz mit den Standardisierungsgraden der Interviews verwechseln.","r nicht quadrieren: r=.45 erklärt rund 20 %, nicht 45 % der Varianz.","Prognostische und inkrementelle Validität verwechseln."]},{"title":"Personalentwicklung und Persönlichkeitsdiagnostik","lernziel":"Verstehen, wie Personalentwicklung als Prozess abläuft und evaluiert wird, und die Persönlichkeitsdiagnostik mit Johari, MBTI und HEXACO kritisch einordnen können.","konzepte":"PE-Prozess in fünf Phasen, Transferdistanz und Lerntransfer, Kirkpatricks vier Evaluationsstufen, fünf Methodenklassen und Führung als PE, PE-Gründe, Corporate University, Johari-Fenster, MBTI und seine Kritik, HEXACO, Neurodiversität.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"Personalentwicklung als fortlaufender Prozess","body":["Mit der Auswahl ist es nicht getan, denn Menschen entwickeln sich, und genau das ist das Feld der Personalentwicklung. Sie verläuft in fünf Phasen. Am Anfang steht die Bedarfsanalyse als Soll-Ist-Vergleich zwischen Anforderung und vorhandener Qualifikation. Es folgen die Planung von Inhalt, Methode, Trainer und Budget, dann die Durchführung, danach der Transfer in den Arbeitsalltag und schließlich die Evaluation. Wichtig ist das Verständnis, dass Personalentwicklung kein einmaliges Seminar ist, sondern ein fortlaufender Prozess, der an der Unternehmensstrategie ausgerichtet wird, weshalb man von strategischer Personalentwicklung spricht."]},{"h":"Transferdistanz: warum Floßbau wenig bringt","body":["Ein Begriff, an dem der Professor gern Beispiele aufhängt, ist die Transferdistanz. Sie meint die inhaltliche Ähnlichkeit zwischen der Entwicklungsmaßnahme und dem späteren Anwendungsfeld. Eine große Transferdistanz bedeutet, dass die Trainingssituation weit vom Arbeitsalltag entfernt ist, etwa beim Outdoor-Training mit Floßbau oder Schlauchbootfahrt. Eine kleine Transferdistanz bedeutet Nähe zum Alltag, etwa eine Telefonschulung am echten Arbeitsplatz. Daraus folgt direkt eine Beurteilung, die in der Klausur auftauchen kann: Outdoor-Trainings haben eine große Transferdistanz und bringen kaum arbeitsbezogene Lerneffekte, sie eignen sich eher als motivierendes Teamerlebnis als zum Kompetenzaufbau. Für echten Kompetenzaufbau wählt man eine geringe Transferdistanz. Den Lerntransfer fördern außerdem Teilnehmermerkmale wie Intelligenz, Gewissenhaftigkeit, Motivation und Freiwilligkeit sowie ein kurzer Weg bis zur Anwendung und die Unterstützung durch Vorgesetzte."]},{"h":"Erfolg messen: das Modell von Kirkpatrick","body":["Ob eine Maßnahme etwas gebracht hat, prüft man mit dem Evaluationsmodell von Kirkpatrick aus dem Jahr 1994, das vier aufeinander aufbauende Stufen unterscheidet. Die erste Stufe ist die Reaktion, also das subjektive Erleben, einfach per Fragebogen zu erheben. Die zweite ist das Lernen, der objektive Lernerfolg, gemessen per Test. Die dritte ist das Verhalten, die tatsächliche Umsetzung am Arbeitsplatz, beobachtet oder erfragt. Die vierte sind die Ergebnisse, also messbare Erfolgskriterien wie Produktivität oder Zufriedenheit. Der rote Faden: Je höher die Stufe, desto aussagekräftiger, aber desto aufwendiger die Messung. Stufe eins ist leicht, Stufe vier oft kaum noch sauber zu erheben, weil sich der wirtschaftliche Erfolg selten allein der Maßnahme zurechnen lässt, sondern auch von Konjunktur oder Produktqualität abhängt. Deshalb evaluiert man in der Praxis meist auf den unteren Stufen."]},{"h":"Methoden und Anlässe der Entwicklung","body":["Kanning ordnet die Methoden der Personalentwicklung in fünf Klassen: das Training für Wissen und Verhalten, die Beratung über Coaching und Mentoring, computergestützte Methoden wie Online-Lernen und Simulationen, erlebnisorientierte Methoden wie Outdoor mit ihrem geringen Lerneffekt, und die Führung selbst als Entwicklungsinstrument, etwa durch Delegieren, Partizipation und tägliche Rückmeldung. Warum überhaupt entwickelt wird, hat fünf Gründe, die die Vorlesung nennt: juristische Vorgaben, berufsständische Regelungen, Compliance-Normen, fachliche und überfachliche Gründe sowie die Incentivierung im Sinne eines Anreizes. Eine besondere Organisationsform ist die Corporate University, eine vom Unternehmen betriebene und an der Strategie ausgerichtete Fortbildungseinrichtung, die aber keine Hochschule ist und deren Abschlüsse meist nicht staatlich anerkannt sind."]},{"h":"Persönlichkeit messen: Johari, MBTI und HEXACO","body":["Zum Abschluss der Blick in die Persönlichkeitsdiagnostik, die im Seminar vertieft wurde. Das Johari-Fenster ordnet das Wissen über eine Person in vier Felder, aufgespannt aus den Achsen, ob andere etwas wissen und ob ich es selbst weiß. Die Arena ist öffentlich und beiden bekannt, der blinde Fleck ist anderen bekannt, mir aber nicht, die Fassade ist mir bekannt, anderen nicht, und der unbekannte Bereich ist niemandem bekannt. Man vergrößert die Arena, indem man sich öffnet, denn die Selbstoffenbarung verkleinert die Fassade, und indem man Feedback einholt, was den blinden Fleck verkleinert. Beides baut Vertrauen auf.","Der bekannteste Typentest ist der MBTI mit vier Dimensionen: Extraversion gegen Introversion, also woher die Energie kommt, Sensing gegen Intuition, also wie man Informationen aufnimmt, Thinking gegen Feeling, also wie man entscheidet, und Judging gegen Perceiving, also wie man sein Umfeld gestaltet. Aus den vier Buchstaben ergibt sich einer von sechzehn Typen, etwa ENTJ, auf Basis der Typenlehre C. G. Jungs. So eingängig der MBTI ist, die Kritik ist erheblich und ausdrücklich klausurrelevant: Er beruht auf dem Barnum- oder Forer-Effekt, bei dem vage, allgemeine Aussagen wie bei einem Horoskop als treffend akzeptiert werden, er stützt sich allein auf Selbsteinschätzung, zwingt mit seinen dichotomen Items zu Entweder-oder-Antworten ohne Zwischenstufen, und vor allem ist seine Retest-Reliabilität sehr niedrig, sodass viele Menschen bei einer Wiederholung einen anderen Typ erhalten. Allgemein erklären Persönlichkeitstests ohnehin höchstens etwa fünfzig Prozent der Persönlichkeit.","Die fundierte Alternative ist das HEXACO-Modell, eine Erweiterung der Big Five um sechs Faktoren: Honesty-Humility, Emotionality, eXtraversion, Agreeableness, Conscientiousness und Openness. Der entscheidende Unterschied zum MBTI: HEXACO misst keine groben Typen, sondern kontinuierliche Dimensionen in Perzentilen, mit Facetten und Normwerten, und ist empirisch deutlich besser abgesichert. Deshalb zieht man es in der seriösen Eignungsdiagnostik typenbasierten Verfahren wie dem MBTI vor, der eher der Selbstreflexion und dem Teamgespräch dient. Ein abschließender Gedanke aus dem Exkurs zur Neurodiversität: Unterschiede in der Funktionsweise des Gehirns, etwa bei Autismus oder ADHS, sollte man nicht als Defizit, sondern als kognitive Vielfalt und Ressource begreifen."]}],"raster":[{"kat":"PK","begriff":"PE-Prozess in fünf Phasen","warum":"Bedarfsanalyse, Planung, Durchführung, Transfer, Evaluation","muss":true,"gew":6,"ktag":"","terms":["PE-Prozess","Prozess","Phasen"]},{"kat":"PB","begriff":"Transferdistanz (groß vs. klein)","warum":"Outdoor vs. Telefonschulung, steuert den Lerntransfer","muss":true,"gew":7,"ktag":"","terms":["Transferdistanz"]},{"kat":"PK","begriff":"Kirkpatrick: vier Stufen (Reaktion, Lernen, Verhalten, Ergebnisse)","warum":"je höher, desto aussagekräftiger und aufwendiger","muss":true,"gew":7,"ktag":"","terms":["Kirkpatrick","Stufen","Reaktion","Lernen","Verhalten","Ergebnisse"]},{"kat":"PB","begriff":"MBTI: vier Dimensionen, 16 Typen","warum":"E/I, S/N, T/F, J/P; Basis Jung","muss":true,"gew":7,"ktag":"","terms":["MBTI","Dimensionen","Typen"]},{"kat":"PB","begriff":"MBTI-Kritik: Retest-Reliabilität sehr niedrig, Barnum, max. etwa 50 %","warum":"[K] Notion Übung 29.04","muss":true,"gew":8,"ktag":"K","terms":["MBTI-Kritik","MBTI","Kritik","Retest-Reliabilität","Retest","Reliabilität","Barnum"]},{"kat":"PK","begriff":"HEXACO: sechs Faktoren, kontinuierlich statt Typen","warum":"valide Alternative zum MBTI","muss":true,"gew":6,"ktag":"","terms":["HEXACO","Faktoren","Typen"]},{"kat":"KD","begriff":"Fünf PE-Methodenklassen (Kanning) und Führung als PE","warum":"Methodenüberblick","muss":false,"gew":4,"ktag":"","terms":["PE-Methodenklassen","Methodenklassen","Kanning","Führung"]},{"kat":"KD","begriff":"Johari-Fenster: vier Felder, Disclosure und Feedback","warum":"Arena vergrößern","muss":false,"gew":4,"ktag":"","terms":["Johari-Fenster","Johari","Fenster","Felder","Disclosure","Feedback"]},{"kat":"KD","begriff":"Neurodiversität als Ressource","warum":"kognitive Vielfalt statt Defizit","muss":false,"gew":3,"ktag":"","terms":["Neurodiversität","Ressource"]}],"fehler":["Kirkpatrick-Stufen in falscher Reihenfolge oder ohne den Zusammenhang von Aufwand und Aussagekraft nennen.","Transferdistanz verkehrt deuten: groß heißt weit vom Alltag (Outdoor), nicht intensiv.","Den MBTI als valides Auswahlinstrument darstellen statt als Selbstreflexion mit niedriger Retest-Reliabilität.","MBTI (Typen) und HEXACO (kontinuierliche Dimensionen) gleichsetzen.","Johari-Felder vertauschen: der blinde Fleck ist anderen bekannt, mir nicht."]}]},{"key":"Block5","label":"Block 5 · Finanzpsychologie & Geld","color":"#e8a13a","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Geld, Vertrauen und die Geldillusion","lernziel":"Verstehen, worauf der Wert von Geld wirklich beruht, wie wir Geld psychologisch verbuchen und wahrnehmen, und wie im Bonusbereich aus Krediten neues Geld entsteht.","konzepte":"Geld als Vertrauenssache und die drei Vertrauensvoraussetzungen, Mental Accounting (Thaler), Geldwert/Geldwahrnehmung/Geldillusion, Buchgeld vs. Fiat-Geld, Geldschöpfung durch Kreditvergabe, Vollgeld, Krypto vs. Zentralbankgeld und CBDC, Bitcoin.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"Geld ist Vertrauenssache","body":["Beginnen wir mit einer Frage, die banaler klingt, als sie ist: Warum funktioniert Geld überhaupt? Die intuitive Antwort, Geld habe einen Wert, weil das Material wertvoll sei, trägt längst nicht mehr. Ein Geldschein ist bedrucktes Papier, eine Münze wenige Cent Metall, und das Guthaben auf dem Konto ist nicht einmal das. Die richtige Antwort, die du dir einprägen solltest, lautet: Geld ist Vertrauenssache. Das Lehrbuch nennt drei Vertrauensvoraussetzungen, die zusammen erfüllt sein müssen. Erstens das Vertrauen, dass andere das Geld auch morgen noch als Zahlungsmittel annehmen. Zweitens das Vertrauen, dass die Wirtschaft tatsächlich die Güter herstellt, die man später dafür kaufen will. Und drittens das Vertrauen, dass der Geldwert stabil bleibt, dass also die Geldmenge im Einklang mit der realen Produktion wächst. Fällt eine dieser Säulen, etwa in einer Hyperinflation, verliert Geld seine Funktion, obwohl sich am Papier nichts geändert hat.","Beim Buchgeld kommt eine vierte Vertrauensschicht hinzu, und die ist wichtig für den Bonusteil weiter unten. Buchgeld ist kein gesetzliches Zahlungsmittel, sondern eine Forderung gegen deine Bank. Du vertraust also zusätzlich darauf, dass deine Bank zahlungsfähig bleibt. Bricht sie zusammen, ist dein Sichtguthaben im Zweifel verloren. Dieser Gedanke wirkt unscheinbar, erklärt aber später, warum aus Misstrauen gegenüber Banken überhaupt Alternativen wie Bitcoin entstehen konnten."]},{"h":"Mental Accounting: Geld in unsichtbaren Schubladen","body":["Wäre Geld eine neutrale Recheneinheit, müssten wir jeden Euro gleich behandeln. Das tun wir aber nicht. Richard Thaler hat das 1985 mit der Theorie der mentalen Buchführung beschrieben, dem Mental Accounting. Wir verbuchen Einnahmen und Ausgaben auf verschiedenen gedanklichen Konten und sind je nach Konto unterschiedlich preisempfindlich. Mit der Kreditkarte geben wir leichter Geld aus als mit Bargeld, weil der Schmerz des Zahlens aufgeschoben und entkoppelt ist. Beim Weihnachtseinkauf sitzt das Geld lockerer als im Alltag. Und sogar die Herkunft des Geldes färbt ab: hart Erarbeitetes geben wir vorsichtiger aus als einen unerwarteten Bonus oder eine Erbschaft. Ökonomisch ist das alles unsinnig, denn ein Euro ist ein Euro. Psychologisch erklärt es einen großen Teil unseres Konsumverhaltens, und es ist der erste Beleg dafür, dass Geld eben nicht neutral verarbeitet wird."]},{"h":"Geldwert, Geldwahrnehmung und Geldillusion","body":["Drei Begriffe, die in der Klausur leicht durcheinandergeraten, solltest du sauber trennen. Der Geldwert ist die objektive Kaufkraft, also die Gütermenge, die du für einen bestimmten Betrag bekommst. Die Geldwahrnehmung ist, wie dieser Wert subjektiv erlebt wird, und sie weicht systematisch ab, weil uns die nominalen Preise, also die aufgedruckten Zahlen, leichter zugänglich sind als die realen, um die Teuerung bereinigten Werte. Aus dieser Lücke entsteht die Geldillusion: das Denken in nominalen statt in realen Größen. Die Geldillusion ist kein Randphänomen, sie hat handfeste Folgen für Löhne, auf die wir im vierten Teil zurückkommen. Merke dir die Kette: objektiver Wert, subjektive Wahrnehmung, und die Illusion als der Fehler, beides zu verwechseln."]},{"h":"Bonus: Wie aus dem Nichts Geld entsteht","body":["Jetzt zu einem Themenkomplex, den du besonders ernst nehmen solltest, weil der Professor angekündigt hat, dass mindestens eine Klausurfrage aus dem Bonusbereich kommt, und Geld gehört dazu. Es geht um die Frage, woher das Geld eigentlich stammt. Zuerst die Begriffe. Buchgeld, auch Giralgeld genannt, sind die elektronischen Guthaben auf Bankkonten, also Sichtguthaben. Fiat-Geld ist gesetzliches Zahlungsmittel, das von Staat oder Zentralbank ausgegeben wird und keinen inneren Wert besitzt. Das Wort fiat ist lateinisch und heißt es werde: Der Wert entsteht allein durch Anordnung, Vertrauen und Akzeptanz, nicht durch Gold dahinter. Wichtig für die Klausur ist die Beziehung der beiden: Buchgeld ist eine Form von Fiat-Geld.","Der überraschende Teil ist, wie neues Geld entsteht. Die meisten vermuten, der Staat oder die Zentralbank drucke es. Tatsächlich schaffen den größten Teil die Geschäftsbanken selbst, und zwar durch Kreditvergabe. Wenn eine Bank dir einen Kredit gewährt, schreibt sie dir den Betrag einfach auf dem Konto gut. In diesem Moment ist neues Buchgeld entstanden, ohne dass irgendwo eine Banknote gedruckt wurde. Genau hier setzt die Schweizer Vollgeld-Initiative an, die forderte, dass nur noch die Zentralbank Geld schöpfen darf. Sie wurde abgelehnt, ist aber das Standardbeispiel, um zu zeigen, wie umstritten diese private Geldschöpfung ist.","Daran schließt die Kryptofrage an. Kryptowährungen und Zentralbankgeld unterscheiden sich in vier Dimensionen, die du als Raster im Kopf haben solltest. Erstens die Kontrolle: dezentral über eine Blockchain gegenüber zentral über eine Zentralbank. Zweitens die Vertrauensbasis: Kryptografie und Code gegenüber dem Vertrauen in Staat und Notenbank. Drittens die Akzeptanz: begrenzt und freiwillig gegenüber breit und als gesetzliches Zahlungsmittel. Viertens die Wertstabilität: hohe Volatilität gegenüber relativer Stabilität durch Geldpolitik. Als Zwischending gibt es die CBDC, das digitale Zentralbankgeld, das technische Eigenschaften von Krypto übernimmt, aber zentral kontrolliert bleibt. Bitcoin selbst entstand nicht zufällig, sondern im Kontext der Finanzkrise 2008, getragen vom Misstrauen gegenüber dem Bankensystem, als Versuch einer staatsunabhängigen Währung. Wie tragfähig das ist, beurteilen wir im dritten Teil kritisch."]}],"raster":[{"kat":"PB","begriff":"Drei Vertrauensvoraussetzungen des Geldes","warum":"Geld ist Vertrauenssache, nicht Materialwert","muss":true,"gew":7,"ktag":"","terms":["Vertrauensvoraussetzungen","Geldes"]},{"kat":"PK","begriff":"Mental Accounting (Thaler 1985)","warum":"erklärt kontextabhängiges Ausgeben","muss":true,"gew":6,"ktag":"","terms":["Mental","Accounting","Thaler"]},{"kat":"PB","begriff":"Geldwert / Geldwahrnehmung / Geldillusion","warum":"nominale vs. reale Größen (Kontrollfrage 1)","muss":true,"gew":8,"ktag":"","terms":["Geldwert","Geldwahrnehmung","Geldillusion"]},{"kat":"PB","begriff":"Buchgeld vs. Fiat-Geld","warum":"Buchgeld ist eine Form von Fiat-Geld (Bonus)","muss":true,"gew":8,"ktag":"","terms":["Buchgeld","Fiat-Geld","Fiat","Geld"]},{"kat":"PK","begriff":"Geldschöpfung durch Kreditvergabe","warum":"Banken schaffen Buchgeld; Bonusfrage möglich","muss":true,"gew":9,"ktag":"","terms":["Geldschöpfung","Kreditvergabe"]},{"kat":"PB","begriff":"Krypto vs. Zentralbankgeld (vier Dimensionen)","warum":"Kontrolle/Vertrauen/Akzeptanz/Stabilität, CBDC","muss":true,"gew":7,"ktag":"","terms":["Krypto","Zentralbankgeld","Dimensionen"]},{"kat":"KD","begriff":"Vollgeld-Initiative","warum":"nur Zentralbank schöpft Geld","muss":false,"gew":4,"ktag":"","terms":["Vollgeld-Initiative","Vollgeld","Initiative"]},{"kat":"KD","begriff":"Bitcoin im Kontext der Finanzkrise 2008","warum":"Misstrauen gegenüber Banken","muss":false,"gew":4,"ktag":"","terms":["Bitcoin","Kontext","Finanzkrise","2008"]}],"fehler":["Den Geldwert mit dem Materialwert begründen statt mit Vertrauen.","Geldillusion mit Geldwahrnehmung gleichsetzen: Illusion ist das Denken in nominalen statt realen Größen.","Glauben, nur Staat oder Zentralbank schaffe Geld: den größten Teil schöpfen Geschäftsbanken durch Kredit.","Buchgeld und Fiat-Geld als Gegensätze sehen: Buchgeld ist eine Form von Fiat-Geld."]},{"title":"Entscheidungen unter Risiko: von der Vernunft zur Prospect Theory","lernziel":"Verstehen, wie sich das normative Idealmodell der Erwartungsnutzentheorie vom deskriptiven Modell der Prospect Theory unterscheidet, und die s-förmige Wertfunktion samt Verlustaversion und Endowment-Effekt sicher lesen können.","konzepte":"Erwartungsnutzentheorie (normativ), Prospect Theory mit Editierung und Evaluation, s-förmige Wertfunktion und Referenzpunkt, Verlustaversion, vierfaches Muster der Risikopräferenzen, Endowment-Effekt und seine Marketingnutzung, Heuristiken.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"Wie man entscheiden sollte: die Erwartungsnutzentheorie","body":["Wenn es um Entscheidungen unter Risiko geht, steht am Anfang ein Modell, das den rationalen Idealfall beschreibt: die Erwartungsnutzentheorie. Sie nimmt an, dass Menschen rational handeln, sich korrekte Vorstellungen über Wahrscheinlichkeiten bilden und am Ende die Alternative wählen, die ihren subjektiv erwarteten Nutzen maximiert. Der erwartete Nutzen ist die Summe aus dem Nutzen jedes möglichen Ergebnisses, gewichtet mit seiner Wahrscheinlichkeit. Präferenzen gelten als stabil und unabhängig davon, wie eine Wahl emotional oder sprachlich verpackt ist. Das Entscheidende, und ein ausdrücklicher Hinweis aus der Vorlesung: Diese Theorie beschreibt nicht, wie Menschen tatsächlich entscheiden. Sie ist heute vor allem normativ zu verstehen, also als Aussage darüber, wie man entscheiden sollte. Für die Beschreibung des realen Verhaltens nimmt man die Prospect Theory."]},{"h":"Wie man wirklich entscheidet: die Prospect Theory","body":["Kahneman und Tversky haben 1979 mit der Prospect Theory das deskriptive Gegenstück geliefert, und sie ist das Herzstück dieses Blocks. Eine Entscheidung läuft in zwei Schritten ab. Im ersten, der Editierung, vereinfachen wir die Situation psychologisch, etwa indem wir Beträge runden oder Optionen umsortieren. Im zweiten, der Evaluation, bewerten wir die vereinfachten Optionen mit zwei Werkzeugen: einer Wertfunktion, die den Ergebnissen einen subjektiven Wert zuordnet, und einer Entscheidungsgewichtungsfunktion, die den Wahrscheinlichkeiten subjektive Gewichte zuordnet. Verwechsle diese zwei Schritte, Editierung und Evaluation, nicht mit den zwei Säulen der Behavioral Finance, die im dritten Teil kommen, das ist eine beliebte Falle."]},{"h":"Die Wertfunktion lesen können","body":["Die Wertfunktion ist der Punkt, an dem du in der Klausur am meisten holen kannst, denn laut Vorlesungsnotiz sollst du ihre s-förmige Kurve erkennen und erklären können. Drei Eigenschaften musst du sicher beherrschen. Erstens: Bewertet wird nicht das Endvermögen, sondern die Veränderung gegenüber einem Referenzpunkt, in der Regel dem Status quo. Auf der x-Achse stehen also Gewinne und Verluste relativ zu diesem Bezugspunkt, auf der y-Achse der subjektive Wert. Zweitens: Im Gewinnbereich verläuft die Kurve konkav, das heißt der Nutzen jedes weiteren Euro nimmt ab, und wir verhalten uns dort risikoscheu. Im Verlustbereich verläuft sie konvex, und wir werden risikosuchend, um einen sicheren Verlust vielleicht doch noch abzuwenden. Genau hier vertauschen viele konkav und konvex, deshalb präg es dir über das Verhalten ein: scheu im Gewinn, suchend im Verlust. Drittens, und das ist die zentrale Aussage: Der Verlustast verläuft steiler als der Gewinnast. Ein Verlust von hundert Euro schmerzt stärker, als ein Gewinn von hundert Euro erfreut. Das ist die Verlustaversion, und sie ist der vielleicht wichtigste Einzelbefund des ganzen Kapitels."]},{"h":"Das vierfache Muster der Risikopräferenzen","body":["Kombiniert man die s-förmige Wertfunktion mit der Gewichtung der Wahrscheinlichkeiten, ergibt sich ein verblüffendes Muster. Wir übergewichten kleine Wahrscheinlichkeiten und untergewichten große. Daraus folgen vier Fälle. Bei einer kleinen Gewinnwahrscheinlichkeit werden wir risikoliebend, das ist der Lottospieler, der für die winzige Chance auf den Jackpot zahlt. Bei einer kleinen Verlustwahrscheinlichkeit werden wir risikoscheu und schließen eine Versicherung ab, das nennt man den Certainty effect. Bei einer großen Gewinnwahrscheinlichkeit werden wir risikoscheu und sichern den fast sicheren Gewinn lieber ab. Und bei einer großen Verlustwahrscheinlichkeit werden wir risikosuchend und halten an der Hoffnung fest, der Possibility effect. Dass derselbe Mensch Lotto spielt und sich gleichzeitig versichert, ist also kein Widerspruch, sondern genau das, was die Theorie vorhersagt."]},{"h":"Der Endowment-Effekt","body":["Direkt aus dem Referenzpunkt folgt ein weiterer ausdrücklich klausurrelevanter Effekt, der Endowment-Effekt oder Besitztumseffekt. Er besagt, dass wir den Wert eines Gegenstands höher einschätzen, sobald er uns gehört, als wenn er uns nicht gehört. Kahneman, Knetsch und Thaler zeigten das 1991 in den berühmten Tassen-Experimenten: Wer eine Tasse besitzt, verlangt für den Verkauf deutlich mehr, als ein anderer zu zahlen bereit ist. Die Merkmale, die du nennen können solltest, sind eine Wertüberschätzung des Besitzes, getragen von der Verlustaversion, sodass der geforderte Verkaufspreis über dem Kaufpreis liegt, ein damit verbundener Status-quo-Bias, ein schnelles Eintreten schon nach kurzem Besitz und eine emotionale Bindung. Der Effekt hängt unmittelbar am Referenzpunkt der Prospect Theory, das ist die Brücke, die du ziehen solltest. Das Marketing nutzt ihn gezielt: Man lässt Kunden Besitz simulieren, damit sie nicht mehr hergeben wollen, etwa über die Probefahrt am Wochenende, die Anprobe der nach Hause gelieferten Kleidung oder kostenlose Testphasen. Auch die eigene Immobilie wird im Wert regelmäßig überschätzt."]},{"h":"Heuristiken bei Finanzentscheidungen","body":["Weil niemand bei jeder Entscheidung alle Informationen durchrechnet, greifen wir auf Heuristiken zurück, also auf Daumenregeln. Fünf solltest du benennen können. Die Verfügbarkeitsheuristik überbewertet das, was uns leicht in den Sinn kommt. Die Repräsentativitätsheuristik schätzt Wahrscheinlichkeiten danach ein, wie sehr etwas einem Prototyp ähnelt. Die Ankerheuristik orientiert sich an einem Vergleichswert und korrigiert von dort aus zu wenig. Das Herdenverhalten imitiert schlicht die anderen. Und die Belief perseverance hält an einmal gefassten Vorstellungen fest, auch gegen neue Evidenz. Montier hat diese Tendenzen in drei Gruppen gebündelt: Heuristiken, Selbstbetrug im Sinne von Überheblichkeit, und soziale Interaktion im Sinne von Herdenverhalten. Diese Begriffe tauchen gleich bei den Anlegerfehlern wieder auf."]}],"raster":[{"kat":"PB","begriff":"Erwartungsnutzentheorie (normativ)","warum":"wie man entscheiden sollte, nicht die Realität","muss":true,"gew":7,"ktag":"","terms":["Erwartungsnutzentheorie"]},{"kat":"PK","begriff":"Prospect Theory: Editierung und Evaluation","warum":"deskriptives Modell in zwei Schritten","muss":true,"gew":8,"ktag":"","terms":["Prospect","Theory","Editierung","Evaluation"]},{"kat":"PZ","begriff":"s-förmige Wertfunktion: konkav im Gewinn, konvex im Verlust, steiler im Verlust","warum":"[K!] erkennen und erklären, vom Referenzpunkt aus","muss":true,"gew":10,"ktag":"K!","terms":["Wertfunktion","Gewinn","Verlust","s-förmige","förmige"]},{"kat":"PB","begriff":"Verlustaversion (Verlust 100 > Gewinn 100)","warum":"[K!] Kernaussage des Kapitels","muss":true,"gew":10,"ktag":"K!","terms":["Verlustaversion","Verlust","Gewinn"]},{"kat":"PK","begriff":"Vierfaches Muster der Risikopräferenzen","warum":"Lotto/Versicherung, Certainty/Possibility effect","muss":true,"gew":7,"ktag":"","terms":["Vierfaches","Muster","Risikopräferenzen"]},{"kat":"PB","begriff":"Endowment-Effekt und seine Merkmale","warum":"[K!] Besitztumseffekt (Folie 122)","muss":true,"gew":9,"ktag":"K!","terms":["Endowment-Effekt","Endowment","Effekt","Merkmale"]},{"kat":"PZ","begriff":"Endowment hängt am Referenzpunkt der Prospect Theory","warum":"Verknüpfung der Konzepte","muss":true,"gew":6,"ktag":"","terms":["Endowment","Referenzpunkt","Prospect","Theory","hängt"]},{"kat":"KD","begriff":"Endowment im Marketing (Probefahrt, Anprobe, Testphase)","warum":"Transferwissen","muss":true,"gew":6,"ktag":"","terms":["Endowment","Marketing","Probefahrt","Anprobe","Testphase"]},{"kat":"PK","begriff":"Fünf Heuristiken (Verfügbarkeit, Repräsentativität, Anker, Herde, Belief perseverance)","warum":"Grundlage der Anlegerfehler","muss":false,"gew":5,"ktag":"","terms":["Heuristiken","Verfügbarkeit","Repräsentativität","Anker","Herde","Belief"]}],"fehler":["Konkav und konvex vertauschen: risikoscheu im Gewinn (konkav), risikosuchend im Verlust (konvex).","Die Wertfunktion auf das Endvermögen statt auf die Veränderung zum Referenzpunkt beziehen.","Editierung und Evaluation mit den zwei Säulen der Behavioral Finance verwechseln.","Die Erwartungsnutzentheorie für eine Beschreibung realen Verhaltens halten: sie ist normativ.","Endowment-Effekt, Status-quo-Bias und Verlustaversion gleichsetzen statt als verwandt einzuordnen."]},{"title":"Behavioral Finance: warum Märkte nicht perfekt sind","lernziel":"Verstehen, was die Markteffizienz-Hypothese behauptet, wie die Behavioral Finance sie über zwei Säulen relativiert, und Anleger- sowie Marktphänomene über Verlustaversion erklären können.","konzepte":"Markteffizienz-Hypothese (Fama), die zwei Säulen der Behavioral Finance, Grenzen der Arbitrage (CUBA, Indexeffekt), Anlegerfehler (Tab. 10.1), Excess Volatility und Aktienprämie, Cronqvist und Thaler, Greater Fool Theory und die Bitcoin-Beurteilung.","lesezeit":"etwa 11 bis 13 Minuten","sections":[{"h":"Sind Märkte effizient? Die EMH und ihre Grenzen","body":["Die klassische Finanztheorie ruht auf der Markteffizienz-Hypothese, der EMH von Eugene Fama. Sie behauptet, dass Wertpapierpreise stets ihrem Fundamentalwert entsprechen, dass es keine dauerhaften Überrenditen geben kann und dass jede Fehlbewertung sofort durch Arbitrage korrigiert wird. Irrationale Händler, sogenannte Noise Traders, seien dabei irrelevant, weil rationale Arbitrageure jede Abweichung sofort weghandeln. Die Behavioral Finance widerspricht dem nur teilweise, und diese Differenzierung ist klausurwichtig: Sie teilt die Aussage, dass es kaum dauerhafte Überrenditen gibt, bestreitet aber, dass die Preise deshalb immer stimmen. Sie ersetzt die klassische Theorie nicht, sondern ergänzt sie. Nach Barberis und Thaler ruht sie auf zwei Säulen, den Grenzen der Arbitrage und der Psychologie der Akteure. Diese zwei Säulen darfst du nicht mit den zwei Schritten der Prospect Theory verwechseln."]},{"h":"Warum Fehlbewertungen bestehen bleiben","body":["Die erste Säule, die Grenzen der Arbitrage, erklärt, warum rationale Profis Fehlbewertungen nicht einfach wegräumen. Der Fundamentalwert ist nur ungenau bekannt, also ist schon unklar, ob überhaupt eine Fehlbewertung vorliegt. Selbst wenn, kann sie lange bestehen oder sich sogar verstärken, bevor sie korrigiert wird, und in dieser Zeit drohen Verluste. Ungeduldige Geldgeber ziehen ihr Vertrauen ab, Herdenverhalten erzeugt einen Reputationsdruck, nicht gegen den Strom zu schwimmen, und Transaktionskosten zehren am Gewinn. Das Standardbeispiel ist der CUBA-Fonds, den Thaler 2015 beschrieb: Dieser geschlossene Fonds enthielt keine einzige kubanische Aktie, stieg aber nach Obamas Annäherungsankündigung 2014 um über siebzig Prozent, allein wegen des Namens. Er blieb lange überbewertet, ohne dass sich daraus risikolos Gewinn schlagen ließ. Ähnliches zeigt der Indexeffekt, etwa wenn eine Aktie nach Aufnahme in den S&P 500 sprunghaft zulegt."]},{"h":"Typische Anlegerfehler","body":["Die zweite Säule, die Psychologie der Akteure, sammelt die typischen Anlegerfehler aus Tabelle 10.1, und du solltest sie ihren Ursachen zuordnen können. Eine ungenügende Diversifikation entspringt der Ambiguitätsaversion, der Scheu vor dem Unbekannten. Die naive Streuung nach der 1/n-Regel ist ein Einfachheits-Bias. Zu häufiges Handeln kommt aus Überheblichkeit und einem Action bias und kostet nach Gebühren Rendite. Der Dispositionseffekt beschreibt, dass Anleger Gewinneraktien zu früh verkaufen und Verliereraktien zu lange halten, getrieben von der Verlustaversion, weil ein realisierter Verlust endgültig wehtut. Der Aufmerksamkeitseffekt führt zum Kauf auffälliger Aktien und beruht auf der Verfügbarkeitsheuristik. Der Kauf bei steigenden Kursen ist Herdenverhalten, und selbst die Stimmung wirkt mit, wobei ausgerechnet eine neutrale Stimmung zu den besten Ergebnissen führt. Verwechsle Dispositions- und Aufmerksamkeitseffekt nicht: der eine handelt vom Halten von Verlusten, der andere vom Kaufen des Auffälligen."]},{"h":"Verlustaversion auf Marktebene: Excess Volatility und Aktienprämie","body":["Zwei größere Marktphänomene lassen sich elegant über die Verlustaversion erklären, und auch sie werden gern verwechselt. Die Excess Volatility, von Shiller 1981 beschrieben, meint, dass die Kurse stärker schwanken als die zugrunde liegenden Gewinne und Dividenden es rechtfertigen. Barberis erklärt das so: Nach Gewinnen fühlen sich Anleger weniger verlustavers und treiben die Kurse weiter, nach Verlusten werden sie vorsichtiger. Die Aktienprämie dagegen, von Thaler 1997 thematisiert, meint, dass Aktien langfristig auffallend höher rentieren als Anleihen, eigentlich zu hoch. Die Erklärung: Wer häufig ins Depot schaut, erlebt viele einzelne Verlusttage, und die schmerzen so sehr, dass er für das Aktienhalten eine hohe Entschädigung verlangt. Im Experiment investierten Menschen deutlich mehr in Aktien, wenn man ihnen nur jährliche statt täglicher Zahlen zeigte. Merke: Excess Volatility betrifft das Schwanken, die Aktienprämie das Renditeniveau."]},{"h":"Folgen für die Regulierung und ein kritischer Blick auf Bitcoin","body":["Wenn Anleger so systematisch irren, stellt sich die Frage nach der Regulierung. Die schwedische Studie von Cronqvist und Thaler aus dem Jahr 2004 ist hier das Lehrstück. Bei einer Teilprivatisierung der Rente konnten die Bürger aus 456 Fonds wählen oder einen Standardfonds nehmen. Knapp zwei Drittel wählten selbst, ein Drittel blieb beim Standard. Die selbstgewählten Portfolios waren lehrbuchhaft schlecht: ein sehr hoher Aktienanteil, ein starker Home bias zu schwedischen Werten, kaum günstige Indexfonds, hohe Gebühren, und die Wahl folgte schlicht den Vorjahresrenditen. Der meistgewählte Fonds, zuvor um über fünfhundert Prozent gestiegen, verlor anschließend fast siebzig Prozent. Die Lehre: Spekulationsblasen vermeiden, Systemrisiken begrenzen und Risiken transparent kommunizieren, statt blind auf die freie Wahl zu setzen. Damit lässt sich auch Bitcoin kritisch beurteilen. Geld braucht Vertrauen in seine künftige Akzeptanz und Wertstabilität, und genau daran hapert es: Bitcoin ist hoch volatil und dezentral ohne staatliche Deckung. Die Greater Fool Theory bringt das auf den Punkt, denn sie besagt, dass sich der Preis nicht am inneren Wert orientiert, sondern an der Erwartung, später teurer an einen noch größeren Narren verkaufen zu können, was Spekulationsblasen erklärt. Den realen Chancen in Schwellenländern, etwa finanzieller Inklusion und Inflationsschutz, wie sie El Salvador mit der zeitweisen Einführung von Bitcoin erprobte, stehen also erhebliche Risiken bei Volatilität, Regulierung und Sicherheit gegenüber."]}],"raster":[{"kat":"PB","begriff":"Markteffizienz-Hypothese (Fama)","warum":"Preise = Fundamentalwert, Arbitrage korrigiert","muss":true,"gew":7,"ktag":"","terms":["Markteffizienz-Hypothese","Markteffizienz","Hypothese","Fama"]},{"kat":"PZ","begriff":"Behavioral Finance ergänzt die EMH","warum":"teilt 'kaum Überrenditen', bestreitet 'Preise stimmen stets'","muss":true,"gew":8,"ktag":"","terms":["Behavioral","Finance","EMH","ergänzt"]},{"kat":"PK","begriff":"Zwei Säulen: Grenzen der Arbitrage und Psychologie der Akteure","warum":"Kernstruktur von Kap. 10.3","muss":true,"gew":9,"ktag":"","terms":["Säulen","Grenzen","Arbitrage","Psychologie","Akteure"]},{"kat":"KD","begriff":"Grenzen der Arbitrage (CUBA-Fonds, Indexeffekt)","warum":"warum Fehlbewertungen bestehen bleiben","muss":true,"gew":6,"ktag":"","terms":["Grenzen","Arbitrage","CUBA-Fonds","CUBA","Fonds","Indexeffekt"]},{"kat":"PK","begriff":"Anlegerfehler und ihre Ursachen (Tab. 10.1)","warum":"Dispositions-, Aufmerksamkeitseffekt usw. zuordnen","muss":true,"gew":7,"ktag":"","terms":["Anlegerfehler","Ursachen"]},{"kat":"PZ","begriff":"Excess Volatility vs. Aktienprämie über Verlustaversion","warum":"Schwanken vs. Renditeniveau, nicht verwechseln","muss":true,"gew":7,"ktag":"","terms":["Excess","Volatility","Aktienprämie","Verlustaversion"]},{"kat":"KD","begriff":"Cronqvist und Thaler 2004 (schwedische Rente)","warum":"Folgen für die Regulierung","muss":false,"gew":5,"ktag":"","terms":["Cronqvist","Thaler","Rente","2004"]},{"kat":"KD","begriff":"Greater Fool Theory und Bitcoin-Beurteilung","warum":"Bonus-Transfer, Spekulationsblasen","muss":true,"gew":6,"ktag":"","terms":["Greater","Fool","Theory","Bitcoin-Beurteilung","Bitcoin","Beurteilung"]}],"fehler":["EMH und Behavioral Finance als völlige Gegensätze darstellen: BF ergänzt, ersetzt nicht.","Dispositions- und Aufmerksamkeitseffekt verwechseln (Halten von Verlusten vs. Kauf des Auffälligen).","Excess Volatility und Aktienprämie gleichsetzen (Kursschwanken vs. Renditeniveau).","Die zwei Säulen der Behavioral Finance mit den zwei Schritten der Prospect Theory verwechseln."]},{"title":"Sparen, Lohn und Steuern","lernziel":"Verstehen, was Menschen zum Sparen bewegt und wie man es fördert, warum Löhne mehr von Fairness als von Angebot und Nachfrage abhängen, und wie Steuern wahrgenommen und beeinflusst werden.","konzepte":"Sparmotive (Wiswede) und Sparhypothesen (Life-cycle, Permanent-income, Relative-income), Defaults und Save More Tomorrow, Schuldenbremse, Lohn-Fairness (Equity, Fair-wage, Gift-exchange, Ford), Geldillusion bei Löhnen, Persönlichkeit und Lohn (Nyhus und Pons), Steuerwahrnehmung und die drei Ansätze Enforcement, Service, Trust.","lesezeit":"etwa 11 bis 13 Minuten","sections":[{"h":"Sparen: Motive und Referenzgruppen","body":["Beim Sparen lohnt zuerst der Blick auf die Motive, die Wiswede zusammengetragen hat: größere Anschaffungen, das Sicherheitsmotiv zum Halten des Lebensstandards, das Kontrollmotiv im Sinne von Unabhängigkeit, ein Leistungsmotiv über hohe Erträge, ein Prestigemotiv, das Vermögen als Erfolgssymbol sieht, ein intrinsisches Motiv, bei dem Sparen zum Selbstzweck wird, und ein Altruismus-Motiv der Vorsorge für andere. Wichtiger für die Klausur sind die konkurrierenden Hypothesen zum Einfluss anderer Menschen. Die Life-cycle-Hypothese von Modigliani und die Permanent-income-Hypothese von Friedman sagen, dass nur das eigene erwartete Lebenseinkommen zählt, Vergleichsgruppen also keine Rolle spielen. Die Relative-income-Hypothese von Duesenberry widerspricht: Die Sparquote hängt von der eigenen Einkommensposition in der Vergleichsgruppe ab, was erklärt, warum ärmere Gruppen relativ mehr sparen. Frank ergänzt das Bild mit den Ausgabenkaskaden, bei denen der Vergleich nach oben die Sparquote drückt, ein Grund für die niedrigere Sparquote in den USA gegenüber Europa."]},{"h":"Sparen fördern, ohne zu zwingen","body":["Wie bringt man Menschen dazu, mehr vorzusorgen? Appelle und Steuerabzüge wirken erstaunlich schwach. Wirksamer sind verhaltensökonomische Werkzeuge, und das Prinzip dahinter ist, die menschliche Trägheit zu nutzen statt sie zu bekämpfen. Defaults, also Standardvorgaben, greifen automatisch, wenn niemand aktiv widerspricht. Madrian und Shea zeigten, dass eine automatische Einzahlung in die Altersvorsorge die Sparquote drastisch erhöht. Das Programm Save More Tomorrow von Thaler und Benartzi geht noch geschickter vor: Der Sparbeitrag steigt nicht heute, sondern automatisch mit jeder künftigen Lohnerhöhung. So fühlt sich das Sparen nie wie ein Verlust an, weil das verfügbare Einkommen nie sinkt, und die Sparquote stieg in den Untersuchungen von 3,5 auf 11,6 Prozent. Auf Staatsebene wirkt die Schuldenbremse als vergleichbares Commitment device, eine Selbstbindung gegen die eigene Schwäche, wie sie etwa Deutschland und die Schweiz nutzen."]},{"h":"Löhne: Warum Fairness das Standardmodell schlägt","body":["Die Ökonomie erklärt den Lohn als Preis, der sich aus Angebot und Nachfrage ergibt, mit Entlohnung nach dem Wertgrenzprodukt der Arbeit. Psychologisch greift das zu kurz, denn Arbeitnehmer kennen weder den Wert ihrer Freizeit noch den ihrer eigenen Arbeit genau, sodass der frühere Lohn als Anker dient und die Lohnsetzung große Spielräume hat. Vor allem zählt Fairness. Die Equity-Theorie von Adams besagt, dass wir das Verhältnis unserer Beiträge zu unseren Belohnungen mit anderen vergleichen und dass Ungleichheit nach Korrektur verlangt. Der Fair-wage-effort-Ansatz von Akerlof und Yellen ergänzt, dass die Leistung von der wahrgenommenen Lohngerechtigkeit abhängt. Und der Gift-exchange-Ansatz, ebenfalls von Akerlof, deutet Lohn und Einsatz als gegenseitiges Geschenk, also als Reziprozität. Das klassische Beispiel ist Henry Ford, der 1914 den Tageslohn auf fünf Dollar verdoppelte, woraufhin die Fluktuation drastisch sank und sich die Maßnahme als Kostensenkung auszahlte. Hier schließt sich auch der Kreis zur Geldillusion aus dem ersten Teil: Eine nominale Lohnerhöhung von zwei Prozent bei vier Prozent Inflation wird positiver erlebt als eine nominale Lohnsenkung von zwei Prozent bei null Inflation, obwohl beide real dasselbe Minus bedeuten. Deshalb können Firmen in Inflationsjahren die Reallöhne fast widerstandslos senken.","Auch Persönlichkeitsmerkmale wirken auf den Lohn, wie Nyhus und Pons 2005 zeigten, und zwar nicht immer wie erwartet. Emotionale Stabilität wirkt positiv und signifikant, Gewissenhaftigkeit zeigt keinen positiven Effekt, und Verträglichkeit wirkt bei Frauen sogar negativ, weil Bescheidenheit in Gehaltsverhandlungen schadet, bei Hochschulabschluss noch ausgeprägter. Lässt man die Persönlichkeit außen vor, überschätzt man leicht die Bedeutung anderer Faktoren wie der Berufserfahrung."]},{"h":"Steuern: Wahrnehmung, Hinterziehung und drei Strategien","body":["Zum Schluss die Steuern, wo es weniger um Mathematik als um Wahrnehmung geht. Wie stark eine Steuerlast empfunden wird, hängt nach Schmölders und Wiswede von mehreren Faktoren ab: von der Höhe auch im Vergleich zu anderen, vom Empfinden, ob die Verteilung gerecht ist, von der Einschätzung, ob der Staat das Geld effizient oder verschwenderisch verwendet, von der wahrgenommenen Dauerhaftigkeit und von der Spürbarkeit, also ob die Steuer überhaupt ins Auge fällt. Diese Wahrnehmung entscheidet mit darüber, ob Steuern als gerechtfertigt gelten und ob hinterzogen wird. Die Hinterziehung selbst lässt sich nicht allein über Beckers rationale Abwägung von Nutzen und Entdeckungsrisiko erklären. Weigel unterscheidet situative Bedingungen wie finanziellen Druck, Normen und Kontrollen von persönlichen Bedingungen wie Ungerechtigkeitsempfinden und Egoismus. Hessing fand, dass die in Befragungen zugegebene Hinterziehung von Einstellungen und Normen abhängt, die tatsächlich beobachtete dagegen von Persönlichkeitsmerkmalen. Für die Steuerung des Verhaltens nennt das Lehrbuch drei Ansätze, die du trennen solltest. Der Enforcement-Ansatz setzt auf häufige Prüfungen und hohe Strafen und nutzt aus, dass wir die unwahrscheinliche Entdeckung übergewichten. Der Service-Ansatz versteht die Verwaltung als kundenorientierten Dienstleister und senkt so die Reaktanz. Der Trust-Ansatz schließlich, von Alm und Torgler, stärkt soziale und kulturelle Normen, betont den Bezug zwischen Steuer und Gegenleistung und macht Steuerehrlichkeit zur Norm, statt mit Amnestien das Gegenteil zu signalisieren."]}],"raster":[{"kat":"PK","begriff":"Sparhypothesen: Life-cycle/Permanent-income vs. Relative-income","warum":"zählt die Referenzgruppe oder nicht","muss":true,"gew":7,"ktag":"","terms":["Sparhypothesen","Life-cycle","Life","cycle","Permanent-income","Permanent","income"]},{"kat":"PB","begriff":"Sparmotive (Wiswede)","warum":"mehrere Motive benennen können","muss":false,"gew":4,"ktag":"","terms":["Sparmotive","Wiswede"]},{"kat":"PZ","begriff":"Defaults und Save More Tomorrow wirken über Trägheit und Verlustaversion","warum":"wirksamer als Appelle und Steuerabzüge","muss":true,"gew":7,"ktag":"","terms":["Defaults","Save","More","Tomorrow","Trägheit","Verlustaversion","wirken"]},{"kat":"PK","begriff":"Lohn-Fairness: Equity, Fair-wage, Gift-exchange","warum":"Reziprozität, Beispiel Ford 1914","muss":true,"gew":7,"ktag":"","terms":["Lohn-Fairness","Lohn","Fairness","Equity","Fair-wage","Fair","wage"]},{"kat":"PZ","begriff":"Geldillusion bei Löhnen (nominale Erhöhung vs. reale Senkung)","warum":"Verknüpfung zu Teil 1","muss":true,"gew":6,"ktag":"","terms":["Geldillusion","Löhnen","Erhöhung","Senkung"]},{"kat":"KD","begriff":"Nyhus und Pons: Big Five und Lohn","warum":"emotionale Stabilität +, Verträglichkeit bei Frauen −","muss":false,"gew":4,"ktag":"","terms":["Nyhus","Pons","Five","Lohn"]},{"kat":"PK","begriff":"Steuerverhalten: Enforcement, Service, Trust","warum":"drei Ansätze sauber trennen","muss":true,"gew":7,"ktag":"","terms":["Steuerverhalten","Enforcement","Service","Trust"]},{"kat":"KD","begriff":"Steuerwahrnehmung (Schmölders) und Hinterziehung (Weigel/Hessing)","warum":"situative vs. persönliche Bedingungen","muss":false,"gew":5,"ktag":"","terms":["Steuerwahrnehmung","Schmölders","Hinterziehung","Weigel","Hessing"]}],"fehler":["Relative-income mit Life-cycle/Permanent-income verwechseln: die Referenzgruppe zählt nur bei Duesenberry.","Sparförderung über Appelle und Steuerabzüge erklären statt über Defaults und Selbstbindung.","Den Lohn rein über Angebot und Nachfrage erklären und Fairness und Reziprozität auslassen.","Die drei Steueransätze vermischen: Enforcement = Strafe, Service = Dienstleister, Trust = Normen."]}]},{"key":"Block6","label":"Block 6 · Gesellschaft","color":"#d4793a","niveau":["A. Mindestniveau (Bestanden, etwa 50% der Pflichtpunkte)","B. Gutes Niveau (etwa 70%)","C. Sehr gutes Niveau (etwa 85%)","D. Klausurniveau (annähernd vollständig, mit Transfer und Wertung)"],"teile":[{"title":"Die psychologische Seite der Wirtschaftslage","lernziel":"Verstehen, warum Konjunktur und Arbeitslosigkeit nicht nur ökonomische, sondern vor allem psychologische Phänomene sind, und wie Erwartungen, Stimmungen und der Wegfall der latenten Arbeitsfunktionen das Geschehen erklären.","konzepte":"Konjunktur und ihre Indikatoren, Erwartungsbildung, Stimmungen und emotionale Ansteckung, Grenzen der Prognose, Folgen und Moderatoren der Arbeitslosigkeit, latente Funktionen der Arbeit, Attributionen, antizipierte Arbeitslosigkeit, unbezahlte Arbeit und Volunteering.","lesezeit":"etwa 12 bis 14 Minuten","sections":[{"h":"","body":["Stell dir vor, du führst ein Unternehmen, das Küchen verkauft. Niemand kauft eine neue Küche, weil die Zinsen gefallen sind oder weil das Bruttoinlandprodukt im letzten Quartal um ein halbes Prozent gewachsen ist. Die Leute kaufen, wenn sie sich sicher fühlen, wenn sie glauben, dass es ihnen auch nächstes Jahr noch gut gehen wird. Genau hier beginnt das Kapitel Gesellschaft. Nach den Kapiteln zu Konsum, Arbeit, Organisation, Personal und Geld weitet sich der Blick auf die großen volkswirtschaftlichen Themen: Konjunktur, Arbeitslosigkeit, unbezahlte Arbeit, Regulierung, Globalisierung und Nachhaltigkeit. Der rote Faden ist eine einzige, fast trotzige Behauptung: Für das Verständnis dieser Themen ist die Psychologie mindestens so wichtig wie die Ökonomie. Wer das einmal verinnerlicht hat, liest Wirtschaftsnachrichten anders."]},{"h":"Konjunktur ist eine Erwartung, kein Thermometer","body":["Konjunktur meint zunächst nichts Geheimnisvolles, sondern die Lage einer Volkswirtschaft, gemessen an der Auslastung der Produktion, an Nachfrage, Beschäftigung und Zinsen. Sie verläuft zyklisch, in Auf- und Abschwüngen. Unternehmen wollen unbedingt wissen, wie es in den nächsten Monaten weitergeht, weil ihre Umsätze davon abhängen. Die Nachfrage nach Prognosen ist so groß, dass sogar völlig unsichere Vorhersagen, etwa für das übernächste Jahr, gekauft werden. Das ist ein erstes Warnsignal: Wo eine Information so begehrt ist, wird sie auch dann verkauft, wenn sie kaum etwas taugt.","Gemessen wird die Konjunktur mit Indikatoren, und man unterscheidet sie danach, auf welche Zeit sie zielen. Nachlaufende Indikatoren beschreiben die Vergangenheit, gleichlaufende die Gegenwart, vorlaufende die Zukunft. Psychologisch spannend sind die vorlaufenden, die Frühindikatoren, denn sie versuchen das zu erfassen, was noch gar nicht passiert ist. Und woraus speisen sie sich? Vor allem aus Befragungen. Die beiden wichtigsten sind die Konsumentenstimmung und die Erwartungen der Unternehmen. Für die Stimmung der Verbraucher gibt es seit den 1950er Jahren in den USA den Index of Consumer Sentiment, kurz ICS, der aus fünf Fragen berechnet wird: Wie war die Wirtschaftslage im letzten Jahr, wie wird sie im nächsten sein, wie steht der eigene Haushalt jetzt und künftig da, und ist es gerade ratsam, größere Anschaffungen zu tätigen. Vergleichbares wird in Deutschland und Österreich im Auftrag der EU erhoben, in der Schweiz durch das Staatssekretariat für Wirtschaft. Die Erwartungen der Unternehmen messen in Deutschland das ifo-Institut in München mit seinem Geschäftsklimaindex, in der Schweiz die KOF der ETH Zürich, in Österreich das WIFO. Du musst dir nicht alle Kürzel merken, aber die Logik solltest du behalten: Stimmung der Konsumenten und Erwartungen der Firmen sind die zwei Säulen der Frühindikatoren.","Diese Indikatoren decken sich kurzfristig recht gut mit den Verkaufszahlen langlebiger Güter wie Autos und Immobilien. Aber, und das ist der entscheidende Punkt, sie können den Konjunkturverlauf nicht erklären, und auf mittlere bis lange Sicht sind sie schlicht unzuverlässig. Sie zeigen an, sie prognostizieren nicht."]},{"h":"Warum sich die Zukunft nicht vorhersagen lässt","body":["Jetzt kommt der Kern, und es lohnt sich, hier langsam zu lesen. Entscheidend für die Konjunktur sind die individuellen Zukunftserwartungen von Konsumenten und Unternehmern. Viele Ökonomen glauben, man könne diese Erwartungen verlässlich steuern, etwa indem die Zentralbank die Zinsen senkt, sodass sich Sparen weniger lohnt und die Leute mehr ausgeben. Die Realität ist widerspenstiger. In den 2010er Jahren hatten die deutschen Haushalte trotz extrem tiefer Zinsen eine hohe Sparquote. Warum? Weil tiefe Zinsen eben nicht nur bedeuten, dass Sparen weniger bringt, sondern auch, dass die künftigen Renten niedriger ausfallen werden. Wer das im Hinterkopf hat, entwickelt eher pessimistische Erwartungen und spart mehr, nicht weniger. Ein und dasselbe ökonomische Signal kann also in entgegengesetzte Richtungen wirken, je nachdem, was die Menschen daraus schließen.","Der eigentliche Grund, weshalb Konjunkturprognosen so schwer sind, liegt aber noch tiefer: Menschen beeinflussen sich in ihren Erwartungen gegenseitig. Erwartungen entstehen aus eigenen Erfahrungen, aus den Erfahrungen anderer, aus Nachrichten in den Medien, aus dem Vertrauen in Politiker und Institutionen, und vor allem aus den Erwartungen der Mitmenschen. Eine deutsche Studie für die Jahre 2001 bis 2008 zeigte, dass eine längere Dominanz negativer Wirtschaftsnachrichten in den Medien zu pessimistischen Erwartungen führte. Wenn aber Erwartungen sich gegenseitig anstecken, dann können sich Signale selbst verstärken, und der Auslöser eines Umschwungs kann lächerlich klein sein, etwa der Konkurs eines Traditionsbetriebs. Selbst bei gewichtigen Anlässen wie einem Krieg oder einem unerwarteten Wahlausgang bestimmen soziale Einflüsse den genauen Zeitpunkt. Man kann nicht sauber begründen, warum die Zinsen für Interbankkredite in den USA ausgerechnet am 9. August 2007 sprunghaft stiegen. Die Finanzkrise hätte ebenso gut früher oder später beginnen können.","Dazu kommt die Rolle der Stimmungen. Ein hübsches Konzept ist die stimmungskongruente Informationsaufnahme: Wer guter Stimmung ist, nimmt bevorzugt positive Informationen auf und erinnert sie auch besser, wer schlechter Stimmung ist, das Gegenteil. Das erklärt, warum Auf- und Abschwünge eine gewisse Beharrlichkeit haben, warum sie also nicht sofort kippen. Gut erforscht ist außerdem die emotionale Ansteckung, die emotional contagion: Stimmungen springen über Stimme, Gestik und Mimik auf andere über, bewusst und unbewusst. Dass sich Stimmungen schon auf Kleinkinder übertragen, deutet darauf hin, dass dieser Mechanismus nicht erlernt, sondern angeboren ist. Vermutet werden sogenannte Spiegelneurone, also Nervenzellen, die beim bloßen Betrachten einer Handlung dasselbe Aktivitätsmuster zeigen wie beim eigenen Tun. Aber Vorsicht, und das ist ein typischer Denkfehler: Man kann die Konjunktur nicht einfach mit Stimmungen erklären, wenn man die Stimmung an genau denselben Verhaltensweisen misst wie die Konjunktur, etwa an den Konsumausgaben. Dann dreht man sich im Kreis. Die Stimmung müsste unabhängig von ihren Folgen erfasst werden, und das gelingt bis heute kaum.","Wenn du dir aus diesem Abschnitt eine einzige Einsicht mitnimmst, dann diese: Die Konjunktur lässt sich langfristig prinzipiell nicht vorhersagen. Der Grund ist elegant. Wüssten wir heute sicher, dass die Aktienkurse in drei Monaten steigen, dann würden alle sofort kaufen, und die Kurse stiegen schon heute. Eine verlässliche Vorhersage würde sich selbst zunichtemachen. Was die Wirtschaftspsychologie leisten kann, ist nicht die Prophezeiung, sondern das Verständnis der Mechanismen, und damit die Korrektur allzu simpler Vorstellungen. Genau an dieser Stelle notierte der Dozent einen Gedanken zu Keynes, den du dir für die Klausur merken solltest: dass es auch der übernächsten Generation gut gehen soll und dass langfristige Wohlstandssicherung Innovation und Entwicklung braucht. Das schlägt die Brücke zum Nachhaltigkeitsgedanken, der dich im zweiten Teil erwartet.",". . ."]},{"h":"Arbeitslosigkeit trifft die Seele, nicht nur das Konto","body":["Der dunkelste Punkt eines Abschwungs ist die Arbeitslosigkeit, und hier wird die Psychologie sehr konkret. Arbeitslosigkeit ist regelmäßig eine der größten Sorgen der Bevölkerung, und das aus gutem Grund. Metaanalysen zeigen, dass unter Arbeitslosen im Mittel 34 Prozent mit nennenswerten psychischen Problemen kämpfen, gegenüber 16 Prozent bei Erwerbstätigen. Befragungen zur Lebenszufriedenheit ergeben übereinstimmend, dass keine andere Ursache die Zufriedenheit so stark senkt wie Arbeitslosigkeit. Und der Zusammenhang ist nicht bloß Korrelation: Längsschnittstudien, die dieselben Menschen über die Zeit verfolgen, zeigen, dass der Jobverlust das Befinden verschlechtert und der Wiedereinstieg es verbessert. Die Arbeitslosigkeit ist also die Ursache, nicht nur ein Begleitumstand.","Die spannende Frage ist das Warum. Man könnte naiv vermuten, es liege am Geld, an den geringeren Konsummöglichkeiten. Das ist erstaunlicherweise nicht der Hauptgrund. Entscheidend ist der Verlust dessen, was Marie Jahoda die latenten Funktionen der Erwerbsarbeit nannte. Arbeit gibt uns mehr als Lohn. Sie legt uns eine feste Zeitstruktur auf, sie weitet unsere sozialen Erfahrungen über die Familie hinaus, sie lässt uns an kollektiven Zielen und Anstrengungen teilnehmen, sie weist uns Status und Identität zu, und sie bietet eine regelmäßige Tätigkeit, die viele Menschen durchaus wollen. Fällt all das weg, entsteht ein Mangel, der mit dem fehlenden Gehalt allein nicht zu erklären ist. Diese fünf latenten Funktionen sind ein klassischer Prüfungsinhalt, und du verstehst sie am besten, wenn du dir vorstellst, was dir an einem dauerhaft strukturlosen, kontaktlosen Tag fehlen würde.","Arbeitslosigkeit trifft aber nicht alle gleich hart. Kirchler hat die Moderatoren zusammengetragen, also die Faktoren, die den Schweregrad mitbestimmen. Die Dauer spielt eine Rolle, wobei sich das Befinden zunächst verschlechtert und sich nach etwa neun Monaten oft auf niedrigem Niveau stabilisiert. Wer der Arbeit subjektiv wenig Bedeutung beimisst, leidet weniger. Wichtig ist, wie jemand die Ursache attribuiert, dazu gleich mehr. Persönlichkeitsmerkmale wirken mit, vor allem die Kontrollüberzeugung, also der Glaube, bald wieder eine passende Stelle zu finden. Das Alter zählt, ebenso sinnvolle Aktivitäten, die den Alltag strukturieren, frühere Erfahrungen mit Arbeitslosigkeit und die soziale und emotionale Unterstützung aus dem Umfeld. Eine Metaanalyse fand, dass Männer stärker leiden als Frauen und dass der Partnerschaftsstatus keinen Einfluss hat, während Religiosität und Hobbys helfen. Wiswede hält die Kontrollüberzeugung für den wohl entscheidenden Moderator, und das ist intuitiv einleuchtend: Wer glaubt, die Lage in der Hand zu haben, zerbricht nicht so leicht daran.","Bei den Attributionen lohnt ein genauer Blick, weil das Ergebnis auf den ersten Blick paradox wirkt. Man kann Arbeitslosigkeit als vorübergehend oder dauerhaft deuten und als selbstverschuldet, also internal, oder als strukturell bedingt, also external. Internal wären mangelnde Motivation oder Flexibil
